/* revisão das arrastadas → cria a rodada nova e leva para a importação da ata */
function planRevisaoAbrir(){
  const ant=planRodadaAtual();
  const ids=ant?planTarefas().filter(t=>t.origemId===ant.id && planAberta(t) && (!t.unidade||podeVer(t.unidade))).map(t=>t.id):[];
  planUI.revisao={anterior:ant?ant.id:"", ids, decidido:{}, prazo:{}, motivo:{}};
  if(!ids.length){ planIr("importar"); return; }
  planIr("revisao");
}
function planRevisaoAplicar(){
  const rv=planUI.revisao; if(!rv) return;
  const falta=rv.ids.filter(id=>!rv.decidido[id]).length;
  if(falta){ atualizarAvanco("bt-plan-revok","Responda as "+falta+" tarefa(s) que faltam"); return; }
  rv.ids.forEach(id=>{
    const t=planTarefa(id); if(!t) return;
    t.arrastadaDe=[...new Set([...(t.arrastadaDe||[]), rv.anterior].filter(Boolean))];
    const dec=rv.decidido[id];
    if(dec==="repactuar"){
      const novo=planPrazoChip(t, rv.prazo[id]||"reuniao");
      const m=planMotivoTrava(rv.motivo[id]||"");
      planNovoPrazo(id, novo, m?m.rot:"repactuada na revisão das arrastadas");
    } else if(dec==="cancelar"){
      const m=planMotivoTrava(rv.motivo[id]||"");
      planMudarStatus(id,"cancelado",{motivo:m?m.rot:"cancelada na revisão das arrastadas"});
    } else {
      planLog(t,"arrastada","", "mantida","mantida na revisão da rodada nova");
    }
  });
  salvarDados();
  planUI.revisao=null;
  planIr("importar");
}
function planAtaGravar(){
  const a=planUI.ata; if(!a) return;
  const vao=[...a.itens, ...a.gerais].filter(it=>it.incluir!==false && String(it.desc||"").trim());
  if(!vao.length){ atualizarAvanco("bt-plan-ata-ok","Deixe pelo menos um item marcado"); return; }
  const ref=planMesDe(hojeBRT());
  let r=planRodadaDoMes(ref);
  if(!r){ r={id:uid(), ref, nome:(planUI.rodadaNome||("Reunião "+fmtData(hojeBRT()))).trim(),
      data:hojeBRT(), criadoEm:hojeBRT(), por:planQuem()}; planRodadas().push(r); }
  r.importadoEm=hojeBRT();
  const res=ataImportar(r, vao);
  planUI.ata=null; planUI.ataTexto="";
  planSalvo(res.novas+" tarefa(s) gravada(s)"+(res.repetidas?" · "+res.repetidas+" já existia(m)":""));
  planNav=[{v:"menu"},{v:"rodadas"},{v:"rodada",id:r.id}];
  ir("planejamento");
}

/* Partes estruturadas de uma operação de grãos (usadas no WhatsApp e no detalhe) */
function resumoOpPartes(b,a){
  const cat=opCatDe(a.tipo), fmt=v=>n0(v).toLocaleString("pt-BR",{maximumFractionDigits:2});
  const info=infoCiclo(a.talhaoId,b.data);
  const parts=[];
  const pAplic=()=>{
    if(a.alvo) parts.push("alvo: "+a.alvo);
    const rec=(a.produtos||[]).filter(p=>p.nome).map(p=>p.nome+(p.dose?" "+String(p.dose).replace(".",",")+" "+(p.un||"L")+"/ha":"")).join(" + ");
    if(rec) parts.push(rec);
    if(n0(a.caldaLha)) parts.push(fmt(a.caldaLha)+" L/ha");
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
    if(a.equip) parts.push(a.equip.toLowerCase());
    if(a.vento==="Vento forte") parts.push("⚠ vento forte");
    if(a.horario) parts.push(a.horario.toLowerCase());
  };
  if(cat==="APLICACAO") pAplic();
  else if(cat==="CALAGEM"||cat==="GESSAGEM"){
    if(a.produtoAdb) parts.push(a.produtoAdb.toLowerCase());
    if(n0(a.doseTHa)) parts.push(fmt(a.doseTHa)+" t/ha");
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
    if(a.incorporado) parts.push(a.incorporado==="Sim"?"incorporado":"não incorporado");
  }else if(cat==="PREPARO"){
    if(a.implemento) parts.push(a.implemento.toLowerCase());
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
  }else if(cat==="PALHADA"){
    if(a.metodo) parts.push(a.metodo.toLowerCase());
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
  }else if(cat==="AMOSTRA_SOLO"){
    if(a.profundidade) parts.push(a.profundidade==="Ambas"?"0-20 e 20-40 cm":a.profundidade);
    if(n0(a.nAmostras)) parts.push(n0(a.nAmostras)+" amostras");
    if(a.laboratorio) parts.push("→ "+a.laboratorio);
  }else if(cat==="TRAT_SEMENTES"){
    const rec=(a.produtos||[]).filter(p=>p.nome).map(p=>p.nome+(p.dose?" "+String(p.dose).replace(".",",")+" "+(p.un||"mL")+"/100 kg":"")).join(" + ");
    if(rec) parts.push(rec);
    if(a.cultivar) parts.push(a.cultivar);
    if(a.qtdSementes) parts.push(String(a.qtdSementes).replace(".",",")+" "+(a.qtdUn||"kg"));
  }else if(cat==="INOCULACAO"){
    if(a.produtoInoc) parts.push(a.produtoInoc);

async function syncEnviar(){
  if(!syncAtivo()||!syncFila.length) return;
  const resto=[]; let mudou=false;
  for(const item of syncFila){
    let col, reg, corpo, conflito;
    if(item.t==="r"){
      col="remessas"; reg=(D.remessas||[]).find(x=>x.id===item.id);
      if(!reg) continue;
      corpo={ id:reg.id, origem:reg.origem, destino:reg.destino, data:reg.data, payload:reg };
      conflito="id";
    }else if(item.t==="t"){
      col="telemetria"; reg=(D.telemetria||[]).find(x=>x.id===item.id);
      if(!reg) continue;
      corpo={ id:reg.id, fonte:reg.fonte, data:reg.data, payload:reg };
      conflito="id";
    }else if(item.t==="c"){
      /* código de acesso gerado pelo admin: sobe para valer em todos os aparelhos */
      col="codigos_acesso"; const cod=((D.codigosAcesso||{})[item.id]);
      if(!cod) continue;
      corpo={ chave:item.id, codigo:cod, atualizado_em:new Date().toISOString() };
      conflito="chave";
    }else if(item.t==="tar"){
      /* v77: tarefa do planejamento. O histórico viaja DENTRO do payload — a coleção do app
         (D.tarefaHistorico) continua sendo a fonte, e o banco guarda a foto completa da tarefa. */
      col="planejamento_tarefa"; reg=(D.tarefas||[]).find(x=>x.id===item.id);
      if(!reg) continue;
      corpo={ id:reg.id, unidade_id:reg.unidade||null, prazo:reg.prazo||null, status:reg.status,
        payload:{...reg, historico:planHistDe(reg.id)} };
      conflito="id";
    }else if(item.t==="rod"){
      col="planejamento_rodada"; reg=(D.rodadas||[]).find(x=>x.id===item.id);
      if(!reg) continue;
      corpo={ id:reg.id, ref:reg.ref, payload:reg };
      conflito="id";
    }else if(item.t==="sem"){
      col="planejamento_semana"; reg=(D.semanas||[]).find(x=>x.id===item.id);
      if(!reg) continue;
      corpo={ id:reg.id, ini:reg.ini, payload:reg };
      conflito="id";
    }else if(item.t==="pec"){
      /* espelho da pecuária do boletim em tabela própria (ERP/consultas);
         o payload completo do boletim continua indo para "boletins" */
      col="boletim_pecuaria"; reg=D.boletins.find(x=>x.id===item.id);
      if(!reg || reg.exemplo || !temPecuaria(reg)) continue;
      corpo={ id:reg.id, fazenda_id:reg.fazendaId, data:reg.data, responsavel:reg.responsavel||"", payload:reg.pecuaria };
      conflito="id";
    }else{
      col = item.t==="b" ? "boletins" : "pos_colheitas";
      reg = item.t==="b" ? D.boletins.find(x=>x.id===item.id) : (D.posColheitas||[]).find(x=>x.id===item.id);
      if(!reg || reg.exemplo) continue;
      corpo={ id:reg.id, fazenda_id:reg.fazendaId, data:reg.data, payload:reg };
      conflito="fazenda_id,data";
    }
    try{
      const r=await fetch(syncCfg.url+"/rest/v1/"+col+"?on_conflict="+conflito,{
        method:"POST", headers:syncCab(),
        body:JSON.stringify([corpo])});
      /* v82: o recibo do banco fica gravado no proprio registro. Antes, "enviado" era so
         "gravado no aparelho" — e um erro de rede passava batido (ver diagnostico de 11/09). */
      if(r.ok){ if(reg && (item.t==="b"||item.t==="p")){ reg.sincEm=new Date().toISOString(); mudou=true; } }
      else { item.http=r.status; item.tent=(item.tent||0)+1; resto.push(item); }
    }catch(e){ item.http=0; item.tent=(item.tent||0)+1; resto.push(item); }
  }
  syncFila=resto; syncSalvarFila();
  if(mudou) await salvarDados();
}
async function syncBaixar(){
  if(!syncAtivo()) return false;
  let ok=false;
  /* aparelho com código de escopo limitado recebe só o que a tela dele permite lançar */
  const esc0=escopoAtual();
  const soFz = (esc0 && !esc0.tudo) ? unidadesPermitidas().map(f=>f.id) : null;
  const idsFz = soFz ? soFz.concat(Object.keys(FZ_LEGADO).filter(k=>soFz.includes(FZ_LEGADO[k]))) : null;
  await baixarPlanejamento();
  for(const [col,alvo] of [["boletins","boletins"],["pos_colheitas","posColheitas"],["remessas","remessas"],["telemetria","telemetria"]]){
    try{
      /* v82: `atualizado` = hora em que a linha entrou no banco. É o "recebido HH:MM" do monitor de
         chegada — diferente de `enviadoEm`, que é a hora em que o gerente terminou o boletim. */
      let url=syncCfg.url+"/rest/v1/"+col+"?select=payload,atualizado&order=data.desc&limit=2000";
      if(idsFz){
        if(col==="boletins"||col==="pos_colheitas") url+="&fazenda_id=in.("+idsFz.join(",")+")";
        else if(col==="remessas") url+="&or=(origem.in.("+idsFz.join(",")+"),destino.in.("+idsFz.join(",")+"))";
      }
      const r=await fetch(url,
        { headers:{ "apikey":syncCfg.chave, "Authorization":"Bearer "+syncCfg.chave } });
      if(!r.ok) continue;
      const linhas=await r.json(); ok=true;
      const lista=D[alvo]=D[alvo]||[];
      linhas.forEach(l=>{
        const b=l.payload; if(!b||!b.id) return;
        if(l.atualizado) b.recebidoEm=l.atualizado;   /* v82: nome próprio — "atualizado" já existe dentro do payload das remessas */
        /* registros gravados por versões antigas chegam com o id antigo da fazenda:
           caem na unidade atual correspondente (Café) */
        if(b.fazendaId) b.fazendaId=fzAtual(b.fazendaId);
        if(col==="remessas"){ if(b.origem) b.origem=fzAtual(b.origem); if(b.destino) b.destino=fzAtual(b.destino); }
        if(soFz){
          if(col==="remessas"){ if(!soFz.includes(b.origem) && !soFz.includes(b.destino)) return; }
          else if(b.fazendaId && !soFz.includes(b.fazendaId)) return;
        }
        if(syncFila.some(x=>x.id===b.id)) return; /* edição local ainda não enviada vence */
        const porId = (col==="remessas"||col==="telemetria");
        const i = porId
          ? lista.findIndex(x=>x.id===b.id)
          : lista.findIndex(x=>x.id===b.id || (x.fazendaId===b.fazendaId && x.data===b.data && !x.exemplo));
        if(i>=0){ if(porId && n0(lista[i].atualizado)>n0(b.atualizado)) return; lista[i]=b; }
        else lista.push(b);
      });
      if(lista.some(x=>!x.exemplo)) D[alvo]=lista.filter(x=>!x.exemplo); /* dados reais aposentam os exemplos */
    }catch(e){}
  }
  if(ok){ syncUltima=new Date(); await salvarDados(); }
  return ok;
}
/* v77: planejamento (sql/050). O app lê e escreve; o histórico de cada tarefa viaja dentro do
   payload da tarefa e volta para a coleção D.tarefaHistorico. Edição local ainda na fila vence. */
async function baixarPlanejamento(){
  if(!syncAtivo()) return false;
  let ok=false;
  for(const [col,alvo] of [["planejamento_rodada","rodadas"],["planejamento_semana","semanas"],["planejamento_tarefa","tarefas"]]){
    try{
      const r=await fetch(syncCfg.url+"/rest/v1/"+col+"?select=payload&limit=4000",
        { headers:{ "apikey":syncCfg.chave, "Authorization":"Bearer "+syncCfg.chave } });
      if(!r.ok) continue;
      const linhas=await r.json(); if(!Array.isArray(linhas)) continue;
      ok=true;
      const lista=D[alvo]=D[alvo]||[];
      linhas.forEach(l=>{
        const o=l.payload; if(!o||!o.id) return;
        if(syncFila.some(x=>x.id===o.id)) return;
        if(o.unidade) o.unidade=fzAtual(o.unidade);
        if(alvo==="tarefas" && Array.isArray(o.historico)){
          const h=planHist();
          o.historico.forEach(x=>{ if(x&&x.id&&!h.some(y=>y.id===x.id)) h.push(x); });
          delete o.historico;
        }
        const i=lista.findIndex(x=>x.id===o.id);
        if(i>=0) lista[i]=o; else lista.push(o);
      });
    }catch(e){}
  }
  if(ok) await salvarDados();
  return ok;
}

/* ---------- v82: estado REAL do envio (diagnóstico de 11/09/2026) ----------
   Até a v81 a casa do gerente dizia "Boletim de hoje enviado" assim que o boletim era gravado no
   APARELHO: o POST para o banco vinha depois e, se falhasse, o erro era engolido sem nenhum aviso.
   Quem responde agora é a fila: item fora da fila = o banco confirmou (`reg.sincEm`, gravado em
   syncEnviar). Função ÚNICA nas três atividades; relata ENVIO, nunca trabalho. */
const naFila = (t,id) => syncFila.find(x=>x.t===t && x.id===id);
const filaRecusou = f => !!(f && f.http && f.http>=400 && f.http!==408 && f.http!==429);
function estadoEnvio(t,id){
  const f=naFila(t,id);
  if(!f) return {estado:"enviado"};
  return {estado: filaRecusou(f)?"recusado":"espera", http:f.http||0};
}
const horaEnvio = b => b && b.sincEm ? new Date(b.sincEm).toTimeString().slice(0,5)
  : ((b&&b.enviadoEm||"").split(" ")[1]||"");
/* hora em que o registro CHEGOU ao banco (coluna `atualizado`); sem ela, a hora em que o
   gerente terminou o boletim. Quem lê é o monitor de chegada da Diretoria. */
const horaChegada = b => { if(b && b.recebidoEm){ const d=new Date(b.recebidoEm);
    if(!isNaN(d)) return d.toTimeString().slice(0,5); } return horaEnvio(b); };

/* Componente ÚNICO do indicador de envio: casa do gerente e topo do boletim, nas três atividades.
   Estático (nunca sticky — orçamento de altura de c5/c11), uma linha, sem emoji novo além dos três
   estados. Some quando não há nada a dizer. */
function faixaEnvio(fz, o){
  if(!syncAtivo()) return "";
  /* `t` é chave substituta, não condicional por atividade: "b" = boletim, "p" = pós-colheita.
     O vocabulário ("boletim" / "registro") vem de quem chama, como na régua de 7 dias (c11). */
  const t = (o&&o.t)||"b", rot = (o&&o.rotulo)||"boletim";
  const b = t==="p" ? posDoDia(hojeBRT(), fz) : boletimDoDia(hojeBRT(), fz);
  const fila = syncFila.filter(x=>x.t==="b" || x.t==="p");
  const meu = b ? naFila(t, b.id) : null;
  if(!b && !fila.length) return "";
  const nb = fila.filter(x=>x.t===t).length;
  const botao = `<button class="btn suave mini" id="bt-enviar-agora" style="display:inline-flex;padding:2px 8px;margin-left:6px">🔄 Tentar enviar agora</button>`;
  const recusado = fila.find(filaRecusou);
  if(b && !meu){
    const h=horaEnvio(b);
    return `<div class="aviso verde" style="margin-bottom:10px"><b>✅ ${esc(rot[0].toUpperCase()+rot.slice(1))} de hoje enviado${h?" às "+esc(h):""}</b>`
      + (fila.length?`<br><span class="mut">⏳ ainda ${fila.length} registro(s) na fila deste aparelho.</span>${botao}`:` <span class="mut">— o escritório já recebeu.</span>`)
      + `</div>`;
  }
  /* tentativa no ar: não assustar com "sem internet" no segundo em que o envio está acontecendo */
  if(syncOcupado && navigator.onLine!==false)
    return `<div class="aviso" style="margin-bottom:10px"><b>⏳ Enviando…</b>
      <br><span class="mut">Guardado no aparelho enquanto o banco não confirma.</span></div>`;
  if(recusado)
    return `<div class="aviso" style="border-color:var(--amarelo);margin-bottom:10px"><b>⏳ Aguardando envio${nb?" ("+nb+" "+esc(rot)+(nb>1?"s":"")+" na fila)":""}</b>
      <br><span class="mut">O banco respondeu ${recusado.http} e não gravou. Nada se perdeu — está guardado neste aparelho. Avise o escritório.</span>${botao}</div>`;
  return `<div class="aviso" style="border-color:var(--amarelo);margin-bottom:10px"><b>⏳ Aguardando internet${nb?" ("+nb+" "+esc(rot)+(nb>1?"s":"")+" na fila)":""}</b>
    <br><span class="mut">Está guardado neste aparelho e sobe sozinho quando o sinal voltar.</span>${botao}</div>`;
}

/* Colheita lançada como operação vira registro em r.colheita (painel, relatório e CSV continuam valendo).
   Só as linhas espelhadas (id "opcol-") são recriadas; colheitas antigas ficam intactas. */
async function espelharColheitaGraos(r){
  const ops=(r.atividades||[]).filter(a=>a.gr&&opCatDe(a.tipo)==="COLHEITA");
  r.colheita=(r.colheita||[]).filter(c=>!String(c.id||"").startsWith("opcol-"));
  ops.forEach(a=>{
    const kg=(a.producaoUn==="kg")?n0(a.producao):n0(a.producao)*60;
    const sacas=Math.round(kg/60*100)/100;
    r.colheita.push({id:"opcol-"+a.id, talhaoId:a.talhaoId, areaHa:a.areaHa||"", sacas:sacas||"", kg:kg||"",
      umidade:a.umidade||"", impureza:a.impureza||"", destino:a.destino||"", cargas:a.cargas||"", obs:a.obs||""});
  });
  /* 100% da área colhida? oferece encerrar o ciclo — v72: diálogo único, UMA pergunta para todos os talhões,
     sem destaque (encerrar não se desfaz na tela: a pessoa lê e escolhe) */
  const encerrar=[];
  [...new Set(ops.map(a=>a.talhaoId).filter(Boolean))].forEach(tid=>{
    const c=cicloAtivo(tid), t=talhao(tid);
    if(!c||!n0(t.area)) return;
    const antes=D.boletins.filter(b=>b.fazendaId===r.fazendaId&&b.data>=(c.plantio||"")&&b.id!==r.id)
      .reduce((s,b)=>s+(b.colheita||[]).filter(x=>x.talhaoId===tid).reduce((x2,cc)=>x2+n0(cc.areaHa),0),0);
    const hoje2=r.colheita.filter(x=>x.talhaoId===tid).reduce((s,x)=>s+n0(x.areaHa),0);
    if(antes+hoje2>=n0(t.area)*0.999) encerrar.push({c,t});
  });
  if(encerrar.length){
    const ok=await perguntar({ pergunta:"Encerrar o ciclo dos talhões com 100 % da área colhida, guardando-os no histórico?",
      detalhes:encerrar.map(x=>x.t.nome+" — "+rotuloCultura(x.c.cultura)), sim:"Encerrar ciclos", nao:"Manter abertos", destaque:false });
    if(ok) encerrar.forEach(x=>{ x.c.encerradoEm=r.data; });
  }
}
/* Cinto de segurança do envio: junta os avisos que merecem uma conferida antes de mandar */
function avisosEnvio(r){
  const avisos=[];
  const chuva=n0(r.clima&&r.clima.chuvaMm);
  if(chuva>150) avisos.push("Chuva de "+chuva.toLocaleString("pt-BR")+" mm — acima de 150 mm. Confira se o número está certo.");
  const ic=icropDo(r.data,r.fazendaId);
  if(ic && Math.abs(chuva-ic.chuva)>15) avisos.push("Chuva informada ("+chuva.toLocaleString("pt-BR")+" mm) difere da estação iCrop ("+ic.chuva.toLocaleString("pt-BR")+" mm) em mais de 15 mm.");
  const pessoas=n0(r.mo&&r.mo.proprios)+n0(r.mo&&r.mo.diaristas);
  const diaSemana=new Date(r.data+"T12:00:00").getDay();
  if(diaSemana!==0 && pessoas===0){
    const lim=(()=>{const d=new Date(r.data+"T12:00:00"); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10);})();
    const teveGente=D.boletins.some(b=>b.fazendaId===r.fazendaId && b.id!==r.id && b.data>=lim && b.data<r.data
      && (n0(b.mo&&b.mo.proprios)+n0(b.mo&&b.mo.diaristas))>0);
    if(teveGente) avisos.push("Dia útil com 0 pessoas — esta fazenda teve gente trabalhando nos últimos 7 dias. Confira a mão de obra.");
  }
  if((r.colheita||[]).some(c=>!c.talhaoId)) avisos.push(atividadeDe(r.fazendaId)==="CAFE"?"Colheita lançada sem talhão. Diga de qual talhão saiu o café.":"Colheita lançada sem talhão. Diga de qual talhão saiu a produção.");
  if(!(r.atividades||[]).length && !(r.colheita||[]).length && pessoas===0 && !(r.ocorrencias||[]).length && !temPecuaria(r) && !(r.irg||[]).some(e2=>e2.status))
    avisos.push("Boletim praticamente vazio — sem atividades, colheita nem equipe. Confira se o dia foi assim.");
  /* grãos: rastreabilidade e informado × medido */
  if(temCultura(r.fazendaId,"GRAOS")&&!temCultura(r.fazendaId,"CAFE")){
    (r.atividades||[]).forEach(a=>{
      if(a.gr&&a.tipo&&opCatDe(a.tipo)==="APLICACAO"&&!(a.produtos||[]).some(p=>p.nome))
        avisos.push("Aplicação \""+a.tipo+"\" em "+talhao(a.talhaoId).nome+" sem receita preenchida. Sem ela não dá para rastrear a aplicação.");
      if(a.gr&&a.tipo&&!a.talhaoId)
        avisos.push("Operação \""+a.tipo+"\" sem talhão. Diga onde foi feita.");
    });
    (r.irg||[]).forEach(e2=>{
      if(!e2.status) return;
      const nome=e2.nome||talhao(e2.k).nome;
      const med=icropMedidoPivo(r,nome);
      const inf=n0(e2.lamina);
      if(!med) return;
      if((e2.status==="Rodou"||e2.status==="Parcial")&&inf&&med.regou&&Math.abs(inf-med.mm)>Math.max(2,med.mm*0.25))
        avisos.push(nome+": lâmina informada ("+inf.toLocaleString("pt-BR")+" mm) difere do que o iCrop mediu ("+med.mm.toLocaleString("pt-BR",{maximumFractionDigits:1})+" mm).");
      if(e2.status==="Não rodou"&&med.regou)
        avisos.push(nome+": marcado como \"Não rodou\", mas o iCrop mediu "+med.mm.toLocaleString("pt-BR",{maximumFractionDigits:1})+" mm de lâmina.");
      if(e2.status==="Rodou"&&!med.regou&&!inf)
        avisos.push(nome+": marcado como \"Rodou\" sem lâmina informada, e o iCrop não mediu irrigação.");
    });
  }
  return avisos;
}
/* v70: envio com seção eventual sem resposta — abre as seções, mostra UM aviso âmbar acima da primeira e rola até ela.
   Texto relata ausência de resposta (nunca "pendente"/"faltou"); o aviso some sozinho quando a seção é respondida. */
function mostrarSecoesSemResposta(lista){
  const antiga=document.getElementById("aviso-sem-resposta"); if(antiga) antiga.remove();
  let primeira=null;
  lista.forEach(s=>{ const sp=document.getElementById(s.resumo); if(!sp) return;
    let det=sp.closest("details"); while(det){ det.open=true; det=det.parentElement&&det.parentElement.closest("details"); }
    if(!primeira) primeira=sp.closest("details"); });
  if(!primeira) return;
  const av=document.createElement("div"); av.id="aviso-sem-resposta"; av.className="aviso";
  av.innerHTML=`<b>Antes de enviar, responda:</b> ${lista.map(s=>esc(s.nome)).join(" · ")}. Registre o que houve ou toque em <b>Nada a registrar hoje</b>.`;
  primeira.parentNode.insertBefore(av, primeira);
  av.scrollIntoView({behavior:"smooth",block:"start"});
}
/* v72: cinto de segurança do envio pelo diálogo único — pergunta diz o que vai acontecer, avisos como detalhes,
   "Revisar" à esquerda e o verbo do envio à direita SEM destaque (o envio é tratado como definitivo: a pessoa lê). */

   a mesma função vale para as três atividades. Texto diz a próxima ação, nunca "campo obrigatório". */
function faltaEnvio(r){
  if(!r) return "";
  const tem = (r.clima&&r.clima.cond) || (r.atividades||[]).length || r.obsGeral || (r.ocorrencias||[]).length || temPecuaria(r) || (r.irg||[]).some(e2=>e2.status);
  return tem ? "" : "Registre o clima ou uma observação do dia";
}
function validarEnviar(){
  const r=rascunho;
  if(faltaEnvio(r)){ atualizarAvanco("bt-enviar", faltaEnvio(r)); return; }
  /* boletim já existente na data: a pessoa não enxerga isso no formulário — o toque é permitido e explicado (avisoInline) */
  const jaExiste = D.boletins.find(b=>b.data===r.data && b.fazendaId===r.fazendaId && b.id!==r.id);
  if(jaExiste){ avisoInline("#bt-enviar", "Já existe boletim de "+fmtData(r.data)+" nesta unidade. Abra-o pela lista para corrigir."); return; }
  /* v70 (decisão do Nilo): toda seção eventual precisa de resposta antes do envio — registro ou "Nada a registrar hoje".
     Só as eventuais (as que têm o chip); as esperadas seguem a regra de sempre. Sem ação em massa: um toque por seção. */
  const semResposta=secoesEventuaisDa(atividadeDe(r.fazendaId)).filter(s=>estadoSecao(r,s).k==="nao_respondido");
  if(semResposta.length){ mostrarSecoesSemResposta(semResposta); return; }
  const avisos=avisosEnvio(r);
  if(avisos.length){ caixaAvisosEnvio(avisos); return; }
  delete r.avisosConfirmados;
  concluirEnvio();
}
async function concluirEnvio(){
  const r=rascunho;
  /* v75: fecha o dia e planeja amanhã — folha CURTA depois do cinto de segurança e antes de gravar.
     Só quando o boletim que fecha é do dia de hoje (corrigir boletim antigo não pede plano de
     "amanhã"). Pular é um toque; nos dois casos o envio segue. Nunca bloqueia. */
  let motivoPlano=null;
  if(r.data===hojeBRT()){
    const resp=await abrirFolhaPlano(r);
    if(resp){ motivoPlano=resp.motivo; if(resp.salvar) planoGuardar(resp); }
  }
  /* status ✅/◐/⚪ de cada linha do plano de HOJE, calculado dos registros do próprio boletim, e o
     motivo do desvio (ou "clima", quando o dia foi impedido pelo clima declarado) — nada digitado */
  gravarPlanoNoBoletim(r, motivoPlano);
  const propostasCiclo=[];   /* v72: plantio lançado → propostas de abrir/completar ciclo, perguntadas de uma vez ao fim */
  /* v69: "sem ocorrência" nunca sobe junto com registro; quem respondeu = quem assina o boletim, se o chip veio antes do nome */
  limparRespostasSecao(r);
  Object.values(r.secoes||{}).forEach(x=>{ if(x && !x.por) x.por=r.responsavel||""; });
  D.ultimasDoses = D.ultimasDoses||{};
  D.insumosAprendidos = D.insumosAprendidos||[];
  D.ultimasReceitas = D.ultimasReceitas||{};
  D.ultimasFert = D.ultimasFert||{};
  if(r.irr && r.irr.fert==="Sim" && r.irr.fertReceita) D.ultimasFert[r.fazendaId]=r.irr.fertReceita;
  (r.atividades||[]).forEach(a=>{ if(a.tipo && a.receita) D.ultimasReceitas[nomeAtual(a.tipo)]={receita:a.receita, ltanque:a.ltanque||""}; });
  (r.atividades||[]).forEach(a=>(a.insumos||[]).forEach(x=>{
    if(x.nome){ if(x.dose||x.qtd) D.ultimasDoses[x.nome]={dose:x.dose,qtd:x.qtd};
      if(!(D.insumos||[]).some(i=>i.nome===x.nome) && !D.insumosAprendidos.includes(x.nome)) D.insumosAprendidos.push(x.nome); }
  }));
  const aprender=nm=>{ if(nm && !(D.insumos||[]).some(i2=>i2.nome===nm) && !D.insumosAprendidos.includes(nm)) D.insumosAprendidos.push(nm); };
  if(temCultura(r.fazendaId,"GRAOS") && !temCultura(r.fazendaId,"CAFE")){
    D.ultimasReceitasTal=D.ultimasReceitasTal||{}; D.ultimasOpsTal=D.ultimasOpsTal||{}; D.ciclos=D.ciclos||[];
    (r.atividades||[]).forEach(a=>{
      if(!a.gr||!a.talhaoId||!a.tipo) return;
      const cat=opCatDe(a.tipo);
      /* memórias de um toque: repetir a última operação e a última receita do talhão */
      const copia=JSON.parse(JSON.stringify(a)); delete copia.id;
      D.ultimasOpsTal[a.talhaoId]=copia;
      if(cat==="APLICACAO"&&(a.produtos||[]).some(p=>p.nome))
        D.ultimasReceitasTal[a.talhaoId]={tipo:a.tipo,alvo:a.alvo||"",produtos:JSON.parse(JSON.stringify(a.produtos)),caldaLha:a.caldaLha||"",equip:a.equip||""};
      (a.produtos||[]).forEach(p=>aprender(p.nome));
      aprender(a.produtoAdb); aprender(a.formulacao); aprender(a.produtoInoc);
      /* plantio lançado: oferece abrir (ou completar) o ciclo do talhão com a data — juntado em UMA pergunta abaixo */
      if(cat==="PLANTIO"&&a.talhaoId!=="geral"){
        const c=cicloAtivo(a.talhaoId);
        if(!c){ if(a.culturaPl && !propostasCiclo.some(x=>x.talhaoId===a.talhaoId)) propostasCiclo.push({talhaoId:a.talhaoId, cultura:a.culturaPl, abrir:true}); }
        else if(!c.plantio && !propostasCiclo.some(x=>x.talhaoId===a.talhaoId)) propostasCiclo.push({talhaoId:a.talhaoId, cultura:c.cultura, ciclo:c});
      }
    });
    /* o sistema propõe, a pessoa aceita com um toque: ação reversível (o ciclo pode ser encerrado ou corrigido em
       Cadastros › Ciclos) e caminho provável claro → afirmativa com destaque. Uma pergunta para todos os talhões. */
    if(propostasCiclo.length){
      const linhas=propostasCiclo.map(x=>rotuloCultura(x.cultura)+" em "+talhao(x.talhaoId).nome+(x.abrir?"":" (ciclo já aberto, sem data)"));
      const ok=await perguntar({ pergunta:"Abrir o ciclo dos talhões plantados hoje, com plantio em "+fmtData(r.data)+"?",
        detalhes:linhas, sim:"Abrir ciclos", nao:"Deixar como está", destaque:true });
      if(ok) propostasCiclo.forEach(x=>{ if(x.abrir) D.ciclos.push({id:uid(),talhaoId:x.talhaoId,cultura:x.cultura,plantio:r.data}); else x.ciclo.plantio=r.data; });
    }
    (r.irg||[]).forEach(e2=>(e2.quimiProdutos||[]).forEach(p=>aprender(p.nome)));
    await espelharColheitaGraos(r);
  }
  if(r.pecuaria){
    const evs=(r.pecuaria.eventos||[]).filter(e2=>e2.tipo);
    if(evs.length){ D.ultimoEvPec=D.ultimoEvPec||{}; D.ultimoEvPec[r.fazendaId]=JSON.parse(JSON.stringify(evs[evs.length-1])); }
  }
  if(r.id){
    const i=D.boletins.findIndex(b=>b.id===r.id);
    r.editadoEm=fmtData(hojeISO())+" "+agoraHM();
    D.boletins[i]=JSON.parse(JSON.stringify(r));
  }else{
    r.id=uid(); r.enviadoEm=r.data+" "+agoraHM();
    D.boletins.push(JSON.parse(JSON.stringify(r)));
  }
  if(r.responsavel) Persist.set("bdf:nomeResp", r.responsavel);
  envioRecente=r.id;
  syncEnfileirar('b', r.id);
  if(temPecuaria(r)) syncEnfileirar('pec', r.id); /* cópia da pecuária na tabela boletim_pecuaria */
  gerarRemessasDe(r);
  salvarDados(); rascunho=null; Persist.del("bdf:rascunho");
  ir("casa");
}

function ligarEventos(tela){
  const app=$("#app");
  if(tela==="cadastros") cadPosRender();
  if(tela==="planejamento") planUI.flash="";

      app.querySelectorAll("[data-farolun]").forEach(el=>{ el.style.display=cadBate(farolVista.q, el.dataset.nome)?"":"none"; }); }; }
  if(tela==="codigo"){ const cod=$("#cod-acesso");
    if(cod) cod.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); const b=$("#bt-cod-entrar"); if(b) b.click(); } }; }

  const setResumo=(id,txt)=>{ const el=$("#"+id); if(el) el.textContent=txt; };

  /* v67: teclado no badge de categoria (role=button): Enter/Espaço equivalem ao toque */
  app.onkeydown = ev=>{ const bd=ev.target&&ev.target.closest&&ev.target.closest(".op-cat"); if(bd&&(ev.key==="Enter"||ev.key===" ")){ ev.preventDefault(); bd.click(); } };
  app.onclick = async ev=>{
    /* v67: toque no badge de categoria mostra o nome da categoria (legenda sob demanda); some no 2º toque, em 2,5 s ou ao tocar fora */
    const bd=ev.target.closest(".op-cat");
    app.querySelectorAll(".op-cat.mostra").forEach(x=>{ if(x!==bd) x.classList.remove("mostra"); });
    if(bd){ const on=bd.classList.toggle("mostra"); if(on) setTimeout(()=>bd.classList.remove("mostra"),2500); return; }
    /* v71: toque em ação desabilitada por perfil mostra quem a executa (data-papel) por 2,5 s; nada executa.
       O botão não tem id nem data-* de ação, então nenhum tratador abaixo o alcançaria de todo modo. */
    const off=ev.target.closest(".acao-off");
    app.querySelectorAll(".acao-off.mostra").forEach(x=>{ if(x!==off) x.classList.remove("mostra","dir"); });
    if(off){ const on=off.classList.toggle("mostra"); off.classList.toggle("dir", on && off.getBoundingClientRect().left>innerWidth/2);
      if(on) setTimeout(()=>off.classList.remove("mostra","dir"),2500); return; }
    /* v74: chips removíveis da multi-seleção — o × dispara o toque do chip de opção correspondente (o tratador que já
       existe faz a remoção e grava); "+K" só expande a lista. Qualquer toque em chip repinta os contadores depois. */
    const rm=ev.target.closest("[data-sel-rm]");
    if(rm){ const v=rm.dataset.selRm, k=v.indexOf("|"), attr=v.slice(0,k), val=v.slice(k+1), box=rm.closest(".sel-box"), pai=box&&box.parentElement;
      const alvo=pai&&pai.querySelector('.chip.on[data-'+attr+'="'+CSS.escape(val)+'"]');
      if(alvo) alvo.click();
      pintarSelecoes(); return; }
    const mais=ev.target.closest("[data-sel-mais]");
    if(mais){ selExpandido.add(mais.dataset.selMais); pintarSelecoes(); return; }
    if(ev.target.closest(".chip")) setTimeout(pintarSelecoes,0);
    const t = ev.target.closest("button"); if(!t) return;
    const d = t.dataset;
    if(telaAtual==="cadastros" || d.cadvoltar!==undefined){ if(cadClique(t,d)) return; }
    /* v77: módulo de planejamento — pastilhas, faixa do gerente e a área da Diretoria/Escritório */
    if(planClique(t,d)) return;
    if(t.id==="bt-planejamento"||t.id==="bt-planejamento2"){ if(!podePainel()) return; planNav=[{v:"menu"}]; ir("planejamento"); return; }

      const e2=escopoDoCodigo(cod);

        const er=$("#cod-erro"); if(er) er.style.display="block"; return; }
      acesso=e2; Persist.set("bdf:acesso",JSON.stringify(acesso));

    if(t.id==="bt-sair-aparelho"){

    /* Escritório: Unidades e Plano de safra (v52) — só ADMIN */

    if(t.id==="bt-relatorios"){ if(!podeCadastros()) return; window.open("relatorios.html","_blank"); return; }

      sessao={userId:u?u.id:"u2", papel, nome:u?u.nome:"Diretoria"}; Persist.set("bdf:sessao",JSON.stringify(sessao)); rascunho=null;

      const papel=podeCadastros()?"admin":"proprietario", u=D.usuarios.find(x=>x.papel===papel);
      sessao={userId:u?u.id:"u2", papel, nome:u?u.nome:"Diretoria"}; Persist.set("bdf:sessao",JSON.stringify(sessao)); rascunho=null; ir("relatorios"); return; }

      else if(d.pastosel!==undefined){ /* v51: select de pasto do cadastro — "Outro…" abre o campo livre ao lado */
        const tx=el.nextElementSibling;
        const v=(el.value==="__outro")?((tx&&tx.value)||""):el.value;
        if(tx){ if(el.value==="__outro"){ tx.style.display="block"; tx.focus(); }

        else if(d.pe!==undefined){ const c=el.closest("[data-pecev]"); const e3=r.pecuaria.eventos[parseInt(c.dataset.pecev)]; if(e3) e3[d.pe]=v; }

        else if(d.nt!==undefined){ const c=el.closest("[data-pecnut]"); const u=c&&r.pecuaria.nut[parseInt(c.dataset.pecnut)]; if(u) u[d.nt]=v; } }
      else if(d.pl!==undefined){ const c=el.closest("[data-peclote]"); const l=r.pecuaria.lotes[parseInt(c.dataset.peclote)];
        if(l){ l[d.pl]=el.value;
          if(d.pl==="cabecas"){ const tot=r.pecuaria.lotes.reduce((x,y)=>x+n0(y.cabecas),0);
            ["res-pec","res-pec-cont"].forEach(id2=>{ const sp=$("#"+id2); if(sp) sp.textContent=tot?tot+" cabeças":""; }); } } }
      else if(d.pe!==undefined){ const c=el.closest("[data-pecev]"); const e3=r.pecuaria.eventos[parseInt(c.dataset.pecev)]; if(e3) e3[d.pe]=el.value; }
      else if(d.mv!==undefined){ const c=el.closest("[data-pecmov]"); const m=c&&r.pecuaria.mov[parseInt(c.dataset.pecmov)];

      else if(d.sn!==undefined){ const c=el.closest("[data-pecsan]"); const s=c&&r.pecuaria.san[parseInt(c.dataset.pecsan)]; if(s) s[d.sn]=el.value; }
      else if(d.ms!==undefined){ const c=el.closest("[data-pecmassa]"); const v=c&&r.pecuaria.massa[parseInt(c.dataset.pecmassa)]; if(v) v[d.ms]=el.value; }

      else if(d.rp!==undefined){ const p2=pecMigrar(r.pecuaria=r.pecuaria||pecVazia()); p2.rep[d.rp]=el.value; }

    }
    if(telaAtual==="casa" && sessao && sessao.papel!=="gerente"){
      filtroPainel={busca:($("#f-busca")||{}).value||"", talhao:($("#f-talhao")||{}).value||"",

      clearTimeout(filtroTimer);
      filtroTimer=setTimeout(()=>{ if(telaAtual==="casa"){
        const foco=document.activeElement&&document.activeElement.id; const pos=document.activeElement&&document.activeElement.selectionStart;
        ir("casa",null,true);
        if(foco){ const el2=$("#"+foco); if(el2){ el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(e){} } }
      } },350);
    }
  };
  app.onchange = async ev=>{
    const el=ev.target, d=el.dataset;
    /* Importar (ADMIN): mapa de colunas e data do arquivo → estado do "3 · Importar" no lugar; arquivo/texto → "1 · Ler".

      if(durl){ const o=rascunho.ocorrencias.find(x=>x.id===d.fotoInput);

    }
    if(d.m==="nome" && rascunho){ const c=el.closest("[data-ativ]");
      if(c){ const a=rascunho.atividades.find(x=>x.id===c.dataset.ativ);

        const v=resolverMaq(rascunho.fazendaId, el.value);
        a.maquinas[i].nome=v; el.value=v; salvarRascunho(); return; } }
    /* grãos: pivô escolhido na lista da irrigação redesenha o cartão */
    if(rascunho && d.igsel!==undefined){ const e3=irgDe(rascunho,d.igsel);
      if(e3){ const p=pivosDa(rascunho.fazendaId).find(x=>x.k===el.value);
        e3.k=el.value; e3.nome=p?p.nome:(el.value?e3.nome:"");
        repintarIrg(rascunho); salvarRascunho(); } return; }
    /* talhão em cascata — escolher redesenha o cartão (a operação é escolhida por toque nos grupos).
       v76: vale também para o café, que passou ao mesmo seletor agrupado. */
    if(rascunho && (d.a==="talhaoId"||d.a==="culturaPl")){
      const card=el.closest("[data-ativ]"); const a=card&&rascunho.atividades.find(x=>x.id===card.dataset.ativ);
      if(a){
        if(d.a==="talhaoId"){ if(a.gr) limparCamposOp(a); a.talhaoId=el.value; }
        else if(!a.gr) return;
        else a[d.a]=el.value;
        card.outerHTML=cardAtivHtml(a); salvarRascunho(); return; } }
    /* pecuária: o tipo do evento decide os campos (dose, peso, valor…) */
    if(rascunho && d.pe==="tipo"){ const c=el.closest("[data-pecev]");
      if(c&&rascunho.pecuaria){ const i=parseInt(c.dataset.pecev); const e3=rascunho.pecuaria.eventos[i];
        if(e3){ e3.tipo=el.value; c.outerHTML=cardEventoPec(e3,i); salvarRascunho(); return; } } }
    /* fito: escolhido o talhão, a lista de pragas/doenças filtra pela cultura do ciclo */
    if(rascunho && d.f==="talhaoId"){ const c=el.closest("[data-fito]");
      if(c){ const f2=rascunho.fito.find(x=>x.id===c.dataset.fito);
        if(f2){ f2.talhaoId=el.value; const box=c.querySelector("[data-fnome-box]"); if(box) box.innerHTML=chipsFitoNome(f2);
          salvarRascunho(); return; } } }
    if(el.id==="rel-faz"){ filtroRel.fazenda=el.value; ir("relatorio",null,true); return; }
    if(el.id==="rel-de"){ filtroRel.de=el.value; ir("relatorio",null,true); return; }
    if(el.id==="rel-ate"){ filtroRel.ate=el.value; ir("relatorio",null,true); return; }
    if(d.vincTal){ const t2=D.talhoes.find(x=>x.id===d.vincTal); if(t2){ t2.fazendaId=el.value||null; salvarDados(); } return; }
    if(d.tipoTal){ const t2=D.talhoes.find(x=>x.id===d.tipoTal); if(t2){ t2.tipo=el.value; salvarDados(); ir("cadastros",null,true); } return; }
    if(d.perfilFaz){ const f2=D.fazendas.find(x=>x.id===d.perfilFaz);
      if(f2){ f2.perfil=el.value.split(",").filter(Boolean);
        /* rederiva o tipo dos talhões desta fazenda para acompanhar o novo perfil */
        talhoesDa(f2.id).forEach(t=>{ t.tipo=tipoPeloPerfil(t.nome, f2.perfil); });
        salvarDados(); ir("cadastros",null,true); } return; }
    if(rascunho && telaAtual==="form"){ app.oninput(ev); return; }
    if(telaAtual==="casa" && sessao && sessao.papel!=="gerente") app.oninput(ev);
  };
}

function vRelatorio(){
  const de=filtroRel.de||(()=>{const d=new Date();d.setDate(d.getDate()-6);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
  const ate=filtroRel.ate||hojeISO();
  const bs=D.boletins.filter(b=>b.data>=de && b.data<=ate && (!filtroRel.fazenda||b.fazendaId===filtroRel.fazenda));
  const porFaz={};
  bs.forEach(b=>{
    const k=b.fazendaId, o=porFaz[k]=porFaz[k]||{dias:0,sacas:0,latas:0,chuva:0,hm:0,comb:0,mo:0,faltas:0,fito:0,ocorr:0,pend:[]};
    o.dias++; o.chuva+=n0(b.clima.chuvaMm); o.mo+=n0(b.mo.proprios)+n0(b.mo.diaristas); o.faltas+=n0(b.mo.faltas);
    (b.colheita||[]).forEach(c=>{o.sacas+=n0(c.sacas); o.latas+=n0(c.latas); o.carretas=(o.carretas||0)+n0(c.carretas);});
    (b.atividades||[]).forEach(a=>(a.maquinas||[]).forEach(m=>{o.hm+=n0(m.horas); o.comb+=n0(m.comb);}));
    o.fito+=(b.fito||[]).filter(f=>f.nivel==="Alto").length;
    if(b.irr&&(b.irr.status==="Rodou com problema"||b.irr.status==="Não rodou"||["Baixo","Crítica"].includes(b.irr.agua))) o.irrProb=(o.irrProb||0)+1;
    o.ocorr+=(b.ocorrencias||[]).filter(x=>x.grav==="Alta").length;
    if(b.pendencias) o.pend.push(fmtData(b.data)+": "+b.pendencias);
  });
  const tot=Object.values(porFaz).reduce((s,o)=>({sacas:s.sacas+o.sacas,latas:s.latas+o.latas,hm:s.hm+o.hm,comb:s.comb+o.comb,chuva:s.chuva+o.chuva}),{sacas:0,latas:0,hm:0,comb:0,chuva:0});
  const talhaoSacas={};
  bs.forEach(b=>(b.colheita||[]).forEach(c=>{ const k=fazenda(b.fazendaId).nome+" · "+talhao(c.talhaoId).nome;
    talhaoSacas[k]=(talhaoSacas[k]||0)+n0(c.sacas); }));
  const rankTal=Object.entries(talhaoSacas).sort((a,b)=>b[1]-a[1]).slice(0,10);
  return topo("Relatório do período","De "+fmtData(de)+" a "+fmtData(ate),true)+`
    <div class="filtros no-print">
      <select id="rel-faz"><option value="">Todas as fazendas</option>
        ${D.fazendas.map(f=>`<option value="${f.id}" ${filtroRel.fazenda===f.id?"selected":""}>${esc(f.nome)}</option>`).join("")}</select>
      <span></span>
      <input id="rel-de" type="date" value="${de}"><input id="rel-ate" type="date" value="${ate}">
    </div>
    <div class="kpis">
      <div class="kpi"><div class="valor num">${tot.sacas}</div><div class="rot">Sacas colhidas</div></div>
      <div class="kpi"><div class="valor num">${tot.hm}</div><div class="rot">Horas-máquina</div></div>
      <div class="kpi"><div class="valor num">${tot.comb}</div><div class="rot">Combustível (L)</div></div>
      <div class="kpi"><div class="valor num">${bs.length}</div><div class="rot">Boletins no período</div></div>
    </div>
    <div class="cartao"><h3>Resumo por fazenda</h3>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
        <tr style="text-align:left;border-bottom:2px solid var(--linha)">
          <th style="padding:6px 4px">Fazenda</th><th>Boletins</th><th>Sacas</th><th>Latas</th><th>Carretas</th><th>Horas-máq.</th><th>Comb. (L)</th><th>Chuva (mm)</th><th>Pessoas·dia</th><th>Irrig. c/ problema</th><th>Alertas</th></tr>
        ${Object.entries(porFaz).map(([k,o])=>`<tr style="border-bottom:1px solid var(--linha)">
          <td style="padding:6px 4px"><b>${esc(fazenda(k).nome)}</b></td><td class="num">${o.dias}</td><td class="num">${o.sacas}</td>
          <td class="num">${o.latas}</td><td class="num">${o.carretas||0}</td><td class="num">${o.hm}</td><td class="num">${o.comb}</td><td class="num">${o.chuva}</td>
          <td class="num">${o.mo}</td><td class="num">${o.irrProb||""}</td><td class="num">${o.fito+o.ocorr||""}</td></tr>`).join("")||htmlEstado("vazio",{que:"boletim",unidade:filtroRel.fazenda||"",onde:filtroRel.fazenda?"":"nas unidades deste código",periodo:periodoVazio(de,ate),ultimo:filtroRel.fazenda?(boletinsOrdenados().find(b=>b.fazendaId===filtroRel.fazenda)||{}).data:""},{tag:"td",colspan:11})}
      </table></div></div>
    ${rankTal.length?`<div class="cartao"><h3>Talhões que mais colheram</h3>
      <ul class="lista-limpa">${rankTal.map(([k,v])=>`<li class="linha-flex"><span class="cresce">${esc(k)}</span><b class="num">${v} sc</b></li>`).join("")}</ul></div>`:""}
    ${Object.entries(porFaz).some(([k,o])=>o.pend.length)?`<div class="cartao"><h3>Pendências registradas</h3>
      ${Object.entries(porFaz).filter(([k,o])=>o.pend.length).map(([k,o])=>`<p class="mt"><b>${esc(fazenda(k).nome)}</b><br><span class="mut" style="white-space:pre-wrap">${esc(o.pend.join("\n"))}</span></p>`).join("")}</div>`:""}
    <div class="linha-flex mt no-print" style="gap:8px">
      <button class="btn sec mini" id="bt-rel-csv">⬇ Exportar CSV deste relatório</button>
      <button class="btn sec mini" id="bt-pdf">🖨 Imprimir / PDF</button>
    </div>`;
}
function csvRelatorio(){
  const de=filtroRel.de||"", ate=filtroRel.ate||hojeISO();
  const sep=";", lin=[["Fazenda","Boletins","Sacas","Latas (manual)","Carretas","Horas-máquina","Combustível (L)","Chuva (mm)","Pessoas·dia","Alertas graves"].join(sep)];
  const bs=D.boletins.filter(b=>(!de||b.data>=de)&&b.data<=ate&&(!filtroRel.fazenda||b.fazendaId===filtroRel.fazenda));
  const porFaz={};
  bs.forEach(b=>{ const o=porFaz[b.fazendaId]=porFaz[b.fazendaId]||{d:0,s:0,l:0,h:0,c:0,ch:0,mo:0,al:0};
    o.d++; (b.colheita||[]).forEach(c=>{o.s+=n0(c.sacas);o.l+=n0(c.latas);o.cr=(o.cr||0)+n0(c.carretas);});
    (b.atividades||[]).forEach(a=>(a.maquinas||[]).forEach(m=>{o.h+=n0(m.horas);o.c+=n0(m.comb);}));
    o.ch+=n0(b.clima.chuvaMm); o.mo+=n0(b.mo.proprios)+n0(b.mo.diaristas);
    o.al+=(b.fito||[]).filter(f=>f.nivel==="Alto").length+(b.ocorrencias||[]).filter(x=>x.grav==="Alta").length; });
  Object.entries(porFaz).forEach(([k,o])=>lin.push([fazenda(k).nome,o.d,o.s,o.l,o.cr||0,o.h,o.c,o.ch,o.mo,o.al].join(sep)));
  const blob=new Blob(["\ufeff"+lin.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="relatorio-fazendas.csv"; a.click(); URL.revokeObjectURL(a.href);
}
function atualizarMatura(card, c){
  const s=n0(c.cereja)+n0(c.verde)+n0(c.seco), m=card.querySelector(".matura");
  if(!m) return;
  const [a,b,d]=m.children;
  a.style.width=(s?100*n0(c.cereja)/s:33)+"%"; a.textContent=n0(c.cereja)||"";
  b.style.width=(s?100*n0(c.verde)/s:34)+"%"; b.textContent=n0(c.verde)||"";
  d.style.width=(s?100*n0(c.seco)/s:33)+"%"; d.textContent=n0(c.seco)||"";
}
