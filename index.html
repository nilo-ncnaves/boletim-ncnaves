      (d.talhoes||[]).forEach(x=>{ const ir=x.irrigacao||{}; L.push("   – "+(x.nome||relTal(x.talhao_id))+": "+[ir.mm!=null?relNum(ir.mm)+" mm":"",n0(x.horas)?relNum(x.horas)+" h":"",n0(x.pessoas_dia)?relNum(x.pessoas_dia,0)+" pessoas-dia":"",(x.produtos||[]).length?(x.produtos||[]).length+" aplicações":""].filter(Boolean).join(" · ")); }); return; }
    if(rel==="rebanho_mes"){ const m=d.movimentacao||{}, rp=d.reproducao||{}; L.push("• "+relUni(l.unidade_id)+": "+n0(m.nascimentos)+" nasc. ("+n0(m.nascimentos_m)+"M/"+n0(m.nascimentos_f)+"F) · "+n0(m.mortes)+" mortes · "+n0(m.desmamas)+" desmamas · "+n0(m.entradas)+" entradas · "+n0(m.saidas)+" saídas · saldo "+n0(m.saldo)+(rp.taxa_prenhez!=null?" · prenhez "+relNum(rp.taxa_prenhez,0)+"%":"")+" · "+relNum(d.cabecas_contadas,0)+" cabeças contadas");
      (d.embarques||[]).forEach(e=>L.push("   – "+fmtDataCurta(e.data)+" "+e.tipo+": "+relNum(e.cabecas,0)+" cab."+(e.valor?" · R$ "+relNum(e.valor,0):"")+(e.contraparte?" · "+e.contraparte:""))); return; }
    if(rel==="plano_executado_mes"){ if(d.aviso&&!d.plano){ L.push("• "+relUni(l.unidade_id)+": "+d.aviso); return; }
      L.push("• "+relUni(l.unidade_id)+" (plano v"+d.plano.versao+"): "+n0((d.unidades||[]).length)+" unidades · "+n0(r.amarelos)+" sem registro · "+n0(r.vermelhos)+" janela fechada · "+n0(r.sem_alias)+" sem ligação com o app");
      (d.unidades||[]).forEach(u=>{ const it=[["adubação",u.adubo],["calagem",u.calagem],["fito",u.fito]].filter(([,x])=>x&&(x.farol==="amarelo"||x.farol==="vermelho")); if(it.length) L.push("   – "+u.codigo+": "+it.map(([n,x])=>n+" "+x.situacao).join(" · ")); }); return; }
  });
  L.push("Fonte: Boletim NCNaves · motor de relatórios (Supabase). Diferença é para conferir, nunca erro.");
  return L.join("\n");
}
function abrirTextoZap(txt){
  if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); return; }
  const a=document.createElement("a");
  a.href="https://wa.me/?text="+encodeURIComponent(txt);
  a.target="_blank"; a.rel="noopener"; a.click();
}

/* ---------- Plano de safra (v52): proposta técnica do agrônomo, SÓ LEITURA ----------
   O plano (PPTX do Salvino) vive no Supabase (sql/005 cria as tabelas, sql/006 carrega a
   safra 2026/27) como REFERÊNCIA e comparação — nunca receituário: o app não recomenda
   produto, dose, época nem lâmina. Regras permanentes do projeto (CLAUDE.md):
   identidade só pelo cadastro mestre (unidade_manejo.id; nomes são aliases), kg do plano
   nunca aparecem por padrão ao gerente, mudança de plano só por NOVA versão publicada pelo
   Escritório, faróis dizem "sem registro" (nunca "não fez") e ficam só na Diretoria.
   Na v52 NADA muda na tela do gerente: aqui só se baixa e guarda o plano vigente
   (bdf:plano, para a fase B) e existe a tela de Escritório "Unidades e Plano". */
/* id da unidade do app → nome gravado em fazenda_app no Supabase (= nome exato do cadastro).
   Cinco batiam de saída; Vereda — Café, Lagamar Café (Rodrigo) e Mata Preta — Café foram
   confirmadas pelo Nilo em 03/09/2026 (docs/plano/2026-27/depara_fazendas.json). Fazenda
   nova no plano só entra aqui depois de conferida — nunca casar "por parecido". */
const PLANO_FAZENDA_APP={ f01:"Água Limpa", f03c:"Rio Preto-Lagamar — Café", f13c:"Mata Preta — Café", f14c:"Monte Carmelo — Café",
  f20:"Lagamar Café (Rodrigo)", f22c:"Vereda — Café", f23:"Vereda Romaria", f24:"Vereda Café 5º e 6º" };
const planoFzDe = nome => Object.keys(PLANO_FAZENDA_APP).find(k=>PLANO_FAZENDA_APP[k]===nome)||null;
const PLANO_MODELO={ "NC Naves":"NC", "NR Agropecuária":"NR" };
const PLANO_STATUS_UNIDADE=[["producao","produção"],["poda","poda"],["renovacao","renovação"],["recepa","recepa"],["plantio","plantio"],["a_confirmar","a confirmar"]];
const rotuloStatusUnidade = s => { const h=PLANO_STATUS_UNIDADE.find(([k])=>k===s); return h?h[1]:(s||"—"); };
const PLANO_FONTES_AREA=["estimativa","calcario","calcario_rateado","icrop","solinftec","agrogestao"];
const PLANO_SISTEMAS=["plano","app","solinftec","icrop","agrogestao"];
const PLANO_INSUMOS=["ureia","nitrato","sulfato_amonio","kcl","phusion","sulfato_mn","acido_borico","sulfato_zn"];
const PLANO_ROTULO_INSUMO={ureia:"ureia", nitrato:"nitrato", sulfato_amonio:"sulfato de amônio", kcl:"KCl", phusion:"Phusion", sulfato_mn:"sulfato de Mn", acido_borico:"ácido bórico", sulfato_zn:"sulfato de Zn"};
let planoCache={};   /* {fzId:{plano_versao_id, versao, vigente_de, fazenda_app, modelo, baixado_em, mes, unidades, aliasApp, adubo, calagem, fito, fitoExc, gantt, parametros}} */
const planoDe = fz => planoCache[fz]||null;   /* usado pela fase B (cartão do mês, chips, faróis) */
const planoIn = lista => "in.("+lista.map(s=>'"'+String(s).replace(/"/g,"")+'"').join(",")+")";
/* pedido ao Supabase com a mesma chave publishable do resto do app */
async function planoReq(metodo, caminho, corpo, prefer){
  const h={ "apikey":syncCfg.chave, "Authorization":"Bearer "+syncCfg.chave, "Content-Type":"application/json" };
  if(prefer) h.Prefer=prefer;
  const r=await fetch(syncCfg.url+"/rest/v1/"+caminho, { method:metodo||"GET", headers:h, body:corpo?JSON.stringify(corpo):undefined });
  if(!r.ok){ let m=""; try{ m=(await r.json()).message||""; }catch(e){} throw new Error("Supabase "+r.status+(m?" — "+m:"")); }
  const txt=await r.text(); return txt?JSON.parse(txt):null;
}
/* Baixa o plano VIGENTE das fazendas de café do escopo (unidades, adubo do mês corrente e
   do próximo, calagem, fito do mês, Gantt do modelo da empresa, parâmetros) e guarda em
   bdf:plano com plano_versao_id e data. Sem rede fica o cache; sem cache o app é a v51.
   Tabelas ainda não criadas (404) ou qualquer erro: silêncio, nada muda para o gerente. */
async function baixarPlano(){
  if(!syncAtivo()) return;
  try{
    const fzs=unidadesPermitidas().filter(f=>temCultura(f.id,"CAFE") && PLANO_FAZENDA_APP[f.id]);
    if(!fzs.length) return;
    const nomes=[...new Set(fzs.map(f=>PLANO_FAZENDA_APP[f.id]))];
    const fzArg="fazenda_app="+encodeURIComponent(planoIn(nomes));
    const planos=await planoReq("GET","plano_safra?select=id,fazenda_app,safra,versao,vigente_de,aprovado_por&status=eq.vigente&"+fzArg);
    if(!Array.isArray(planos)) return;
    const mes=new Date().getMonth()+1, prox=mes===12?1:mes+1;
    const meses="mes="+encodeURIComponent("in.("+mes+","+prox+")");
    let unidades=[], aliasApp=[], adubo=[], calagem=[], fito=[], fitoExc=[], gantt=[], params=[];
    if(planos.length){
      const ids="plano_id="+encodeURIComponent(planoIn(planos.map(p=>p.id)));
      [unidades,aliasApp,adubo,calagem,fito,fitoExc,gantt,params]=await Promise.all([
        planoReq("GET","unidade_manejo?select=id,codigo,fazenda_app,empresa,nome_plano,nome_curto,pai_id,area_ha,irrigacao,status,status_desde,area_zerada_ha&ativo=is.true&"+fzArg),
        planoReq("GET","unidade_alias?select=unidade_id,alias&sistema=eq.app&vigente_ate=is.null&"+fzArg),
        planoReq("GET","plano_adubo_mes?select=plano_id,unidade_id,mes,insumo,kg,via&"+ids+"&"+meses),
        planoReq("GET","plano_calagem?select=plano_id,unidade_id,subarea,t_ha,t_total,rateado,janela_ini,janela_fim&"+ids),
        planoReq("GET","plano_fito_mes?select=mes,fase,alvos,produtos,via_solo&plano_id=is.null&"+meses),
        planoReq("GET","plano_fito_excecao?select=mes,produto,fazenda_app&"+meses+"&"+fzArg),
        planoReq("GET","plano_gantt?select=modelo,atividade,meses,tipo,evidencia_app"),
        planoReq("GET","plano_parametros?select=chave,valor")
      ]);
    }
    const agora=new Date().toISOString();
    const parametros={}; (params||[]).forEach(x=>{ parametros[x.chave]=x.valor; });
    fzs.forEach(f=>{
      const nome=PLANO_FAZENDA_APP[f.id];
      const p=planos.find(x=>x.fazenda_app===nome);
      if(!p){ delete planoCache[f.id]; return; }   /* sem plano vigente: nada em cache para esta fazenda */
      const uns=(unidades||[]).filter(u=>u.fazenda_app===nome);
      const modelo=PLANO_MODELO[(uns[0]||{}).empresa]||"NC";
      const idsU=new Set(uns.map(u=>u.id));
      planoCache[f.id]={ plano_versao_id:p.id, versao:p.versao, vigente_de:p.vigente_de, fazenda_app:nome, modelo, baixado_em:agora, mes,
        unidades:uns, aliasApp:(aliasApp||[]).filter(a=>idsU.has(a.unidade_id)),
        adubo:(adubo||[]).filter(a=>a.plano_id===p.id), calagem:(calagem||[]).filter(c=>c.plano_id===p.id),
        fito:fito||[], fitoExc:(fitoExc||[]).filter(x=>x.fazenda_app===nome), gantt:(gantt||[]).filter(g=>g.modelo===modelo), parametros };
    });
    await Persist.set("bdf:plano", JSON.stringify(planoCache));
  }catch(e){ /* tabelas ainda não criadas ou sem rede: fica o cache que já existia */ }
}

/* ---------- Tela de Escritório (só ADMIN): Unidades e Plano ----------
   Lê e grava direto no Supabase (precisa de rede). Unidades: editar nome curto, status,
   área e obs; adicionar/encerrar apelidos; inativar (nunca apagar) — cada campo alterado
   vira uma linha em unidade_manejo_log. Plano: rodar auditoria (resultado em
   plano_safra.auditoria_json) e publicar como vigente (só com auditoria ✔ e nome do
   agrônomo); publicar passa a vigente anterior para "superado". */
let upEstado={ fz:"", dados:null, erro:"", editando:null, aliasEm:null };
async function upCarregar(){
  upEstado.erro="";
  if(!syncAtivo()){ upEstado.erro="Sincronização desligada — esta tela precisa do Supabase (Cadastros › Sincronização)."; return; }
  try{
    const [unidades,aliases,planos]=await Promise.all([
      planoReq("GET","unidade_manejo?select=*&order=codigo"),
      planoReq("GET","unidade_alias?select=id,unidade_id,fazenda_app,sistema,alias,vigente_de&vigente_ate=is.null&order=sistema,alias"),
      planoReq("GET","plano_safra?select=id,fazenda_app,safra,versao,status,vigente_de,motivo,arquivo_origem,criado_por,aprovado_por,aprovado_em,auditoria_ok,auditoria_json,resumo_deck,criado_em&order=fazenda_app,versao.desc")
    ]);
    upEstado.dados={unidades:unidades||[], aliases:aliases||[], planos:planos||[]};
    const fzs=[...new Set(upEstado.dados.unidades.map(u=>u.fazenda_app).concat(upEstado.dados.planos.map(p=>p.fazenda_app)))].sort((a,b)=>a.localeCompare(b));
    if(!upEstado.fz||!fzs.includes(upEstado.fz)) upEstado.fz=fzs[0]||"";
  }catch(e){ upEstado.dados=null; upEstado.erro="Não consegui ler o plano no Supabase ("+e.message+"). Se as tabelas ainda não existem, rode sql/005-plano-safra.sql e depois sql/006-plano-safra-seed-2627.sql no SQL Editor."; }
}

/* Auditoria de uma versão do plano. ✱ = bloqueia a publicação. Só informa, não corrige. */
function auditarPlano(p, unidades, pus, adubo, cal){
  const itens=[], add=(titulo,bloqueante,detalhes)=>itens.push({titulo, bloqueante, ok:!detalhes.length, detalhes});
  const uni=id=>unidades.find(u=>u.id===id);
  const rot=id=>{ const u=uni(id); return u?u.codigo+" "+(u.nome_curto||u.nome_plano):"unidade "+String(id).slice(0,8)+"…"; };
  /* ✱ toda unidade do plano existe, está ativa e é desta fazenda */
  const d1=[];
  pus.forEach(x=>{ const u=uni(x.unidade_id);
    if(!u) d1.push("unidade "+String(x.unidade_id).slice(0,8)+"… não existe no cadastro");
    else if(!u.ativo) d1.push(rot(u.id)+" está inativa");
    else if(u.fazenda_app!==p.fazenda_app) d1.push(rot(u.id)+" pertence a "+u.fazenda_app); });
  add("Toda unidade do plano existe, está ativa e é desta fazenda", true, d1);
  /* ✱ calendário de adubação sem área (exceção declarada em obs: "sem área: ok") */
  const comCal=[...new Set(adubo.map(a=>a.unidade_id))];
  const d2=comCal.filter(id=>{ const u=uni(id); return u && (u.area_ha==null||u.area_ha==="") && !/sem\s+[áa]rea\s*:\s*ok/i.test(u.obs||""); }).map(rot);
  add("Nenhuma unidade com calendário de adubação sem área (exceção: escrever \"sem área: ok\" em obs)", true, d2);
  /* soma dos calendários × resumo do deck */
  const soma={}; PLANO_INSUMOS.forEach(i=>{ soma[i]=0; }); adubo.forEach(a=>{ soma[a.insumo]=(soma[a.insumo]||0)+n0(a.kg); });
  const d3=[], rd=p.resumo_deck||null;
  if(!rd) d3.push("plano sem resumo do deck gravado — não há com o que comparar");
  else PLANO_INSUMOS.forEach(i=>{ const r=n0(rd[i]); if(r!==soma[i]) d3.push(PLANO_ROTULO_INSUMO[i]+": calendários "+soma[i].toLocaleString("pt-BR")+" kg × resumo do deck "+r.toLocaleString("pt-BR")+" kg ("+((r-soma[i])>0?"+":"")+(r-soma[i]).toLocaleString("pt-BR")+")"); });
  add("Soma de kg por insumo bate com o resumo do deck (informa)", false, d3);
  /* kg/ha por insumo fora de ±50% da mediana da fazenda */
  const d4=[];
  const comArea=comCal.filter(id=>{ const u=uni(id); return u && n0(u.area_ha)>0; });
  const mediana=v=>{ const s=[...v].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  PLANO_INSUMOS.forEach(i=>{
    const kgha={}; comArea.forEach(id=>{ kgha[id]=adubo.filter(a=>a.unidade_id===id&&a.insumo===i).reduce((s,a)=>s+n0(a.kg),0)/n0(uni(id).area_ha); });
    const vals=Object.values(kgha); if(vals.length<3) return;
    const med=mediana(vals); if(!(med>0)) return;
    comArea.forEach(id=>{ const x=kgha[id]; if(Math.abs(x-med)>0.5*med) d4.push(rot(id)+" — "+PLANO_ROTULO_INSUMO[i]+" "+Math.round(x)+" kg/ha (mediana "+Math.round(med)+")"); });
  });
  add("kg/ha por insumo dentro de ±50% da mediana da fazenda (informa)", false, d4);
  /* calendário × calagem */
  const comCalag=new Set(cal.map(c=>c.unidade_id));
  const d5=[...comCal.filter(id=>!comCalag.has(id)).map(id=>rot(id)+": calendário sem calagem"),
            ...[...comCalag].filter(id=>!comCal.includes(id)).map(id=>rot(id)+": calagem sem calendário")];
  add("Toda unidade com calendário tem calagem e vice-versa (informa)", false, d5);
  /* status a confirmar */
  const d6=pus.map(x=>uni(x.unidade_id)).filter(u=>u&&u.status==="a_confirmar").map(u=>rot(u.id));
  add("Nenhuma unidade com status \"a confirmar\" (informa)", false, d6);
  /* via do insumo-mês */
  const semVia=adubo.filter(a=>!a.via).length;
  add("Todo insumo-mês tem via (fertirrigação / lanço) definida (informa — na v1 nenhuma tem, é esperado)", false, semVia?[semVia+" de "+adubo.length+" linhas sem via"]:[]);
  return { ok:itens.filter(i=>i.bloqueante).every(i=>i.ok), quando:new Date().toISOString(), versao_app:"v52", itens };
}

function telemetriaDo(data,fz){

    if(b.fonte==="solinftec"){

      const tal = l.talhaoId && talhoesDa(fz).some(t=>t.id===l.talhaoId);

/* ---------- Indicadores ---------- */
function indicadores(dias){
  const lim = new Date(); lim.setDate(lim.getDate()-dias);
  const limISO = lim.getFullYear()+"-"+String(lim.getMonth()+1).padStart(2,"0")+"-"+String(lim.getDate()).padStart(2,"0");
  const bs = D.boletins.filter(b=>b.data>=limISO && (!filtroPainel.fazenda || b.fazendaId===filtroPainel.fazenda)
    && (!filtroPainel.atv || atividadeDe(b.fazendaId)===filtroPainel.atv));
  let sacas=0, chuva=0, horasMaq=0, ativ=0, fitoAltos=0, ocorrAltas=0;
  bs.forEach(b=>{
    (b.colheita||[]).forEach(c=>sacas+=n0(c.sacas));
    chuva += n0(b.clima && b.clima.chuvaMm);
    (b.atividades||[]).forEach(a=>{ ativ++; (a.maquinas||[]).forEach(m=>horasMaq+=n0(m.horas)); });
    (b.fito||[]).forEach(f=>{ if(f.nivel==="Alto") fitoAltos++; });
    (b.ocorrencias||[]).forEach(o=>{ if(o.grav==="Alta") ocorrAltas++; });
  });
  return {qtd:bs.length, sacas, chuva, horasMaq, ativ, fitoAltos, ocorrAltas};
}
function statusDoDia(fz){
  const b = boletimDoDia(hojeISO(), fz);
  if(b){
    const critico = (b.ocorrencias||[]).some(o=>o.grav==="Alta") || (b.fito||[]).some(f=>f.nivel==="Alto");
    return critico ? "critico" : "ok";
  }
  return (new Date().getHours()>=17) ? "espera" : "vazio";
}

function novoRascunho(dataBase){
  const fz = sessao.fazendaId;
  const ontem = boletinsOrdenados().find(b=>b.data<(dataBase||hojeISO()) && b.fazendaId===fz);
  return {
    id:null, data:dataBase||hojeISO(), fazendaId:fz,
    responsavel: (typeof nomeRespLembrado!=="undefined" && nomeRespLembrado) ? nomeRespLembrado : "",
    pendAnterior: ontem ? [

      ontem.pendencias||""
    ].filter(Boolean).join("\n") : "",
    clima:{cond:"", tmin:"", tmax:"", chuvaMm:"", florada:"", requeima:"", obs:""},
    irr:{status:"", agua:"", problemas:[], fert:"", fertSetores:[], fertReceita:"", obs:""},
    mo:{proprios:"", diaristas:"", faltas:"", motivoFaltas:"", horasExtras:"", funcoes:[]},
    atividades:[], colheita:[],
    pos:{terreiro:"", secLote:"", secTemp:"", secHoras:"", sacasBenef:""},
    fito:[], ocorrencias:[], obsGeral:"", pendencias:"",

    ...(temCultura(fz,"GRAOS")?{irg:[]}:{}),

}

/* ---------- Planejamento do dia seguinte × executado (v75) ----------

/* status automático de cada item, a partir dos registros do próprio boletim do dia (nada digitado):

/* ---- correlações: uma função só, usada pelo gerente, pela Diretoria e pelo resumo de sexta ---- */
/* Aderência = itens ✅ / itens planejados (o parcial NÃO conta como cumprido; aparece à parte).

   (nunca como desvio evitável). Dias efetivos: dias com boletim × dias impedidos pelo clima

    pessoasPrev:0, pessoasReal:0,
    diasImped:todos.filter(diaImpedido).length};

    (p.itens||[]).forEach(x=>{ r.n++; if(x.status==="feito") r.feito++; else if(x.status==="parcial") r.parcial++; else r.naoFeito++; });

    const desvio=(p.itens||[]).some(x=>x.status!=="feito");
    if(!desvio) return;
    const clima=(p.clima&&p.clima.impedido)||planoMotivoClima(p.motivo);
    const k=clima?"chuva":((p.motivo&&p.motivo.id)||"nao_informado");
    r.motivos[k]=(r.motivos[k]||0)+1;
    if(clima) r.clima++; else r.evitaveis++;
  });
  r.ader = r.n ? Math.round(r.feito*100/r.n) : null;
  r.precisao = r.pessoasPrev ? Math.round(r.pessoasReal*100/r.pessoasPrev) : null;
  return r;
}
/* "40% chuva · 25% máquina quebrou" — distribuição dos motivos do período, do maior para o menor */
function planoMotivosTexto(res, max){
  const tot=Object.values(res.motivos).reduce((s,v)=>s+v,0);
  if(!tot) return "";
  return Object.entries(res.motivos).sort((a,b)=>b[1]-a[1]).slice(0,max||3)
    .map(([k,v])=>Math.round(v*100/tot)+"% "+(k==="nao_informado"?"não informado":planoMotivoRot({id:k})).toLowerCase()).join(" · ");
}

/* ---- faixa "O plano de ontem para hoje", no topo do boletim (as três atividades) ----
   Componente ÚNICO. Sem plano para o dia, devolve "" — unidade sem plano não mostra nada.
   Até PLANO_MAX_ITENS linhas, uma linha visual cada a 360 px (nowrap + reticências). A caixinha de
   status é preenchida pelo próprio app conforme os lançamentos do dia; pintarPlanoHoje() a
   atualiza no lugar, sem redesenhar o formulário. */
function faixaPlanoHoje(r){
  const plano=planoDiaDe(r.fazendaId, r.data);
  if(!plano || !(plano.itens||[]).length) return "";
  return `<div class="aviso plano-faixa" id="plano-faixa">${htmlPlanoFaixaCorpo(r, plano)}</div>`;
}
function htmlPlanoFaixaCorpo(r, plano){
  const av=avaliarPlano(plano, r), fz=r.fazendaId, atv=atividadeDe(fz);
  return `<div class="linha-flex" style="gap:8px">
      <b class="cresce">📋 O plano de ontem para hoje <span class="mut plano-conta">${av.feito} de ${av.n} ✅</span></b>
      <button class="btn suave mini" id="bt-plano-ajustar">ajustar</button></div>
    ${av.itens.map(it=>`<div class="plano-item"><span class="plano-st" aria-hidden="true">${PLANO_ST[it.status].ico}</span>
      <b>${badgeCategoria(atv,{nome:it.op})}${esc(nomeAtual(it.op))}</b><span class="mut"> — ${esc(it.ondes.map(o=>planoOndeNome(fz,o)).join(", "))}${n0(it.pessoas)?" · "+n0(it.pessoas)+"p":""}</span>
      <span class="plano-ler">${esc(PLANO_ST[it.status].rot)}</span></div>`).join("")}
    ${plano.obs?`<p class="mut" style="margin:6px 0 0;font-size:.78rem">${esc(plano.obs)}</p>`:""}
    ${plano.replanejado?`<p class="mut" style="margin:6px 0 0;font-size:.76rem">Plano replanejado hoje.</p>`:""}`;
}
function pintarPlanoHoje(r){
  const box=document.getElementById("plano-faixa"); if(!box||!r) return;
  const plano=planoDiaDe(r.fazendaId, r.data); if(!plano) return;
  box.innerHTML=htmlPlanoFaixaCorpo(r, plano);
}
/* linha única na casa do gerente — espelho do dia escolhido na régua; sem plano, devolve "" */
function linhaPlanoCasa(fz, dia){
  const plano=planoDiaDe(fz, dia);
  if(!plano || !(plano.itens||[]).length) return "";
  const b=boletimDoDia(dia, fz);
  const rot=dia===hojeBRT()?"hoje":fmtDataCurta(dia);
  if(!b) return `<p class="mut plano-linha-casa">📋 Plano de ${esc(rot)}: ${plano.itens.length} linha${plano.itens.length>1?"s":""} — o app confere sozinho quando o boletim for enviado.</p>`;
  const av=avaliarPlano(plano, b);
  const mot=av.desvio?planoMotivoRot((b.plano||{}).motivo).toLowerCase():"";
  const partes=[av.feito+" de "+av.n+" ✅"];
  if(av.parcial) partes.push(av.parcial+" parcial");
  if(av.naoFeito) partes.push(av.naoFeito+" não feito"+(mot?" ("+mot+")":""));
  return `<p class="mut plano-linha-casa">📋 Plano de ${esc(rot)}: ${esc(partes.join(" · "))}</p>`;
}
/* fim de semana (sexta, sábado, domingo): o espelho da semana, em primeira pessoa e sem cobrança */
function linhaPlanoSemana(fz, dia){
  const d=new Date(String(dia).slice(0,10)+"T12:00:00").getDay();
  if(!(d===5||d===6||d===0)) return "";
  const res=planoResumo(fz,7);
  if(!res.diasComPlano || res.ader===null) return "";
  return `<p class="mut plano-linha-casa">📋 Você cumpriu ${res.ader}% do que planejou nesta semana.</p>`;
}

/* ---- cartão da Diretoria "📋 Planejado × Executado" (componente ÚNICO, três atividades) ----
   Ordenado por quem mais precisa de apoio — mais desvios EVITÁVEIS primeiro (o desvio de clima
   nunca sobe a unidade na lista). Rótulo neutro; nenhuma tela mostra um gerente para outro
   (a lista é de unidades, sem nome de pessoa). */
function cartaoPlanoPainel(){
  const uns=D.fazendas.filter(f=>(!filtroPainel.atv || atividadeDe(f.id)===filtroPainel.atv)
      && (!filtroPainel.fazenda || f.id===filtroPainel.fazenda) && podeVer(f.id))
    .map(f=>({f, r7:planoResumo(f.id,7), r30:planoResumo(f.id,30)}))
    .filter(x=>x.r30.diasComPlano>0)
    .sort((a,b)=>(b.r7.evitaveis-a.r7.evitaveis)||(a.r7.ader??101)-(b.r7.ader??101));
  const corpo = uns.length
    ? uns.map(({f,r7,r30})=>{
        const mot=planoMotivosTexto(r7,2)||planoMotivosTexto(r30,2);
        return `<div class="plano-un"><b>${esc(f.nome)}</b>
          <p class="mut" style="margin:2px 0 0">aderência <b class="num">${r7.ader===null?"—":r7.ader+"%"}</b> em 7 dias · <b class="num">${r30.ader===null?"—":r30.ader+"%"}</b> em 30 dias
            <span class="mut">(${r30.n} linha${r30.n===1?"":"s"} planejada${r30.n===1?"":"s"} em ${r30.diasComPlano} dia${r30.diasComPlano===1?"":"s"})</span></p>
          ${mot?`<p class="mut" style="margin:2px 0 0">motivos: ${esc(mot)}</p>`:""}
          <p class="mut" style="margin:2px 0 0">desvios evitáveis <b class="num">${r7.evitaveis}</b> · de clima <b class="num">${r7.clima}</b> · dias trabalháveis <b class="num">${r7.diasTrab}</b> de <b class="num">${r7.diasReg}</b> com boletim${r7.replan?" · "+r7.replan+" replanejado"+(r7.replan>1?"s":""):""}</p>
          ${r7.precisao!==null?`<p class="mut" style="margin:2px 0 0">esforço: previu <b class="num">${r7.pessoasPrev}</b> pessoas, lançou <b class="num">${r7.pessoasReal}</b> (${r7.precisao}%)</p>`:""}</div>`;
      }).join("")
    : htmlEstado("vazio",{que:"plano do dia registrado", atividade:filtroPainel.atv||"", unidade:filtroPainel.fazenda||"",
        onde:filtroPainel.fazenda?"":"nas unidades deste código", periodo:periodoVazio(diaISO(hojeBRT(),-29),hojeBRT())},{classe:"mut"});
  return `<div class="cartao"><h3>📋 Planejado × Executado</h3>
    <p class="mut" style="font-size:.78rem;margin:0 0 8px">O que o gerente planejou para o dia seguinte × o que o boletim daquele dia registrou. Ordem: unidades com mais desvios evitáveis.</p>
    ${corpo}
    <p class="mut" style="font-size:.72rem;margin-top:8px">Fonte: o próprio boletim (plano e registros do dia). O cruzamento com as metas do mês entra quando o módulo de programação/metas existir.</p></div>`;
}

/* ---- folha "📋 Amanhã" (v75) ----
   Tela curta no fim do envio, DEPOIS do cinto de segurança e ANTES de gravar: pulável com um toque,
   nunca obrigatória, nunca bloqueia o envio. Dois blocos: (1) "o que atrapalhou hoje?", só quando o
   plano de hoje ficou com ⚪ ou ◐ e o dia NÃO foi impedido pelo clima declarado (aí o motivo é
   "clima" e nem se pergunta); (2) o plano de amanhã, no padrão de 3 passos (ONDE em chips → O QUÊ
   em chips → DETALHES), até PLANO_MAX_ITENS linhas. Nada visível antes do toque anterior. Sem
   régua, sem chips removíveis, sem ação por perfil, sem botão de avanço e sem métrica (CLAUDE.md,
   c4/c9/c10/c11/c12: a tela de apontamento em 3 passos não recebe nada disso). */
let planoUI=null, planoResolve=null;
/* sugestão automática: o que o gerente marcou hoje como "continua amanhã" já vem preenchido —
   ele só confirma ou troca. (Com o módulo de metas, entram também as metas em risco.) */
function planoSugestao(r){
  const out=[];
  (r.atividades||[]).forEach(a=>{
    if(a.status!=="continua" || !a.tipo) return;
    const onde=(a.talhaoId&&a.talhaoId!=="geral")?a.talhaoId:"geral";
    const op=nomeAtual(a.tipo);
    const ja=out.find(x=>x.op===op);
    if(ja){ if(!ja.ondes.includes(onde)) ja.ondes.push(onde); return; }
    if(out.length<PLANO_MAX_ITENS) out.push({op, ondes:[onde], pessoas:String(n0(a.pessoas)||""), sugerido:true});
  });
  return out;
}
function planoFolhaHtml(){
  const u=planoUI, fz=u.fz, cat=planoCat(fz), nv=u.novo;
  const motivoBloco = !u.pedeMotivo ? "" : `<div class="cartao"><b>O que atrapalhou hoje?</b>
    <p class="mut" style="font-size:.78rem;margin:2px 0 8px">${u.av.naoFeito?u.av.naoFeito+" linha"+(u.av.naoFeito>1?"s":"")+" sem registro":""}${u.av.naoFeito&&u.av.parcial?" · ":""}${u.av.parcial?u.av.parcial+" parcial":""}. Um toque responde; dá para deixar em branco.</p>
    <div class="chips">${PLANO_MOTIVOS_CHIP.map(m=>`<button class="chip ${u.motivo.id===m.id?"on":""}" data-plano-motivo="${m.id}">${esc(m.rot)}</button>`).join("")}</div>
    ${u.motivo.id==="outro"?`<input id="plano-motivo-txt" value="${esc(u.motivo.texto||"")}" placeholder="O que foi?" style="margin-top:8px">`:""}</div>`;
  const lista = u.itens.length
    ? u.itens.map((it,i)=>`<div class="linha-flex plano-item-ed" data-plano-item="${i}">
        <span class="cresce"><b>${esc(nomeAtual(it.op))}</b><span class="mut"> — ${esc(it.ondes.map(o=>planoOndeNome(fz,o)).join(", "))}${n0(it.pessoas)?" · "+n0(it.pessoas)+" pessoa"+(n0(it.pessoas)>1?"s":""):""}</span>${it.sugerido?` <span class="tag verde">sugestão</span>`:""}</span>
        <button class="btn suave mini" data-plano-rm="${i}" aria-label="Remover ${esc(nomeAtual(it.op))} do plano">remover</button></div>`).join("")
    : `<p class="mut" id="plano-vazio">Nenhuma linha ainda. Toque em ＋ para escrever o plano de amanhã, ou pule.</p>`;
  let passos="";
  if(nv.ativo){
    const ondes=[...cat.onde(fz),{id:"geral",nome:cat.ondeGeral}];
    passos=`<div class="subcartao" id="plano-novo">
      <label>${esc(cat.ondeRot)}</label>
      <div class="chips">${ondes.map(o=>`<button class="chip ${nv.ondes.includes(o.id)?"on":""}" data-plano-onde="${esc(o.id)}">${esc(o.nome)}</button>`).join("")}</div>
      ${nv.ondes.length?`<label class="mt">O que vai ser feito</label>
        <div class="chips">${cat.ops(fz).map(op=>`<button class="chip ${nv.op===op?"on":""}" data-plano-op="${esc(op)}">${esc(op)}</button>`).join("")}</div>`:""}
      ${(nv.ondes.length&&nv.op)?`<label class="mt">Quantas pessoas você prevê</label>
        <input inputmode="numeric" id="plano-pessoas" value="${esc(nv.pessoas||"")}" placeholder="Ex.: 8">
        <button class="btn mt" id="bt-plano-ok">Adicionar linha</button>`:""}
      <button class="btn suave mini mt" id="bt-plano-cancelar">cancelar esta linha</button></div>`;
  } else if(u.itens.length<PLANO_MAX_ITENS){
    passos=`<button class="btn suave mt" id="bt-plano-add">＋ linha do plano</button>`;
  }
  return `${motivoBloco}
    <div class="cartao"><b>Plano de ${fmtData(u.alvo)}</b>
      <p class="mut" style="font-size:.78rem;margin:2px 0 8px">Até ${PLANO_MAX_ITENS} linhas: onde, o que e quantas pessoas. Leva uns 20 segundos — e dá para pular.</p>
      ${u.itens.some(x=>x.sugerido)?`<p class="mut" style="font-size:.76rem;margin:0 0 6px">Sugestão do app a partir do que você marcou como "continua amanhã" — confirme ou troque.</p>`:""}
      ${lista}
      ${passos}
      <label class="mt">Observação de amanhã <span class="mut">(opcional)</span></label>
      <input id="plano-obs" value="${esc(u.obs||"")}" placeholder="Uma linha, se ajudar"></div>`;
}
function planoLerCampos(){
  const u=planoUI; if(!u) return;
  const g=id=>{ const el=document.getElementById(id); return el?el.value:null; };
  const ps=g("plano-pessoas"); if(ps!==null) u.novo.pessoas=ps;
  const ob=g("plano-obs"); if(ob!==null) u.obs=ob;
  const mt=g("plano-motivo-txt"); if(mt!==null) u.motivo.texto=mt;
}
function planoPintar(){
  const c=document.getElementById("plano-corpo"); if(!c) return;
  planoLerCampos(); c.innerHTML=planoFolhaHtml();
}
/* grava o plano de um dia-alvo em D.planoDia (plano vazio não cria linha nenhuma).
   replan=true: alteração no próprio dia — fica registrada como "replanejado", nunca como falha. */
function planoGuardar(resp){
  if(!resp || !resp.fz || !resp.alvo) return;
  const itens=(resp.itens||[]).filter(x=>x.op).slice(0,PLANO_MAX_ITENS)
    .map(x=>({op:x.op, ondes:(x.ondes||[]).length?x.ondes:["geral"], pessoas:x.pessoas||""}));
  const antes=planoPendente(resp.fz,resp.alvo);
  D.planoDia = planosDia().filter(p=>!(p.fazendaId===resp.fz && p.data===resp.alvo));
  if(!itens.length) return;
  planosDia().push({ id:(antes&&antes.id)||uid(), fazendaId:resp.fz, data:resp.alvo, itens, obs:resp.obs||"",
    criadoEm:(antes&&antes.criadoEm)||hojeBRT(), por:(rascunho&&rascunho.responsavel)||(antes&&antes.por)||"",
    replanejado:!!(resp.replan||(antes&&antes.replanejado)),
    replanejadoEm: resp.replan?(hojeBRT()+" "+agoraHM()):((antes&&antes.replanejadoEm)||"") });
}
/* o = {alvo, replan}: sem `o`, planeja o dia seguinte ao boletim; com replan, ajusta o plano do
   próprio dia (o motivo do desvio não é perguntado aqui — ele é perguntado ao fechar o boletim). */
function abrirFolhaPlano(r,o){
  o=o||{};
  return new Promise(res=>{
    const fz=r.fazendaId, alvo=o.alvo||diaISO(r.data,1), replan=!!o.replan;
    const base=replan?planoDiaDe(fz,alvo):planoPendente(fz,alvo);
    const plHoje=planoDiaDe(fz,r.data);
    const av=plHoje?avaliarPlano(plHoje,r):null;
    planoUI={ fz, alvo, r, av, replan,
      itens: base?JSON.parse(JSON.stringify(base.itens||[])):planoSugestao(r),
      obs: base?(base.obs||""):"",
      novo:{ativo:false, ondes:[], op:"", pessoas:""},
      motivo:{id:"", texto:""},
      pedeMotivo: !replan && !!(av && av.desvio && !diaImpedido(r)) };
    planoResolve=res;
    const titulo=replan?"📋 Plano de hoje":"📋 Amanhã";
    const f=document.createElement("div"); f.className="folha"; f.id="folha-plano";
    f.setAttribute("role","dialog"); f.setAttribute("aria-modal","true"); f.setAttribute("aria-label",replan?"Plano de hoje":"Amanhã");
    f.innerHTML=`<div class="miolo">
      <div class="topo"><button class="btn-topo" id="bt-plano-pular2">‹ ${replan?"Voltar":"Pular"}</button><h1>${titulo}</h1></div>
      <div id="plano-corpo">${planoFolhaHtml()}</div>
    </div>
    <div class="rodape no-print"><div class="linha-flex" style="gap:8px;max-width:640px;margin:0 auto">
      <button class="btn sec" id="bt-plano-pular">${replan?"Voltar":"Pular"}</button>
      <button class="btn" id="bt-plano-salvar">Salvar plano</button></div></div>`;
    document.body.appendChild(f);
    travarFolha();
    f.oninput=ev=>{ if(ev.target && ev.target.id) planoLerCampos(); };
    f.onclick=ev=>{ const t=ev.target.closest("button"); if(!t) return; const d=t.dataset;
      if(t.id==="bt-plano-pular"||t.id==="bt-plano-pular2"){ fecharFolhaPlano(false); return; }
      if(t.id==="bt-plano-salvar"){ fecharFolhaPlano(true); return; }
      if(d.planoMotivo!==undefined){ planoLerCampos();
        planoUI.motivo={id: planoUI.motivo.id===d.planoMotivo?"":d.planoMotivo, texto:planoUI.motivo.texto||""};
        planoPintar(); return; }
      if(t.id==="bt-plano-add"){ planoUI.novo={ativo:true, ondes:[], op:"", pessoas:""}; planoPintar(); return; }
      if(t.id==="bt-plano-cancelar"){ planoUI.novo={ativo:false, ondes:[], op:"", pessoas:""}; planoPintar(); return; }
      if(d.planoOnde!==undefined){ const l=planoUI.novo.ondes, i=l.indexOf(d.planoOnde);
        if(i>=0) l.splice(i,1); else l.push(d.planoOnde); planoPintar(); return; }
      if(d.planoOp!==undefined){ planoUI.novo.op = planoUI.novo.op===d.planoOp?"":d.planoOp; planoPintar(); return; }
      if(t.id==="bt-plano-ok"){ planoLerCampos(); const nv=planoUI.novo;
        if(nv.ondes.length && nv.op && planoUI.itens.length<PLANO_MAX_ITENS)
          planoUI.itens.push({op:nv.op, ondes:[...nv.ondes], pessoas:nv.pessoas||""});
        planoUI.novo={ativo:false, ondes:[], op:"", pessoas:""}; planoPintar(); return; }
      if(d.planoRm!==undefined){ planoLerCampos(); planoUI.itens.splice(parseInt(d.planoRm),1); planoPintar(); return; }
    };
  });
}
/* fecha a folha; salvar=true grava o plano de amanhã (e o motivo respondido) — pular não grava
   plano nenhum, e nos dois casos o envio segue. */
function fecharFolhaPlano(salvar){
  const u=planoUI, f=document.getElementById("folha-plano");
  if(f){ planoLerCampos(); f.remove(); destravarFolha(); }
  const res=planoResolve; planoResolve=null; planoUI=null;
  if(res) res(u ? {salvar:!!salvar, itens:u.itens, obs:u.obs, motivo:u.motivo, alvo:u.alvo, fz:u.fz, replan:!!u.replan} : null);
}


/* ============================================================
   MÓDULO DE PLANEJAMENTO (v77) — reunião mensal + planejamento semanal
   ------------------------------------------------------------
   A mesma TAREFA vista em dois horizontes: a rodada mensal (a ata da reunião
   administrativa, por volta do dia 10) e a semana (toda sexta, sem reunião).
   Concluir num horizonte atualiza o outro — não existe cópia.

   Princípios que não se discutem (decisão do Nilo, 10/09/2026):
   1. O gerente muda status com UM toque e nunca digita.
   2. Tarefa travada por terceiro ou por chuva NUNCA fica vermelha para o campo:
      tem status próprio (⏸️) e vira cobrança do escritório.
   3. O que importa se vê ao abrir — faixa no topo do boletim e da casa, e
      pastilhas na porta de entrada.
   4. Nada bloqueia o preenchimento do boletim.
   5. Tudo roda dentro do app: colar a ata, ler, cobrar e redigir a próxima ata.

   Isolamento (CLAUDE.md, c4): componentes ÚNICOS nas três atividades. O que muda
   por atividade é o CATÁLOGO (PLAN_VINCULO / PLAN_SINONIMOS), nunca a tela.
   ============================================================ */

/* ---- status, farol e motivos (catálogo único; docs/catalogos-por-atividade.md) ---- */
const PLAN_STATUS=[
  {id:"a_iniciar",           rot:"A iniciar"},
  {id:"em_execucao",         rot:"Em execução"},
  {id:"finalizado",          rot:"Finalizado"},
  {id:"aguardando_terceiro", rot:"Aguardando terceiro", pausa:true},
  {id:"aguardando_clima",    rot:"Aguardando clima",    pausa:true},
  {id:"cancelado",           rot:"Cancelado"}
];
const planStatus = id => PLAN_STATUS.find(s=>s.id===id) || PLAN_STATUS[0];
const planStatusRot = id => planStatus(id).rot;
const PLAN_ABERTOS=["a_iniciar","em_execucao","aguardando_terceiro","aguardando_clima"];
const planAberta = t => PLAN_ABERTOS.includes(t.status);
const planPausada = t => t.status==="aguardando_terceiro" || t.status==="aguardando_clima";
/* FAROL só existe para A INICIAR e EM EXECUÇÃO. Os dois "aguardando" e a tarefa sem prazo ficam
   em cinza (⏸️) — nunca vermelho: quem está parado por terceiro ou por chuva não é cobrado no campo. */
const PLAN_FAROL={ vermelho:{ico:"🔴"}, amarelo:{ico:"🟡"}, cinza:{ico:"⏸️"}, verde:{ico:"🟢"}, feito:{ico:"✅"}, cancelado:{ico:"—"} };
const PLAN_FAROL_ORDEM={vermelho:0, amarelo:1, cinza:2, verde:3, feito:4, cancelado:5};
/* chips de "Travado" — um toque, sem digitar. `tipo` decide o status: clima tem status próprio,
   os demais entram como pausa de terceiro/apoio e viram cobrança do escritório. */
const PLAN_MOTIVOS_TRAVA=[
  {id:"insumo",  rot:"falta insumo",  tipo:"terceiro", texto:"aguardando insumo"},

    esqueletar:"Poda mecanizada esqueletamento", esqueletamento:"Poda mecanizada esqueletamento",

  GRAOS:{ kcl:"Adubação de cobertura", cobertura:"Adubação de cobertura", calcario:"Calagem", gesso:"Gessagem",
    dessecacao:"Dessecação de pré-plantio", plantio:"Plantio / semeadura", colheita:"Colheita mecanizada",

  PECUARIA:{ vacina:"Vacinação (especificar)", vacinacao:"Vacinação (especificar)", vermifugacao:"Vermifugação",

};
const PLAN_ESTRUTURA=["caixa dagua","caixa d agua","piscinao","talude","adutora","barracao","galpao","cerca","estrada",
  "aceiro","represa","bomba","poco","rede eletrica","energia","curral","laboratorio","reforma","construcao","montagem"];
const planEhEstrutura = desc => { const n=normTxt(desc); return PLAN_ESTRUTURA.some(k=>n.includes(k)); };
const planOpsDaAtividade = atv => atv==="GRAOS" ? OPS_GRAOS_FASES.flatMap(([,o])=>o)
  : atv==="PECUARIA" ? LISTA_PECUARIA : LISTA_ATIV.filter(n=>n!=="Outra");
/* operações do catálogo que casam com a descrição (sinônimo primeiro, depois palavra inteira com 5+ letras) */
function planOperacoesDe(t){
  const atv=t.unidade?atividadeDe(t.unidade):"CAFE";
  const n=" "+normTxt(t.desc).replace(/[^a-z0-9]+/g," ")+" ";
  const ops=planOpsDaAtividade(atv), achadas=[];
  Object.entries(PLAN_SINONIMOS[atv]||{}).forEach(([k,op])=>{ if(n.includes(" "+k) && ops.includes(op) && !achadas.includes(op)) achadas.push(op); });
  ops.forEach(op=>{ if(achadas.includes(op)) return;
    const toks=normTxt(op).replace(/[^a-z0-9]+/g," ").split(" ").filter(w=>w.length>=5);
    if(toks.length && toks.some(w=>n.includes(" "+w))) achadas.push(op); });
  return achadas;
}

const planAgora    = () => hojeBRT()+" "+agoraHM();

/* uma tarefa nova (da ata, da semana ou avulsa). `o` já vem normalizado por quem chama. */
function planNovaTarefa(o){

/* UM toque muda o status. Reversível e registrada: nada some, nada é apagado — por isso não há
   diálogo de confirmação nenhum neste módulo (CLAUDE.md, c10: entrega nova não aumenta a conta). */
function planMudarStatus(id, novo, o){
  o=o||{};
  const t=planTarefa(id); if(!t) return null;
  const de=t.status;
  t.status=novo;
  if(novo==="aguardando_terceiro"||novo==="aguardando_clima"){
    if(de!=="aguardando_terceiro" && de!=="aguardando_clima") t.statusAntes=de;
    t.bloqueio={ tipo: novo==="aguardando_clima"?"clima":"terceiro", quem:o.quem||"",
      motivo:o.motivo||"", texto:o.texto||"", desde:o.desde||hojeBRT() };
  }else{
    delete t.bloqueio; delete t.statusAntes; delete t.destravadaEm;
  }
  if(novo==="em_execucao" && !t.inicioReal) t.inicioReal=hojeBRT();
  if(novo==="finalizado") t.concluidoEm=hojeBRT(); else delete t.concluidoEm;
  if(novo==="cancelado") t.cancelMotivo=o.motivo||o.texto||"";
  planLog(t,"status",de,novo,o.texto||o.motivo||"");
  planGravar(t);
  return t;
}
function planNovoPrazo(id, prazo, motivo){
  const t=planTarefa(id); if(!t||!prazo) return null;
  const de=t.prazo;
  if(!t.prazoOriginal) t.prazoOriginal=de;
  t.prazo=prazo; t.repactuada=true;
  planLog(t,"prazo",de,prazo,motivo||"");
  planGravar(t);
  return t;
}

/* ---- motor de calendário: roda a cada abertura e a cada sincronização, sozinho ---- */
const planDiaSemana = iso => new Date(String(iso).slice(0,10)+"T12:00:00").getDay();
const planDiasEntre = (a,b) => Math.round((new Date(String(b).slice(0,10)+"T12:00:00")-new Date(String(a).slice(0,10)+"T12:00:00"))/864e5);
const planFimDoMes = iso => { const d=new Date(String(iso).slice(0,10)+"T12:00:00"); const f=new Date(d.getFullYear(), d.getMonth()+1, 0);
  return f.getFullYear()+"-"+String(f.getMonth()+1).padStart(2,"0")+"-"+String(f.getDate()).padStart(2,"0"); };
const planMesDe = iso => String(iso||"").slice(0,7);
const planMesRot = ref => { const [a,m]=String(ref||"").split("-"); return m?(MESES_REL[parseInt(m,10)-1]||"").replace(/^./,c=>c.toUpperCase())+"/"+a.slice(2):"—"; };
const planMesNome = ref => { const NOMES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const [,m]=String(ref||"").split("-"); return m?NOMES[parseInt(m,10)-1]||"":""; };
/* dia impedido pelo clima DECLARADO no boletim da unidade (mesma fonte do plano do dia, v75) */
const planBoletimDe = (fz,dia) => D.boletins.find(b=>b.fazendaId===fz && b.data===dia) || null;
function planClima(fz, de, ate){
  const out={n:0, dias:[], firmes:0, comBoletim:0};
  if(!fz || !de) return out;
  const ini=String(de).slice(0,10), fim=String(ate||hojeBRT()).slice(0,10);
  const ls=D.boletins.filter(b=>b.fazendaId===fz && b.data>=ini && b.data<=fim).sort((a,b)=>a.data<b.data?-1:1);
  ls.forEach(b=>{ out.comBoletim++; if(diaImpedido(b)){ out.n++; out.dias.push(b.data); } });
  for(let i=ls.length-1;i>=0;i--){ if(diaImpedido(ls[i])) break; out.firmes++; }
  return out;
}
/* prazo que vale hoje = prazo original + os dias de chuva que pararam o serviço (o original nunca se perde) */
const planPrazoEfetivo = t => (!t.prazo || !n0(t.diasChuva)) ? (t.prazo||"") : diaISO(t.prazo, n0(t.diasChuva));
const planDiasParaPrazo = t => { const p=planPrazoEfetivo(t); return p ? planDiasEntre(hojeBRT(), p) : null; };
/* dias úteis: fora domingos e fora dias impedidos pelo clima declarado (fonte no rodapé da tela) */
function planDiasUteis(fz, de, ate){
  if(!de||!ate) return 0;
  const ini=String(de).slice(0,10), fim=String(ate).slice(0,10);
  if(ini>fim) return 0;
  const imped=new Set(planClima(fz, ini, fim).dias);
  let n=0;
  for(let d=ini; d<=fim; d=diaISO(d,1)){ if(planDiaSemana(d)===0) continue; if(imped.has(d)) continue; n++; }
  return n;
}
function planSomarDiasUteis(fz, de, dias){
  let d=String(de).slice(0,10), faltam=Math.max(0,dias);
  let guarda=0;
  while(faltam>0 && guarda++<400){ d=diaISO(d,1); if(planDiaSemana(d)!==0) faltam--; }
  return d;
}
function planFarol(t){
  if(t.status==="cancelado") return "cancelado";
  if(t.status==="finalizado") return "feito";
  if(planPausada(t)) return "cinza";      /* regra 2: aguardando nunca fica vermelho */
  if(!t.prazo) return "cinza";
  const d=planDiasParaPrazo(t);
  if(d<=2) return "vermelho";
  if(d<=7) return "amarelo";
  return "verde";
}
const planAtrasada = t => planAberta(t) && !planPausada(t) && !!t.prazo && planDiasParaPrazo(t)<0;
const planTravadaDias = t => planPausada(t) ? planDiasEntre((t.bloqueio&&t.bloqueio.desde)||t.criadoEm, hojeBRT()) : 0;
const planArrastaMeses = t => (t.arrastadaDe||[]).length;
/* ============================================================
   PLANEJADO × EXECUTADO (v78) — reforço do acompanhamento
   ------------------------------------------------------------
   Três números em toda tarefa: PLANEJADO (a meta — a área da ata, ou a que o
   escritório informar), EXECUTADO (a soma dos lançamentos do boletim que
   casaram com a tarefa) e RESTANTE, com barra de progresso. O executado é
   RASTREÁVEL: um toque lista os lançamentos que o compuseram (data, talhão,
   área e quem lançou). Nada é digitado pelo gerente e nada é inventado: sem
   meta não há barra nem restante — o app diz isso com todas as letras.

   A outra metade da história é o EXECUTADO FORA DO PLANO: o lançamento que não
   casou com nenhuma tarefa. Não é cobrança — é o que apareceu no dia e não
   estava na ata. Vocabulário: prazo e REGISTRO, nunca "não fez".
   ============================================================ */

/* índice dos lançamentos de uma unidade, uma passada só pelos boletins.
   Refeito quando o dia, o número de boletins ou o de tarefas muda. */
let planExecCache={marca:"", uni:{}};
const planExecMarca = () => hojeBRT()+"|"+((D&&D.boletins)||[]).length+"|"+planTarefas().length;
function planLancamentos(fz){
  if(!fz) return [];
  const m=planExecMarca();
  if(planExecCache.marca!==m) planExecCache={marca:m, uni:{}};
  if(planExecCache.uni[fz]) return planExecCache.uni[fz];
  const cat=PLANO_ATIVIDADE[atividadeDe(fz)]||PLANO_ATIVIDADE.CAFE;
  const out=[];
  (D.boletins||[]).filter(b=>b.fazendaId===fz && !b.exemplo).forEach(b=>{
    (cat.feitos(b)||[]).forEach((f,i)=>{
      if(!f.op) return;
      const onde=(f.onde && f.onde!=="geral") ? f.onde : "";
      out.push({ id:b.id+":"+i, boletimId:b.id, data:b.data, op:nomeAtual(f.op), onde,
        nome: onde?planoOndeNome(fz,onde):cat.ondeGeral, area: onde?n0(talhao(onde).area):0,
        pessoas:n0(f.pessoas), por:String(b.responsavel||"").trim(), parcial:!!f.parcial });
    });
  });
  out.sort((a,b)=>a.data<b.data?1:a.data>b.data?-1:0);
  planExecCache.uni[fz]=out;
  return out;
}
/* janela em que um lançamento conta para a tarefa: do começo dela até hoje
   (ou até o dia em que ela foi concluída — depois disso o número congela) */
const planJanela = t => ({ de:String(t.inicioReal||t.criadoEm||hojeBRT()).slice(0,10),
  ate:String(t.concluidoEm||hojeBRT()).slice(0,10) });
/* EXECUTADO: os lançamentos que casaram com a tarefa, com a soma em ha dos
   talhões DISTINTOS (o mesmo talhão lançado duas vezes conta uma vez só). */
function planExecucao(t){
  const vazio={ha:0, n:0, itens:[], talhoes:0, pessoas:0, semVinculo:false};
  if(!t || !t.unidade) return vazio;
  const ops=planOperacoesDe(t);
  if(!ops.length) return {...vazio, semVinculo:true};   /* descrição sem operação no catálogo */
  const j=planJanela(t);
  const itens=planLancamentos(t.unidade).filter(l=>ops.includes(l.op) && l.data>=j.de && l.data<=j.ate);
  const tals=new Map();
  itens.forEach(l=>{ if(l.onde && !tals.has(l.onde)) tals.set(l.onde, l.area); });
  let ha=0; tals.forEach(v=>{ ha+=v; });
  return {ha, n:itens.length, itens, talhoes:tals.size,
    pessoas:itens.reduce((s,l)=>s+n0(l.pessoas),0), semVinculo:false};
}
/* PLANEJADO · EXECUTADO · RESTANTE. `meta` é a área da ata ou a informada pelo
   escritório (t.meta); sem meta, o app conta os lançamentos e NÃO inventa barra. */
const planMeta = t => n0(t.meta) || n0(t.area);
function planProgresso(t){
  const ex=planExecucao(t), meta=planMeta(t);
  if(meta>0){
    /* arredonda ANTES de subtrair: planejado, executado e restante têm de fechar na tela */
    const arr=v=>Math.round(v*10)/10;
    const feito=arr(Math.min(ex.ha, meta));
    return { temMeta:true, un:"ha", meta:arr(meta), feito, resta:arr(Math.max(0, arr(meta)-feito)),
      pct:Math.min(100, Math.round(feito*100/meta)), excedente:arr(Math.max(0, ex.ha-meta)), ex };
  }
  return { temMeta:false, un:"reg", meta:null, feito:ex.n, resta:null,
    pct:t.status==="finalizado"?100:0, excedente:0, ex };
}
const planHa = v => n0(v).toLocaleString("pt-BR",{maximumFractionDigits:(n0(v)%1)?1:0});
/* componente ÚNICO dos três números + barra. `o.attr` torna o EXECUTADO tocável
   (abre a lista dos lançamentos que o compuseram); sem `attr` é só leitura. */
function planTrio(t, o){
  o=o||{};
  const p=planProgresso(t), ex=p.ex;
  const exec = p.temMeta ? planHa(p.feito)+" ha" : p.feito+" lançamento"+(p.feito===1?"":"s");
  const rot = ex.n ? exec : (p.temMeta?"0 ha":"nenhum lançamento");
  const botao = o.attr
    ? `<button class="plan-exec" ${o.attr}="${t.id}" aria-expanded="${o.aberta?"true":"false"}"
        aria-label="Ver os ${ex.n} lançamento(s) que compõem o executado">${esc(rot)}${ex.n?" ›":""}</button>`
    : `<b class="num">${esc(rot)}</b>`;
  const nota = p.temMeta
    ? `${p.pct}% da área planejada tem registro no boletim${p.excedente>0?` · ${esc(planHa(p.excedente))} ha lançados além da meta`:""}`
    : (ex.semVinculo?"A descrição não casa com nenhuma operação do catálogo — o app não consegue somar sozinho."
       :"Sem meta: a ata não trouxe a área. O app conta os lançamentos casados.");
  /* SEM meta não existem "planejado" nem "restante": três colunas em que duas são travessão
     é andaime vazio (mesma regra do .sel-box da v74) e ainda espremia o valor em duas linhas.
     Uma linha só: rótulo ao lado do valor. COM meta o trio é a forma certa e continua igual. */
  if(!p.temMeta) return `<div class="plan-trio">
    <div class="plan-um"><i>executado</i>${botao}</div>
    <p class="plan-trio-nota mut">${nota}</p>
    ${o.aberta?planExecLista(t):""}</div>`;
  return `<div class="plan-trio">
    <div class="plan-tres">
      <span><i>planejado</i><b class="num">${esc(planHa(p.meta))} ha</b></span>
      <span><i>executado</i>${botao}</span>
      <span><i>restante</i><b class="num">${esc(planHa(p.resta))} ha</b></span>
    </div>
    <div class="plan-barra" role="img" aria-label="${p.pct}% da área planejada com registro"><span style="width:${p.pct}%"></span></div>
    <p class="plan-trio-nota mut">${nota}</p>
    ${o.aberta?planExecLista(t):""}</div>`;
}
/* rastreabilidade total: o que compôs o executado, do mais recente ao mais antigo */
function planExecLista(t){
  const ex=planExecucao(t);
  if(!ex.n) return `<p class="mut plan-exec-vazio">${esc(fraseVazio({que:"lançamento casado com esta tarefa", unidade:t.unidade||"", onde:t.unidade?"":"nesta unidade"}))}</p>`;
  const j=planJanela(t);
  return `<div class="plan-exec-lista">
    <p class="mut plan-exec-cab">${ex.n} lançamento${ex.n>1?"s":""} em ${ex.talhoes||"—"} ${ex.talhoes===1?"local":"locais"}${ex.pessoas?" · "+ex.pessoas+" pessoas-dia":""} · de ${esc(fmtDataCurta(j.de))} a ${esc(fmtDataCurta(j.ate))}</p>
    ${ex.itens.slice(0,20).map(l=>`<div class="plan-exec-l">

      <span class="cresce">${esc(l.nome)}${l.parcial?' <span class="mut">· continua</span>':""}<br><span class="mut">${esc(nomeAtual(l.op))}${l.por?" · "+esc(l.por):""}</span></span>
      <span class="num">${l.area?esc(planHa(l.area))+" ha":"—"}</span></div>`).join("")}
    ${ex.n>20?`<p class="mut plan-exec-cab">mostrando 20 de ${ex.n}</p>`:""}
    <p class="mut plan-exec-cab">Fonte: os boletins da unidade. A soma em ha conta cada talhão uma vez.</p></div>`;

/* ---- vínculo do lançamento com a tarefa (item 3): o gerente vê o que abateu ----
   Componente ÚNICO nas três atividades. Devolve "" quando o lançamento não abate
   tarefa nenhuma. Nunca é botão nem métrica: é uma etiqueta de leitura. */
function planTarefaDoLancamento(fz, tipo, talhaoId, data){
  if(!fz || !tipo) return null;
  const op=nomeAtual(tipo), onde=(talhaoId && talhaoId!=="geral")?talhaoId:"";
  const dia=String(data||hojeBRT()).slice(0,10);
  const cands=planDaUnidade(fz).filter(t=>t.tipoItem==="tarefa" && t.status!=="cancelado")
    .filter(t=>{ const j=planJanela(t); return dia>=j.de && dia<=j.ate; })
    .filter(t=>planOperacoesDe(t).includes(op));
  if(!cands.length) return null;
  /* com mais de uma candidata, vence a que tem meta e ainda tem o que fazer */
  return cands.sort((a,b)=>(planMeta(b)>0)-(planMeta(a)>0) || (planAberta(b)-planAberta(a))
    || String(a.prazo||"9999").localeCompare(String(b.prazo||"9999")))[0] || null;
}
function planTagVinculo(fz, tipo, talhaoId, data){
  const t=planTarefaDoLancamento(fz, tipo, talhaoId, data);
  if(!t) return "";
  return `<span class="tag verde plan-vinc" title="${esc("Abate a tarefa da reunião: "+t.desc)}">📋 abate: ${esc(t.desc.length>38?t.desc.slice(0,36)+"…":t.desc)}</span>`;
}

/* ---- executado FORA do plano (item 4): a outra metade da história ----
   Lançamento do período que não casou com nenhuma tarefa da unidade. Não é
   cobrança: é o que apareceu no dia e não estava na ata. */
function planForaDoPlano(fz, ref){
  const ini=ref+"-01", fim=planFimDoMes(ref+"-01");
  const ls=planLancamentos(fz).filter(l=>l.data>=ini && l.data<=fim);
  const dentro=[], fora=[];
  ls.forEach(l=>{ (planTarefaDoLancamento(fz, l.op, l.onde, l.data) ? dentro : fora).push(l); });
  const grupos={};
  fora.forEach(l=>{ const g=grupos[l.op]=grupos[l.op]||{op:l.op, n:0, ha:0, pessoas:0, locais:new Set(), ultimo:""};
    g.n++; g.pessoas+=n0(l.pessoas); if(l.onde && !g.locais.has(l.onde)){ g.locais.add(l.onde); g.ha+=l.area; }
    if(!g.ultimo || l.data>g.ultimo) g.ultimo=l.data; });
  const total=ls.length;
  return { fz, ref, total, dentro:dentro.length, fora:fora.length,
    pct: total?Math.round(fora.length*100/total):null,
    pessoasFora: fora.reduce((s,l)=>s+n0(l.pessoas),0),
    pessoasTotal: ls.reduce((s,l)=>s+n0(l.pessoas),0),
    grupos: Object.values(grupos).map(g=>({...g, locais:g.locais.size})).sort((a,b)=>b.n-a.n||b.ha-a.ha) };
}
/* quanto já foi feito da meta (ha), limitado a ela — base da projeção de ritmo */
const planFeitoHa = t => planMeta(t)>0 ? Math.min(planExecucao(t).ha, planMeta(t)) : 0;
/* "feito 40 de 96 ha · no ritmo atual conclui em 24/09 (4 dias após o prazo)" */
function planProjecao(t){
  const meta=planMeta(t);
  if(!planAberta(t) || !meta) return null;
  const feito=planFeitoHa(t);
  if(feito<=0) return null;
  const ini=String(t.inicioReal||t.criadoEm||hojeBRT()).slice(0,10);
  const uteis=Math.max(1, planDiasUteis(t.unidade, ini, hojeBRT()));
  const ritmo=feito/uteis;
  const faltam=Math.max(0, meta-feito);
  if(faltam<=0) return {feito, area:meta, ritmo, fim:hojeBRT(), atraso:0};
  const dias=Math.ceil(faltam/ritmo);
  const fim=planSomarDiasUteis(t.unidade, hojeBRT(), dias);
  const prazo=planPrazoEfetivo(t);
  return {feito, area:meta, ritmo, fim, dias, atraso: prazo?planDiasEntre(prazo,fim):0};
}
/* o motor: farol, dias de chuva, saída automática da pausa por clima e semana da sexta.
   Roda a cada abertura de tela do módulo e a cada sincronização — ninguém precisa lembrar de nada. */
let planMotorEm="";
function planMotor(forcar){
  if(!D) return;
  const marca=hojeBRT()+"|"+planTarefas().length+"|"+(D.boletins||[]).length;
  if(!forcar && marca===planMotorEm) return;
  planMotorEm=marca;
  let mudou=false;
  planTarefas().forEach(t=>{
    if(t.status!=="aguardando_clima") return;
    const desde=(t.bloqueio&&t.bloqueio.desde)||t.criadoEm||hojeBRT();
    const c=planClima(t.unidade, desde, hojeBRT());
    if(n0(t.diasChuva)!==c.n){ t.diasChuva=c.n; mudou=true; }
    if(c.firmes>=PLAN_DIAS_SOL){
      const volta=t.statusAntes||"a_iniciar";
      t.status=volta; delete t.bloqueio; delete t.statusAntes;
      t.destravadaEm=hojeBRT();
      planLog(t,"status","aguardando_clima",volta,"o tempo firmou ("+c.firmes+" dias sem chuva impeditiva no boletim)");
      mudou=true;
    }
  });
  /* v78: foto do executado em cada tarefa (ha, lançamentos e meta) — é o que o relatório
     mensal ata_x_executado lê no Supabase, já que o de-para descrição → operação mora no app. */
  const paraFila=[];
  planTarefas().forEach(t=>{
    if(t.tipoItem!=="tarefa" || !t.unidade) return;
    const ex=planExecucao(t), meta=planMeta(t);
    const novo={ha:Math.round(ex.ha*100)/100, n:ex.n, meta, em:hojeBRT()};
    const a=t.exec||{};
    if(a.ha!==novo.ha || a.n!==novo.n || a.meta!==novo.meta){ t.exec=novo; mudou=true; paraFila.push(t.id); }
  });
  if(planSemanaGarantir()) mudou=true;
  if(mudou) salvarDados();
  paraFila.forEach(id=>{ if(!syncFila.some(x=>x.t==="tar"&&x.id===id)) syncFila.push({t:"tar",id}); });
  if(paraFila.length) syncSalvarFila();
}
/* ---- semanas: a tela da sexta nasce sozinha (segunda a domingo da semana que começa) ---- */
const planSegundaDe = iso => { const d=planDiaSemana(iso); return diaISO(iso, d===0?-6:1-d); };

function planSemanaCriar(ini){

/* garante a semana corrente e, na sexta (ou depois), a semana seguinte — a tela existe antes de alguém pedir */

const planComprometidas = sid => planTarefas().filter(t=>(t.semanas||[]).includes(sid));
function planComprometer(id, sid){

/* sugestões da semana: prazo próximo (≤7 dias), atrasadas e recém-destravadas — sem nada digitado */
function planSugestoesSemana(sid){

      && !(t.semanas||[]).includes(sid))

/* fechamento automático da semana que passou: assumido × concluído × travado + placar */
function planFecharSemana(s){

const planOrdenar = (a,b) => (PLAN_FAROL_ORDEM[planFarol(a)]-PLAN_FAROL_ORDEM[planFarol(b)])
  || ((a.prazo||"9999")<(b.prazo||"9999")?-1:(a.prazo||"9999")>(b.prazo||"9999")?1:0)

const planVisiveis = () => planTarefas().filter(t=>!t.unidade || podeVer(t.unidade));
const planDaUnidade = fz => planTarefas().filter(t=>t.unidade===fz);

const planRodadaAtual = () => planRodadas().slice().sort((a,b)=>a.ref<b.ref?1:-1)[0] || null;
const planRodadaDoMes = ref => planRodadas().find(r=>r.ref===ref) || null;
/* resumo do mês (cabeçalho permanente da área Planejamento e cartão do painel) */
function planResumoMes(ref, fz){
  const ls=planVisiveis().filter(t=>t.tipoItem==="tarefa" && (!fz||t.unidade===fz)
    && (!ref || planMesDe(t.prazo||t.criadoEm)===ref || (t.origemTipo==="mensal" && planMesDe((planRodadaDoMes(ref)||{}).data||"")===ref && t.origemId===(planRodadaDoMes(ref)||{}).id)));
  const fim=ls.filter(t=>t.status==="finalizado").length;
  const canc=ls.filter(t=>t.status==="cancelado").length;
  const base=ls.length-canc;
  /* v78: a metade quantitativa — área planejada × executada, tarefas sem NENHUM lançamento
     e o esforço que aconteceu fora da ata. Tudo calculado; nada digitado. */
  const ativas=ls.filter(t=>t.status!=="cancelado");
  const metaHa=ativas.reduce((a,t)=>a+planMeta(t),0);
  const execHa=ativas.reduce((a,t)=>a+(planMeta(t)?Math.min(planExecucao(t).ha,planMeta(t)):0),0);
  const semLanc=ativas.filter(t=>planExecucao(t).n===0);
  const fora=fz?planForaDoPlano(fz, ref||planMesDe(hojeBRT())):null;
  return { ref, n:ls.length, finalizadas:fim, canceladas:canc,
    pct: base?Math.round(fim*100/base):null,
    atrasadas: ls.filter(planAtrasada), travadas: ls.filter(planPausada),
    arrastadas: ls.filter(t=>planArrastaMeses(t)>0),
    vermelhas: ls.filter(t=>planFarol(t)==="vermelho").length,
    amarelas: ls.filter(t=>planFarol(t)==="amarelo").length,
    cinzas: ls.filter(t=>planFarol(t)==="cinza").length,
    verdes: ls.filter(t=>planFarol(t)==="verde").length,
    metaHa, execHa, restaHa:Math.max(0, metaHa-execHa),
    pctArea: metaHa?Math.min(100, Math.round(execHa*100/metaHa)):null,
    comMeta: ativas.filter(t=>planMeta(t)>0).length,
    semLancamento: semLanc, fora, lista:ls };
}
/* pendências agrupadas por fornecedor — quem falta, desde quando e quais fazendas estão paradas */
function planPorTerceiro(){
