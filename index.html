<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F5233">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boletim LGS">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5233">
<title>Boletim Diário da Fazenda</title>
<style>
:root{
  --papel:#FBF9F4; --cartao:#FFFFFF; --tinta:#23201A; --tinta-2:#5C554A;
  --verde:#2F5233; --verde-esc:#243F28; --verde-claro:#E9F0E5;
  --terra:#7A5C43; --terra-claro:#F0E9E1;
  --cereja:#B5432E; --cereja-claro:#F7E5E1;
  --amarelo:#C98A1B; --amarelo-claro:#F8EFDC;
  --linha:#E3DDD2; --raio:12px;
  --sombra:0 1px 3px rgba(35,32,26,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--papel);color:var(--tinta);font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:12px;border:1.5px solid var(--linha);border-radius:10px;background:var(--cartao);min-height:48px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(47,82,51,.35);outline-offset:1px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:.82rem;font-weight:600;color:var(--tinta-2);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:.95rem;font-weight:700}
.mut{color:var(--tinta-2);font-size:.88rem}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;padding:0 14px 90px}
#app.largo{max-width:860px}
/* Barra superior */
.topo{position:sticky;top:0;z-index:20;background:var(--verde);color:#fff;margin:0 -14px 14px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.topo h1{color:#fff;font-size:1.05rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .sub{font-size:.72rem;opacity:.85;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.btn-topo{background:rgba(255,255,255,.14);border-radius:9px;padding:8px 12px;font-size:.85rem;font-weight:600;color:#fff;min-height:40px}
/* Botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:var(--raio);font-weight:700;font-size:1.02rem;background:var(--verde);color:#fff;box-shadow:var(--sombra)}
.btn:active{background:var(--verde-esc)}
.btn.sec{background:var(--cartao);color:var(--verde);border:1.5px solid var(--verde)}
.btn.suave{background:var(--verde-claro);color:var(--verde-esc);border:none;box-shadow:none}
.btn.perigo{background:var(--cereja)}
.btn.mini{min-height:40px;width:auto;padding:0 14px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:default}
/* Cartões */
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);padding:14px;margin-bottom:12px;box-shadow:var(--sombra)}
.cartao.toque{cursor:pointer}
.linha-flex{display:flex;align-items:center;gap:10px}
.linha-flex .cresce{flex:1;min-width:0}
/* Semáforo de status */
.farol{width:14px;height:14px;border-radius:50%;flex:none}
.farol.ok{background:var(--verde)}
.farol.espera{background:var(--amarelo)}
.farol.critico{background:var(--cereja)}
.farol.vazio{background:var(--linha)}
/* Etiquetas */
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.75rem;font-weight:700}
.tag.verde{background:var(--verde-claro);color:var(--verde-esc)}
.tag.terra{background:var(--terra-claro);color:var(--terra)}
.tag.cereja{background:var(--cereja-claro);color:var(--cereja)}
.tag.amarelo{background:var(--amarelo-claro);color:#8a5f10}
/* Chips de seleção */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 14px;border-radius:24px;border:1.5px solid var(--linha);background:var(--cartao);font-weight:600;font-size:.92rem;min-height:46px}
.chip.on{background:var(--verde);border-color:var(--verde);color:#fff}
/* Stepper numérico */
.step{display:flex;align-items:center;gap:0;border:1.5px solid var(--linha);border-radius:10px;overflow:hidden;background:var(--cartao)}
.step button{width:52px;min-height:52px;font-size:1.5rem;font-weight:700;color:var(--verde);background:var(--verde-claro);flex:none}
.step input{border:none;border-radius:0;text-align:center;font-weight:800;font-size:1.15rem;min-height:52px}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* Assinatura: barra de maturação */
.matura{display:flex;height:26px;border-radius:8px;overflow:hidden;border:1px solid var(--linha);margin-top:8px}
.matura>div{display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;min-width:0;transition:width .2s}
.mat-cereja{background:var(--cereja)}
.mat-verde{background:var(--verde)}
.mat-seco{background:var(--terra)}
/* Acordeão do formulário */
.secao{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);margin-bottom:10px;overflow:hidden}
.secao>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;font-weight:700;cursor:pointer;min-height:56px}
.secao>summary::-webkit-details-marker{display:none}
.secao>summary .ico{width:34px;height:34px;border-radius:9px;background:var(--verde-claro);display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex:none}
.secao>summary .seta{margin-left:auto;color:var(--tinta-2);transition:transform .15s;flex:none}
.secao[open]>summary .seta{transform:rotate(90deg)}
.secao .corpo{padding:0 14px 16px;border-top:1px solid var(--linha)}
/* sub-acordeões da pecuária (dentro da seção 🐂): mesmo desenho, um degrau menor */
.subsec{border:1px solid var(--linha);border-radius:10px;margin-top:10px;background:var(--papel)}
.subsec>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px;font-weight:700;font-size:.95rem;cursor:pointer;min-height:48px}
.subsec>summary::-webkit-details-marker{display:none}
.subsec>summary .resumo{margin-left:auto;margin-right:6px;font-size:.76rem;color:var(--verde);font-weight:700;white-space:nowrap}
.subsec>summary .seta{color:var(--tinta-2);transition:transform .15s;flex:none}
.subsec[open]>summary .seta{transform:rotate(90deg)}
.subsec .corpo{padding:0 12px 14px;border-top:1px solid var(--linha)}
.secao>summary .resumo{margin-left:auto;margin-right:8px;font-size:.78rem;color:var(--verde);font-weight:700;white-space:nowrap}
/* Seletor de operação por fase (grãos): fases recolhidas, toque para expandir */
.fase-op{border:1px solid var(--linha);border-radius:10px;margin-top:8px;background:var(--cartao)}
.fase-op>summary{list-style:none;padding:12px 14px;font-weight:700;cursor:pointer;display:flex;align-items:center}
.fase-op>summary::-webkit-details-marker{display:none}
.fase-op>summary::after{content:"›";margin-left:auto;color:var(--tinta-2);transition:transform .15s}
.fase-op[open]>summary::after{transform:rotate(90deg)}
.fase-op .chips{padding:0 12px 4px}
.subcartao{background:var(--papel);border:1px dashed var(--linha);border-radius:10px;padding:12px;margin-top:10px;position:relative}
.fechar-sub{position:absolute;top:8px;right:8px;color:var(--cereja);font-weight:800;font-size:.8rem;padding:4px 8px;min-height:32px}
/* Rodapé fixo */
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--cartao);border-top:1px solid var(--linha);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:30}
.rodape .interno{max-width:520px;margin:0 auto;display:flex;gap:10px}
/* Painel */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);padding:12px}
.kpi .valor{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.kpi .rot{font-size:.72rem;font-weight:700;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.05em}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros input,.filtros select{width:auto;flex:1;min-width:130px;min-height:44px;padding:9px 12px}
/* Aviso de rascunho / offline */
.aviso{background:var(--amarelo-claro);border:1px solid #ecd9ad;border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:12px}
.aviso.verde{background:var(--verde-claro);border-color:#cfe0c8}
.foto-mini{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--linha)}
.foto-grande{width:100%;border-radius:10px;border:1px solid var(--linha);margin-top:8px}
.lista-limpa{list-style:none}
.lista-limpa li{padding:9px 0;border-bottom:1px solid var(--linha)}
.lista-limpa li:last-child{border:none}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.dl dt{color:var(--tinta-2);font-weight:600}
.dl dd{font-weight:600}
.centro{text-align:center}
.mt{margin-top:12px}.mb{margin-bottom:12px}
hr.sep{border:none;border-top:1px solid var(--linha);margin:14px 0}
/* Tela de entrada */
.entrada{min-height:92vh;display:flex;flex-direction:column;justify-content:center;padding:24px 6px}
.marca{text-align:center;margin-bottom:28px}
.marca .grao{font-size:2.6rem}
.marca h1{font-size:1.6rem;margin-top:6px}
.perfil-btn{display:flex;align-items:center;gap:12px;width:100%;background:var(--cartao);border:1.5px solid var(--linha);border-radius:var(--raio);padding:16px;margin-bottom:10px;text-align:left;min-height:72px;box-shadow:var(--sombra)}
.perfil-btn .ava{width:44px;height:44px;border-radius:50%;background:var(--verde-claro);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:none}
.perfil-btn b{display:block}
@media print{
  .topo,.rodape,.btn,.filtros,.no-print{display:none!important}
  body{background:#fff}
  .cartao,.secao{box-shadow:none;break-inside:avoid}
  #app{max-width:100%;padding:0}
}
</style>

/* ---------- Camada de persistência (window.storage com reserva em memória) ---------- */
const Persist = {
  mem:{}, modo:"mem",
  async get(chave){
    if(this.modo==="claude"){ try{ const r=await window.storage.get(chave); return r?r.value:null; }catch(e){ return this.mem[chave]||null; } }
    if(this.modo==="local"){ try{ return localStorage.getItem(chave); }catch(e){ return this.mem[chave]||null; } }
    return this.mem[chave]||null;
  },
  async set(chave,valor){
    this.mem[chave]=valor;
    if(this.modo==="claude"){ try{ await window.storage.set(chave,valor); }catch(e){} return; }
    if(this.modo==="local"){ try{ localStorage.setItem(chave,valor); }catch(e){} }
  },
  async del(chave){
    delete this.mem[chave];
    if(this.modo==="claude"){ try{ await window.storage.delete(chave); }catch(e){} return; }
    if(this.modo==="local"){ try{ localStorage.removeItem(chave); }catch(e){} }
  },
  get usaMem(){ return this.modo==="mem"; },
  async iniciar(){
    if(window.storage && window.storage.get){ this.modo="claude"; return; }
    try{ localStorage.setItem("bdf:teste","1"); localStorage.removeItem("bdf:teste"); this.modo="local"; }
    catch(e){ this.modo="mem"; }
  }
};

async function carregarTudo(){
  await Persist.iniciar();

  D = bruto ? JSON.parse(bruto) : dadosSemente();

  if(bruto && (D.versao||0) < semente.versao){

       (f03 -> f03c/f03g, f22 -> f22c/f22g, f13 -> f13c/f13p, f14 -> f14c/f14p); histórico

       próprio tipo; ids antigos e unificações anteriores continuam valendo via FZ_LEGADO.

    const rf = fzAtual;

    const rfTal = t => {
      const base={f19:"f03",f18:"f03",f05:"f14",f15:"f14",f16:"f14"}[t.fazendaId]||t.fazendaId;
      const u=UNIDADES_DESM[base];

    };
    const PREFIXO_UNIF = {f05:"Caxico — ", f15:"José Eustáquio — ", f16:"Ernane — ", f18:"Área do Lico — "};
    const antigos = (D.boletins||[]).map(b=>({...b, fazendaId:rf(b.fazendaId)}));

    const teleAntiga = (D.telemetria||[]).map(t=>({...t, fazendaId:rf(t.fazendaId)}));
    const estrAntigas = {}; Object.keys(D.estruturas||{}).forEach(k=>{ const nk=rf(k);
      estrAntigas[nk]=Object.assign({}, estrAntigas[nk]||{}, D.estruturas[k]); });
    const insumosExtras = (D.insumos||[]).filter(i=>!semente.insumos.some(s=>s.nome===i.nome));
    const maqExtras = (D.maquinas||[]).filter(m=>!semente.maquinas.some(s=>s.id===m.id))
      .map(m=>({...m, fazendas:(m.fazendas||[]).map(rf)}));
    const talExtras = (D.talhoes||[]).filter(t=>!semente.talhoes.some(s=>s.id===t.id))
      .map(t=>{ const p=PREFIXO_UNIF[t.fazendaId];
        const nome=(p && !String(t.nome||"").startsWith(p.replace(" — ",""))) ? p+t.nome : t.nome;
        return {...t, fazendaId:rfTal(t), nome}; });
    const ciclosAntigos = (D.ciclos||[]);

    D.boletins = antigos.length ? antigos.filter(b=>D.fazendas.some(f=>f.id===b.fazendaId)) : semente.boletins;
    D.posColheitas = posAntigos.filter(p=>D.fazendas.some(f=>f.id===p.fazendaId));
    D.remessas = remAntigas; D.telemetria = teleAntiga; D.estruturas = estrAntigas;
    D.ciclos = ciclosAntigos.filter(c=>D.talhoes.some(t=>t.id===c.talhaoId));
    D.deparaMaq = dMaq; D.deparaTal = dTal; D.mapaImport = mImp;
    D.ultimasDoses = uDoses; D.ultimasReceitas = uRec; D.ultimasFert = uFert; D.insumosAprendidos = insApr;

    D.insumos = [...semente.insumos, ...insumosExtras];
    D.maquinas = [...semente.maquinas, ...maqExtras];
    await salvarDados();
  }
  if(!bruto) await salvarDados();
  /* normaliza máquinas: aceita vínculo com várias fazendas */
  (D.maquinas||[]).forEach(m=>{
    if(!Array.isArray(m.fazendas)) m.fazendas = m.fazendaId ? [m.fazendaId] : [];

  /* multicultura: garante o perfil de cada fazenda (já vem gravado no cadastro) e
     deriva o tipo dos talhões que ainda não têm, sempre a partir do perfil */
  (D.fazendas||[]).forEach(f=>{

  (D.ciclos||[]).forEach(c=>{ if(c.cultura==="MILHO_SEMENTE"){
    const t=D.talhoes.find(x=>x.id===c.talhaoId); if(t&&t.tipo!=="ARRENDADO") t.tipo="ARRENDADO"; } });
  (D.talhoes||[]).forEach(t=>{ if(t.tipo==="MILHO_SEMENTE") t.tipo="ARRENDADO"; });

  await syncCarregarCfg();
  window.addEventListener && window.addEventListener("online", ()=>syncTudo());
  setTimeout(()=>syncTudo(), 800);
  nomeRespLembrado = await Persist.get("bdf:nomeResp") || "";
  try{ const rp=await Persist.get("bdf:rascpos"); if(rp){ rascunhoPos=JSON.parse(rp);
    if(rascunhoPos && !rascunhoPos.secadores){ rascunhoPos.secadores=rascunhoPos.secador?[rascunhoPos.secador]:[{lote:"",temp:"",horas:"",fim:"",umidade:"",obs:""}];
      rascunhoPos.beneficios=rascunhoPos.beneficio?[rascunhoPos.beneficio]:[{lote:"",sacas:"",obs:""}];
      delete rascunhoPos.secador; delete rascunhoPos.beneficio; }
    if(rascunhoPos && !rascunhoPos.tulhas) rascunhoPos.tulhas=[{lote:'',mov:'',obs:''}]; } }catch(e){}
  D.posColheitas = D.posColheitas||[];
  /* plano de safra vigente guardado no aparelho (v52) — sem cache o app é igual à v51 */
  try{ const pc=await Persist.get("bdf:plano"); planoCache=pc?(JSON.parse(pc)||{}):{}; }catch(e){ planoCache={}; }
  D.remessas = D.remessas||[];
  D.estruturas = D.estruturas||{};
  D.telemetria = D.telemetria||[];
  const s = await Persist.get("bdf:sessao");
  sessao = s ? JSON.parse(s) : null;
  const r = await Persist.get("bdf:rascunho");
  rascunho = r ? JSON.parse(r) : null;
  try{ const ac = await Persist.get("bdf:acesso"); acesso = ac ? JSON.parse(ac) : null; }catch(e){ acesso=null; }
  /* aparelhos da versão anterior guardavam {tipo, fazendaId}: vira chave de escopo */
  if(acesso && !acesso.chave && acesso.tipo){
    acesso={codigo:acesso.codigo, chave:acesso.tipo==="admin"?"ADMIN":acesso.tipo==="diretoria"?"DIRETORIA":acesso.fazendaId};
    Persist.set("bdf:acesso",JSON.stringify(acesso));
  }
  if(acesso && (!escopoDaChave(acesso.chave) || codigoDe(acesso.chave)!==acesso.codigo)){ acesso=null; Persist.del("bdf:acesso"); }
  /* sessão gravada tem que caber no escopo do código deste aparelho */
  if(!acesso) sessao=null;
  else if(sessao){
    if(sessao.papel==="admin" && !podeCadastros()) sessao=null;
    else if(sessao.papel==="proprietario" && !podePainel()) sessao=null;
    else if((sessao.papel==="gerente"||sessao.papel==="pos") && sessao.fazendaId && !podeVer(sessao.fazendaId)) sessao=null;
    else if(sessao.papel==="gerente" && sessao.atividade && !unidadesPermitidas().some(f=>atividadeDe(f.id)===sessao.atividade)) sessao=null;
  }
}

/* ---- Multicultura: tipo do talhão, ciclos de cultura anual e catálogos ---- */

const rotuloTipo = tp => { const h=TIPOS_TALHAO.find(([k])=>k===tp); return h?h[1]:"Indefinido"; };

const ATIVIDADES=[["CAFE","☕","Café","var(--cereja)"],["GRAOS","🌾","Grãos","var(--amarelo)"],["PECUARIA","🐂","Pecuária","var(--terra)"]];

const ROTULO_CULT={CAFE:"Café", GRAOS:"Grãos", PECUARIA:"Pecuária"};
const perfilDe = fz => { const f=fazenda(fz); return (Array.isArray(f.perfil)&&f.perfil.length)?f.perfil:(PERFIS_PADRAO[fz]||["CAFE"]); };

/* ---------- Controle de acesso por código (escopos por unidade, atividade e combinados) ----------
   Cada código (prefixo-NNNN) aponta para uma CHAVE, e a chave define o escopo:
   lista de atividades e/ou lista de unidades + permissões (painel, cadastros).
   Chaves aceitas:
   - id de unidade (f01, f22g, …)          → só aquela unidade
   - ATV:CAFE / ATV:GRAOS / ATV:PECUARIA   → todas as unidades da atividade
   - ATV:CAFE+GRAOS (e demais combinações) → todas as unidades das atividades
   - MIX:<atividades>:<unidades>           → combinado criado pelo admin em Cadastros
   - DIRETORIA                             → painel + leitura de tudo, sem Cadastros
   - ADMIN                                 → tudo, inclusive Cadastros e códigos
   Unidade criada no futuro entra sozinha nos escopos por atividade (o escopo é
   calculado na hora pelo perfil da fazenda). O admin pode gerar um código novo em
   Cadastros: o novo vale na hora, o antigo cai nos outros aparelhos na próxima
   sincronização (tabela codigos_acesso no Supabase; sem internet vale a tabela
   abaixo). É fechadura de porta, não cofre — ver ESTADO.md. */
const CODIGOS_PADRAO={
  f01:"AL-4172", f03c:"RC-8305", f03g:"RG-2657", f13c:"MC-7914", f13p:"MP-3548",
  f14c:"CC-6081", f14p:"CP-1739", f20:"LR-8447", f21:"SF-9426", f22c:"VC-5883",
  f22g:"VG-2496", f23:"VR-7061", f24:"VQ-3215", f25:"NC-1690",
  f26:"AS-6754", f27:"CG-5372", f28:"CH-2381", f29:"CD-8196", f30:"CF-3907",
  f31:"CR-5240", f32:"FE-7623", f33:"FM-9028", f34:"GA-1058", f35:"PB-4519",
  "ATV:CAFE":"CAFE-2740", "ATV:GRAOS":"GRAOS-3815", "ATV:PECUARIA":"PECU-5926",
  "ATV:CAFE+GRAOS":"CAFEGRAOS-4157", "ATV:CAFE+PECUARIA":"CAFEPECU-6283",
  "ATV:GRAOS+PECUARIA":"GRAOSPECU-7492",
  DIRETORIA:"DIRETORIA-8034", ADMIN:"ADMIN-9561"
};
const CHAVES_ATV=["ATV:CAFE","ATV:GRAOS","ATV:PECUARIA","ATV:CAFE+GRAOS","ATV:CAFE+PECUARIA","ATV:GRAOS+PECUARIA"];
const ABREV_ATV={CAFE:"CAFE", GRAOS:"GRAOS", PECUARIA:"PECU"};
const codigoDe = chave => (((D&&D.codigosAcesso)||{})[chave] || CODIGOS_PADRAO[chave] || "");
/* chave → escopo {ativs, unidades, tudo?, painel?, cadastros?, soLe?} (null = chave inválida) */
function escopoDaChave(chave){
  if(!chave) return null;
  if(chave==="ADMIN") return {chave, tudo:true, painel:true, cadastros:true, ativs:[], unidades:[]};
  if(chave==="DIRETORIA") return {chave, tudo:true, painel:true, soLe:true, ativs:[], unidades:[]};
  if(/^(ATV|MIX):/.test(chave)){
    const p=chave.split(":");
    const ativs=(p[1]||"").split("+").filter(a=>ROTULO_CULT[a]);
    const unidades=(p[2]||"").split("+").filter(fz=>(D.fazendas||[]).some(f=>f.id===fz));
    return (ativs.length||unidades.length) ? {chave, ativs, unidades} : null;
  }
  return (D.fazendas||[]).some(f=>f.id===chave) ? {chave, ativs:[], unidades:[chave]} : null;
}
const chavesConhecidas = () => [...new Set(["ADMIN","DIRETORIA"].concat(CHAVES_ATV, (D.fazendas||[]).map(f=>f.id), Object.keys(D.codigosAcesso||{})))];
function escopoDoCodigo(cod){
  let c=String(cod||"").toUpperCase().replace(/\s+/g,"");
  const m=c.match(/^([A-Z]+)-?(\d{4})$/); if(m) c=m[1]+"-"+m[2]; /* aceita sem o traço */
  if(!c) return null;
  const chave=chavesConhecidas().find(k=>codigoDe(k)===c && escopoDaChave(k));
  return chave ? {codigo:c, chave} : null;
}
const escopoAtual = () => acesso ? escopoDaChave(acesso.chave) : null;
const unidadesPermitidas = () => { const e=escopoAtual(); if(!e) return [];
  if(e.tudo) return D.fazendas;
  return D.fazendas.filter(f=>e.unidades.includes(f.id) || perfilDe(f.id).some(a=>e.ativs.includes(a)));
};
const podeVer = fz => { const e=escopoAtual(); return !!e && (e.tudo || unidadesPermitidas().some(f=>f.id===fz)); };
const podePainel = () => { const e=escopoAtual(); return !!(e && e.painel); };
const podeCadastros = () => { const e=escopoAtual(); return !!(e && e.cadastros); };
const soLeitura = () => { const e=escopoAtual(); return !!(e && e.soLe); };
const chaveDoAcesso = () => acesso ? acesso.chave : null;
/* rótulo e descrição do escopo de uma chave (usados só nas telas de ADMIN) */
function rotuloDaChave(chave){
  if(chave==="ADMIN") return "Administrador";
  if(chave==="DIRETORIA") return "Diretoria";
  if(/^(ATV|MIX):/.test(chave)){
    const e=escopoDaChave(chave)||{ativs:[],unidades:[]};
    return e.ativs.map(a=>ROTULO_CULT[a]||a).concat(e.unidades.map(fz=>fazenda(fz).nome)).join(" + ")||chave;
  }
  return fazenda(chave).nome;
}
function escopoRotulo(chave){
  if(chave==="ADMIN") return "abre tudo, inclusive Cadastros e códigos";
  if(chave==="DIRETORIA") return "painel e leitura de todas as unidades, sem Cadastros";
  if(/^(ATV|MIX):/.test(chave)){
    const e=escopoDaChave(chave)||{ativs:[],unidades:[]};
    return e.ativs.map(a=>"todas as unidades de "+(ROTULO_CULT[a]||a).toLowerCase())

function conferirAcesso(){

}
function sairDoAparelho(){
  acesso=null; sessao=null; rascunho=null;
  Persist.del("bdf:acesso"); Persist.del("bdf:sessao"); Persist.del("bdf:rascunho");
  ir("codigo");

/* depois de validar o código, cada escopo abre na sua tela: admin escolhe tudo;
   diretoria cai no painel; escopo com uma atividade só pula para a lista de
   unidades; com uma unidade só abre direto o boletim dela */
function entrarPeloAcesso(){
  if(!acesso){ ir("codigo"); return; }
  const e=escopoDaChave(acesso.chave);
  if(!e){ sairDoAparelho(); return; }
  if(e.cadastros){ ir("entrada"); return; }
  if(e.soLe){ const u=D.usuarios.find(x=>x.papel==="proprietario");
    sessao={userId:u?u.id:"u2", papel:"proprietario", nome:u?u.nome:"Diretoria"};
    Persist.set("bdf:sessao",JSON.stringify(sessao)); rascunho=null; ir("painel"); return; }
  const uni=unidadesPermitidas(), u=D.usuarios.find(x=>x.papel==="gerente");
  if(uni.length===1){ const fz=uni[0].id;
    sessao={userId:u?u.id:"u1", papel:"gerente", nome:"Gerente — "+fazenda(fz).nome, atividade:atividadeDe(fz), fazendaId:fz};
    Persist.set("bdf:sessao",JSON.stringify(sessao)); rascunho=null; ir("casa"); return; }
  const ativs=[...new Set(uni.map(f=>atividadeDe(f.id)))];
  if(ativs.length===1){
    sessao={userId:u?u.id:"u1", papel:"gerente", nome:u?u.nome:"Gerente", atividade:ativs[0], fazendaId:null};
    Persist.set("bdf:sessao",JSON.stringify(sessao)); rascunho=null; ir("fazendas"); return; }
  ir("entrada");
}
function gerarNovoCodigo(chave){
  const atual=codigoDe(chave), e=escopoDaChave(chave)||{ativs:[],unidades:[]};
  const pref = atual ? atual.split("-")[0]
    : (chave==="ADMIN"||chave==="DIRETORIA") ? chave
    : /^(ATV|MIX):/.test(chave) ? (e.unidades.length ? "MIX" : e.ativs.map(a=>ABREV_ATV[a]||a).join("")||"MIX")
    : String((fazenda(chave).nome||"XX")).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z ]/g," ").trim().split(/\s+/).map(p=>p[0]).join("").slice(0,2).toUpperCase().padEnd(2,"X");
  const emUso=chavesConhecidas().map(k=>codigoDe(k));
  let novo; do{ novo=pref+"-"+String(Math.floor(1000+Math.random()*9000)); }while(emUso.includes(novo));
  D.codigosAcesso=D.codigosAcesso||{}; D.codigosAcesso[chave]=novo; salvarDados();
  /* trocou o próprio código? o aparelho do admin continua dentro */
  if(acesso && acesso.chave===chave){ acesso={...acesso, codigo:novo}; Persist.set("bdf:acesso",JSON.stringify(acesso)); }
  syncEnfileirar("c",chave);
  return novo;
}
/* Tipo do talhão derivado do perfil da fazenda (o nome só desempata nas mistas) */
function tipoPeloPerfil(nome, perfil){
  const n=String(nome||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const so = (perfil&&perfil.length===1) ? perfil[0] : null;
  if(so==="PECUARIA") return /sede|represa|area geral|armazem/.test(n)?"ESTRUTURA":"PASTO_PECUARIA";
  if(so==="CAFE") return "CAFE_PERENE";
  if(so==="GRAOS") return "GRAO_ANUAL";
  if(/setor|cafe/.test(n)) return "CAFE_PERENE";
  if(/pivo|gleba|sequeiro/.test(n)) return "GRAO_ANUAL";
  if(/pasto|retiro|curral/.test(n)) return "PASTO_PECUARIA";
  if(/sede|represa|area geral|armazem/.test(n)) return "ESTRUTURA";
  const prim=(perfil&&perfil[0])||"CAFE";
  return prim==="GRAOS"?"GRAO_ANUAL":prim==="PECUARIA"?"PASTO_PECUARIA":"CAFE_PERENE";
}

  const algo=o=>!!o&&Object.values(o).some(v=>v!==""&&v!=null);
  return (p.lotes||[]).some(l=>l.talhaoId||l.lote||n0(l.cabecas)) ||
    (p.eventos||[]).some(e=>e.tipo) || !!p.cocho || !!p.sal || !!p.agua ||
    (p.mov||[]).some(m=>m.tipo) ||
    (p.san||[]).some(s=>s.problema||s.acao||s.produto||s.categoria) ||
    (p.massa||[]).some(m=>m.tipo||m.produto||n0(m.qtd)) ||
    algo(p.rep) ||
    (p.nut||[]).some(u=>u.talhaoId||u.insumo||u.cocho||u.agua||n0(u.qtd)) ||
    algo(p.pasto) || !!p.obs;
}

function separarCSV(txt){
  const linha1=(txt.split(/\r?\n/).find(l=>l.trim())||"");
  const sep=[["\t",linha1.split("\t").length],[";",linha1.split(";").length],[",",linha1.split(",").length]].sort((a,b)=>b[1]-a[1])[0][0];
  const linhas=txt.split(/\r?\n/).filter(l=>l.trim());
  const partir=l=>{ const out=[]; let cur="",asp=false;
    for(const ch of l){ if(ch==='"'){asp=!asp;continue;} if(ch===sep&&!asp){out.push(cur);cur="";} else cur+=ch; }
    out.push(cur); return out.map(s=>s.trim()); };
  return linhas.map(partir);
}
function dataNorm(v){
  v=String(v||"").trim().split(" ")[0];
  let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(v);
  if(m){ let a=m[3].length===2?"20"+m[3]:m[3]; return a+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0"); }
  return "";
}
function acharMaquina(nomePlat){
  if(!nomePlat) return null;
  const dp=(D.deparaMaq||{})[nomePlat]; if(dp) return dp;
  const c=/(\d{1,4})/.exec(nomePlat);
  if(c){ const alvo=D.maquinas.find(m=>codDe(m.nome)===c[1]); if(alvo) return alvo.id; }
  const nl=nomePlat.toLowerCase();
  const alvo=D.maquinas.find(m=>m.nome.toLowerCase().includes(nl)||nl.includes(m.nome.toLowerCase().replace(/\s*\(cod[^)]*\)/i,"").trim()));
  return alvo?alvo.id:null;
}
function acharTalhao(nomePlat){
  if(!nomePlat) return null;
  const dp=(D.deparaTal||{})[nomePlat]; if(dp) return dp;
  const semAcento=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const bruto=String(nomePlat).trim();
  /* padrão do Alice/Solinftec: "VE-SETOR 1", "CX-SETOR 1" — a sigla antes do hífen restringe a busca */
  const m=/^([A-Za-z]{2,4})\s*[-–]\s*(.+)$/.exec(bruto);
  let candidatos=D.talhoes, resto=bruto;
  if(m){
    const sig=semAcento(m[1]); resto=m[2];
    const casaSig=w=>{ /* prefixo ("ve"→vereda) ou letras em sequência a partir do início ("cx"→caxico) */
      if(w.startsWith(sig)) return true;
      if(w[0]!==sig[0]) return false;
      let i=0; for(const ch of w){ if(ch===sig[i]) i++; if(i===sig.length) return true; }
      return false; };
    const fzs=D.fazendas.filter(f=>{
      const pal=semAcento(f.nome).split(/[\s\/–—-]+/).filter(Boolean);
      return pal.some(casaSig) || pal.map(w=>w[0]).join("").startsWith(sig);
    }).map(f=>f.id);
    if(fzs.length===1) candidatos=D.talhoes.filter(t=>fzs.includes(t.fazendaId));
  }
  const nl=semAcento(resto);
  const iguais=candidatos.filter(t=>semAcento(t.nome)===nl);
  if(iguais.length===1) return iguais[0].id;
  if(iguais.length>1) return null; /* ambíguo: não chuta — vai para o vínculo manual */
  const parecidos=candidatos.filter(t=>semAcento(t.nome).includes(nl)||nl.includes(semAcento(t.nome)));
  return parecidos.length===1?parecidos[0].id:null;
}

function icropDo(data,fz){
  /* a estação iCrop é da fazenda física; cada linha vai para a unidade certa:
     equipamento/parcela com "café" no nome -> unidade Café; demais -> Grãos;
     fazenda com uma unidade só recebe tudo */
  const maeId=maeIdDe(fz);
  const varias=unidadesDaMae(maeId).length>1;
  const minha=perfilDe(fz);
  const semAc=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const linhas=(D.icropDados||[]).filter(l=>{
    if(l.data!==data || icropFazendaId(l.fazenda)!==maeId) return false;
    if(!varias) return true;
    const ehCafe=semAc((l.equipamento||"")+" "+(l.parcela||"")).includes("cafe");
    return ehCafe ? minha.includes("CAFE") : minha.includes("GRAOS");
  });
  if(!linhas.length) return null;
  /* o bruto vem como texto (->>); campo ausente/nulo fica fora da conta */
  const vals=(ls,k)=>ls.map(l=>l[k]).filter(v=>v!=null&&v!=="").map(n0);
  const maxDe=(ls,k)=>{const v=vals(ls,k);return v.length?Math.max(...v):0;};
  const minDe=(ls,k)=>{const v=vals(ls,k);return v.length?Math.min(...v):0;};
  const somaDe=(ls,k)=>vals(ls,k).reduce((s,x)=>s+x,0);
  const mediaDe=(ls,k)=>{const v=vals(ls,k);return v.length?v.reduce((s,x)=>s+x,0)/v.length:0;};
  const probsDe=ls=>{const out=[];ls.forEach(l=>{const p=l.probs;
    if(!p||p==="null"||p==="[]") return;
    let itens=[p]; try{const j=JSON.parse(p); itens=Array.isArray(j)?j:[j];}catch(e){}
    itens.forEach(x=>{const s=String((x&&(x.descricao||x.nome))||x||"").trim();
      if(s&&s!=="[object Object]"&&!out.includes(s)) out.push(s);});});return out;};
  const chuva=Math.max(...linhas.map(l=>n0(l.precipitacao_mm)));
  const porEq={};
  linhas.forEach(l=>{
    const eq=l.equipamento||"Equipamento";
    (porEq[eq]=porEq[eq]||[]).push(l);
  });
  let custoDia=0;
  const eqs=Object.keys(porEq).sort().map(eq=>{
    const ls=porEq[eq], regadas=ls.filter(l=>n0(l.irrigacao_mm)>0);
    const custo=regadas.reduce((s,l)=>s+n0(l.irrigacao_mm)*n0(l.area)*n0(l.custo_mm),0);
    custoDia+=custo;
    return { nome:eq,
      regadas:regadas.map(l=>({parcela:l.parcela||"", mm:n0(l.irrigacao_mm)})),
      total:ls.length, custo,
      etc:Math.max(...ls.map(l=>n0(l.etc))),
      deficit:Math.max(...ls.map(l=>n0(l.deficit))),
      atraso:Math.max(...ls.map(l=>n0(l.atraso))),
      percent:maxDe(ls,"percentimetro"), tempo:maxDe(ls,"tempo_irr"),
      deficitPrev:maxDe(ls,"deficit_prev"), laminaMin:maxDe(ls,"lamina_min"),
      umid:minDe(ls,"umidade"), umidSeg:maxDe(ls,"umid_seg"), capCampo:maxDe(ls,"cap_campo"),
      umidBaixa:ls.some(l=>l.umidade!=null&&l.umidade!==""&&l.umid_seg!=null&&l.umid_seg!==""
        &&n0(l.umidade)<n0(l.umid_seg)),
      fase:String(ls.map(l=>l.fase).find(v=>v!=null&&v!==""&&v!=="null")||""),
      gd:maxDe(ls,"gd"), probs:probsDe(ls) };
  });
  /* clima da estação (é da fazenda física; qualquer linha do dia serve) */
  const temClima=linhas.some(l=>["t_min","t_max","ur","vento"].some(k=>l[k]!=null&&l[k]!==""));
  const clima=temClima?{ tmin:minDe(linhas,"t_min"), tmax:maxDe(linhas,"t_max"),
    ur:maxDe(linhas,"ur"), vento:maxDe(linhas,"vento") }:null;
  return { chuva, eqs, qtd:linhas.length, custoDia, clima,
    chuvaPluv:maxDe(linhas,"chuva_pluv"), eficiencia:mediaDe(linhas,"eficiencia"),
    acumIrr:mediaDe(linhas,"acum_irr"), acumChuva:mediaDe(linhas,"acum_chuva"),
    reaisNec:somaDe(linhas,"reais_nec"), reaisReal:somaDe(linhas,"reais_real") };
}

function icropVencimentos(){
  const fzs=D.icropFaz||[], pcs=D.icropParcelas||[];
  if(!fzs.length) return null;
  const hoje=hojeISO(), out={vencendo:[], zeradas:[]};
  const nomeDe=id=>{const f=fzs.find(x=>String(x.id_da_fazenda)===String(id));return f?f.nome:("fazenda "+id);};
  const comParcela=new Set();
  pcs.forEach(p=>{
    const ativas=(p.parcela&&p.parcela.parcelas_ativas)||[];
    if(ativas.length) comParcela.add(String(p.id_fazenda));
    ativas.forEach(a=>{
      if(!a.fim) return;
      const dias=Math.round((new Date(a.fim+"T12:00:00")-new Date(hoje+"T12:00:00"))/864e5);
      if(dias<=7) out.vencendo.push({fazenda:nomeDe(p.id_fazenda),
        equip:(p.parcela.nome_do_equipamento||""), nome:a.nome_da_parcela||"parcela", fim:a.fim, dias});
    });
  });
  fzs.forEach(f=>{ if(!comParcela.has(String(f.id_da_fazenda))) out.zeradas.push(f.nome); });
  out.vencendo.sort((a,b)=>a.dias-b.dias);
  return (out.vencendo.length||out.zeradas.length)?out:null;
}

    const planos=await planoReq("GET","plano_safra?select=id,fazenda_app,safra,versao,vigente_de,aprovado_por&status=eq.vigente&"+fzArg);
    if(!Array.isArray(planos)) return;
    const mes=new Date().getMonth()+1, prox=mes===12?1:mes+1;
    const meses="mes="+encodeURIComponent("in.("+mes+","+prox+")");
    let unidades=[], aliasApp=[], adubo=[], calagem=[], fito=[], fitoExc=[], gantt=[], params=[];
    if(planos.length){
      const ids="plano_id="+encodeURIComponent(planoIn(planos.map(p=>p.id)));
      [unidades,aliasApp,adubo,calagem,fito,fitoExc,gantt,params]=await Promise.all([
        planoReq("GET","unidade_manejo?select=id,codigo,fazenda_app,empresa,nome_plano,nome_curto,pai_id,area_ha,irrigacao,status,status_desde,area_zerada_ha&ativo=is.true&"+fzArg),
        planoReq("GET","unidade_alias?select=unidade_id,alias&sistema=eq.app&vigente_ate=is.null&"+fzArg),
        planoReq("GET","plano_adubo_mes?select=plano_id,unidade_id,mes,insumo,kg,via&"+ids+"&"+meses),
        planoReq("GET","plano_calagem?select=plano_id,unidade_id,subarea,t_ha,t_total,rateado,janela_ini,janela_fim&"+ids),
        planoReq("GET","plano_fito_mes?select=mes,fase,alvos,produtos,via_solo&plano_id=is.null&"+meses),
        planoReq("GET","plano_fito_excecao?select=mes,produto,fazenda_app&"+meses+"&"+fzArg),
        planoReq("GET","plano_gantt?select=modelo,atividade,meses,tipo,evidencia_app"),
        planoReq("GET","plano_parametros?select=chave,valor")
      ]);
    }
    const agora=new Date().toISOString();
    const parametros={}; (params||[]).forEach(x=>{ parametros[x.chave]=x.valor; });
    fzs.forEach(f=>{
      const nome=PLANO_FAZENDA_APP[f.id];
      const p=planos.find(x=>x.fazenda_app===nome);
      if(!p){ delete planoCache[f.id]; return; }   /* sem plano vigente: nada em cache para esta fazenda */
      const uns=(unidades||[]).filter(u=>u.fazenda_app===nome);
      const modelo=PLANO_MODELO[(uns[0]||{}).empresa]||"NC";
      const idsU=new Set(uns.map(u=>u.id));
      planoCache[f.id]={ plano_versao_id:p.id, versao:p.versao, vigente_de:p.vigente_de, fazenda_app:nome, modelo, baixado_em:agora, mes,
        unidades:uns, aliasApp:(aliasApp||[]).filter(a=>idsU.has(a.unidade_id)),
        adubo:(adubo||[]).filter(a=>a.plano_id===p.id), calagem:(calagem||[]).filter(c=>c.plano_id===p.id),
        fito:fito||[], fitoExc:(fitoExc||[]).filter(x=>x.fazenda_app===nome), gantt:(gantt||[]).filter(g=>g.modelo===modelo), parametros };
    });
    await Persist.set("bdf:plano", JSON.stringify(planoCache));
  }catch(e){ /* tabelas ainda não criadas ou sem rede: fica o cache que já existia */ }
}

   Lê e grava direto no Supabase (precisa de rede). Unidades: editar nome curto, status,
   área e obs; adicionar/encerrar apelidos; inativar (nunca apagar) — cada campo alterado

let upEstado={ fz:"", dados:null, erro:"", editando:null, aliasEm:null };
async function upCarregar(){
  upEstado.erro="";
  if(!syncAtivo()){ upEstado.erro="Sincronização desligada — esta tela precisa do Supabase (Cadastros › Sincronização)."; return; }
  try{
    const [unidades,aliases,planos]=await Promise.all([
      planoReq("GET","unidade_manejo?select=*&order=codigo"),
      planoReq("GET","unidade_alias?select=id,unidade_id,fazenda_app,sistema,alias,vigente_de&vigente_ate=is.null&order=sistema,alias"),
      planoReq("GET","plano_safra?select=id,fazenda_app,safra,versao,status,vigente_de,motivo,arquivo_origem,criado_por,aprovado_por,aprovado_em,auditoria_ok,auditoria_json,resumo_deck,criado_em&order=fazenda_app,versao.desc")
    ]);
    upEstado.dados={unidades:unidades||[], aliases:aliases||[], planos:planos||[]};

/* Auditoria de uma versão do plano. ✱ = bloqueia a publicação. Só informa, não corrige. */
function auditarPlano(p, unidades, pus, adubo, cal){
  const itens=[], add=(titulo,bloqueante,detalhes)=>itens.push({titulo, bloqueante, ok:!detalhes.length, detalhes});
  const uni=id=>unidades.find(u=>u.id===id);
  const rot=id=>{ const u=uni(id); return u?u.codigo+" "+(u.nome_curto||u.nome_plano):"unidade "+String(id).slice(0,8)+"…"; };
  /* ✱ toda unidade do plano existe, está ativa e é desta fazenda */
  const d1=[];
  pus.forEach(x=>{ const u=uni(x.unidade_id);
    if(!u) d1.push("unidade "+String(x.unidade_id).slice(0,8)+"… não existe no cadastro");
    else if(!u.ativo) d1.push(rot(u.id)+" está inativa");
    else if(u.fazenda_app!==p.fazenda_app) d1.push(rot(u.id)+" pertence a "+u.fazenda_app); });
  add("Toda unidade do plano existe, está ativa e é desta fazenda", true, d1);
  /* ✱ calendário de adubação sem área (exceção declarada em obs: "sem área: ok") */
  const comCal=[...new Set(adubo.map(a=>a.unidade_id))];
  const d2=comCal.filter(id=>{ const u=uni(id); return u && (u.area_ha==null||u.area_ha==="") && !/sem\s+[áa]rea\s*:\s*ok/i.test(u.obs||""); }).map(rot);
  add("Nenhuma unidade com calendário de adubação sem área (exceção: escrever \"sem área: ok\" em obs)", true, d2);
  /* soma dos calendários × resumo do deck */
  const soma={}; PLANO_INSUMOS.forEach(i=>{ soma[i]=0; }); adubo.forEach(a=>{ soma[a.insumo]=(soma[a.insumo]||0)+n0(a.kg); });
  const d3=[], rd=p.resumo_deck||null;
  if(!rd) d3.push("plano sem resumo do deck gravado — não há com o que comparar");
  else PLANO_INSUMOS.forEach(i=>{ const r=n0(rd[i]); if(r!==soma[i]) d3.push(PLANO_ROTULO_INSUMO[i]+": calendários "+soma[i].toLocaleString("pt-BR")+" kg × resumo do deck "+r.toLocaleString("pt-BR")+" kg ("+((r-soma[i])>0?"+":"")+(r-soma[i]).toLocaleString("pt-BR")+")"); });
  add("Soma de kg por insumo bate com o resumo do deck (informa)", false, d3);
  /* kg/ha por insumo fora de ±50% da mediana da fazenda */
  const d4=[];
  const comArea=comCal.filter(id=>{ const u=uni(id); return u && n0(u.area_ha)>0; });
  const mediana=v=>{ const s=[...v].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  PLANO_INSUMOS.forEach(i=>{
    const kgha={}; comArea.forEach(id=>{ kgha[id]=adubo.filter(a=>a.unidade_id===id&&a.insumo===i).reduce((s,a)=>s+n0(a.kg),0)/n0(uni(id).area_ha); });
    const vals=Object.values(kgha); if(vals.length<3) return;
    const med=mediana(vals); if(!(med>0)) return;
    comArea.forEach(id=>{ const x=kgha[id]; if(Math.abs(x-med)>0.5*med) d4.push(rot(id)+" — "+PLANO_ROTULO_INSUMO[i]+" "+Math.round(x)+" kg/ha (mediana "+Math.round(med)+")"); });
  });
  add("kg/ha por insumo dentro de ±50% da mediana da fazenda (informa)", false, d4);
  /* calendário × calagem */
  const comCalag=new Set(cal.map(c=>c.unidade_id));
  const d5=[...comCal.filter(id=>!comCalag.has(id)).map(id=>rot(id)+": calendário sem calagem"),
            ...[...comCalag].filter(id=>!comCal.includes(id)).map(id=>rot(id)+": calagem sem calendário")];
  add("Toda unidade com calendário tem calagem e vice-versa (informa)", false, d5);
  /* status a confirmar */
  const d6=pus.map(x=>uni(x.unidade_id)).filter(u=>u&&u.status==="a_confirmar").map(u=>rot(u.id));
  add("Nenhuma unidade com status \"a confirmar\" (informa)", false, d6);
  /* via do insumo-mês */
  const semVia=adubo.filter(a=>!a.via).length;
  add("Todo insumo-mês tem via (fertirrigação / lanço) definida (informa — na v1 nenhuma tem, é esperado)", false, semVia?[semVia+" de "+adubo.length+" linhas sem via"]:[]);
  return { ok:itens.filter(i=>i.bloqueante).every(i=>i.ok), quando:new Date().toISOString(), versao_app:"v52", itens };
}

  const k=el.dataset.upc||"";

    const bt=$("#app").querySelector('[data-up="publicar"][data-upv="'+pid+'"]');
    if(bt) bt.disabled=!(p&&p.auditoria_ok&&el.value.trim()); }
}

function opcoesMaquina(fz, sel){

  const daFaz=maquinasDa(fz);

  cats.forEach(c=>{ h+=`<optgroup label="${esc(c)} — grupo">${doGrupo.filter(m=>m.cat===c).map(m=>`<option value="${esc(m.nome)}" ${sel===m.nome?"selected":""}>${esc(m.nome)}</option>`).join("")}</optgroup>`; });

/* ---------- Indicadores ---------- */
function indicadores(dias){
  const lim = new Date(); lim.setDate(lim.getDate()-dias);
  const limISO = lim.getFullYear()+"-"+String(lim.getMonth()+1).padStart(2,"0")+"-"+String(lim.getDate()).padStart(2,"0");
  const bs = D.boletins.filter(b=>b.data>=limISO && (!filtroPainel.fazenda || b.fazendaId===filtroPainel.fazenda)
    && (!filtroPainel.atv || atividadeDe(b.fazendaId)===filtroPainel.atv));
  let sacas=0, chuva=0, horasMaq=0, ativ=0, fitoAltos=0, ocorrAltas=0;
  bs.forEach(b=>{
    (b.colheita||[]).forEach(c=>sacas+=n0(c.sacas));
    chuva += n0(b.clima && b.clima.chuvaMm);
    (b.atividades||[]).forEach(a=>{ ativ++; (a.maquinas||[]).forEach(m=>horasMaq+=n0(m.horas)); });
    (b.fito||[]).forEach(f=>{ if(f.nivel==="Alto") fitoAltos++; });
    (b.ocorrencias||[]).forEach(o=>{ if(o.grav==="Alta") ocorrAltas++; });
  });
  return {qtd:bs.length, sacas, chuva, horasMaq, ativ, fitoAltos, ocorrAltas};
}
function statusDoDia(fz){
  const b = boletimDoDia(hojeISO(), fz);
  if(b){
    const critico = (b.ocorrencias||[]).some(o=>o.grav==="Alta") || (b.fito||[]).some(f=>f.nivel==="Alto");
    return critico ? "critico" : "ok";
  }
  return (new Date().getHours()>=17) ? "espera" : "vazio";
}

/* ---------- Navegação ---------- */
function ir(tela, arg, manterScroll){
  /* portaria: sem código válido nada abre; cada tela respeita o escopo do código */
  if(!acesso) tela="codigo";
  else if((tela==="cadastros"||tela==="importar"||tela==="unidplano") && !podeCadastros()) tela = podePainel()?"painel":"entrada";
  else if(["painel","relatorio","historico"].includes(tela) && !podePainel()) tela="entrada";
  telaAtual = tela;
  if(!manterScroll) window.scrollTo(0,0);
  const app = $("#app");
  app.className = (tela!=="codigo" && sessao && sessao.papel!=="gerente" && sessao.papel!=="pos") ? "largo" : "";
  if(tela==="codigo") app.innerHTML = vCodigo();
  else if(tela==="entrada") app.innerHTML = vEntrada();
  else if(tela==="fazendas") app.innerHTML = vEscolheFazenda();
  else if(tela==="casa") app.innerHTML = (sessao.papel==="gerente") ? vCasaGerente() : (sessao.papel==="pos") ? vCasaPos() : vPainel();
  else if(tela==="formpos") app.innerHTML = vFormPos();
  else if(tela==="detalhepos") app.innerHTML = vDetalhePos(arg);
  else if(tela==="painel") app.innerHTML = vPainel();
  else if(tela==="form") app.innerHTML = vForm();
  else if(tela==="detalhe") app.innerHTML = vDetalhe(arg);
  else if(tela==="historico") app.innerHTML = vHistorico();
  else if(tela==="cadastros") app.innerHTML = vCadastros();
  else if(tela==="importar") app.innerHTML = vImportar();
  else if(tela==="unidplano") app.innerHTML = vUnidPlano();
  else if(tela==="relatorio") app.innerHTML = vRelatorio();
  else if(tela==="ajuda") app.innerHTML = vAjuda();
  ligarEventos(tela, arg);
}

function resumo1linha(b){
  const parts=[];
  const ats=(b.atividades||[]).map(a=>a.tipo.split(" —")[0]);
  if(ats.length) parts.push([...new Set(ats)].slice(0,3).join(", "));
  const sac=(b.colheita||[]).reduce((s,c)=>s+n0(c.sacas),0);
  if(sac) parts.push(sac+" sacas");
  if(n0(b.clima&&b.clima.chuvaMm)) parts.push(b.clima.chuvaMm+" mm chuva");
  const no=(b.ocorrencias||[]).length; if(no) parts.push(no+" ocorrência"+(no>1?"s":""));
  return parts.join(" · ")||"sem atividades de campo";
}
function topo(titulo, sub, voltar){

function cartaoIcropDia(r){
  const ic=icropDo(r.data,r.fazendaId);
  if(!ic) return "";
  const num=(v,d)=>v.toLocaleString("pt-BR",{maximumFractionDigits:d==null?1:d});
  const linhaDet=(rotulo,resumo,corpo)=>`<details class="mt" style="font-size:.85rem">
    <summary style="cursor:pointer;list-style-position:inside"><b>${rotulo}</b>${resumo?` <span class="mut" style="font-size:.78rem">· ${resumo}</span>`:""}</summary>
    <div style="margin:4px 0 2px 8px">${corpo}</div></details>`;
  /* linha "Hoje": lâmina medida por pivô/parcela, chuva da estação e problemas */
  const hojeCorpo=(ic.chuva?`<div style="margin:2px 0">🌧️ Chuva na estação: <b>${num(ic.chuva)} mm</b>${(ic.chuvaPluv&&ic.chuvaPluv!==ic.chuva)?` <span class="mut">(pluviômetro ${num(ic.chuvaPluv)} mm)</span>`:""}</div>`:"")
    +ic.eqs.map(e=>{
      const det=e.regadas.length
        ? e.regadas.map(g=>"<b>"+num(g.mm)+" mm</b>"+(g.parcela?" ("+esc(g.parcela)+")":"")).join(" · ")
        : "sem irrigação medida";
      const pb=(e.probs||[]).length?` <span style="color:var(--amarelo)">· ⚠ ${esc(e.probs.join(", "))}</span>`:"";
      return `<div style="margin:2px 0">${esc(e.nome)} — ${det}${pb}</div>`;
    }).join("");
  const regou=ic.eqs.filter(e=>e.regadas.length).length;
  const hojeRes=(regou?regou+(regou>1?" regaram":" regou"):"sem irrigação medida")
    +(ic.chuva?` · chuva ${num(ic.chuva)} mm`:"");
  /* linha "Recomendação iCrop": o que o sistema pede para amanhã */
  const eqsRec=ic.eqs.filter(e=>e.percent||e.tempo||e.deficitPrev||e.laminaMin);
  const recCorpo=eqsRec.map(e=>`<div style="margin:2px 0">${esc(e.nome)} — ${[
      e.percent?`percentímetro <b>${num(e.percent,0)}%</b>`:"",
      e.tempo?`tempo <b>${num(e.tempo)} h</b>`:"",
      e.deficitPrev?`déficit previsto amanhã <b>${num(e.deficitPrev)} mm</b>`:"",
      e.laminaMin?`lâmina mínima <b>${num(e.laminaMin)} mm</b>`:""
    ].filter(Boolean).join(" · ")}</div>`).join("");
  const maxPct=Math.max(0,...eqsRec.map(e=>e.percent));
  /* linha "Solo e planta": umidade × segurança, fase, graus-dia e atraso */
  const eqsSolo=ic.eqs.filter(e=>e.umid||e.umidSeg||e.fase||e.gd||e.atraso);
  const soloCorpo=eqsSolo.map(e=>{
    const umid=(e.umid||e.umidSeg)?(e.umidBaixa
      ?`umidade <b style="color:var(--amarelo)">${num(e.umid)}%</b> <span style="color:var(--amarelo)">⚠ abaixo da segurança (${num(e.umidSeg)}%)</span>`
      :`umidade <b>${num(e.umid)}%</b>${e.umidSeg?` (segurança ${num(e.umidSeg)}%)`:""}`):"";
    return `<div style="margin:2px 0">${esc(e.nome)} — ${[umid,
      e.fase?`fase ${esc(e.fase)}`:"",
      e.gd?`<b class="num">${num(e.gd,0)}</b> graus-dia`:"",
      e.atraso?`<b style="color:var(--amarelo)">${e.atraso} dia${e.atraso>1?"s":""} de atraso</b>`:""
    ].filter(Boolean).join(" · ")}</div>`;}).join("");
  const nBaixa=eqsSolo.filter(e=>e.umidBaixa).length, nAtraso=eqsSolo.filter(e=>e.atraso>0).length;
  const soloRes=nBaixa?`<span style="color:var(--amarelo)">⚠ ${nBaixa} abaixo da segurança</span>`
    :nAtraso?`<span style="color:var(--amarelo)">⚠ ${nAtraso} em atraso</span>`:"umidade ok";
  return `<div class="aviso" style="border-color:var(--verde)"><b>💧 iCrop — medição automática do dia</b>
          ${linhaDet("Hoje",hojeRes,hojeCorpo)}
          ${recCorpo?linhaDet("Recomendação iCrop",maxPct?`percentímetro até ${num(maxPct,0)}%`:"",recCorpo):""}
          ${soloCorpo?linhaDet("Solo e planta",soloRes,soloCorpo):""}
          <p class="mut" style="font-size:.75rem;margin-top:6px">Medição do sistema iCrop, gravada automaticamente de madrugada. Só confira — não precisa digitar.</p></div>`;
}

/* Seletor de operação AGRUPADO POR FASE, com as fases recolhidas (nada de listona aberta):
   toca na fase → ela expande e mostra só as operações dela. Filtrado pela cultura do ciclo. */
function seletorOperacaoGraos(a,data){
  const info=infoCiclo(a.talhaoId,data);
  const cultura=info?info.cultura:null;
  let fases;
  if(cultura){
    fases=fasesDa(cultura).map(([f,ops])=>[f,ops.filter(o=>valeParaCultura(o,cultura))]).filter(([,ops])=>ops.length);
    if(info.fase){ const i=fases.findIndex(([f])=>f===info.fase);
      if(i>0){ const h=fases.splice(i,1)[0]; fases.unshift(h); } }
  }else{
    /* sem ciclo aberto: só faz sentido preparar e plantar */
    fases=[OPS_GRAOS_FASES[0],OPS_GRAOS_FASES[1]];
  }
  if(a.tipo) return `<label>Operação</label>
    <div class="linha-flex"><span class="cresce"><b>${esc(a.tipo)}</b></span>
      <button class="btn suave mini" data-troca-op="${a.id}">trocar</button></div>`;
  return `<label>Operação</label>
    ${fases.map(([f,ops])=>`<details class="fase-op"><summary>${esc(f)}${info&&info.fase===f?` <span class="mut">· fase de agora</span>`:""}</summary>
      <div class="chips" style="margin:6px 0 8px">${ops.map(o=>`<button class="chip" data-escop="${a.id}|${esc(o)}">${esc(o)}</button>`).join("")}</div>
    </details>`).join("")}`;
}

/* ===== GRÃOS — Irrigação por pivô (informado pelo gerente × medido pela iCrop) =====
   O gerente NUNCA digita nome de pivô: cada lançamento usa o mesmo seletor
   "Talhão / pivô" das Operações do dia. A lista oficial da unidade junta:
   a) talhões do cadastro oficial com "pivô" no nome (fora os arrendados);
   b) equipamentos que a iCrop entrega para a fazenda (excluindo os com
      "café" no nome, que pertencem à unidade Café);
   c) cadastro local (D.pivosLocais, guardado por unidade — para fazendas
      sem pivô no cadastro nem iCrop, como Porto Buriti),
   unificados por nome (sem acento, sem zeros à esquerda) e ordenados. */
function pivosIcropDa(fz){
  const maeId=maeIdDe(fz);
  const nomes=new Set();
  (D.icropDados||[]).forEach(l=>{
    if(icropFazendaId(l.fazenda)!==maeId || !l.equipamento) return;
    if(normTxt(l.equipamento).includes("cafe")) return; /* pivô de café é da unidade Café */
    nomes.add(l.equipamento);
  });
  return [...nomes].sort((a,b)=>a.localeCompare(b,"pt-BR",{numeric:true}));
}
const pivosLocaisDa = fz => ((D.pivosLocais||{})[fz])||[];
/* "Pivô 01", "Pivo 1", "P-1" e o "01" que a iCrop manda são o MESMO pivô:
   quando o nome tem número, o número é a identidade (mesma regra do
   icropMedidoPivo); sem número, vale o texto sem acento */
const chavePivo = n => { const t=normTxt(n).replace(/[^a-z0-9]+/g," ").trim().replace(/\b0+(\d)/g,"$1");
  const ds=t.match(/\d+/g); return ds?ds.join(" "):t; };
function pivosDa(fz){
  const lista=talhoesDa(fz).filter(t=>t.tipo!=="ARRENDADO" && normTxt(t.nome).includes("pivo"))
    .map(t=>({k:t.id,nome:t.nome,area:t.area}));
  const add=(k,nome)=>{ if(!lista.some(x=>chavePivo(x.nome)===chavePivo(nome))) lista.push({k,nome,area:0}); };
  pivosIcropDa(fz).forEach(nome=>add("ic:"+nome,nome));
  pivosLocaisDa(fz).forEach(p=>add(p.id,p.nome));
  return lista.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));
}
/* pivôs ainda não lançados no boletim (o do próprio cartão continua na lista dele) */
function pivosLivresDa(r,eAtual){
  const usados=(r.irg||[]).filter(e=>e!==eAtual&&e.k);
  return pivosDa(r.fazendaId).filter(p=>!usados.some(e=>e.k===p.k||chavePivo(e.nome||"")===chavePivo(p.nome)));
}
const irgDe = (r,id) => { r.irg=r.irg||[]; return r.irg.find(x=>x.id===id||x.k===id); };
const novoIrg = p => ({id:uid(), k:p?p.k:"", nome:p?p.nome:"",
  status:"",lamina:"",percent:"",quimi:"",quimiProdutos:[],problemas:[],obs:""});
/* boletins antigos guardavam a linha só pela chave do pivô; rascunhos da v44
   podem ter o mesmo pivô em dobro ("01" da iCrop + "Pivô 01" do talhão) */
function migrarIrg(r){
  r.irg=r.irg||[];
  r.irg.forEach(e=>{ if(!e.id) e.id=e.k||uid();
    /* religa a linha ao pivô oficial da lista (nome e área certos) */
    if(e.nome){ const p=pivosDa(r.fazendaId).find(x=>chavePivo(x.nome)===chavePivo(e.nome));
      if(p&&e.k!==p.k){ e.k=p.k; e.nome=p.nome; } } });
  /* mesmo pivô duas vezes: fica a linha que tem situação marcada */
  const chaveDe=e=>e.k?("k:"+chavePivo(e.nome||e.k)):("id:"+e.id);
  const melhor={};
  r.irg.forEach(e=>{ const c=chaveDe(e); if(!melhor[c]||(!melhor[c].status&&e.status)) melhor[c]=e; });
  r.irg=r.irg.filter(e=>melhor[chaveDe(e)]===e);
}
function icropMedidoPivo(b,nomePivo){
  const ic=icropDo(b.data,b.fazendaId); if(!ic) return null;
  const num=s=>{const m=/(\d+)/.exec(String(s||""));return m?parseInt(m[1],10):null;};
  const alvo=num(nomePivo);
  const eq=(ic.eqs||[]).find(e=>normTxt(e.nome)===normTxt(nomePivo))
    || (alvo!==null ? (ic.eqs||[]).find(e=>num(e.nome)===alvo) : null);
  if(!eq) return null;
  return {mm:eq.regadas.reduce((s,g)=>s+g.mm,0), regou:eq.regadas.length>0};
}

  const fmtMm=v=>v.toLocaleString("pt-BR",{maximumFractionDigits:1});

  return `<div class="mt" data-irg="${esc(e.id)}" style="border-top:1px dashed var(--linha);padding-top:10px;position:relative">
    <button class="fechar-sub" data-rm-irg="${esc(e.id)}" style="top:6px;right:0">remover</button>

    ${(med&&med.regou)?` <span class="mut" style="font-size:.78rem">· iCrop mediu <b class="num">${fmtMm(med.mm)} mm</b></span>`:""}
    <div class="chips mt">${["Rodou","Parcial","Não rodou","Manutenção"].map(s=>`<button class="chip ${e.status===s?"on":""}" data-igst="${esc(e.id)}|${s}">${s}</button>`).join("")}</div>
    ${rodou?`<div class="grade2 mt">
      <div><label>Lâmina (mm)</label><input inputmode="decimal" data-ig="lamina" value="${esc(e.lamina||"")}" placeholder="${(med&&med.regou)?("iCrop: "+fmtMm(med.mm)):"Ex.: 6"}"></div>
      <div><label>Percentímetro (%)</label><input inputmode="decimal" data-ig="percent" value="${esc(e.percent||"")}" placeholder="Ex.: 50"></div>
    </div>
    <div class="chips mt"><button class="chip ${e.quimi==="Sim"?"on":""}" data-igqm="${esc(e.id)}">🧪 Quimigação / fertirrigação</button></div>
    ${e.quimi==="Sim"?linhasProdutos(e.quimiProdutos||[],"igp")+`<button class="btn suave mini mt" data-igp-add="${esc(e.id)}">＋ produto</button>`:""}`:""}
    ${prob?`<label class="mt">Qual foi o problema?</label>
      <div class="chips">${["Energia","Bomba","Torre / roda","Vazamento","Painel / automação","Outro"].map(p2=>`<button class="chip ${(e.problemas||[]).includes(p2)?"on":""}" data-igpb="${esc(e.id)}|${p2}">${p2}</button>`).join("")}</div>
      <input data-ig="obs" value="${esc(e.obs||"")}" placeholder="Detalhe rápido (opcional)" style="margin-top:8px">`:""}
  </div>`;

function repintarIrg(r){
  const el=$("#lista-irg"); if(!el) return;

function cardFn(f,i){

    <select data-fnq="nomeSel">
      <option value="">— toque para escolher —</option>
      ${lista.map(op=>`<option value="${op}" ${f.nome===op?"selected":""}>${op}</option>`).join("")}
      <option value="__outra" ${outra?"selected":""}>Outra (digitar)…</option>
    </select>
    <input data-fnq="nome" placeholder="Digite a função" value="${esc(outra?f.nome:"")}" style="display:${outra?"block":"none"};margin-top:8px">
    <div class="grade2 mt">
      <div><label>Próprios</label><input inputmode="numeric" data-fnq="prop" value="${esc(f.prop!==undefined?f.prop:(f.pessoas||""))}" placeholder="0"></div>
      <div><label>Diaristas / terceiros</label><input inputmode="numeric" data-fnq="diar" value="${esc(f.diar||"")}" placeholder="0"></div>
    </div>
    <label class="mt">Horas extras (turma)</label><input inputmode="decimal" data-fnq="hx" value="${esc(f.hx||"")}" placeholder="0">
    <button class="btn suave mini mt" data-rm-fn="${i}">remover esta função</button></div>`;
}
function fnPr(f){ return (n0(f.prop)||n0(f.diar)) ? n0(f.prop) : n0(f.pessoas); }
function fnDi(f){ return n0(f.diar); }
function sincronizarMoTotais(app,r){
  const fs=r.mo.funcoes||[]; if(!fs.length) return;
  r.mo.proprios=String(fs.reduce((s,f)=>s+fnPr(f),0));
  r.mo.diaristas=String(fs.reduce((s,f)=>s+fnDi(f),0));
  r.mo.horasExtras=String(fs.reduce((s,f)=>s+n0(f.hx),0));
  ["proprios","diaristas","horasExtras"].forEach(k=>{
    const i=app.querySelector(`input[data-mo="${k}"]`); if(i) i.value=r.mo[k]; });
  const s=app.querySelector("#res-mo"); if(s) s.textContent=(n0(r.mo.proprios)+n0(r.mo.diaristas))+" pessoas";
}
function distTexto(mo){
  const fs=(mo.funcoes||[]).filter(f=>f.nome||fnPr(f)||fnDi(f)); if(!fs.length) return "";
  const pr=fs.reduce((s,f)=>s+fnPr(f),0), di=fs.reduce((s,f)=>s+fnDi(f),0);
  const hx=fs.reduce((s,f)=>s+n0(f.hx),0);
  let s="🧮 Total do dia (calculado): "+pr+" próprio"+(pr!==1?"s":"")+" + "+di+" diarista"+(di!==1?"s":"")+" = "+(pr+di)+" pessoa"+((pr+di)!==1?"s":"")+" na fazenda";
  if(hx) s+=" · "+hx+"h extras";
  return s;
}
function pintarFuncoes(app,r){
  const lx=app.querySelector("#lista-mofn");
  if(lx) lx.innerHTML=(r.mo.funcoes||[]).map((f,i)=>cardFn(f,i)).join("");
  const dx=app.querySelector("#dist-mofn"); if(dx) dx.textContent=distTexto(r.mo);
  const temF=(r.mo.funcoes||[]).length>0;
  ["proprios","diaristas","horasExtras"].forEach(k=>{
    const i=app.querySelector(`input[data-mo="${k}"]`); if(i) i.readOnly=temF; });
  const av=app.querySelector("#aviso-mo-auto"); if(av) av.style.display=temF?"block":"none";
  sincronizarMoTotais(app,r);
}

/* comprime a foto para caber no armazenamento (máx. ~800 px, JPEG) */
function comprimirFoto(arquivo){
  return new Promise(res=>{
    const img=new Image(), url=URL.createObjectURL(arquivo);
    img.onload=()=>{ const esc2=Math.min(1,800/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*esc2); cv.height=Math.round(img.height*esc2);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",.6)); };
    img.onerror=()=>res(null); img.src=url;
  });
}

/* ---------- Farol de completude: quem mandou boletim nos últimos 7 dias ---------- */
function cartaoFarolBoletins(){
  const dias=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i);
    dias.push({ iso:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
      dom:d.getDay()===0 }); }
  const uteis=dias.filter(x=>!x.dom).length;
  const hoje=hojeISO(), ontem=dias[5].iso;
  const unidades=D.fazendas.filter(f=>!filtroPainel.atv || atividadeDe(f.id)===filtroPainel.atv);
  const linhas=unidades.map(f=>{
    let envUteis=0;
    const marcas=dias.map(x=>{
      if(boletimDoDia(x.iso,f.id)){ if(!x.dom) envUteis++; return "●"; }
      return x.dom?"–":"○";
    }).join(" ");
    const emDia=!!(boletimDoDia(hoje,f.id)||boletimDoDia(ontem,f.id));
    return {f, marcas, envUteis, emDia, mae:maeDe(f)};
  });
  /* agrupa as unidades pela fazenda física */
  const grupos={}, ordem=[];
  linhas.forEach(l=>{ const k=l.mae.id; if(!grupos[k]){ grupos[k]={mae:l.mae, uns:[]}; ordem.push(k); } grupos[k].uns.push(l); });
  const gs=ordem.map(k=>grupos[k]);
  gs.forEach(g=>{ g.min=Math.min(...g.uns.map(u=>u.envUteis)); g.soma=g.uns.reduce((s,u)=>s+u.envUteis,0);
    g.emDia=g.uns.every(u=>u.emDia); g.uns.sort((a,b)=>a.envUteis-b.envUteis); });
  gs.sort((a,b)=>a.min-b.min || (a.emDia===b.emDia?0:a.emDia?1:-1) || a.mae.nome.localeCompare(b.mae.nome));
  const emDiaQtd=linhas.filter(l=>l.emDia).length;
  const tudoEmDia=emDiaQtd===linhas.length;
  const linhaHtml=(rotulo,l,indent)=>`<div class="linha-flex" style="padding:5px 0${indent?"":";border-top:1px solid var(--linha)"};gap:8px${indent?";padding-left:14px":""}">
        <span class="cresce" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.emDia?rotulo:"<b>"+rotulo+"</b>"}</span>
        <span class="num" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;flex:none">${l.marcas}</span>
        <span class="num mut" style="flex:none;min-width:34px;text-align:right">${l.envUteis}/${uteis}</span></div>`;
  return `<details class="secao" ${tudoEmDia?"":"open"}><summary><span class="ico">📋</span>Boletins dos últimos 7 dias
      <span class="resumo">${emDiaQtd} de ${linhas.length} em dia</span><span class="seta">›</span></summary>
    <div class="corpo" style="font-size:.85rem">
      ${gs.map(g=>{
        if(g.uns.length===1) return linhaHtml(esc(g.uns[0].f.nome), g.uns[0], false);
        /* fazenda física com sublinhas por unidade; total soma as unidades */
        return `<div class="linha-flex" style="padding:5px 0;border-top:1px solid var(--linha);gap:8px">
          <span class="cresce">${g.emDia?esc(g.mae.nome):"<b>"+esc(g.mae.nome)+"</b>"}</span>
          <span class="num mut" style="flex:none">total ${g.soma}/${uteis*g.uns.length}</span></div>`+
          g.uns.map(u=>linhaHtml("· "+rotuloAtividade(atividadeDe(u.f.id)), u, true)).join("");
      }).join("")}
      <p class="mt" style="font-weight:700">${emDiaQtd} de ${linhas.length} unidades em dia <span class="mut" style="font-weight:400">(enviou ontem ou hoje)</span></p>
      <p class="mut" style="font-size:.72rem">● enviado · ○ faltou · – domingo sem envio</p>
    </div></details>`;
}

/* ---------- Painel: grãos ontem por unidade (ha por operação, lâminas informado × medido,
   colheita acumulada do ciclo e alerta de monitoramento alto sem aplicação) ---------- */
function cartaoGraosPainel(){
  if(filtroPainel.atv&&filtroPainel.atv!=="GRAOS") return "";
  const ontem=ontemISO();
  const fmt1=v=>v.toLocaleString("pt-BR",{maximumFractionDigits:1});
  const blocos=D.fazendas.filter(f=>atividadeDe(f.id)==="GRAOS").map(f=>{
    const b=boletimDoDia(ontem,f.id);
    const linhas=[];
    if(b){
      const porCat={};
      (b.atividades||[]).forEach(a=>{ if(!a.gr||!a.tipo) return; const c=GRUPO_OP[opCatDe(a.tipo)]||"outras";
        porCat[c]=(porCat[c]||0)+n0(a.areaHa); });
      const ha=Object.entries(porCat).filter(([,v])=>v>0).map(([k,v])=>k+" "+fmt1(v)+" ha");
      if(ha.length) linhas.push("🚜 "+ha.join(" · "));
      const lam=(b.irg||[]).filter(e2=>e2.status).map(e2=>{
        const nome=e2.nome||talhao(e2.k).nome, med=icropMedidoPivo(b,nome), inf=n0(e2.lamina);
        return nome+": "+(inf?fmt1(inf)+" mm":e2.status.toLowerCase())+((med&&med.regou)?" (mediu "+fmt1(med.mm)+")":"");
      });
      if(lam.length) linhas.push("💧 "+lam.join(" · "));
    }
    const cols=[];
    talhoesAnuais(f.id).forEach(t=>{ const c=cicloAtivo(t.id); if(!c) return;
      let sacas=0, area=0;
      D.boletins.filter(x=>x.fazendaId===f.id&&x.data>=(c.plantio||"")).forEach(x=>(x.colheita||[]).forEach(cc=>{
        if(cc.talhaoId===t.id){ sacas+=n0(cc.sacas); area+=n0(cc.areaHa); } }));
      if(sacas) cols.push(t.nome+" ("+rotuloCultura(c.cultura)+"): "+Math.round(sacas).toLocaleString("pt-BR")+" sc"+(area?" · "+fmt1(sacas/area)+" sc/ha":""));
    });
    if(cols.length) linhas.push("⚖️ Ciclo: "+cols.join(" · "));
    const alertas=[];
    const d10=(()=>{const d2=new Date();d2.setDate(d2.getDate()-10);return d2.toISOString().slice(0,10);})();
    D.boletins.filter(x=>x.fazendaId===f.id&&x.data>=d10).forEach(x=>{
      const altos=[
        ...(x.atividades||[]).filter(a=>a.gr&&opCatDe(a.tipo)==="MONITORAMENTO"&&a.nivel==="Alto").map(a=>({tal:a.talhaoId,alvo:a.alvo})),
        ...(x.fito||[]).filter(ft=>ft.nivel==="Alto").map(ft=>({tal:ft.talhaoId,alvo:ft.nome}))];
      altos.forEach(al=>{
        const lim=(()=>{const d2=new Date(x.data+"T12:00:00");d2.setDate(d2.getDate()+3);return d2.toISOString().slice(0,10);})();
        if(lim>hojeISO()) return; /* prazo de 3 dias ainda correndo */
        const aplicou=D.boletins.some(y=>y.fazendaId===f.id&&y.data>x.data&&y.data<=lim
          &&(y.atividades||[]).some(a=>opCatDe(a.tipo)==="APLICACAO"&&(!al.tal||a.talhaoId===al.tal)));
        if(!aplicou) alertas.push((al.alvo||"alvo")+" nível ALTO em "+talhao(al.tal).nome+" ("+fmtDataCurta(x.data)+") sem aplicação nos 3 dias seguintes");
      });
    });
    if(alertas.length) linhas.push("🔴 "+[...new Set(alertas)].slice(0,3).join(" · "));
    if(!linhas.length) return "";
    return `<div class="mt" style="border-top:1px dashed var(--linha);padding-top:8px"><b>${esc(f.nome)}</b>${b?"":" <span class='mut' style='font-size:.78rem'>· sem boletim ontem</span>"}
      ${linhas.map(l=>`<p class="mut" style="font-size:.82rem;margin:3px 0">${esc(l)}</p>`).join("")}</div>`;
  }).filter(Boolean);
  if(!blocos.length) return "";
  return `<div class="cartao"><h3>🌾 Grãos — ontem por unidade</h3>${blocos.join("")}
    <p class="mut" style="font-size:.75rem;margin-top:6px">Hectares por operação, lâmina informado × medido (iCrop) e colheita acumulada do ciclo.</p></div>`;
}

const escopoKpi=()=>filtroPainel.fazenda?esc(fazenda(filtroPainel.fazenda).nome):"grupo";
function msgVazio(){
  const f=filtroPainel, partes=[];
  if(f.atividade) partes.push("com a atividade \""+f.atividade+"\"");
  if(f.busca) partes.push("com \""+f.busca+"\"");
  if(f.fazenda) partes.push("de "+fazenda(f.fazenda).nome);
  if(f.de||f.ate) partes.push("nesse período");
  const total=boletinsOrdenados().length;
  const causa=partes.length?"Nenhum boletim "+partes.join(" e ")+"." : "Nenhum boletim registrado ainda.";
  const dica=partes.length&&total?` Existem ${total} boletim(ns) no total — <button class="btn suave mini" data-limpar-filtros="1" style="display:inline-flex;padding:2px 8px">limpar filtros</button>`:(total?"":" Assim que um gerente enviar, aparece aqui.");
  return causa+dica;
}
function filtrarBoletins(){
  const f=filtroPainel, q=f.busca.toLowerCase();
  return boletinsOrdenados().filter(b=>{
    if(f.fazenda && b.fazendaId!==f.fazenda) return false;
    if(f.atv && atividadeDe(b.fazendaId)!==f.atv) return false;
    if(f.de && b.data<f.de) return false;
    if(f.ate && b.data>f.ate) return false;
    if(f.atividade && !(b.atividades||[]).some(a=>a.tipo===f.atividade)) return false;
    if(q){
      const txt = JSON.stringify(b).toLowerCase();
      if(!txt.includes(q)) return false;
    }
    return true;
  });
}

function ontemISO(){ const d=new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
let xlsxPronto=null;
function carregarXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxPronto) return xlsxPronto;
  xlsxPronto=new Promise((ok,erro)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=()=>ok(); s.onerror=()=>{ xlsxPronto=null; erro(); };
    document.head.appendChild(s);
  });
  return xlsxPronto;
}
function impLerTexto(txt){
  const grade=separarCSV(txt);
  if(grade.length<2){ alert("Não achei linhas na tabela. Confira o arquivo ou o que colou."); return; }
  /* exports reais vêm com linhas de enfeite antes do cabeçalho — acha a linha com mais células preenchidas */
  let iCab=0, melhor=0;
  for(let i=0;i<Math.min(grade.length,8);i++){
    const cheias=grade[i].filter(c=>c!=="").length;
    if(cheias>melhor){ melhor=cheias; iCab=i; }
  }
  impEstado={ fonte:(impEstado?impEstado.fonte:"solinftec"), cab:grade[iCab], linhas:grade.slice(iCab+1).filter(l=>l.some(c=>c!=="")), mapa:{}, semMaq:[], semTal:[], resultado:"" };
  ir("importar");
}
function impRodar(){
  const e=impEstado; if(!e) return;
  const campos=CAMPOS_IMPORT[e.fonte];
  /* aproveita o mapa salvo da última vez para o que o usuário não mexeu */
  const salvo=(D.mapaImport||{})[e.fonte]||{};
  campos.forEach(([k])=>{ if(e.mapa[k]===undefined){ const i=e.cab.indexOf(salvo[k]); if(i>=0) e.mapa[k]=String(i); } });
  const diaEl=document.getElementById("imp-dia"); e.dia=diaEl?diaEl.value:(e.dia||ontemISO());
  for(const [k,rot,obrig] of campos){ if(obrig&&(e.mapa[k]===undefined||e.mapa[k]==="")){ alert("Falta dizer qual coluna é: "+rot); return; } }
  if(e.fonte==="solinftec" && (e.mapa.data===undefined||e.mapa.data==="") && !e.dia){ alert("Informe de que dia é o arquivo."); return; }
  D.mapaImport=D.mapaImport||{}; D.mapaImport[e.fonte]={};
  campos.forEach(([k])=>{ if(e.mapa[k]!==undefined&&e.mapa[k]!=="") D.mapaImport[e.fonte][k]=e.cab[e.mapa[k]]; });
  const col=k=>e.mapa[k]!==undefined&&e.mapa[k]!==""?+e.mapa[k]:null;
  const porDia={}; const semMaq=new Set(), semTal=new Set(); let lidas=0, semData=0, semHora=0;
  const arred=v=>Math.round(v*100)/100;
  e.linhas.forEach(L=>{
    const data=(col("data")!==null?dataNorm(L[col("data")]):"")||e.dia||"";
    if(!data){ semData++; return; }
    const linha={};
    if(e.fonte==="solinftec"){
      linha.origemNome=L[col("maquina")]||"";
      linha.maquinaId=acharMaquina(linha.origemNome); if(!linha.maquinaId&&linha.origemNome) semMaq.add(linha.origemNome);
      linha.horasTrab=arred(n0(L[col("horasTrab")]));
      if(col("horasMotor")!==null) linha.horasMotor=arred(n0(L[col("horasMotor")]));
      if(col("ocioso")!==null) linha.ocioso=arred(n0(L[col("ocioso")]));
      if(col("processo")!==null) linha.processo=String(L[col("processo")]||"").trim();
      if(col("operador")!==null){ const op=String(L[col("operador")]||"").trim(); if(op&&!/não definido/i.test(op)) linha.operador=op; }
      if(col("comb")!==null) linha.comb=arred(n0(L[col("comb")]));
      if(col("talhao")!==null){ linha.setorNome=L[col("talhao")]||""; linha.talhaoId=acharTalhao(linha.setorNome); if(linha.setorNome&&!linha.talhaoId) semTal.add(linha.setorNome); }
      if(!(linha.horasTrab>0)&&!(linha.horasMotor>0)&&!(linha.ocioso>0)){ semHora++; return; } /* linha vazia da telemetria: ignora */
    }else{
      linha.setorNome=L[col("setor")]||"";
      linha.talhaoId=acharTalhao(linha.setorNome); if(linha.setorNome&&!linha.talhaoId) semTal.add(linha.setorNome);
      linha.lamina=n0(L[col("lamina")]);
      if(!(linha.lamina>0)) { semHora++; return; }
    }
    (porDia[data]=porDia[data]||[]).push(linha); lidas++;
  });
  D.telemetria=D.telemetria||[];
  Object.entries(porDia).forEach(([data,linhas])=>{
    const id="tel-"+e.fonte+"-"+data;
    const i=D.telemetria.findIndex(x=>x.id===id);
    const reg={id, fonte:e.fonte, data, linhas, atualizado:Date.now()};
    if(i>=0) D.telemetria[i]=reg; else D.telemetria.push(reg);
    syncEnfileirar('t', id);
  });
  e.semMaq=[...semMaq]; e.semTal=[...semTal];
  e.resultado="✅ "+lidas+" linha(s) importadas em "+Object.keys(porDia).length+" dia(s)."+(semHora?" ("+semHora+" linha(s) zeradas ignoradas)":"")+(semData?" ("+semData+" sem data, ignoradas)":"");
  salvarDados(); ir("importar");
}

/* ---------- Exportações ---------- */
function baixarCSV(){
  const sep=";", lin=[["Data","Fazenda","Responsável","Clima","Chuva (mm)","Próprios","Diaristas","Faltas","Horas extras","Funções","Atividades","Sacas colhidas","Latas (manual)","Carretas","Horas-máquina","Combustível (L)","Irrigação","Água captação","Fitossanitário","Ocorrências","Observações","Pendências"].join(sep)];
  filtrarBoletins().slice().reverse().forEach(b=>{
    const hm=(b.atividades||[]).reduce((s,a)=>s+(a.maquinas||[]).reduce((x,m)=>x+n0(m.horas),0),0);
    const cb=(b.atividades||[]).reduce((s,a)=>s+(a.maquinas||[]).reduce((x,m)=>x+n0(m.comb),0),0);
    const cel=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    lin.push([fmtData(b.data),cel(fazenda(b.fazendaId).nome),cel(b.responsavel),cel([b.clima.cond,b.clima.florada==="Sim"?"florada aberta":"",b.clima.requeima==="Sim"?"requeima de flores":""].filter(Boolean).join(" · ")),n0(b.clima.chuvaMm),
      n0(b.mo.proprios),n0(b.mo.diaristas),n0(b.mo.faltas),n0(b.mo.horasExtras),
      cel((b.mo.funcoes||[]).map(f=>f.nome+":"+(fnPr(f)+fnDi(f))+"p"+(fnDi(f)?"("+fnPr(f)+"pr+"+fnDi(f)+"di)":"")+(n0(f.hx)?"/"+n0(f.hx)+"he":"")).join(" | ")),
      cel((b.atividades||[]).map(a=>a.tipo+" ("+talhao(a.talhaoId).nome+")"
        +(a.gr&&n0(a.areaHa)?" ["+a.areaHa+" ha]":"")
        +(a.gr&&(a.produtos||[]).some(p=>p.nome)?" {"+a.produtos.filter(p=>p.nome).map(p=>p.nome+(p.dose?" "+p.dose+(p.un||"")+"/ha":"")).join("; ")+"}":"")
        +(a.gr&&(a.produtoAdb||a.formulacao)?" {"+(a.produtoAdb||a.formulacao)+(n0(a.doseKgHa)?" "+a.doseKgHa+" kg/ha":"")+(n0(a.doseTHa)?" "+a.doseTHa+" t/ha":"")+"}":"")
        +(n0(a.tanques)?" ["+n0(a.tanques)+" tq]":"")+(a.status==="concluida"?" ✔":a.status==="continua"?" ⏳"+(a.falta?" falta: "+a.falta:""):"")).join(" | ")),
      (b.colheita||[]).reduce((s,c)=>s+n0(c.sacas),0),hm,cb,
      cel((b.irg||[]).some(e2=>e2.status)
        ? b.irg.filter(e2=>e2.status).map(e2=>(e2.nome||talhao(e2.k).nome)+": "+e2.status+(n0(e2.lamina)?" "+e2.lamina+" mm":"")+((e2.quimiProdutos||[]).some(p=>p.nome)?" · quimigação "+e2.quimiProdutos.filter(p=>p.nome).map(p=>p.nome+(p.dose?" "+p.dose+(p.un||"")+"/ha":"")).join("+"):"")).join(" | ")
        : (b.irr?[b.irr.status,(b.irr.problemas||[]).join("/"),b.irr.obs||"",b.irr.fert==="Sim"?("fertirrigação"+((b.irr.fertSetores||[]).length?" ("+b.irr.fertSetores.map(id=>talhao(id).nome).join("/")+")":"")):""].filter(Boolean).join(" · "):"")),
      cel(b.irr?b.irr.agua||"":""),
      cel((b.fito||[]).map(f=>f.nome+" "+f.nivel).join(" | ")),
      cel((b.ocorrencias||[]).map(o=>o.tipo+" ("+o.grav+"): "+o.texto).join(" | ")),
      cel(b.obsGeral),cel(b.pendencias)].join(sep));
  });
  const blob=new Blob(["\uFEFF"+lin.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="boletins_"+D.grupo.nome.replace(/\s+/g,"_")+".csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
