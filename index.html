/* ---- leitura da ata colada (item 4): texto inteiro → itens, com pré-visualização editável ----
   Nada é gravado antes de a pessoa conferir item a item. Reimportar a mesma ata não duplica
   (chave: rodada + unidade + descrição normalizada). */
const ATA_CAB_GERAIS=/^\s*(?:\d+(?:\.\d+)*\s*[–—-]\s*)?(assuntos?\s+gerais|necessidades?\s+de\s+investimento|investimentos?)\s*:?\s*$/i;
const ATA_BLOCO=/^\s*(\d+(?:\.\d+)*)\s*[–—-]\s*(.+?)\s*$/;
const ATA_ITEM=/^\s*[-–—•*]\s*(.+?)\s*$/;
const ATA_PRAZO=/PRAZO\s*:?\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{2,4})/i;
/* "96 há", "22 ha", "40 hectares": \b não serve depois de "á" (fora do \w) — a fronteira é a letra seguinte */
const ATA_AREA=/(\d+(?:[.,]\d+)?)\s*(?:h[aá]s?|hectares?)(?![A-Za-zÀ-ÿ0-9])/i;
const ATA_CLIMA=/(aguardando\s+sol|quando\s+parar\s+(?:as\s+)?chuvas?|\d+\s*dias?\s+de\s+sol|esperando\s+(?:o\s+)?tempo|parar\s+de\s+chover|dep(?:o|ó)is\s+das\s+chuvas)/i;
const ATA_TERCEIRO=/(aguardando\s+repasse|aguardando\s+aprova\w*|aguardando\s+[a-zà-ú]+|falta\s+chegar|falta\s+entregar|falta\s+pe[çc]as?|cobrar\s+[A-ZÀ-Ú][\wÀ-ÿ]*)/i;
const ATA_FIM=/\b(ok|finalizad[oa]s?|conclu[ií]d[oa]s?|pronto|feito)\b/i;
const ATA_EXEC=/\b(em\s+andamento|andamento|iniciou|iniciad[oa]s?|finalizando|em\s+execu\w*|come[çc]ou)\b/i;
const ATA_TERCEIROS_CONHECIDOS=["Cooxupé","Diferpan","Cemig","Sicoob","Bayer","Yara","Mosaic","Copercampos","Netafim","John Deere","Jacto"];
const ataData = (d,m,a) => { const ano=a.length===2?("20"+a):a;
  return ano+"-"+String(parseInt(m,10)).padStart(2,"0")+"-"+String(parseInt(d,10)).padStart(2,"0"); };
function ataTerceiroDe(txt){
  const conh=ATA_TERCEIROS_CONHECIDOS.find(n=>normTxt(txt).includes(normTxt(n)));
  if(conh) return conh;
  const m=/(?:cobrar|aguardando|falta\s+(?:chegar|entregar)\s+(?:d[aeo]\s+)?)\s+([A-ZÀ-Ú][\wÀ-ÿ]{2,})/.exec(txt);
  return m ? m[1] : "";
}
function ataResponsavelDe(txt){
  const dc=/definid[oa]\s+com\s+([A-ZÀ-Ú][\wÀ-ÿ\/\s]{2,30}?)(?:[.,)]|$)/i.exec(txt);
  if(dc) return dc[1].trim();
  const parens=[...txt.matchAll(/\(([^()]*)\)/g)].map(m=>m[1].trim()).filter(Boolean);
  const cand=parens.filter(p=>!ATA_CLIMA.test(p) && !ATA_TERCEIRO.test(p) && !/\d/.test(p) && p.split(/\s+/).length<=5 && /[A-ZÀ-Ú]/.test(p[0]||""));
  return cand.length ? cand[cand.length-1].replace(/\s*\/\s*/g,"/").trim() : "";
}
function ataLerItem(linha, ctx){
  const bruto=linha.trim();
  const it={ desc:"", prazo:"", area:"", responsavel:"", status:"a_iniciar", bloqueio:null,
    unidade:ctx.unidade||"", unidadeTexto:ctx.unidadeTexto||"", tipoItem:ctx.tipoItem||"tarefa", bruto, avisos:[] };
  let txt=bruto;
  const p=ATA_PRAZO.exec(txt);
  if(p){ it.prazo=ataData(p[1],p[2],p[3]); txt=txt.replace(p[0],""); }
  const a=ATA_AREA.exec(txt);
  if(a) it.area=String(a[1]).replace(",",".");
  it.responsavel=ataResponsavelDe(bruto);
  const clima=ATA_CLIMA.test(bruto), terc=ATA_TERCEIRO.test(bruto);
  if(ATA_FIM.test(bruto)) it.status="finalizado";
  else if(clima){ it.status="aguardando_clima"; it.bloqueio={tipo:"clima", quem:"", texto:"aguardando o tempo firmar"}; }
  else if(terc){ const quem=ataTerceiroDe(bruto);
    it.status="aguardando_terceiro";
    it.bloqueio={tipo:"terceiro", quem, texto:(ATA_TERCEIRO.exec(bruto)||[])[1]||"aguardando"}; }
  else if(ATA_EXEC.test(bruto)) it.status="em_execucao";
  /* descrição limpa: sem o PRAZO e sem sobra de pontuação nas pontas */
  it.desc=txt.replace(/\s*[-–—:.,;]+\s*$/,"").replace(/\s{2,}/g," ").trim();
  if(!it.desc) it.desc=bruto;
  if(it.tipoItem!=="tarefa"){ it.prazo=""; it.unidade=""; }
  if(it.tipoItem==="tarefa" && !it.unidade) it.avisos.push("unidade não reconhecida");
  return it;
}
function ataParsear(texto){
  const linhas=String(texto||"").split(/\r?\n/);
  const out={itens:[], gerais:[], fora:[], blocos:[]};
  let ctx={unidade:"", unidadeTexto:"", tipoItem:"tarefa"}, ignorando=false;
  linhas.forEach(l=>{
    const linha=l.replace(/ /g," ").trimEnd();
    if(!linha.trim()) return;
    if(ATA_CAB_GERAIS.test(linha)){
      const g=ATA_CAB_GERAIS.exec(linha)[1];
      ctx={unidade:"", unidadeTexto:"", tipoItem:/investimento/i.test(g)?"investimento":"assunto"};
      ignorando=false; return;
    }
    const b=ATA_BLOCO.exec(linha);
    if(b && !ATA_ITEM.test(linha)){
      const nome=b[2].replace(/[:.]\s*$/,"").trim();
      const dp=deparaAtaDe(nome);
      if(dp && dp.fora){ ignorando=true; ctx={unidade:"", unidadeTexto:nome, tipoItem:"tarefa"};
        if(!out.fora.includes(nome)) out.fora.push(nome); return; }
      ignorando=false;
      ctx={unidade:(dp&&dp.unidade)||"", unidadeTexto:nome, tipoItem:"tarefa", area:(dp&&dp.area)||""};
      out.blocos.push({nome, unidade:ctx.unidade, area:ctx.area||""});
      return;
    }
    const i=ATA_ITEM.exec(linha);
    if(!i) return;
    if(ignorando) return;                                   /* fazenda fora do escopo: some sem perguntar */
    const it=ataLerItem(i[1], ctx);
    if(ctx.area) it.areaNome=ctx.area;                      /* "FMC Igrejinha" → área dentro de Monte Carmelo — Café */
    it.incluir=true;
    if(it.tipoItem==="tarefa") out.itens.push(it); else out.gerais.push(it);
  });
  return out;
}
const ataChave = (rodadaId, unidade, desc) => [rodadaId, unidade||"", normTxt(desc).replace(/[^a-z0-9]/g,"")].join("|");
const ataJaTem = (rodadaId, it) => planTarefas().some(t=>ataChave(t.origemId, t.unidade, t.desc)===ataChave(rodadaId, it.unidade, it.desc));
/* grava a pré-visualização já conferida. Devolve {novas, repetidas}. */
function ataImportar(rodada, itens){
  let novas=0, repetidas=0;
  itens.filter(it=>it.incluir!==false && String(it.desc||"").trim()).forEach(it=>{
    if(ataJaTem(rodada.id, it)){ repetidas++; return; }
    planNovaTarefa({ origemTipo:"mensal", origemId:rodada.id, origemRot:rodada.nome,
      unidade:it.unidade, unidadeTexto:it.unidadeTexto, area:it.area, desc:(it.areaNome?it.areaNome+" — ":"")+it.desc,
      prazo:it.prazo, responsavel:it.responsavel, status:it.status, tipoItem:it.tipoItem,
      bloqueio:it.bloqueio, statusAntes:"a_iniciar" });
    novas++;
  });
  salvarDados();
  planTarefas().filter(t=>t.origemId===rodada.id).forEach(t=>syncEnfileirar("tar",t.id));
  syncEnfileirar("rod", rodada.id);
  return {novas, repetidas};
}

/* ---- faixa "📋 Tarefas da reunião" (item 7) — topo da casa do gerente e do boletim ----
   Componente ÚNICO nas três atividades. Sem tarefa aberta na unidade, devolve "" (nada aparece).
   No máximo PLAN_FAIXA_MAX linhas, ordem 🔴 → 🟡 → ⏸️ → 🟢, com "＋N tarefas". Tudo em dia vira
   uma linha só. Relata prazo e registro — nunca "não fez", "atrasado" no campo é o rótulo do
   próprio prazo vencido (ATRASADO), nunca julgamento de pessoa. */
function planLinhaTexto(t){
  const f=planFarol(t);
  const partes=[];
  /* v78: a faixa já traz o placar da tarefa — executado de planejado, na mesma linha visual */
  const p=planProgresso(t);
  if(p.temMeta) partes.push(planHa(p.feito)+" de "+planHa(p.meta)+" ha");
  else if(p.ex.n) partes.push(p.ex.n+" lançamento"+(p.ex.n>1?"s":""));
  if(planPausada(t)) partes.push(((t.bloqueio&&t.bloqueio.texto)||planStatusRot(t.status).toLowerCase())+((t.bloqueio&&t.bloqueio.quem)?" ("+t.bloqueio.quem+")":""));
  else if(t.prazo) partes.push((f==="vermelho"&&planDiasParaPrazo(t)<0?"ATRASADO desde ":"vence ")+fmtDataCurta(planPrazoEfetivo(t)));
  else partes.push("sem prazo");
  return partes.join(" · ");
}
function faixaTarefas(fz){
  if(!fz) return "";
  const ls=planAbertasDa(fz);
  if(!ls.length) return "";
  const urgentes=ls.filter(t=>planFarol(t)!=="verde");
  if(!urgentes.length){
    const prox=ls.filter(t=>t.prazo).sort((a,b)=>a.prazo<b.prazo?-1:1)[0];
    return `<div class="aviso tar-faixa" id="tar-faixa"><div class="linha-flex" style="gap:8px">
      <b class="cresce">📋 Tarefas em dia${prox?` <span class="mut tar-conta">próxima vence ${esc(fmtDataCurta(planPrazoEfetivo(prox)))}</span>`:""}</b>
      <button class="btn suave mini" data-tar-todas="${esc(fz)}">ver</button></div></div>`;
  }
  const mostra=ls.slice(0,PLAN_FAIXA_MAX), resto=ls.length-mostra.length;
  return `<div class="aviso tar-faixa" id="tar-faixa"><div class="linha-flex" style="gap:8px">
      <b class="cresce">📋 Tarefas da reunião <span class="mut tar-conta">${ls.length} aberta${ls.length>1?"s":""}</span></b></div>
    ${mostra.map(t=>`<button class="tar-item" data-tar="${t.id}" aria-label="${esc(t.desc)} — ${esc(planLinhaTexto(t))}">
      <span class="tar-farol" aria-hidden="true">${PLAN_FAROL[planFarol(t)].ico}</span>
      <b>${esc(t.desc)}</b><span class="mut"> · ${esc(planLinhaTexto(t))}</span></button>`).join("")}
    ${resto>0?`<button class="btn suave mini mt" data-tar-todas="${esc(fz)}">＋${resto} tarefa${resto>1?"s":""}</button>`:""}</div>`;
}
/* sugestão do vínculo com o boletim (item 10): o app SUGERE, nunca conclui sozinho. Um toque em
   "Concluí" fecha; um toque em "ainda não" some pelo resto do dia. Sem diálogo, sem modal. */
function planSugestaoBoletim(fz, dia){
  const b=planBoletimDe(fz,dia); if(!b) return "";
  const cat=PLANO_ATIVIDADE[atividadeDe(fz)]||PLANO_ATIVIDADE.CAFE;
  const feitas=(cat.feitos(b)||[]).map(f=>nomeAtual(f.op));
  if(!feitas.length) return "";
  const ls=planAbertasDa(fz).filter(t=>!planEhEstrutura(t.desc) && !(planSugestaoAdiada[t.id]===dia))
    .filter(t=>planOperacoesDe(t).some(op=>feitas.includes(op)));
  if(!ls.length) return "";
  const t=ls[0];
  const op=planOperacoesDe(t).find(o=>feitas.includes(o))||"";
  return `<div class="cartao tar-sug"><b>Você lançou ${esc(nomeAtual(op).toLowerCase())} ${dia===hojeBRT()?"hoje":"em "+fmtDataCurta(dia)} — concluir a tarefa?</b>
    <p class="mut" style="margin:2px 0 8px;font-size:.85rem">${esc(t.desc)}${t.prazo?" · vence "+esc(fmtDataCurta(planPrazoEfetivo(t))):""}</p>
    <div class="chips"><button class="chip" data-tar-ok="${t.id}">Concluí</button>
      <button class="chip" data-tar-adiar="${t.id}">ainda não</button></div></div>`;
}
let planSugestaoAdiada={};

/* ---- folha da tarefa (gerente e escritório): ações de UM TOQUE, nada digitado ---- */
let tarUI=null;
function planFolhaCorpo(){
  if(!tarUI.id) return planFolhaLista();
  const t=planTarefa(tarUI.id); if(!t) return `<p class="mut">Tarefa não encontrada.</p>`;
  const f=planFarol(t), proj=planProjecao(t), hist=planHistDe(t.id).slice(0,4);
  const prazo=planPrazoEfetivo(t);
  const uteis=t.prazo?planDiasUteis(t.unidade, hojeBRT(), prazo):0;
  return `<div class="cartao">
      <b>${PLAN_FAROL[f].ico} ${esc(t.desc)}</b>
      <p class="mut" style="margin:4px 0 0">${esc(t.unidade?fazenda(t.unidade).nome:(t.unidadeTexto||"Grupo"))}${n0(t.area)?" · "+esc(n0(t.area).toLocaleString("pt-BR",{maximumFractionDigits:0}))+" ha":""} · ${esc(planStatusRot(t.status).toLowerCase())}</p>
      <p class="mut" style="margin:2px 0 0">${t.prazo?`prazo ${esc(fmtData(prazo))}${n0(t.diasChuva)?` <span class="tar-ajuste">ajustado +${n0(t.diasChuva)} dia${n0(t.diasChuva)>1?"s":""} de chuva (original ${esc(fmtData(t.prazoOriginal||t.prazo))})</span>`:""}${uteis?" · "+uteis+" dia"+(uteis>1?"s":"")+" úteis pela frente":""}`:"sem prazo"}</p>
      ${t.responsavel?`<p class="mut" style="margin:2px 0 0">com ${esc(t.responsavel)}</p>`:""}
      ${t.origemRot?`<p class="mut" style="margin:2px 0 0;font-size:.78rem">origem: ${esc(t.origemRot)}${planArrastaMeses(t)?" · arrastada há "+planArrastaMeses(t)+" reuniões":""}</p>`:""}
      ${planTrio(t,{attr:"data-tar-exec", aberta:!!tarUI.exec})}
      ${proj?`<p class="mut tar-proj">no ritmo atual conclui em ${esc(fmtDataCurta(proj.fim))}${proj.atraso>0?` (${proj.atraso} dia${proj.atraso>1?"s":""} após o prazo)`:proj.atraso<0?` (${-proj.atraso} dia${-proj.atraso<-1?"s":""} antes do prazo)`:""}</p>
        <p class="mut" style="font-size:.72rem;margin:2px 0 0">Ritmo calculado dos talhões já registrados no boletim; dias úteis sem domingo e sem os dias de chuva declarados.</p>`:""}
    </div>
    <div class="cartao"><b>O que aconteceu?</b>
      <p class="mut" style="font-size:.78rem;margin:2px 0 8px">Um toque responde. Dá para mudar de novo depois.</p>
      <div class="chips">
        <button class="chip ${t.status==="em_execucao"?"on":""}" data-tar-st="em_execucao">Comecei</button>
        <button class="chip ${t.status==="finalizado"?"on":""}" data-tar-st="finalizado">Concluí</button>
        <button class="chip ${planPausada(t)?"on":""}" data-tar-trava="1">Travado</button>
      </div>
      ${tarUI.trava?`<label class="mt">O que travou?</label>
        <div class="chips">${PLAN_MOTIVOS_TRAVA.map(m=>`<button class="chip ${((t.bloqueio||{}).motivo)===m.id?"on":""}" data-tar-mot="${m.id}">${esc(m.rot)}</button>`).join("")}</div>`:""}
    </div>
    ${tarUI.podePrazo?`<div class="cartao"><b>Novo prazo</b>
      <p class="mut" style="font-size:.78rem;margin:2px 0 8px">Repactuar fica registrado no histórico, com quem e quando.</p>
      <div class="chips">${PLAN_NOVOS_PRAZOS.map(p=>`<button class="chip" data-tar-prazo="${p.id}">${esc(p.rot)}</button>`).join("")}</div></div>`:""}
    <button class="btn sec" data-tar-zap="${t.id}">💬 Falar com o Nilo</button>
    ${hist.length?`<div class="cartao mt"><b>Histórico</b>
      <ul class="lista-limpa">${hist.map(h=>`<li><span class="mut" style="font-size:.8rem">${esc(h.em)}${h.por?" · "+esc(h.por):""}</span><br>${esc(planHistTexto(h))}</li>`).join("")}</ul></div>`:""}`;
}
/* modo lista da mesma folha: todas as tarefas abertas da unidade do gerente (o "＋N tarefas") */
function planFolhaLista(){
  const ls=planAbertasDa(tarUI.fz);
  if(!ls.length) return htmlEstado("vazio",{que:"tarefa da reunião", unidade:tarUI.fz},{classe:"mut centro mt"});
  return `<p class="mut" style="margin:0 0 8px">${ls.length} tarefa${ls.length>1?"s":""} aberta${ls.length>1?"s":""} nesta unidade. Toque para responder num toque.</p>`
    +ls.map(t=>`<button class="cad-item" data-tar-abrir="${t.id}" style="text-align:left">
      <span class="plan-farol" aria-hidden="true">${PLAN_FAROL[planFarol(t)].ico}</span>
      <span class="cresce"><b>${esc(t.desc)}</b><span class="mut">${esc(planLinhaTexto(t))}</span></span>
      <span class="seta">›</span></button>`).join("");
}
function planHistTexto(h){
  if(h.campo==="status") return "status: "+(h.de?planStatusRot(h.de).toLowerCase()+" → ":"")+planStatusRot(h.para).toLowerCase()+(h.motivo?" ("+h.motivo+")":"");
  if(h.campo==="prazo") return "prazo: "+(h.de?fmtData(h.de):"sem prazo")+" → "+fmtData(h.para)+(h.motivo?" ("+h.motivo+")":"");
  if(h.campo==="compromisso") return h.para?"assumida na semana":"tirada da semana";
  if(h.campo==="criada") return "criada"+(h.motivo?" — "+h.motivo:"");
  return h.campo+(h.motivo?" — "+h.motivo:"");
}
function planFolhaPintar(){ const c=document.getElementById("tar-corpo"); if(c) c.innerHTML=planFolhaCorpo(); }
function planFolhaAbrir(o){
  tarUI={ id:o.id||"", fz:o.fz||"", trava:false, exec:false, podePrazo: !!(sessao && sessao.papel!=="gerente") };
  const f=document.createElement("div"); f.className="folha"; f.id="folha-tarefa";
  f.setAttribute("role","dialog"); f.setAttribute("aria-modal","true"); f.setAttribute("aria-label","Tarefas da reunião");
  f.innerHTML=`<div class="miolo">
      <div class="topo"><button class="btn-topo" id="bt-tar-fechar">‹ Fechar</button><h1>📋 Tarefas da reunião</h1></div>
      <div id="tar-corpo">${planFolhaCorpo()}</div>
    </div>
    <div class="rodape no-print"><div class="linha-flex" style="gap:8px;max-width:640px;margin:0 auto">
      <button class="btn sec" id="bt-tar-fechar2">Fechar</button></div></div>`;
  document.body.appendChild(f);
  travarFolha();
  f.onclick=ev=>{ const bt=ev.target.closest("button"); if(!bt) return; const d=bt.dataset;
    if(bt.id==="bt-tar-fechar"||bt.id==="bt-tar-fechar2"){
      if(tarUI.id && tarUI.fz){ tarUI.id=""; tarUI.trava=false; tarUI.exec=false; planFolhaPintar(); return; }
      fecharFolhaTarefa(); return; }
    if(d.tarAbrir!==undefined){ tarUI.id=d.tarAbrir; tarUI.trava=false; tarUI.exec=false; planFolhaPintar(); return; }
    if(d.tarExec!==undefined){ tarUI.exec=!tarUI.exec; planFolhaPintar(); return; }
    if(!tarUI.id) return;
    if(d.tarSt!==undefined){ const at=planTarefa(tarUI.id);
      planMudarStatus(tarUI.id, at.status===d.tarSt?"a_iniciar":d.tarSt);
      tarUI.trava=false; planFolhaPintar(); return; }
    if(d.tarTrava!==undefined){ tarUI.trava=!tarUI.trava; planFolhaPintar(); return; }
    if(d.tarMot!==undefined){ const m=planMotivoTrava(d.tarMot); if(!m) return;
      planMudarStatus(tarUI.id, m.tipo==="clima"?"aguardando_clima":"aguardando_terceiro", {motivo:m.id, texto:m.texto});
      tarUI.trava=false; planFolhaPintar(); return; }
    if(d.tarPrazo!==undefined){ const novo=planPrazoChip(planTarefa(tarUI.id), d.tarPrazo);
      if(novo) planNovoPrazo(tarUI.id, novo, "repactuado no escritório");
      planFolhaPintar(); return; }
    if(d.tarZap!==undefined){ planFalarComNilo(d.tarZap); return; }
  };
}
const abrirFolhaTarefa  = id => { if(planTarefa(id)) planFolhaAbrir({id}); };
const abrirFolhaTarefas = fz => planFolhaAbrir({fz});
function fecharFolhaTarefa(){
  const f=document.getElementById("folha-tarefa");
  if(f){ f.remove(); destravarFolha(); }
  tarUI=null;
  if(telaAtual==="planejamento") ir("planejamento",null,true);
  else if(telaAtual==="casa") ir("casa",null,true);
  else if(telaAtual==="form"){ const box=document.getElementById("tar-faixa");
    if(box && rascunho){ const novo=faixaTarefas(rascunho.fazendaId);
      if(novo) box.outerHTML=novo; else box.remove(); } }
}
function planPrazoChip(t, id){
  const base=t.prazo||hojeBRT();
  if(id==="d7") return diaISO(base,7);
  if(id==="d15") return diaISO(base,15);
  if(id==="mes") return planFimDoMes(hojeBRT());
  if(id==="reuniao"){ const d=new Date(hojeBRT()+"T12:00:00");
    const alvo=new Date(d.getFullYear(), d.getMonth()+(d.getDate()>=PLAN_DIA_REUNIAO?1:0), PLAN_DIA_REUNIAO);
    return alvo.getFullYear()+"-"+String(alvo.getMonth()+1).padStart(2,"0")+"-"+String(alvo.getDate()).padStart(2,"0"); }
  return "";
}
/* "Falar com o Nilo": UMA linha pronta, sem sair do app para escrever nada */
function planFalarComNilo(id){
  const t=planTarefa(id); if(!t) return;
  const linha=[fazenda(t.unidade).nome||t.unidadeTexto, t.desc, planLinhaTexto(t)].filter(Boolean).join(" · ");
  abrirTextoZap(linha);
}

/* ---------- Seções multicultura do formulário ---------- */
function cartaoIcropDia(r){
  const ic=icropDo(r.data,r.fazendaId);
  if(!ic) return "";
  const num=(v,d)=>v.toLocaleString("pt-BR",{maximumFractionDigits:d==null?1:d});
  const linhaDet=(rotulo,resumo,corpo)=>`<details class="mt" style="font-size:.85rem">
    <summary style="cursor:pointer;list-style-position:inside"><b>${rotulo}</b>${resumo?` <span class="mut" style="font-size:.78rem">· ${resumo}</span>`:""}</summary>
    <div style="margin:4px 0 2px 8px">${corpo}</div></details>`;
  /* linha "Hoje": lâmina medida por pivô/parcela, chuva da estação e problemas */
  const hojeCorpo=(ic.chuva?`<div style="margin:2px 0">🌧️ Chuva na estação: <b>${num(ic.chuva)} mm</b>${(ic.chuvaPluv&&ic.chuvaPluv!==ic.chuva)?` <span class="mut">(pluviômetro ${num(ic.chuvaPluv)} mm)</span>`:""}</div>`:"")
    +ic.eqs.map(e=>{
      const det=e.regadas.length
        ? e.regadas.map(g=>"<b>"+num(g.mm)+" mm</b>"+(g.parcela?" ("+esc(g.parcela)+")":"")).join(" · ")
        : "sem irrigação medida";
      const pb=(e.probs||[]).length?` <span style="color:var(--amarelo)">· ⚠ ${esc(e.probs.join(", "))}</span>`:"";
      return `<div style="margin:2px 0">${esc(e.nome)} — ${det}${pb}</div>`;
    }).join("");
  const regou=ic.eqs.filter(e=>e.regadas.length).length;
  const hojeRes=(regou?regou+(regou>1?" regaram":" regou"):"sem irrigação medida")
    +(ic.chuva?` · chuva ${num(ic.chuva)} mm`:"");
  /* linha "Recomendação iCrop": o que o sistema pede para amanhã */
  const eqsRec=ic.eqs.filter(e=>e.percent||e.tempo||e.deficitPrev||e.laminaMin);
  const recCorpo=eqsRec.map(e=>`<div style="margin:2px 0">${esc(e.nome)} — ${[
      e.percent?`percentímetro <b>${num(e.percent,0)}%</b>`:"",
      e.tempo?`tempo <b>${num(e.tempo)} h</b>`:"",
      e.deficitPrev?`déficit previsto amanhã <b>${num(e.deficitPrev)} mm</b>`:"",
      e.laminaMin?`lâmina mínima <b>${num(e.laminaMin)} mm</b>`:""
    ].filter(Boolean).join(" · ")}</div>`).join("");
  const maxPct=Math.max(0,...eqsRec.map(e=>e.percent));
  /* linha "Solo e planta": umidade × segurança, fase, graus-dia e atraso */
  const eqsSolo=ic.eqs.filter(e=>e.umid||e.umidSeg||e.fase||e.gd||e.atraso);
  const soloCorpo=eqsSolo.map(e=>{
    const umid=(e.umid||e.umidSeg)?(e.umidBaixa
      ?`umidade <b style="color:var(--amarelo)">${num(e.umid)}%</b> <span style="color:var(--amarelo)">⚠ abaixo da segurança (${num(e.umidSeg)}%)</span>`
      :`umidade <b>${num(e.umid)}%</b>${e.umidSeg?` (segurança ${num(e.umidSeg)}%)`:""}`):"";
    return `<div style="margin:2px 0">${esc(e.nome)} — ${[umid,
      e.fase?`fase ${esc(e.fase)}`:"",
      e.gd?`<b class="num">${num(e.gd,0)}</b> graus-dia`:"",
      e.atraso?`<b style="color:var(--amarelo)">${e.atraso} dia${e.atraso>1?"s":""} de atraso</b>`:""
    ].filter(Boolean).join(" · ")}</div>`;}).join("");
  const nBaixa=eqsSolo.filter(e=>e.umidBaixa).length, nAtraso=eqsSolo.filter(e=>e.atraso>0).length;
  const soloRes=nBaixa?`<span style="color:var(--amarelo)">⚠ ${nBaixa} abaixo da segurança</span>`
    :nAtraso?`<span style="color:var(--amarelo)">⚠ ${nAtraso} em atraso</span>`:"umidade ok";
  return `<div class="aviso" style="border-color:var(--verde)"><b>💧 iCrop — medição automática do dia</b>
          ${linhaDet("Hoje",hojeRes,hojeCorpo)}
          ${recCorpo?linhaDet("Recomendação iCrop",maxPct?`percentímetro até ${num(maxPct,0)}%`:"",recCorpo):""}
          ${soloCorpo?linhaDet("Solo e planta",soloRes,soloCorpo):""}
          <p class="mut" style="font-size:.75rem;margin-top:6px">Medição do sistema iCrop, gravada automaticamente de madrugada. Só confira — não precisa digitar.</p>${linhaOrigemDado("icrop")}</div>`;
}

        return `<div class="mt" style="border-top:1px dashed var(--linha);padding-top:10px">
          <b>${esc(t.nome)}</b> <span class="mut">— ${rotuloCultura(c.cultura)}${c.plantio?", plantado "+fmtData(c.plantio):""}${c.colheitaPrevista?" · colheita prevista "+fmtData(c.colheitaPrevista):""}</span>
          ${fasesDa(c.cultura).map(([fase,ops])=>`<p class="mut" style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px">${esc(fase)}</p>

/* Seletor de operação AGRUPADO, com os grupos RECOLHIDOS (nada de listona aberta): toca no grupo
   → ele expande e mostra só as operações dele. Componente ÚNICO das atividades que o usam
   (CLAUDE.md, c4): o vocabulário — rótulo do passo, nome dos grupos, operações e o grupo em
   destaque — vem de quem chama, nunca de `if(atividade==="…")`. Grãos agrupa por FASE do ciclo;
   café, por NATUREZA do serviço (v76). O nome já escolhido aparece pelo termo de hoje (nomeAtual),
   mesmo que o boletim tenha sido gravado com o nome antigo. */
function seletorOperacao(a,{rotulo,grupos,destaque,nota}){
  if(a.tipo) return `<label>${rotulo}</label>
    <div class="linha-flex"><span class="cresce"><b>${esc(nomeAtual(a.tipo))}</b></span>
      <button class="btn suave mini" data-troca-op="${a.id}">trocar</button></div>`;
  return `<label>${rotulo}</label>
    ${grupos.map(([f,ops])=>`<details class="fase-op"><summary>${esc(f)}${destaque&&destaque===f?` <span class="mut">${esc(nota)}</span>`:""}</summary>
      <div class="chips" style="margin:6px 0 8px">${ops.map(o=>`<button class="chip" data-escop="${a.id}|${esc(o)}">${esc(o)}</button>`).join("")}</div>
    </details>`).join("")}`;
}
function seletorOperacaoGraos(a,data){
  const info=infoCiclo(a.talhaoId,data);
  const cultura=info?info.cultura:null;
  let fases;
  if(cultura){
    fases=fasesDa(cultura).map(([f,ops])=>[f,ops.filter(o=>valeParaCultura(o,cultura))]).filter(([,ops])=>ops.length);
    if(info.fase){ const i=fases.findIndex(([f])=>f===info.fase);
      if(i>0){ const h=fases.splice(i,1)[0]; fases.unshift(h); } }
  }else{
    /* sem ciclo aberto: só faz sentido preparar e plantar */
    fases=[OPS_GRAOS_FASES[0],OPS_GRAOS_FASES[1]];
  }
  return seletorOperacao(a,{rotulo:"Operação",grupos:fases,destaque:info&&info.fase,nota:"· fase de agora"});
}

function pivosIcropDa(fz){
  const maeId=maeIdDe(fz);
  const nomes=new Set();
  (D.icropDados||[]).forEach(l=>{
    if(icropFazendaId(l.fazenda)!==maeId || !l.equipamento) return;
    if(normTxt(l.equipamento).includes("cafe")) return; /* pivô de café é da unidade Café */
    nomes.add(l.equipamento);
  });
  return [...nomes].sort((a,b)=>a.localeCompare(b,"pt-BR",{numeric:true}));
}
const pivosLocaisDa = fz => ((D.pivosLocais||{})[fz])||[];
/* "Pivô 01", "Pivo 1", "P-1" e o "01" que a iCrop manda são o MESMO pivô:
   quando o nome tem número, o número é a identidade (mesma regra do
   icropMedidoPivo); sem número, vale o texto sem acento */
const chavePivo = n => { const t=normTxt(n).replace(/[^a-z0-9]+/g," ").trim().replace(/\b0+(\d)/g,"$1");
  const ds=t.match(/\d+/g); return ds?ds.join(" "):t; };
function pivosDa(fz){
  const lista=talhoesDa(fz).filter(t=>t.tipo!=="ARRENDADO" && normTxt(t.nome).includes("pivo"))
    .map(t=>({k:t.id,nome:t.nome,area:t.area}));
  const add=(k,nome)=>{ if(!lista.some(x=>chavePivo(x.nome)===chavePivo(nome))) lista.push({k,nome,area:0}); };
  pivosIcropDa(fz).forEach(nome=>add("ic:"+nome,nome));
  pivosLocaisDa(fz).forEach(p=>add(p.id,p.nome));
  return lista.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));
}
/* pivôs ainda não lançados no boletim (o do próprio cartão continua na lista dele) */
function pivosLivresDa(r,eAtual){
  const usados=(r.irg||[]).filter(e=>e!==eAtual&&e.k);
  return pivosDa(r.fazendaId).filter(p=>!usados.some(e=>e.k===p.k||chavePivo(e.nome||"")===chavePivo(p.nome)));
}
const irgDe = (r,id) => { r.irg=r.irg||[]; return r.irg.find(x=>x.id===id||x.k===id); };
const novoIrg = p => ({id:uid(), k:p?p.k:"", nome:p?p.nome:"",
  status:"",lamina:"",percent:"",quimi:"",quimiProdutos:[],problemas:[],obs:""});
/* boletins antigos guardavam a linha só pela chave do pivô; rascunhos da v44
   podem ter o mesmo pivô em dobro ("01" da iCrop + "Pivô 01" do talhão) */
function migrarIrg(r){
  r.irg=r.irg||[];
  r.irg.forEach(e=>{ if(!e.id) e.id=e.k||uid();
    /* religa a linha ao pivô oficial da lista (nome e área certos) */
    if(e.nome){ const p=pivosDa(r.fazendaId).find(x=>chavePivo(x.nome)===chavePivo(e.nome));
      if(p&&e.k!==p.k){ e.k=p.k; e.nome=p.nome; } } });
  /* mesmo pivô duas vezes: fica a linha que tem situação marcada */
  const chaveDe=e=>e.k?("k:"+chavePivo(e.nome||e.k)):("id:"+e.id);
  const melhor={};
  r.irg.forEach(e=>{ const c=chaveDe(e); if(!melhor[c]||(!melhor[c].status&&e.status)) melhor[c]=e; });
  r.irg=r.irg.filter(e=>melhor[chaveDe(e)]===e);
}
function icropMedidoPivo(b,nomePivo){
  const ic=icropDo(b.data,b.fazendaId); if(!ic) return null;
  const num=s=>{const m=/(\d+)/.exec(String(s||""));return m?parseInt(m[1],10):null;};
  const alvo=num(nomePivo);
  const eq=(ic.eqs||[]).find(e=>normTxt(e.nome)===normTxt(nomePivo))
    || (alvo!==null ? (ic.eqs||[]).find(e=>num(e.nome)===alvo) : null);
  if(!eq) return null;
  return {mm:eq.regadas.reduce((s,g)=>s+g.mm,0), regou:eq.regadas.length>0};
}
function cardIrg(r,e){
  /* ainda sem pivô escolhido: o mesmo seletor "Talhão / pivô" das Operações do dia */
  if(!e.k) return `<div class="subcartao" data-irg="${esc(e.id)}">
    <button class="fechar-sub" data-rm-irg="${esc(e.id)}">remover</button>
    <label>Talhão / pivô</label>
    <select data-igsel="${esc(e.id)}">${["<option value=''>Selecione…</option>",
      ...pivosLivresDa(r,e).map(p=>`<option value="${esc(p.k)}">${esc(p.nome)}${p.area?` — ${p.area} ha`:""}</option>`)].join("")}</select>
  </div>`;
  /* pivô escolhido: linha compacta (nome — área · situação), sem caixa de seleção */
  const p=pivosDa(r.fazendaId).find(x=>x.k===e.k);
  const nome=e.nome||(p?p.nome:talhao(e.k).nome), area=p?p.area:0;
  const med=icropMedidoPivo(r,nome);
  const fmtMm=v=>v.toLocaleString("pt-BR",{maximumFractionDigits:1});
  const rodou=e.status==="Rodou"||e.status==="Parcial";
  const prob=e.status==="Não rodou"||e.status==="Manutenção";
  return `<div class="mt" data-irg="${esc(e.id)}" style="border-top:1px dashed var(--linha);padding-top:10px;position:relative">
    <button class="fechar-sub" data-rm-irg="${esc(e.id)}" style="top:6px;right:0">remover</button>
    <b>${esc(nome)}</b>${area?` <span class="mut">— ${area} ha</span>`:""}
    ${(med&&med.regou)?` <span class="mut" style="font-size:.78rem">· iCrop mediu <b class="num">${fmtMm(med.mm)} mm</b></span>`:""}
    <div class="chips mt">${["Rodou","Parcial","Não rodou","Manutenção"].map(s=>`<button class="chip ${e.status===s?"on":""}" data-igst="${esc(e.id)}|${s}">${s}</button>`).join("")}</div>
    ${rodou?`<div class="grade2 mt">
      <div><label>Lâmina (mm)</label><input inputmode="decimal" data-ig="lamina" value="${esc(e.lamina||"")}" placeholder="${(med&&med.regou)?("iCrop: "+fmtMm(med.mm)):"Ex.: 6"}"></div>
      <div><label>Percentímetro (%)</label><input inputmode="decimal" data-ig="percent" value="${esc(e.percent||"")}" placeholder="Ex.: 50"></div>
    </div>
    <div class="chips mt"><button class="chip ${e.quimi==="Sim"?"on":""}" data-igqm="${esc(e.id)}">🧪 Quimigação / fertirrigação</button></div>
    ${e.quimi==="Sim"?linhasProdutos(e.quimiProdutos||[],"igp")+`<button class="btn suave mini mt" data-igp-add="${esc(e.id)}">＋ produto</button>`:""}`:""}
    ${prob?`<label class="mt">Qual foi o problema?</label>
      <div class="chips">${["Energia","Bomba","Torre / roda","Vazamento","Painel / automação","Outro"].map(p2=>`<button class="chip ${(e.problemas||[]).includes(p2)?"on":""}" data-igpb="${esc(e.id)}|${p2}">${p2}</button>`).join("")}</div>
      <input data-ig="obs" value="${esc(e.obs||"")}" placeholder="Detalhe rápido (opcional)" style="margin-top:8px">`:""}
  </div>`;
}
function topoIrgHtml(r){
  if(!pivosDa(r.fazendaId).length)
    return htmlEstado("vazio",{que:"pivô cadastrado",unidade:r.fazendaId,dica:"Cadastre abaixo. Fica guardado para os próximos dias."},{classe:"mut mt",estilo:"font-size:.78rem"});
  return `<p class="mut mt" style="font-size:.78rem">Toque em ＋, escolha o pivô na lista e marque a situação. Lâmina e quimigação aparecem quando ele rodou.</p>`
    +(pivosLivresDa(r,null).length?`<button class="btn suave mini mt" id="bt-add-todos-pivos">＋ adicionar todos os pivôs</button>`:"");
}

  return `<label class="mt">Cadastrar pivô desta fazenda</label>

      <button class="btn suave mini" id="bt-salvar-novo-pivo">salvar</button>
    </div>`;
}
function repintarIrg(r){
  const el=$("#lista-irg"); if(!el) return;
  migrarIrg(r);
  el.innerHTML=(r.irg||[]).map(e=>cardIrg(r,e)).join("");
  const topo=$("#topo-irg"); if(topo) topo.innerHTML=topoIrgHtml(r);
  const s=$("#res-irg");
  if(s){ const n=(r.irg||[]).filter(e=>e.status).length; s.textContent=n?n+" pivô"+(n>1?"s":"")+" lançado"+(n>1?"s":""):""; }
}
function secaoIrrigacaoGraos(r){
  migrarIrg(r);

  return `<details class="secao"><summary><span class="ico">💧</span>Irrigação (pivôs)

}

const selPastoLivre=(attr,campo,valor,fz)=>{
  const lista=pastosCadastrados(fz);
  const legado=(valor&&talhao(valor).nome!=="?")?talhao(valor).nome:null;
  const livre=(valor&&!legado&&lista.indexOf(valor)<0)?valor:null;
  return `<select data-${attr}="${campo}" data-pastosel>${[
    "<option value=''>Selecione…</option>",
    ...lista.map(nm=>`<option value="${esc(nm)}" ${valor===nm?"selected":""}>${esc(nm)}</option>`),
    legado?`<option value="${esc(valor)}" selected>${esc(legado)}</option>`:"",
    `<option value="__outro" ${livre?"selected":""}>Outro…</option>`
  ].join("")}</select><input data-${attr}="${campo}" data-pastotxt value="${esc(livre||"")}" placeholder="Nome do pasto" style="margin-top:8px;${livre?"":"display:none"}">`;
};

/* comprime a foto para caber no armazenamento (máx. ~800 px, JPEG) */
function comprimirFoto(arquivo){
  return new Promise(res=>{
    const img=new Image(), url=URL.createObjectURL(arquivo);
    img.onload=()=>{ const esc2=Math.min(1,800/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*esc2); cv.height=Math.round(img.height*esc2);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",.6)); };
    img.onerror=()=>res(null); img.src=url;
  });
}

  const t=new Date(iso); if(isNaN(t)) return "";
  const min=Math.round((Date.now()-t.getTime())/60000);
  if(min<2) return "agora há pouco";
  if(min<60) return "há "+min+" min";
  if(min<48*60) return "há "+Math.round(min/60)+" h";
  return "há "+Math.round(min/1440)+" dias"; };

  if(!podePainel()) return "";

      .sort((a,c)=>String(c.visto_em||"").localeCompare(String(a.visto_em||"")))[0];
    return {f, b, ap};
  });
  const n=linhas.filter(l=>l.b).length;
  const semAparelho=linhas.every(l=>!l.ap);
  /* v84: aparelho que sincronizou SEM unidade aberta não cabe em nenhuma linha da lista — e some.

  const soltos=chegadaCache.filter(x=>!x.unidade_id)
    .sort((a,c)=>String(c.visto_em||"").localeCompare(String(a.visto_em||"")));
  const corpo=linhas
    .sort((a,c)=>(a.b?1:0)-(c.b?1:0) || a.f.nome.localeCompare(c.f.nome))
    .map(l=>{
      const h=l.b?horaChegada(l.b):"";

}
function cartaoFarolBoletins(){
  const dias=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i);
    dias.push({ iso:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
      dom:d.getDay()===0 }); }
  const uteis=dias.filter(x=>!x.dom).length;
  const hoje=hojeISO(), ontem=dias[5].iso;
  const unidades=D.fazendas.filter(f=>!filtroPainel.atv || atividadeDe(f.id)===filtroPainel.atv);
  const linhas=unidades.map(f=>{
    let envUteis=0;
    const marcas=dias.map(x=>{
      if(boletimDoDia(x.iso,f.id)){ if(!x.dom) envUteis++; return "●"; }
      return x.dom?"–":"○";
    }).join(" ");
    const emDia=!!(boletimDoDia(hoje,f.id)||boletimDoDia(ontem,f.id));
    return {f, marcas, envUteis, emDia, mae:maeDe(f)};
  });
  /* agrupa as unidades pela fazenda física */
  const grupos={}, ordem=[];
  linhas.forEach(l=>{ const k=l.mae.id; if(!grupos[k]){ grupos[k]={mae:l.mae, uns:[]}; ordem.push(k); } grupos[k].uns.push(l); });
  const gs=ordem.map(k=>grupos[k]);
  gs.forEach(g=>{ g.min=Math.min(...g.uns.map(u=>u.envUteis)); g.soma=g.uns.reduce((s,u)=>s+u.envUteis,0);
    g.emDia=g.uns.every(u=>u.emDia); g.uns.sort((a,b)=>a.envUteis-b.envUteis); });
  gs.sort((a,b)=>a.min-b.min || (a.emDia===b.emDia?0:a.emDia?1:-1) || a.mae.nome.localeCompare(b.mae.nome));
  const emDiaQtd=linhas.filter(l=>l.emDia).length;
  const tudoEmDia=emDiaQtd===linhas.length;
  const linhaHtml=(rotulo,l,indent)=>`<div class="linha-flex" style="padding:5px 0${indent?"":";border-top:1px solid var(--linha)"};gap:8px${indent?";padding-left:14px":""}">
        <span class="cresce" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.emDia?rotulo:"<b>"+rotulo+"</b>"}</span>
        <span class="num" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;flex:none">${l.marcas}</span>
        <span class="num mut" style="flex:none;min-width:34px;text-align:right">${l.envUteis}/${uteis}</span></div>`;
  return `<details class="secao" ${tudoEmDia?"":"open"}><summary><span class="ico">📋</span>Boletins dos últimos 7 dias
      <span class="resumo">${emDiaQtd} de ${linhas.length} em dia</span><span class="seta">›</span></summary>
    <div class="corpo" style="font-size:.85rem">
      ${gs.map(g=>{
        if(g.uns.length===1) return linhaHtml(esc(g.uns[0].f.nome), g.uns[0], false);
        /* fazenda física com sublinhas por unidade; total soma as unidades */
        return `<div class="linha-flex" style="padding:5px 0;border-top:1px solid var(--linha);gap:8px">
          <span class="cresce">${g.emDia?esc(g.mae.nome):"<b>"+esc(g.mae.nome)+"</b>"}</span>
          <span class="num mut" style="flex:none">total ${g.soma}/${uteis*g.uns.length}</span></div>`+
          g.uns.map(u=>linhaHtml("· "+rotuloAtividade(atividadeDe(u.f.id)), u, true)).join("");
      }).join("")}
      <p class="mt" style="font-weight:700">${emDiaQtd} de ${linhas.length} unidades em dia <span class="mut" style="font-weight:400">(enviou ontem ou hoje)</span></p>
      <p class="mut" style="font-size:.72rem">● enviado · ○ sem registro · – domingo sem envio</p>
    </div></details>`;
}

/* ---------- Painel: grãos ontem por unidade (ha por operação, lâminas informado × medido,
   colheita acumulada do ciclo e alerta de monitoramento alto sem aplicação) ---------- */
function cartaoGraosPainel(){
  if(filtroPainel.atv&&filtroPainel.atv!=="GRAOS") return "";
  const ontem=ontemISO();
  const fmt1=v=>v.toLocaleString("pt-BR",{maximumFractionDigits:1});
  const blocos=D.fazendas.filter(f=>atividadeDe(f.id)==="GRAOS").map(f=>{
    const b=boletimDoDia(ontem,f.id);
    const linhas=[];
    if(b){
      const porCat={};
      (b.atividades||[]).forEach(a=>{ if(!a.gr||!a.tipo) return; const c=GRUPO_OP[opCatDe(a.tipo)]||"outras";
        porCat[c]=(porCat[c]||0)+n0(a.areaHa); });
      const ha=Object.entries(porCat).filter(([,v])=>v>0).map(([k,v])=>k+" "+fmt1(v)+" ha");
      if(ha.length) linhas.push("🚜 "+ha.join(" · "));
      const lam=(b.irg||[]).filter(e2=>e2.status).map(e2=>{
        const nome=e2.nome||talhao(e2.k).nome, med=icropMedidoPivo(b,nome), inf=n0(e2.lamina);
        return nome+": "+(inf?fmt1(inf)+" mm":e2.status.toLowerCase())+((med&&med.regou)?" (mediu "+fmt1(med.mm)+")":"");
      });
      if(lam.length) linhas.push("💧 "+lam.join(" · "));
    }
    const cols=[];
    talhoesAnuais(f.id).forEach(t=>{ const c=cicloAtivo(t.id); if(!c) return;
      let sacas=0, area=0;
      D.boletins.filter(x=>x.fazendaId===f.id&&x.data>=(c.plantio||"")).forEach(x=>(x.colheita||[]).forEach(cc=>{
        if(cc.talhaoId===t.id){ sacas+=n0(cc.sacas); area+=n0(cc.areaHa); } }));
      if(sacas) cols.push(t.nome+" ("+rotuloCultura(c.cultura)+"): "+Math.round(sacas).toLocaleString("pt-BR")+" sc"+(area?" · "+fmt1(sacas/area)+" sc/ha":""));
    });
    if(cols.length) linhas.push("⚖️ Ciclo: "+cols.join(" · "));
    const alertas=[];
    const d10=(()=>{const d2=new Date();d2.setDate(d2.getDate()-10);return d2.toISOString().slice(0,10);})();
    D.boletins.filter(x=>x.fazendaId===f.id&&x.data>=d10).forEach(x=>{
      const altos=[
        ...(x.atividades||[]).filter(a=>a.gr&&opCatDe(a.tipo)==="MONITORAMENTO"&&a.nivel==="Alto").map(a=>({tal:a.talhaoId,alvo:a.alvo})),
        ...(x.fito||[]).filter(ft=>ft.nivel==="Alto").map(ft=>({tal:ft.talhaoId,alvo:ft.nome}))];
      altos.forEach(al=>{
        const lim=(()=>{const d2=new Date(x.data+"T12:00:00");d2.setDate(d2.getDate()+3);return d2.toISOString().slice(0,10);})();
        if(lim>hojeISO()) return; /* prazo de 3 dias ainda correndo */
        const aplicou=D.boletins.some(y=>y.fazendaId===f.id&&y.data>x.data&&y.data<=lim
          &&(y.atividades||[]).some(a=>opCatDe(a.tipo)==="APLICACAO"&&(!al.tal||a.talhaoId===al.tal)));
        if(!aplicou) alertas.push((al.alvo||"alvo")+" nível ALTO em "+talhao(al.tal).nome+" ("+fmtDataCurta(x.data)+") sem aplicação nos 3 dias seguintes");
      });
    });
    if(alertas.length) linhas.push("🔴 "+[...new Set(alertas)].slice(0,3).join(" · "));
    if(!linhas.length) return "";
    return `<div class="mt" style="border-top:1px dashed var(--linha);padding-top:8px"><b>${esc(f.nome)}</b>${b?"":" <span class='mut' style='font-size:.78rem'>· sem boletim ontem</span>"}
      ${linhas.map(l=>`<p class="mut" style="font-size:.82rem;margin:3px 0">${esc(l)}</p>`).join("")}</div>`;
  }).filter(Boolean);
  if(!blocos.length) return "";
  return `<div class="cartao"><h3>🌾 Grãos — ontem por unidade</h3>${blocos.join("")}
    <p class="mut" style="font-size:.75rem;margin-top:6px">Hectares por operação, lâmina informado × medido (iCrop) e colheita acumulada do ciclo.</p></div>`;
}

/* v61: vazio da lista de boletins do painel — nomeia cada filtro ativo (atividade, unidade,
   operação, busca, período) e, com unidade escolhida, diz quando foi o último boletim dela */
function msgVazio(){
  const f=filtroPainel;
  const comFiltro=!!(f.atv||f.atividade||f.busca||f.fazenda||f.de||f.ate);
  const total=boletinsOrdenados().length;
  const ultimo=f.fazenda?(boletinsOrdenados().find(b=>b.fazendaId===f.fazenda)||{}).data:"";
  const o={que:"boletim", atividade:f.atv||"", operacao:f.atividade||"", unidade:f.fazenda||"", onde:f.fazenda?"":"nas unidades deste código",
    filtro:f.busca||"", periodo:periodoVazio(f.de,f.ate), ultimo:ultimo||""};
  if(comFiltro&&total) o.dicaHtml=`Existem ${total} boletim(ns) no total. <button class="btn suave mini" data-limpar-filtros="1" style="display:inline-flex;padding:2px 8px">limpar filtros</button>`;
  else if(!total) o.dica="Os boletins aparecem aqui depois do primeiro envio.";
  return htmlEstado("vazio",o,{tag:"li"});
}
function filtrarBoletins(){
  const f=filtroPainel, q=f.busca.toLowerCase();
  return boletinsOrdenados().filter(b=>{
    if(f.fazenda && b.fazendaId!==f.fazenda) return false;
    if(f.atv && atividadeDe(b.fazendaId)!==f.atv) return false;
    if(f.de && b.data<f.de) return false;
    if(f.ate && b.data>f.ate) return false;
    if(f.atividade && !(b.atividades||[]).some(a=>nomeAtual(a.tipo)===nomeAtual(f.atividade))) return false;
    if(q){
      const txt = JSON.stringify(b).toLowerCase();
      if(!txt.includes(q)) return false;
    }
    return true;
  });
}

function ontemISO(){ const d=new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
let xlsxPronto=null;
function carregarXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxPronto) return xlsxPronto;
  xlsxPronto=new Promise((ok,erro)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=()=>ok(); s.onerror=()=>{ xlsxPronto=null; erro(); };
    document.head.appendChild(s);
  });
  return xlsxPronto;
}
function impLerTexto(txt){
  const grade=separarCSV(txt);
  if(grade.length<2){ avisoInline("#imp-ler", "Não achei linhas na tabela. Confira o arquivo ou o que colou."); return; }
  /* exports reais vêm com linhas de enfeite antes do cabeçalho — acha a linha com mais células preenchidas */
  let iCab=0, melhor=0;
  for(let i=0;i<Math.min(grade.length,8);i++){
    const cheias=grade[i].filter(c=>c!=="").length;
    if(cheias>melhor){ melhor=cheias; iCab=i; }
  }
  impEstado={ fonte:(impEstado?impEstado.fonte:"solinftec"), cab:grade[iCab], linhas:grade.slice(iCab+1).filter(l=>l.some(c=>c!=="")), mapa:{}, semMaq:[], semTal:[], resultado:"" };
  ir("importar");
}
/* v72: pré-condições visíveis do "3 · Importar" (selects de coluna e data do arquivo) — botão de avanço; o mapa salvo da
   última vez conta como escolhido */
function faltaImportar(e){
  if(!e||!e.cab) return "";
  const campos=CAMPOS_IMPORT[e.fonte], salvo=(D.mapaImport||{})[e.fonte]||{};
  const tem=k=>(e.mapa[k]!==undefined&&e.mapa[k]!=="") || e.cab.indexOf(salvo[k])>=0;
  for(const [k,rot,obrig] of campos){ if(obrig&&!tem(k)) return "Diga qual coluna é: "+rot; }
  const diaEl=document.getElementById("imp-dia"), dia=diaEl?diaEl.value:(e.dia||ontemISO());
  if(e.fonte==="solinftec" && !tem("data") && !dia) return "Informe de que dia é o arquivo";
  return "";
}
function faltaLerArquivo(){
  const arq=document.getElementById("imp-arq"), cola=document.getElementById("imp-cola");
  return ((arq&&arq.files&&arq.files.length) || (cola&&cola.value.trim())) ? "" : "Escolha o arquivo ou cole a tabela";
}
function impRodar(){
  const e=impEstado; if(!e) return;
  const campos=CAMPOS_IMPORT[e.fonte];
  /* aproveita o mapa salvo da última vez para o que o usuário não mexeu */
  const salvo=(D.mapaImport||{})[e.fonte]||{};
  campos.forEach(([k])=>{ if(e.mapa[k]===undefined){ const i=e.cab.indexOf(salvo[k]); if(i>=0) e.mapa[k]=String(i); } });
  const diaEl=document.getElementById("imp-dia"); e.dia=diaEl?diaEl.value:(e.dia||ontemISO());
  const falta=faltaImportar(e); if(falta){ atualizarAvanco("imp-rodar", falta); return; }
  D.mapaImport=D.mapaImport||{}; D.mapaImport[e.fonte]={};
  campos.forEach(([k])=>{ if(e.mapa[k]!==undefined&&e.mapa[k]!=="") D.mapaImport[e.fonte][k]=e.cab[e.mapa[k]]; });
  const col=k=>e.mapa[k]!==undefined&&e.mapa[k]!==""?+e.mapa[k]:null;
  const porDia={}; const semMaq=new Set(), semTal=new Set(); let lidas=0, semData=0, semHora=0;
  const arred=v=>Math.round(v*100)/100;
  e.linhas.forEach(L=>{
    const data=(col("data")!==null?dataNorm(L[col("data")]):"")||e.dia||"";
    if(!data){ semData++; return; }
    const linha={};
    if(e.fonte==="solinftec"){
      linha.origemNome=L[col("maquina")]||"";
      linha.maquinaId=acharMaquina(linha.origemNome); if(!linha.maquinaId&&linha.origemNome) semMaq.add(linha.origemNome);
      linha.horasTrab=arred(n0(L[col("horasTrab")]));
      if(col("horasMotor")!==null) linha.horasMotor=arred(n0(L[col("horasMotor")]));
      if(col("ocioso")!==null) linha.ocioso=arred(n0(L[col("ocioso")]));
      if(col("processo")!==null) linha.processo=String(L[col("processo")]||"").trim();
      if(col("operador")!==null){ const op=String(L[col("operador")]||"").trim(); if(op&&!/não definido/i.test(op)) linha.operador=op; }
      if(col("comb")!==null) linha.comb=arred(n0(L[col("comb")]));
      if(col("talhao")!==null){ linha.setorNome=L[col("talhao")]||""; linha.talhaoId=acharTalhao(linha.setorNome); if(linha.setorNome&&!linha.talhaoId) semTal.add(linha.setorNome); }
      if(!(linha.horasTrab>0)&&!(linha.horasMotor>0)&&!(linha.ocioso>0)){ semHora++; return; } /* linha vazia da telemetria: ignora */
    }else{
      linha.setorNome=L[col("setor")]||"";
      linha.talhaoId=acharTalhao(linha.setorNome); if(linha.setorNome&&!linha.talhaoId) semTal.add(linha.setorNome);
      linha.lamina=n0(L[col("lamina")]);
      if(!(linha.lamina>0)) { semHora++; return; }
    }
    (porDia[data]=porDia[data]||[]).push(linha); lidas++;
  });
  D.telemetria=D.telemetria||[];
  Object.entries(porDia).forEach(([data,linhas])=>{
    const id="tel-"+e.fonte+"-"+data;
    const i=D.telemetria.findIndex(x=>x.id===id);
    const reg={id, fonte:e.fonte, data, linhas, atualizado:Date.now()};
    if(i>=0) D.telemetria[i]=reg; else D.telemetria.push(reg);
    syncEnfileirar('t', id);
  });
  e.semMaq=[...semMaq]; e.semTal=[...semTal];
  e.resultado="✅ "+lidas+" linha(s) importadas em "+Object.keys(porDia).length+" dia(s)."+(semHora?" ("+semHora+" linha(s) zeradas ignoradas)":"")+(semData?" ("+semData+" sem data, ignoradas)":"");
  salvarDados(); ir("importar");
}

function cadResultadosBusca(q){

/* cliques da área de Cadastros — devolve true quando tratou */
function cadClique(t,d){
  if(d.cadvoltar!==undefined){ if(telaAtual==="cadastros") cadVoltar(); else ir("cadastros"); return true; }
  if(d.cadv!==undefined){
    const v=d.cadv, id=d.cadid||"";
    if(v==="unidplano"){ upEstado.dados=null; upEstado.erro=""; ir("unidplano"); upRecarregar(); return true; }
    if(v==="abrir"){ window.open(id,"_blank"); return true; }
    if(v==="talhoes" && id){ cadIr({v:"talhoes"}); cadUI.filtro=id; cadRender(); return true; }
    if(v==="maquinas"||v==="insumos"){ cadIr({v}); if(t.closest("#app") && cadUI.busca){ cadUI.filtro=cadUI.busca; cadRender(); } return true; }
    if(v==="codigonovo"){ novoCombo={ativs:[],unis:[]}; cadIr({v}); return true; }
    cadIr(id?{v,id}:{v}); return true;
  }
  if(d.cadsaltos!==undefined){ cadUI.saltos=true; cadRender(); return true; }
  if(d.cadsalto!==undefined){ cadUI.filtro=d.cadsalto; cadRender(); return true; }
  if(d.cadnovo!==undefined){ cadUI.novo=d.cadnovo; cadUI.confirma=""; if(cadAtual().v==="lote") cadUI.zona=true; cadRender(); return true; }
  if(d.cadcancel!==undefined){ cadUI.novo=""; cadUI.confirma=""; cadRender(); return true; }
  if(d.cadpede!==undefined){ const chave=d.cadpede, tipo=chave.slice(0,chave.indexOf(":")>=0?chave.indexOf(":"):chave.length);
    perguntar({pergunta:d.pergunta||"", sim:CAD_VERBO[tipo]||"Continuar", nao:"Cancelar", destaque:false}).then(ok=>{ if(ok) cadOk(chave); }); return true; }
  if(d.cadchip!==undefined){ const [k,v]=d.cadchip.split(":"); cadUI.form=cadUI.form||{}; cadUI.form[k]=(k==="mes")?parseInt(v):(cadUI.form[k]===v?"":v); if(k==="mes") cadUI.filtro=""; cadRender(); return true; }
  if(d.cadok!==undefined){ cadOk(d.cadok); return true; }
  if(d.cadacao!==undefined){ cadAcao(d.cadacao,d.cadid||""); return true; }
  return false;
}
function cadOk(chave){
  const [tipo,resto]=[chave.slice(0,chave.indexOf(":")>=0?chave.indexOf(":"):chave.length), chave.slice(chave.indexOf(":")+1)];
  cadUI.confirma="";
  if(tipo==="rm-talhao"){ D.talhoes=D.talhoes.filter(x=>x.id!==resto); salvarDados(); cadSalvo("","Talhão removido"); cadVoltar(); return; }
  if(tipo==="rm-pivo"){ const [fz,pid]=resto.split(":"); D.pivosLocais=D.pivosLocais||{}; D.pivosLocais[fz]=(D.pivosLocais[fz]||[]).filter(p=>p.id!==pid); salvarDados(); cadSalvo("","Pivô removido"); cadVoltar(); return; }
  if(tipo==="rm-maq"){ D.maquinas=D.maquinas.filter(x=>x.id!==resto); salvarDados(); cadSalvo("","Máquina removida"); cadRender(); return; }
  if(tipo==="rm-ins"){ D.insumos=D.insumos.filter(x=>x.id!==resto); salvarDados(); cadSalvo("","Insumo removido"); cadRender(); return; }
  if(tipo==="rm-termo"){ const i=resto.indexOf("|"); catExtraRm(resto.slice(0,i),resto.slice(i+1)); cadSalvo("","Termo removido"); cadRender(); return; }
  if(tipo==="enc-ciclo"){ const c=(D.ciclos||[]).find(x=>x.id===resto); if(c){ c.encerradoEm=hojeISO(); salvarDados(); } cadSalvo("ciclo:"+(c?c.talhaoId:""),"Colheita encerrada"); cadVoltar(); return; }
  if(tipo==="novo-cod"){ const novo=gerarNovoCodigo(resto); cadUI.form={novoCodigo:novo}; cadUI.zona=false; cadSalvo("","Novo código gerado"); cadRender(); return; }
  if(tipo==="desmembrar"){ const f=D.fazendas.find(x=>x.id===resto), atv=cadVal("novaAtv"); if(!f||!atv){ cadUI.msg="Escolha a atividade da nova unidade."; cadUI.zona=true; cadRender(); return; }
    const mae=maeDe(f); const base=(mae.id||f.id).replace(/[cgp]$/,""); let novoId=base+({CAFE:"c",GRAOS:"g",PECUARIA:"p"}[atv]); let n=2; while(D.fazendas.some(x=>x.id===novoId)) novoId=base+({CAFE:"c",GRAOS:"g",PECUARIA:"p"}[atv])+(n++);
    const nova={id:novoId, nome:mae.nome+" — "+ROTULO_CULT[atv], municipio:f.municipio||"", perfil:[atv], fazendaMae:{id:mae.id, nome:mae.nome}, entidade:f.entidade||""};
    if(!f.fazendaMae) f.fazendaMae={id:mae.id, nome:mae.nome};
    D.fazendas.push(nova); salvarDados(); cadSalvo("fazenda:"+novoId,"Unidade irmã criada"); cadNav.pop(); cadNav.push({v:"fazenda",id:novoId}); ir("cadastros"); return; }
  if(tipo==="unificar"){ const f=D.fazendas.find(x=>x.id===resto), alvo=D.fazendas.find(x=>x.id===cadVal("alvoUnif")); if(!f||!alvo) return;
    D.talhoes.forEach(t=>{ if(t.fazendaId===f.id){ t.fazendaId=alvo.id; t.tipo=tipoPeloPerfil(t.nome, perfilDe(alvo.id)); } });
    f.inativa=true; salvarDados(); cadSalvo("fazenda:"+alvo.id,"Unificada em "+alvo.nome); cadVoltar(); return; }
  if(tipo==="limpar-teste"){ D.boletins=(D.boletins||[]).filter(b=>!b.exemplo); D.posColheitas=(D.posColheitas||[]).filter(p=>!p.exemplo); salvarDados(); cadSalvo("","Dados de teste apagados"); cadRender(); return; }
}
function cadAcao(acao,id){
  if(acao==="salvar-fazenda"){ const f=D.fazendas.find(x=>x.id===id); if(!f) return;
    const nome=cadVal("nome"); if(!nome){ cadUI.msg="O nome não pode ficar vazio."; cadRender(); return; }
    const perfilNovo=cadVal("perfil").split(",").filter(Boolean), mudouPerfil=perfilNovo.join(",")!==perfilDe(f.id).join(",");
    f.nome=nome; f.entidade=cadVal("entidade"); f.municipio=cadVal("municipio"); f.inativa=cadVal("ativa")==="0";
    if(perfilNovo.length){ f.perfil=perfilNovo; if(mudouPerfil) talhoesDa(f.id).forEach(t=>{ t.tipo=tipoPeloPerfil(t.nome, f.perfil); }); }
    salvarDados(); cadSalvo("fazenda:"+f.id); cadVoltar(); return; }
  if(acao==="salvar-talhao"){ const nome=cadVal("nome"), pref=cadVal("prefixo"); if(!nome){ cadUI.msg="Dê um nome ao talhão."; cadRender(); return; }
    const nomeFinal=pref?pref+" — "+nome:nome, fz=cadVal("fazendaId")||null, tipo=cadVal("tipo");
    let t; if(id==="novo"){ t={id:uid(), nome:nomeFinal, area:n0(cadVal("area")), fazendaId:fz}; D.talhoes.push(t); } else { t=D.talhoes.find(x=>x.id===id); if(!t) return; t.nome=nomeFinal; t.area=n0(cadVal("area")); t.fazendaId=fz; }
    t.tipo=tipo||tipoPeloPerfil(t.nome, fz?perfilDe(fz):["CAFE"]);
    salvarDados(); cadSalvo("talhao:"+t.id, id==="novo"?"Talhão criado":"Salvo"); if(id==="novo"){ cadNav.pop(); ir("cadastros"); } else cadVoltar(); return; }

    +cadRodape(`<button class="btn" data-planv="nova">＋ tarefa</button>`);
}

/* ---- rodadas da reunião (3.1) ---- */
function planVRodadas(){
  const ls=planRodadas().slice().sort((a,b)=>a.ref<b.ref?1:-1);
  const ref=planMesDe(hojeBRT()), falta=!planRodadaDoMes(ref) && parseInt(hojeBRT().slice(8),10)>=PLAN_DIA_REUNIAO;
  return planTopo("Rodadas da reunião", ls.length+" rodada(s)")
    +(falta?`<div class="aviso">A rodada de ${esc(planMesNome(ref))} ainda não foi importada. A ata da reunião entra colando o texto — o app mostra item a item antes de gravar.</div>`:"")
    +(ls.length?ls.map(r=>{ const ts=planTarefas().filter(t=>t.origemId===r.id);
        const fim=ts.filter(t=>t.status==="finalizado").length;
        return cadItem("rodada",r.id,esc(r.nome), ts.length+" tarefa(s) · "+fim+" finalizada(s)"+(r.importadoEm?" · importada em "+esc(fmtData(r.importadoEm)):""), planMesRot(r.ref)); }).join("")
      :planVazio("rodada da reunião"))
    +cadRodape(`<button class="btn" data-planv="importar">📥 Importar ata</button>`);
}
function planVRodada(id){
  const r=planRodadas().find(x=>x.id===id);
  if(!r) return planTopo("Rodada")+`<p class="mut">Rodada não encontrada.</p>`;
  const ts=planTarefas().filter(t=>t.origemId===r.id && t.tipoItem==="tarefa" && (!t.unidade||podeVer(t.unidade)));
  const uns=[...new Set(ts.map(t=>t.unidade).filter(Boolean))];
  return planTopo(r.nome, planMesRot(r.ref)+" · fechamento por unidade")
    +planBusca("Buscar tarefa ou unidade…")
    +(uns.length?uns.map(fz=>{ const g=ts.filter(t=>t.unidade===fz && planBate(t));
        if(!g.length) return "";
        const fim=g.filter(t=>t.status==="finalizado").length, atr=g.filter(planAtrasada).length;
        const trv=g.filter(planPausada).length, arr=g.filter(t=>planArrastaMeses(t)>0).length;
        const pct=g.length?Math.round(fim*100/g.length):0;
        const meta=g.filter(x=>x.status!=="cancelado").reduce((a,x)=>a+planMeta(x),0);
        const exec=g.filter(x=>x.status!=="cancelado").reduce((a,x)=>a+(planMeta(x)?Math.min(planExecucao(x).ha,planMeta(x)):0),0);
        const semL=g.filter(x=>x.status!=="cancelado" && planExecucao(x).n===0);
        const fora=planForaDoPlano(fz, r.ref);
        return `<div class="cartao"><div class="linha-flex" style="gap:8px"><b class="cresce">${esc(fazenda(fz).nome)}</b><span class="num plan-pct">${pct}%</span></div>
          <div class="plan-barra" role="img" aria-label="${pct}% concluído"><span style="width:${pct}%"></span></div>
          <p class="mut" style="margin:6px 0 0">${fim} de ${g.length} finalizadas · ${atr} atrasada(s) · ${trv} travada(s) · ${arr} arrastada(s)</p>
          <p class="mut plan-num" style="margin:4px 0 0">${meta?`plano executado <b class="num">${Math.min(100,Math.round(exec*100/meta))}%</b> em área (${esc(planHa(exec))} de ${esc(planHa(meta))} ha)`:"sem meta em ha nas tarefas desta rodada"}
            ${fora.total?` · esforço fora do plano <b class="num">${fora.pct}%</b> (${fora.fora} de ${fora.total} lançamentos)`:""}</p>
          ${semL.length?`<p class="mut plan-num" style="margin:2px 0 0">Sem nenhum lançamento casado: ${esc(semL.map(x=>x.desc).slice(0,3).join(" · "))}${semL.length>3?" · ＋"+(semL.length-3):""}</p>`:""}
          ${g.map(t=>planLinhaTarefa(t)).join("")}</div>`; }).join("")
      :planVazio("tarefa nesta rodada"))
    +cadRodape(`<button class="btn sec" data-plan-copia="fechamento|${esc(r.id)}">📲 copiar fechamento do mês</button>`);
}

/* ---- revisão das arrastadas: primeira tela de toda rodada nova ---- */

  const rv=planUI.revisao;
  if(!rv) return planVRodadas();
  const ls=rv.ids.map(planTarefa).filter(Boolean);
  const pend=ls.filter(t=>!rv.decidido[t.id]).length;
  return planTopo("Revisão das arrastadas", ls.length+" tarefa(s) da rodada anterior")
    +`<div class="aviso">Antes de importar a ata nova, o que ficou aberto na rodada anterior chega marcado como <b>arrastada</b>. Manter, repactuar ou cancelar — um toque em cada.${pend?" Faltam "+pend+".":""}</div>`
    +planBusca("Buscar tarefa ou unidade…")
    +ls.filter(planBate).map(t=>{ const dec=rv.decidido[t.id]||"";
      return `<div class="cartao">
        <b>${PLAN_FAROL[planFarol(t)].ico} ${esc(t.desc)}</b>
        <p class="mut" style="margin:2px 0 8px">${esc(t.unidade?fazenda(t.unidade).nome:(t.unidadeTexto||"Grupo"))} · ${esc(planLinhaTexto(t))} · arrastada há ${planArrastaMeses(t)+1} reuni${planArrastaMeses(t)+1===1?"ão":"ões"}</p>
        <div class="chips">
          <button class="chip ${dec==="manter"?"on":""}" data-plan-rev="${t.id}|manter">Manter</button>
          <button class="chip ${dec==="repactuar"?"on":""}" data-plan-rev="${t.id}|repactuar">Repactuar</button>
          <button class="chip ${dec==="cancelar"?"on":""}" data-plan-rev="${t.id}|cancelar">Cancelar</button></div>
        ${dec==="repactuar"?`<label class="mt">Novo prazo</label>
          <div class="chips">${PLAN_NOVOS_PRAZOS.map(p=>`<button class="chip ${(rv.prazo[t.id]===p.id)?"on":""}" data-plan-revprazo="${t.id}|${p.id}">${esc(p.rot)}</button>`).join("")}</div>
          <label class="mt">Motivo</label>
          <div class="chips">${PLAN_MOTIVOS_TRAVA.map(m=>`<button class="chip ${(rv.motivo[t.id]===m.id)?"on":""}" data-plan-revmot="${t.id}|${m.id}">${esc(m.rot)}</button>`).join("")}</div>`:""}
        ${dec==="cancelar"?`<label class="mt">Motivo do cancelamento</label>
          <div class="chips">${PLAN_MOTIVOS_TRAVA.map(m=>`<button class="chip ${(rv.motivo[t.id]===m.id)?"on":""}" data-plan-revmot="${t.id}|${m.id}">${esc(m.rot)}</button>`).join("")}</div>`:""}
      </div>`; }).join("")
    +cadRodape(botaoAvanco("bt-plan-revok",{rotulo:"Aplicar e ir para a ata", falta: pend?("Responda as "+pend+" tarefa(s) que faltam"):""}));

  const a=planUI.ata;
  if(!a) return planTopo("Importar ata","cole o texto da reunião")
    +`<div class="cartao">
      <label>Nome da rodada</label>

      <p class="mut" style="font-size:.78rem;margin-top:6px">O app lê os blocos por fazenda ("2.1 – Vereda"), cada linha iniciada por "-" vira uma tarefa, e mostra tudo para conferir antes de gravar. Fazenda fora do escopo é ignorada sem perguntar.</p>
    </div>`
    +cadRodape(`<button class="btn" id="bt-plan-ler">Ler a ata</button>`);
  const naoRec=a.itens.filter(it=>it.incluir!==false && it.tipoItem==="tarefa" && !it.unidade).length;

  return planTopo("Conferir a ata", vao+" item(ns) para gravar")
    +planBusca("Buscar item da ata…")
    +(a.fora.length?`<div class="aviso">Fora do escopo, ignoradas sem perguntar: ${esc(a.fora.join(" · "))}.</div>`:"")
    +(naoRec?`<div class="aviso">${naoRec} item(ns) sem unidade reconhecida. Escolha a unidade ou deixe de fora.</div>`:"")
    +a.blocos.map(b=>{ const its=a.itens.filter(it=>it.unidadeTexto===b.nome && bate(it));
        if(!its.length) return "";
        return `<div class="cad-grupo">${esc(b.nome)}${b.unidade?" › "+esc(fazenda(b.unidade).nome):" · unidade não reconhecida"} · ${its.length}</div>`
          +its.map(it=>planAtaLinha(a.itens.indexOf(it),it,"itens")).join(""); }).join("")
    +(a.gerais.filter(bate).length?`<div class="cad-grupo">🗒️ Assuntos gerais e investimentos · ${a.gerais.filter(bate).length}</div>`
        +a.gerais.filter(bate).map(it=>planAtaLinha(a.gerais.indexOf(it),it,"gerais")).join(""):"")
    +cadRodape(`<div class="linha-flex" style="gap:8px"><button class="btn sec" id="bt-plan-ata-limpar">Recomeçar</button>
      ${botaoAvanco("bt-plan-ata-ok",{rotulo:"Gravar "+vao+" item(ns)", falta: vao?"":"Deixe pelo menos um item marcado"})}</div>`);
}

  const sub=[it.unidade?fazenda(it.unidade).nome:(it.tipoItem==="tarefa"?"unidade não reconhecida":PLAN_TIPOS_ITEM[it.tipoItem]),
    it.prazo?"prazo "+fmtDataCurta(it.prazo):"sem prazo", n0(it.area)?n0(it.area)+" ha":"",
    planStatusRot(it.status).toLowerCase(), it.responsavel?"com "+it.responsavel:"",
    (it.bloqueio&&it.bloqueio.quem)?"cobrar "+it.bloqueio.quem:""].filter(Boolean).join(" · ");
  return `<div class="plan-linha${fora?" fora":""}">
    <div class="cad-item" style="margin:0">

          ${uns.map(f=>`<option value="${f.id}" ${it.unidade===f.id?"selected":""}>${esc(f.nome)}</option>`).join("")}</select>

        <label>Prazo</label><input type="date" data-planata="${lista}|${i}|prazo" value="${esc(it.prazo)}">

      <label>Status</label><div class="chips">${PLAN_STATUS.filter(s=>s.id!=="cancelado").map(s=>`<button class="chip ${it.status===s.id?"on":""}" data-plan-atast="${lista}|${i}|${s.id}">${esc(s.rot)}</button>`).join("")}</div>
      <p class="mut" style="font-size:.74rem;margin-top:8px">Linha da ata: ${esc(it.bruto)}</p>

/* ---- (3.2) semana ---- */

  const s=planSemanaAtual() || planSemanaCriar(planSegundaDe(hojeBRT()));
  const ant=planSemanaAnterior(), fech=ant?planFecharSemana(ant):null;
  const comp=planComprometidas(s.id).sort(planOrdenar);

  const novas=planTarefas().filter(t=>t.origemTipo==="semana" && t.origemId===s.id);
  return planTopo(planSemanaRot(s), comp.length+" tarefa"+(comp.length===1?"":"s")+" assumida"+(comp.length===1?"":"s"))
    +(fech&&fech.n?`<div class="cartao plan-fecha"><b>Como foi ${esc(planSemanaRot(ant).toLowerCase())}</b>
      <p class="mut" style="margin:2px 0 6px">${esc(fech.placar)} · ${fech.travadas.length} travada(s)</p>
      ${fech.concluidas.map(t=>`<p class="plan-fecha-l">✅ ${esc(t.desc)}</p>`).join("")}
      ${fech.travadas.map(t=>`<p class="plan-fecha-l">⏸️ ${esc(t.desc)} <span class="mut">· ${esc((t.bloqueio&&t.bloqueio.texto)||planStatusRot(t.status).toLowerCase())}${(t.bloqueio&&t.bloqueio.quem)?" ("+esc(t.bloqueio.quem)+")":""}</span></p>`).join("")}
      ${fech.abertas.map(t=>`<p class="plan-fecha-l">◻ ${esc(t.desc)} <span class="mut">· ${esc(planLinhaTexto(t))}</span></p>`).join("")}</div>`:"")
    +`<div class="cad-grupo">Parte A · tarefas assumidas nesta semana</div>`
    +(comp.length?comp.map(t=>planLinhaTarefa(t)).join("")
      :`<p class="mut centro" style="padding:8px 0">Nenhuma tarefa assumida ainda. Toque em "assumir" nas sugestões abaixo.</p>`)
    +(sug.length?`<div class="cad-grupo">Sugestões — prazo próximo, atrasadas e recém-destravadas</div>`
        +sug.map(t=>`<div class="cad-item"><button class="plan-farol" data-tar="${t.id}" aria-label="Abrir ${esc(t.desc)}">${PLAN_FAROL[planFarol(t)].ico}</button>
          <span class="cresce"><b>${esc(t.desc)}</b><span class="mut">${esc(t.unidade?fazenda(t.unidade).nome:"Grupo")} · ${esc(planLinhaTexto(t))}${t.destravadaEm?" · destravada":""}</span></span>
          <button class="chip plan-comp" data-plan-comp="${t.id}|${s.id}">assumir</button></div>`).join("")
      :"")
    +`<div class="cad-grupo">Parte B · tarefas novas da semana</div>`
    +(novas.length?novas.map(t=>planLinhaTarefa(t)).join(""):`<p class="mut centro" style="padding:8px 0">Nenhuma tarefa nova nesta semana.</p>`)
    +`<button class="btn suave mt" data-plan-novasem="${s.id}">＋ tarefa da semana</button>`
    +cadRodape(`<button class="btn sec" data-plan-copia="pauta|">📲 copiar pauta da sexta</button>`);
}

  if(tipo==="ata"){
    const ref=planMesDe(hojeBRT());
    return planTopo("Importar a ata da reunião", planMesNome(ref).replace(/^./,c=>c.toUpperCase())+" · rodada não importada")
      +`<div class="cartao"><b>A rodada de ${esc(planMesNome(ref))} ainda não entrou.</b>

  }
  const s=planSemanaAtual(), prox=planSemanaProxima()||planSemanaAtual();

  return planTopo("Fechar a semana e planejar a próxima","sexta-feira · dois toques resolvem")
    +`<div class="plan-duas">

            <span class="chips"><button class="chip mini" data-plan-st="${t.id}|finalizado">Concluí</button>

          :`<p class="mut">Nenhuma tarefa assumida na semana que passou.</p>`}</div>
      <div class="cartao"><b>Sugestões para ${esc(planSemanaRot(prox).toLowerCase())}</b>
        ${(prox?planSugestoesSemana(prox.id).slice(0,6):[]).map(t=>`<div class="plan-fecha-l"><span>${PLAN_FAROL[planFarol(t)].ico} ${esc(t.desc)}</span>

    +cadRodape(`<div class="linha-flex" style="gap:8px"><button class="btn sec" id="bt-plan-ritual-pular">Pular por agora</button>

}

/* ---- (item 4) executado FORA do plano: a outra metade da história ----
   O que foi lançado no boletim e não casou com nenhuma tarefa da ata. Não é cobrança:
   é o que apareceu no dia. Por unidade, no mês corrente. */
function planVFora(id){
  const ref=planMesDe(hojeBRT());
  const uns=(id?[fazenda(id)]:unidadesPermitidas()).filter(f=>f && f.id)
    .map(f=>({f, r:planForaDoPlano(f.id, ref)}))
    .filter(x=>x.r.total>0)
    .sort((a,b)=>(b.r.fora-a.r.fora)||((b.r.pct||0)-(a.r.pct||0)));
  const tot=uns.reduce((a,x)=>a+x.r.total,0), fora=uns.reduce((a,x)=>a+x.r.fora,0);
  return planTopo("Executado fora do plano", planMesRot(ref)+(tot?" · "+fora+" de "+tot+" lançamentos":""))
    +`<div class="aviso">O que o boletim registrou e não casou com nenhuma tarefa da ata. <b>Não é cobrança</b> — é a outra metade da história: o que apareceu no dia e não estava planejado. Serve para a ata do mês que vem.</div>`
    +(uns.length?uns.map(({f,r})=>`<div class="cartao">
        <div class="linha-flex" style="gap:8px"><b class="cresce">${esc(f.nome)}</b><span class="num plan-pct">${r.pct}%</span></div>
        <div class="plan-barra" role="img" aria-label="${r.pct}% dos lançamentos fora do plano"><span class="fora" style="width:${r.pct}%"></span></div>
        <p class="mut plan-num" style="margin:6px 0 0">${r.fora} de ${r.total} lançamentos fora do plano${r.pessoasTotal?` · ${r.pessoasFora} de ${r.pessoasTotal} pessoas-dia`:""}</p>
        ${r.grupos.length?`<ul class="lista-limpa mt">${r.grupos.slice(0,8).map(g=>`<li class="linha-flex">
          <span class="cresce">${badgeCategoria(atividadeDe(f.id),{nome:g.op})}${esc(nomeAtual(g.op))}<span class="mut"> · ${g.n} lançamento${g.n>1?"s":""}${g.locais?" em "+g.locais+" "+(g.locais===1?"local":"locais"):""}${g.ha?" · "+planHa(g.ha)+" ha":""} · último ${esc(fmtDataCurta(g.ultimo))}</span></span></li>`).join("")}</ul>
          ${r.grupos.length>8?`<p class="mut" style="font-size:.78rem;margin:4px 0 0">＋${r.grupos.length-8} operação(ões)</p>`:""}`
          :`<p class="mut mt">Tudo o que foi lançado no mês casou com alguma tarefa da ata.</p>`}
      </div>`).join("")
      :planVazio("lançamento no boletim",{periodo:"em "+planMesRot(ref)}))
    +`<p class="mut" style="font-size:.74rem;margin-top:10px">Fonte: os boletins das unidades deste código. Um lançamento é talhão × operação × dia; o de-para descrição → operação está em docs/catalogos-por-atividade.md.</p>`
    +cadRodape(`<button class="btn sec" data-plan-copia="fora|">📲 copiar para a próxima ata</button>`);
}

/* ---- (11) saídas prontas: texto montado do que já está no app, sem ferramenta externa ---- */
const planNomeUn = t => t.unidade ? fazenda(t.unidade).nome : (t.unidadeTexto||"Grupo");
function planTextoPauta(){
  const ls=planVisiveis().filter(t=>planAberta(t)&&t.tipoItem==="tarefa");
  const venc=ls.filter(planAtrasada), sete=ls.filter(t=>!planAtrasada(t)&&["vermelho","amarelo"].includes(planFarol(t))), trav=ls.filter(planPausada);
  const porFaz=lista=>{ const m={};
    lista.forEach(t=>{ const k=planNomeUn(t); (m[k]=m[k]||[]).push(t); });
    return Object.keys(m).sort((a,b)=>a.localeCompare(b,"pt-BR")).map(k=>k+":\n"+m[k].map(t=>"  - "+t.desc+" ("+planLinhaTexto(t)+(t.responsavel?" · "+t.responsavel:"")+")").join("\n")).join("\n"); };
  const L=["📋 Pauta da sexta — "+fmtData(hojeBRT()),""];
  L.push("VENCIDAS ("+venc.length+")"); L.push(venc.length?porFaz(venc):"  nenhuma");
  L.push(""); L.push("VENCENDO EM ATÉ 7 DIAS ("+sete.length+")"); L.push(sete.length?porFaz(sete):"  nenhuma");
  L.push(""); L.push("TRAVADAS ("+trav.length+")");
  L.push(trav.length?trav.map(t=>"  - "+planNomeUn(t)+" · "+t.desc+" — "+((t.bloqueio&&t.bloqueio.texto)||planStatusRot(t.status).toLowerCase())+((t.bloqueio&&t.bloqueio.quem)?" ("+t.bloqueio.quem+")":"")+" há "+planTravadaDias(t)+" dias").join("\n"):"  nenhuma");
  return L.join("\n");
}
function planTextoCobranca(quem){
  const gs=planPorTerceiro().filter(g=>!quem||g.quem===quem);
  if(!gs.length) return "Nenhuma pendência com terceiro registrada hoje.";
  return gs.map(g=>{
    const itens=[...new Set(g.tarefas.map(t=>t.desc))].join(", ");
    const faz=[...new Set(g.tarefas.map(planNomeUn))];
    return g.quem+": "+itens+" pendente"+(g.tarefas.length>1?"s":"")+" para "+faz.join(" e ")
      +" desde "+fmtDataCurta(g.desde)+" — "+faz.length+" fazenda"+(faz.length>1?"s":"")+" parada"+(faz.length>1?"s":"")+".";
  }).join("\n");
}
function planTextoFechamento(rodadaId){
  const r=rodadaId?planRodadas().find(x=>x.id===rodadaId):planRodadaAtual();
  const ts=planTarefas().filter(t=>t.tipoItem==="tarefa" && (!t.unidade||podeVer(t.unidade)) && (!r||t.origemId===r.id));
  if(!ts.length) return "Nenhuma tarefa na rodada para fechar.";
  const uns=[...new Set(ts.map(planNomeUn))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const L=["📅 Fechamento — "+((r&&r.nome)||planMesRot(planMesDe(hojeBRT()))),""];
  uns.forEach(u=>{ const g=ts.filter(t=>planNomeUn(t)===u);
    const fim=g.filter(t=>t.status==="finalizado").length;
    const ativas=g.filter(t=>t.status!=="cancelado");
    const meta=ativas.reduce((a,t)=>a+planMeta(t),0);
    const exec=ativas.reduce((a,t)=>a+(planMeta(t)?Math.min(planExecucao(t).ha,planMeta(t)):0),0);
    const semL=ativas.filter(t=>planExecucao(t).n===0);
    const fz=(ativas.find(t=>t.unidade)||{}).unidade;
    const fora=fz?planForaDoPlano(fz, r?r.ref:planMesDe(hojeBRT())):null;
    L.push(u+": "+fim+" de "+g.length+" concluídas ("+Math.round(fim*100/g.length)+"%) · "
      +g.filter(planAtrasada).length+" atrasada(s) · "+g.filter(planPausada).length+" travada(s) · "
      +g.filter(t=>planArrastaMeses(t)>0).length+" arrastada(s)");
    L.push("  plano executado: "+(meta?Math.min(100,Math.round(exec*100/meta))+"% da área ("+planHa(exec)+" de "+planHa(meta)+" ha)":"sem meta em ha"));
    if(fora && fora.total) L.push("  esforço fora do plano: "+fora.pct+"% ("+fora.fora+" de "+fora.total+" lançamentos)");
    if(semL.length) L.push("  sem nenhum lançamento: "+semL.map(t=>t.desc).join("; "));
  });
  return L.join("\n");
}
/* rascunho da PRÓXIMA ata: o que ficou pendente por fazenda, já no formato do texto da reunião */
function planTextoAta(){
  const ts=planVisiveis().filter(t=>planAberta(t)&&t.tipoItem==="tarefa");
  const gerais=planVisiveis().filter(t=>planAberta(t)&&t.tipoItem!=="tarefa");
  const uns=[...new Set(ts.map(planNomeUn))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const L=["Rascunho da ata — reunião de "+fmtData(planPrazoChip({prazo:""},"reuniao")),""];
  uns.forEach((u,i)=>{ L.push("2."+(i+1)+" – "+u);
    ts.filter(t=>planNomeUn(t)===u).sort(planOrdenar).forEach(t=>{
      /* o texto da ata já costuma dizer o estado ("Kcl em andamento") — não repetir */
      const jaDiz=x=>normTxt(t.desc).includes(normTxt(x));
      const st=t.status==="em_execucao"?(jaDiz("em andamento")?"":" em andamento")
        :planPausada(t)?(jaDiz("aguardando")||jaDiz("cobrar")?"":" ("+((t.bloqueio&&t.bloqueio.texto)||"aguardando")+((t.bloqueio&&t.bloqueio.quem)?" "+t.bloqueio.quem:"")+")"):"";
      L.push("- "+t.desc+(n0(t.area)?" - "+n0(t.area)+" há":"")+st+(t.prazo?" – PRAZO: "+fmtData(planPrazoEfetivo(t)).replace(/(\d{2})\/(\d{2})\/\d{2}(\d{2})/,"$1/$2/$3"):"")); });
    L.push(""); });
  if(gerais.length){ L.push("Assuntos gerais e necessidades de investimento");
    gerais.forEach(t=>L.push("- "+t.desc+(t.responsavel?" ("+t.responsavel+")":""))); }
  return L.join("\n");
}
/* "Executado fora do plano" em texto: entra na conversa da próxima reunião */
function planTextoFora(){
  const ref=planMesDe(hojeBRT());
  const uns=unidadesPermitidas().map(f=>({f, r:planForaDoPlano(f.id, ref)})).filter(x=>x.r.fora);
  if(!uns.length) return "Nenhum lançamento fora do plano em "+planMesRot(ref)+".";
  const L=["🧾 Executado fora do plano — "+planMesRot(ref),"",
    "O que o boletim registrou e não estava na ata. Não é cobrança: é assunto para a próxima reunião.",""];
  uns.sort((a,b)=>b.r.fora-a.r.fora).forEach(({f,r})=>{
    L.push(f.nome+": "+r.fora+" de "+r.total+" lançamentos ("+r.pct+"%)");
    r.grupos.slice(0,6).forEach(g=>L.push("  - "+nomeAtual(g.op)+" · "+g.n+" lançamento"+(g.n>1?"s":"")
      +(g.ha?" · "+planHa(g.ha)+" ha":"")+" · último "+fmtDataCurta(g.ultimo)));
  });
  return L.join("\n");
}
function planCopiar(chave, arg){
  const txt = chave==="pauta" ? planTextoPauta()
    : chave==="terceiro" ? planTextoCobranca(arg)
    : chave==="terceiros" ? planTextoCobranca("")
    : chave==="fechamento" ? planTextoFechamento(arg)
    : chave==="ata" ? planTextoAta()
    : chave==="fora" ? planTextoFora() : "";
  if(!txt) return;
  abrirTextoZap(txt);
}

/* ---- (9) pastilhas na porta de entrada: nenhuma aparece sem pendência ---- */
function planPastilhas(){
  const out=[];
  if(!D) return out;
  planMotor();
  if(podePainel()){
    const abertas=planVisiveis().filter(t=>planAberta(t)&&t.tipoItem==="tarefa");
    const atr=abertas.filter(planAtrasada).length;
    if(atr) out.push({txt:"🔴 "+atr+" tarefa"+(atr>1?"s":"")+" atrasada"+(atr>1?"s":""), v:"lista", filtro:"atrasadas"});
    const trv=abertas.filter(t=>planPausada(t)&&planTravadaDias(t)>PLAN_TRAVA_COBRANCA).length;
    if(trv) out.push({txt:"📌 "+trv+" travada"+(trv>1?"s":"")+" há +"+PLAN_TRAVA_COBRANCA+" dias", v:"terceiros"});
    const s=planSemanaAtual();
    if(planDiaSemana(hojeBRT())>=5 && s && !planComprometidas((planSemanaProxima()||s).id).length)
      out.push({txt:"🗓️ Planejamento da semana pendente", v:"ritual", arg:"semana"});
    const ref=planMesDe(hojeBRT());
    if(parseInt(hojeBRT().slice(8),10)>=PLAN_DIA_REUNIAO && !planRodadaDoMes(ref))
      out.push({txt:"📅 Rodada de "+planMesNome(ref)+" não importada", v:"ritual", arg:"ata"});
  }
  if(sessao && sessao.papel==="gerente" && sessao.fazendaId){
    const ls=planAbertasDa(sessao.fazendaId).filter(t=>{ const d=planDiasParaPrazo(t); return d!==null && d<=7; });
    if(ls.length) out.push({txt:"📋 "+ls.length+" tarefa"+(ls.length>1?"s":"")+" vencendo esta semana", v:"faixa", arg:sessao.fazendaId});
  }
  return out;
}
function planPastilhasHtml(){
  const ps=planPastilhas();
  if(!ps.length) return "";
  return `<div class="pastilhas no-print">${ps.map((p,i)=>`<button class="pastilha" data-past="${i}">${esc(p.txt)}</button>`).join("")}</div>`;
}
function planPastilhaTocar(i){
  const p=planPastilhas()[parseInt(i,10)];
  if(!p) return;
  if(p.v==="faixa"){ abrirFolhaTarefas(p.arg); return; }
  if(p.v==="ritual"){ planUI.ritual=p.arg; planNav=[{v:"ritual"}]; ir("planejamento"); return; }
  if(p.filtro==="atrasadas"){ planUI.filtroStatus=""; planUI.filtroFarol="vermelho"; }
  planNav=[{v:"menu"},{v:p.v}]; ir("planejamento");
}
/* ---- rituais que se abrem sozinhos: sexta (fechar a semana) e do dia 10 em diante (ata) ----
   Pulável; o "pulado" vale só para esta sessão, então volta no próximo acesso do MESMO dia. */
let ritualPuladoSessao=false;
function planRitualPendente(){
  if(!D || !podePainel()) return "";
  planMotor();
  const ref=planMesDe(hojeBRT());
  if(parseInt(hojeBRT().slice(8),10)>=PLAN_DIA_REUNIAO && !planRodadaDoMes(ref)) return "ata";
  const s=planSemanaProxima()||planSemanaAtual();
  if(planDiaSemana(hojeBRT())>=5 && s && !planComprometidas(s.id).length) return "semana";
  return "";
}

async function planNotifPedir(){

function planNotifCorpoGerente(){
  const fz=sessao&&sessao.fazendaId; if(!fz) return "";
  const ls=planAbertasDa(fz).filter(t=>{ const d=planDiasParaPrazo(t); return d!==null && d<=2; });
  return ls.length ? ls.slice(0,3).map(t=>t.desc+" · "+planLinhaTexto(t)).join(" — ") : "";
}
/* dispara o que venceu hoje e ainda não foi avisado (uma vez por aviso por dia, por aparelho) */
function planNotifDisparar(){
  if(!planNotifOk() || !D) return;
  const hoje=hojeBRT(), h=new Date().getHours();
  D.planNotifFeitos=D.planNotifFeitos||{};
  PLAN_AVISOS.forEach(a=>{
    if(D.planNotifFeitos[a.id]===hoje) return;
    if(h<a.hora) return;
    if(a.papel==="painel" && !podePainel()) return;
    if(a.papel==="gerente" && !(sessao&&sessao.papel==="gerente")) return;
    if(a.dia!==undefined && planDiaSemana(hoje)!==a.dia) return;
    if(a.diaMes!==undefined && parseInt(hoje.slice(8),10)<a.diaMes) return;
    let corpo=a.corpo;
    if(a.id==="gerente"){ corpo=planNotifCorpoGerente(); if(!corpo) return; }
    if(a.id==="ata" && planRodadaDoMes(planMesDe(hoje))) return;
    if(a.id==="semana" && planComprometidas((planSemanaProxima()||planSemanaAtual()||{}).id||"").length) return;
    try{ new Notification("📋 "+a.txt, {body:corpo, tag:"plan-"+a.id}); }catch(e){ return; }
    D.planNotifFeitos[a.id]=hoje;
  });
  salvarDados();
}

  /* v79: "＋N" abre o resto da fileira de filtros, no lugar (só na memória) */

function planForaDoEscopo(nome){
  D.deparaAta = (D.deparaAta && D.deparaAta.length) ? D.deparaAta : DEPARA_ATA_PADRAO.map(x=>({...x}));
  if(!D.deparaAta.some(x=>planChaveAta(x.ata)===planChaveAta(nome))) D.deparaAta.push({ata:nome, fora:true});
