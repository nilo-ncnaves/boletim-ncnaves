/* Partes estruturadas de uma operação de grãos (usadas no WhatsApp e no detalhe) */
function resumoOpPartes(b,a){
  const cat=opCatDe(a.tipo), fmt=v=>n0(v).toLocaleString("pt-BR",{maximumFractionDigits:2});
  const info=infoCiclo(a.talhaoId,b.data);
  const parts=[];
  const pAplic=()=>{
    if(a.alvo) parts.push("alvo: "+a.alvo);
    const rec=(a.produtos||[]).filter(p=>p.nome).map(p=>p.nome+(p.dose?" "+String(p.dose).replace(".",",")+" "+(p.un||"L")+"/ha":"")).join(" + ");
    if(rec) parts.push(rec);
    if(n0(a.caldaLha)) parts.push(fmt(a.caldaLha)+" L/ha");
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
    if(a.equip) parts.push(a.equip.toLowerCase());
    if(a.vento==="Vento forte") parts.push("⚠ vento forte");
    if(a.horario) parts.push(a.horario.toLowerCase());
  };
  if(cat==="APLICACAO") pAplic();
  else if(cat==="CALAGEM"||cat==="GESSAGEM"){
    if(a.produtoAdb) parts.push(a.produtoAdb.toLowerCase());
    if(n0(a.doseTHa)) parts.push(fmt(a.doseTHa)+" t/ha");
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
    if(a.incorporado) parts.push(a.incorporado==="Sim"?"incorporado":"não incorporado");
  }else if(cat==="PREPARO"){
    if(a.implemento) parts.push(a.implemento.toLowerCase());
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
  }else if(cat==="PALHADA"){
    if(a.metodo) parts.push(a.metodo.toLowerCase());
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
  }else if(cat==="AMOSTRA_SOLO"){
    if(a.profundidade) parts.push(a.profundidade==="Ambas"?"0-20 e 20-40 cm":a.profundidade);
    if(n0(a.nAmostras)) parts.push(n0(a.nAmostras)+" amostras");
    if(a.laboratorio) parts.push("→ "+a.laboratorio);
  }else if(cat==="TRAT_SEMENTES"){
    const rec=(a.produtos||[]).filter(p=>p.nome).map(p=>p.nome+(p.dose?" "+String(p.dose).replace(".",",")+" "+(p.un||"mL")+"/100 kg":"")).join(" + ");
    if(rec) parts.push(rec);
    if(a.cultivar) parts.push(a.cultivar);
    if(a.qtdSementes) parts.push(String(a.qtdSementes).replace(".",",")+" "+(a.qtdUn||"kg"));
  }else if(cat==="INOCULACAO"){
    if(a.produtoInoc) parts.push(a.produtoInoc);
    if(a.doseInoc) parts.push(a.doseInoc);
    if(a.qtdSementes) parts.push(a.qtdSementes+" de sementes");
  }else if(cat==="PLANTIO"){
    const cult=info?rotuloCultura(info.cultura):rotuloCultura(a.culturaPl);
    if(cult) parts.push(cult);
    if(a.cultivar) parts.push(a.cultivar);
    if(a.populacao) parts.push(String(a.populacao).replace(".",",")+" "+(a.populacaoUn||"sementes/m"));
    if(n0(a.espacamento)) parts.push(fmt(a.espacamento)+" cm");
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha plantados");
  }else if(cat==="ADUBO_PLANTIO"){
    if(a.formulacao) parts.push(a.formulacao);
    if(n0(a.doseKgHa)) parts.push(fmt(a.doseKgHa)+" kg/ha");
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
  }else if(cat==="ADUBO_COBERTURA"){
    const prod=a.produtoTipo==="Outro"?a.produtoAdb:a.produtoTipo;
    if(prod) parts.push(prod);
    if(n0(a.doseKgHa)) parts.push(fmt(a.doseKgHa)+" kg/ha");
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
    if(a.forma) parts.push(a.forma.toLowerCase());
  }else if(cat==="REPLANTIO"){
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha replantados");
    if(a.motivo) parts.push("motivo: "+a.motivo.toLowerCase());
    if(a.cultivar) parts.push(a.cultivar);
  }else if(cat==="ESTANDE"){
    if(a.plantasM) parts.push(String(a.plantasM).replace(".",",")+" plantas/m");
    if(n0(a.pontos)) parts.push(n0(a.pontos)+" pontos");
    if(a.decisao) parts.push("decisão: "+(a.decisao==="OK"?"ok":"replantar"));
  }else if(cat==="MONITORAMENTO"){
    if(a.alvo) parts.push(a.alvo);
    if(a.nivel) parts.push("nível "+a.nivel.toUpperCase());
    if(a.contagem) parts.push(a.contagem);
    if(a.decisao) parts.push("decisão: "+(a.decisao==="Reavaliar"?"reavaliar em "+(a.reavaliarDias||"?")+" dias":a.decisao.toLowerCase()));
  }else if(cat==="DANINHA_MANUAL"){
    if(a.alvo) parts.push(a.alvo);
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
    if(n0(a.pessoas)) parts.push(n0(a.pessoas)+" pessoa"+(n0(a.pessoas)>1?"s":""));
  }else if(cat==="COLHEITA"){
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha colhidos");
    if(n0(a.producao)) parts.push(fmt(a.producao)+" "+((a.producaoUn==="kg")?"kg":"sc 60 kg"));
    if(n0(a.umidade)) parts.push(fmt(a.umidade)+"% umidade");
    if(n0(a.impureza)) parts.push(fmt(a.impureza)+"% impureza");
    if(a.maqTipo==="Própria"&&a.maqNome) parts.push("máquina "+a.maqNome);
    else if(a.maqTipo==="De terceiro") parts.push("terceiro"+(a.prestador?" ("+a.prestador+")":""));
    if(a.destino) parts.push(a.destino.toLowerCase());
    if(n0(a.cargas)) parts.push(n0(a.cargas)+" carga"+(n0(a.cargas)>1?"s":""));
  }else if(cat==="TRANSPORTE"){
    if(n0(a.cargas)) parts.push(n0(a.cargas)+" carga"+(n0(a.cargas)>1?"s":""));
    if(a.destino) parts.push(a.destino.toLowerCase());
    if(a.placaMotorista) parts.push(a.placaMotorista);
  }else if(cat==="PESAGEM"){
    if(a.ticket) parts.push("ticket "+a.ticket);
    if(n0(a.pesoKg)) parts.push(fmt(a.pesoKg)+" kg líquidos");
    if(a.local) parts.push(a.local);
  }else if(cat==="AMOSTRA_GRAO"){
    if(n0(a.umidade)) parts.push(fmt(a.umidade)+"% umidade");
    if(n0(a.impureza)) parts.push(fmt(a.impureza)+"% impureza");
    if(a.local) parts.push(a.local);
  }else if(cat==="SECAGEM"){
    if(a.local) parts.push(a.local);
    if(n0(a.umidEntrada)||n0(a.umidSaida)) parts.push(fmt(a.umidEntrada)+"% → "+fmt(a.umidSaida)+"%");
    if(n0(a.quebra)) parts.push(fmt(a.quebra)+"% de quebra");
  }else if(cat==="RESTOS"){
    if(a.metodo) parts.push(a.metodo.toLowerCase());
    if(a.metodo==="Herbicida") pAplic();
    else if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
  }else if(cat==="COBERTURA_VERDE"){
    const espec=a.especie==="Outra"?a.especieOutra:a.especie;
    if(espec) parts.push(espec);
    if(n0(a.doseKgHa)) parts.push(fmt(a.doseKgHa)+" kg/ha");
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
  }else if(cat==="VAZIO"){
    if(a.dataInicio) parts.push("início "+fmtData(a.dataInicio));
  }else{
    if(n0(a.areaHa)) parts.push(fmt(a.areaHa)+" ha");
  }
  return parts;
}
function linhasWhatsOp(b,a){
  const info=infoCiclo(a.talhaoId,b.data);
  const cab="🚜 "+talhao(a.talhaoId).nome
    +(info?" ("+rotuloCultura(info.cultura)+((info.dap!==null&&info.dap>=0)?", "+info.dap+" DAP":"")+")":"")
    +": "+(a.tipo||"operação").toLowerCase();
  const parts=resumoOpPartes(b,a);
  const maq=(a.maquinas||[]).filter(m=>m.nome).map(m=>m.nome.replace(/\s*\(COD[^)]*\)/,"")+(n0(m.horas)?" "+n0(m.horas)+"h":"")).join(", ");
  if(maq) parts.push(maq);
  const linhas=[cab+(parts.length?" — "+parts.join(", "):"")];
  if(a.obs) linhas.push("📝 "+a.obs);
  return linhas;
}
function linhasWhatsIrg(b){
  return (b.irg||[]).filter(e2=>e2.status).map(e2=>{
    const nome=e2.nome||talhao(e2.k).nome;
    const med=icropMedidoPivo(b,nome);
    let li="💧 "+nome+": "+e2.status.toLowerCase();
    if(n0(e2.lamina)) li+=", "+n0(e2.lamina).toLocaleString("pt-BR")+" mm";
    if(n0(e2.percent)) li+=" ("+n0(e2.percent).toLocaleString("pt-BR")+"%)";
    if(med&&med.regou) li+=" (iCrop mediu "+med.mm.toLocaleString("pt-BR",{maximumFractionDigits:1})+")";
    if((e2.problemas||[]).length) li+=" — "+e2.problemas.join(", ").toLowerCase();
    const qm=(e2.quimiProdutos||[]).filter(p=>p.nome).map(p=>p.nome+(p.dose?" "+String(p.dose).replace(".",",")+" "+(p.un||"kg")+"/ha":"")).join(" + ");
    if(qm) li+=" · quimigação: "+qm;
    if(e2.obs) li+=" — "+e2.obs;
    return li;
  });
}
function resumoWhats(b){
  const L=[];
  L.push("📋 *BOLETIM "+fazenda(b.fazendaId).nome.toUpperCase()+"* — "+fmtData(b.data));
  L.push("Por: "+(b.responsavel||"—"));
  const c=b.clima||{};
  if(c.cond||c.chuvaMm||c.obs) L.push("🌤️ "+[(c.cond||""),(n0(c.chuvaMm)?"chuva "+n0(c.chuvaMm)+" mm":""),(c.obs||"")].filter(Boolean).join(" · "));
  if(c.florada==="Sim") L.push("🌸 FLORADA ABERTA na lavoura");
  if(c.requeima==="Sim") L.push("🥀 Requeima / queda de flores observada");
  const mo=b.mo||{}, tot=n0(mo.proprios)+n0(mo.diaristas);
  if(tot) L.push("👥 "+tot+" pessoas ("+n0(mo.proprios)+" próprios + "+n0(mo.diaristas)+" diaristas)"+(n0(mo.faltas)?" · "+n0(mo.faltas)+" falta(s)"+(mo.motivoFaltas?" ("+mo.motivoFaltas+")":""):"")+(n0(mo.horasExtras)?" · "+n0(mo.horasExtras)+" h extras":""));
  const fns=(mo.funcoes||[]).filter(f=>f.nome);
  if(fns.length) L.push("🛠️ "+fns.map(f=>{const p=fnPr(f)+fnDi(f);
    return (p?p+" ":"")+f.nome+(fnDi(f)?" ("+fnPr(f)+"p+"+fnDi(f)+"d)":"")+(n0(f.hx)?" ["+n0(f.hx)+"h extra]":"");}).join(" · "));
  (b.atividades||[]).forEach(a=>{
    if(a.gr){ L.push(...linhasWhatsOp(b,a)); return; }
    const maq=(a.maquinas||[]).filter(m=>m.nome).map(m=>m.nome.replace(/\s*\(COD[^)]*\)/,"")+" "+n0(m.horas)+"h").join(", ");
    const st=a.status==="concluida"?" ✔":a.status==="continua"?" ⏳":"";
    const cic=cicloAtivo(a.talhaoId);
    L.push("🔧 "+(a.tipo||"Atividade")+" — "+talhao(a.talhaoId).nome+(cic?" ("+rotuloCultura(cic.cultura)+")":"")+(n0(a.pessoas)?" · "+n0(a.pessoas)+"p":"")+(maq?" · "+maq:"")+st+(a.obs?" — "+a.obs:""));
    if(a.receita) L.push("🧪 "+a.receita.split(/\n+/).map(s=>s.trim()).filter(Boolean).join(" · "));
    if(n0(a.tanques)) L.push("🛢️ Gastou "+n0(a.tanques)+" tanque"+(n0(a.tanques)>1?"s":"")+(n0(a.ltanque)?" × "+n0(a.ltanque)+" L = "+(n0(a.tanques)*n0(a.ltanque)).toLocaleString("pt-BR")+" L":""));
  });

/* Colheita lançada como operação vira registro em r.colheita (painel, relatório e CSV continuam valendo).
   Só as linhas espelhadas (id "opcol-") são recriadas; colheitas antigas ficam intactas. */
function espelharColheitaGraos(r){
  const ops=(r.atividades||[]).filter(a=>a.gr&&opCatDe(a.tipo)==="COLHEITA");
  r.colheita=(r.colheita||[]).filter(c=>!String(c.id||"").startsWith("opcol-"));
  ops.forEach(a=>{
    const kg=(a.producaoUn==="kg")?n0(a.producao):n0(a.producao)*60;
    const sacas=Math.round(kg/60*100)/100;
    r.colheita.push({id:"opcol-"+a.id, talhaoId:a.talhaoId, areaHa:a.areaHa||"", sacas:sacas||"", kg:kg||"",
      umidade:a.umidade||"", impureza:a.impureza||"", destino:a.destino||"", cargas:a.cargas||"", obs:a.obs||""});
  });
  /* 100% da área colhida? oferece encerrar o ciclo */
  [...new Set(ops.map(a=>a.talhaoId).filter(Boolean))].forEach(tid=>{
    const c=cicloAtivo(tid), t=talhao(tid);
    if(!c||!n0(t.area)) return;
    const antes=D.boletins.filter(b=>b.fazendaId===r.fazendaId&&b.data>=(c.plantio||"")&&b.id!==r.id)
      .reduce((s,b)=>s+(b.colheita||[]).filter(x=>x.talhaoId===tid).reduce((x2,cc)=>x2+n0(cc.areaHa),0),0);
    const hoje2=r.colheita.filter(x=>x.talhaoId===tid).reduce((s,x)=>s+n0(x.areaHa),0);
    if(antes+hoje2>=n0(t.area)*0.999){
      if(confirm("Área de "+t.nome+" 100% colhida ("+rotuloCultura(c.cultura)+"). Encerrar o ciclo? Ele fica no histórico."))
        c.encerradoEm=r.data;
    }
  });
}
/* Cinto de segurança do envio: junta os avisos que merecem uma conferida antes de mandar */
function avisosEnvio(r){
  const avisos=[];
  const chuva=n0(r.clima&&r.clima.chuvaMm);
  if(chuva>150) avisos.push("Chuva de "+chuva.toLocaleString("pt-BR")+" mm — acima de 150 mm. Confira se o número está certo.");
  const ic=icropDo(r.data,r.fazendaId);
  if(ic && Math.abs(chuva-ic.chuva)>15) avisos.push("Chuva informada ("+chuva.toLocaleString("pt-BR")+" mm) difere da estação iCrop ("+ic.chuva.toLocaleString("pt-BR")+" mm) em mais de 15 mm.");
  const pessoas=n0(r.mo&&r.mo.proprios)+n0(r.mo&&r.mo.diaristas);
  const diaSemana=new Date(r.data+"T12:00:00").getDay();
  if(diaSemana!==0 && pessoas===0){
    const lim=(()=>{const d=new Date(r.data+"T12:00:00"); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10);})();
    const teveGente=D.boletins.some(b=>b.fazendaId===r.fazendaId && b.id!==r.id && b.data>=lim && b.data<r.data
      && (n0(b.mo&&b.mo.proprios)+n0(b.mo&&b.mo.diaristas))>0);
    if(teveGente) avisos.push("Dia útil com 0 pessoas — esta fazenda teve gente trabalhando nos últimos 7 dias. Esqueceu a mão de obra?");
  }
  if((r.colheita||[]).some(c=>!c.talhaoId)) avisos.push(atividadeDe(r.fazendaId)==="CAFE"?"Colheita lançada sem talhão. Diga de qual talhão saiu o café.":"Colheita lançada sem talhão. Diga de qual talhão saiu a produção.");
  if(!(r.atividades||[]).length && !(r.colheita||[]).length && pessoas===0 && !(r.ocorrencias||[]).length && !temPecuaria(r) && !(r.irg||[]).some(e2=>e2.status))
    avisos.push("Boletim praticamente vazio — sem atividades, colheita nem equipe. Confirma que o dia foi assim?");
  /* grãos: rastreabilidade e informado × medido */
  if(temCultura(r.fazendaId,"GRAOS")&&!temCultura(r.fazendaId,"CAFE")){
    (r.atividades||[]).forEach(a=>{
      if(a.gr&&a.tipo&&opCatDe(a.tipo)==="APLICACAO"&&!(a.produtos||[]).some(p=>p.nome))
        avisos.push("Aplicação \""+a.tipo+"\" em "+talhao(a.talhaoId).nome+" sem produto na receita. Sem produto e dose não dá para fechar custo nem rastrear.");
      if(a.gr&&a.tipo&&!a.talhaoId)
        avisos.push("Operação \""+a.tipo+"\" sem talhão. Diga onde foi feita.");
    });
    (r.irg||[]).forEach(e2=>{
      if(!e2.status) return;
      const nome=e2.nome||talhao(e2.k).nome;
      const med=icropMedidoPivo(r,nome);
      const inf=n0(e2.lamina);
      if(!med) return;
      if((e2.status==="Rodou"||e2.status==="Parcial")&&inf&&med.regou&&Math.abs(inf-med.mm)>Math.max(2,med.mm*0.25))
        avisos.push(nome+": lâmina informada ("+inf.toLocaleString("pt-BR")+" mm) difere do que o iCrop mediu ("+med.mm.toLocaleString("pt-BR",{maximumFractionDigits:1})+" mm).");
      if(e2.status==="Não rodou"&&med.regou)
        avisos.push(nome+": marcado como \"Não rodou\", mas o iCrop mediu "+med.mm.toLocaleString("pt-BR",{maximumFractionDigits:1})+" mm de lâmina.");
      if(e2.status==="Rodou"&&!med.regou&&!inf)
        avisos.push(nome+": marcado como \"Rodou\" sem lâmina informada, e o iCrop não mediu irrigação.");
    });
  }
  return avisos;
}

function validarEnviar(){
  const r=rascunho;
  if(!r.clima.cond && !r.atividades.length && !r.obsGeral && !r.ocorrencias.length && !temPecuaria(r) && !(r.irg||[]).some(e2=>e2.status)){
    alert("Registre pelo menos o clima ou uma observação do dia."); return;
  }
  const jaExiste = D.boletins.find(b=>b.data===r.data && b.fazendaId===r.fazendaId && b.id!==r.id);
  if(jaExiste){ alert("Já existe boletim para "+fmtData(r.data)+". Abra-o pela lista para corrigir."); return; }
  const avisos=avisosEnvio(r);

function concluirEnvio(){
  const r=rascunho;
  D.ultimasDoses = D.ultimasDoses||{};
  D.insumosAprendidos = D.insumosAprendidos||[];
  D.ultimasReceitas = D.ultimasReceitas||{};
  D.ultimasFert = D.ultimasFert||{};
  if(r.irr && r.irr.fert==="Sim" && r.irr.fertReceita) D.ultimasFert[r.fazendaId]=r.irr.fertReceita;
  (r.atividades||[]).forEach(a=>{ if(a.tipo && a.receita) D.ultimasReceitas[a.tipo]={receita:a.receita, ltanque:a.ltanque||""}; });
  (r.atividades||[]).forEach(a=>(a.insumos||[]).forEach(x=>{
    if(x.nome){ if(x.dose||x.qtd) D.ultimasDoses[x.nome]={dose:x.dose,qtd:x.qtd};
      if(!(D.insumos||[]).some(i=>i.nome===x.nome) && !D.insumosAprendidos.includes(x.nome)) D.insumosAprendidos.push(x.nome); }
  }));
  const aprender=nm=>{ if(nm && !(D.insumos||[]).some(i2=>i2.nome===nm) && !D.insumosAprendidos.includes(nm)) D.insumosAprendidos.push(nm); };
  if(temCultura(r.fazendaId,"GRAOS") && !temCultura(r.fazendaId,"CAFE")){
    D.ultimasReceitasTal=D.ultimasReceitasTal||{}; D.ultimasOpsTal=D.ultimasOpsTal||{}; D.ciclos=D.ciclos||[];
    (r.atividades||[]).forEach(a=>{
      if(!a.gr||!a.talhaoId||!a.tipo) return;
      const cat=opCatDe(a.tipo);
      /* memórias de um toque: repetir a última operação e a última receita do talhão */
      const copia=JSON.parse(JSON.stringify(a)); delete copia.id;
      D.ultimasOpsTal[a.talhaoId]=copia;
      if(cat==="APLICACAO"&&(a.produtos||[]).some(p=>p.nome))
        D.ultimasReceitasTal[a.talhaoId]={tipo:a.tipo,alvo:a.alvo||"",produtos:JSON.parse(JSON.stringify(a.produtos)),caldaLha:a.caldaLha||"",equip:a.equip||""};
      (a.produtos||[]).forEach(p=>aprender(p.nome));
      aprender(a.produtoAdb); aprender(a.formulacao); aprender(a.produtoInoc);
      /* plantio lançado: oferece abrir (ou completar) o ciclo do talhão com a data */
      if(cat==="PLANTIO"&&a.talhaoId!=="geral"){
        const c=cicloAtivo(a.talhaoId);
        if(!c){ if(a.culturaPl && confirm("Abrir o ciclo de "+rotuloCultura(a.culturaPl)+" em "+talhao(a.talhaoId).nome+" com plantio em "+fmtData(r.data)+"?"))
          D.ciclos.push({id:uid(),talhaoId:a.talhaoId,cultura:a.culturaPl,plantio:r.data}); }
        else if(!c.plantio && confirm("Atualizar o ciclo de "+rotuloCultura(c.cultura)+" em "+talhao(a.talhaoId).nome+" com a data de plantio "+fmtData(r.data)+"?"))
          c.plantio=r.data;
      }
    });
    (r.irg||[]).forEach(e2=>(e2.quimiProdutos||[]).forEach(p=>aprender(p.nome)));
    espelharColheitaGraos(r);
  }
  if(r.pecuaria){
    const evs=(r.pecuaria.eventos||[]).filter(e2=>e2.tipo);
    if(evs.length){ D.ultimoEvPec=D.ultimoEvPec||{}; D.ultimoEvPec[r.fazendaId]=JSON.parse(JSON.stringify(evs[evs.length-1])); }
  }
  if(r.id){
    const i=D.boletins.findIndex(b=>b.id===r.id);
    r.editadoEm=fmtData(hojeISO())+" "+agoraHM();
    D.boletins[i]=JSON.parse(JSON.stringify(r));
  }else{
    r.id=uid(); r.enviadoEm=r.data+" "+agoraHM();
    D.boletins.push(JSON.parse(JSON.stringify(r)));
  }
  if(r.responsavel) Persist.set("bdf:nomeResp", r.responsavel);
  envioRecente=r.id;
  syncEnfileirar('b', r.id);
  if(temPecuaria(r)) syncEnfileirar('pec', r.id); /* cópia da pecuária na tabela boletim_pecuaria */
  gerarRemessasDe(r);
  salvarDados(); rascunho=null; Persist.del("bdf:rascunho");
  ir("casa");
}

/* ---------- Eventos ---------- */
function ligarEventos(tela){
  const app=$("#app");
  if(tela==="codigo"){ const cod=$("#cod-acesso");
    if(cod) cod.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); const b=$("#bt-cod-entrar"); if(b) b.click(); } }; }
  const marcarChips=(raiz,attr,valor)=>raiz.querySelectorAll("[data-"+attr+"]").forEach(ch=>ch.classList.toggle("on",ch.dataset[attr.replace(/-(.)/g,(m,c)=>c.toUpperCase())]===valor));
  const setResumo=(id,txt)=>{ const el=$("#"+id); if(el) el.textContent=txt; };
  const resumoContagem=(id,n)=>setResumo(id, n? n+" registro"+(n>1?"s":"") : "");

  app.onchange = ev=>{
    const s=ev.target.closest("[data-impmapa]");

  };
  app.onclick = async ev=>{
    const t = ev.target.closest("button"); if(!t) return;
    const d = t.dataset;
    /* código de acesso */
    if(t.id==="bt-cod-entrar"){
      const el=$("#cod-acesso"), cod=el?el.value:"";
      t.disabled=true; t.textContent="Conferindo…";
      /* com internet, busca antes os códigos atuais no banco (pega códigos trocados pelo admin) */
      if(syncAtivo() && navigator.onLine!==false){ try{ await baixarCodigos(); }catch(e){} }
      const e2=escopoDoCodigo(cod);
      if(!e2){ t.disabled=false; t.textContent="Entrar";
        const er=$("#cod-erro"); if(er) er.style.display="block"; return; }
      acesso=e2; Persist.set("bdf:acesso",JSON.stringify(acesso));
      sessao=null; rascunho=null; Persist.del("bdf:sessao");
      entrarPeloAcesso(); syncTudo(); return; }
    if(t.id==="bt-sair-aparelho"){
      if(confirm("Esquecer o código deste aparelho? Para entrar de novo vai precisar digitar o código.")) sairDoAparelho();
      return; }
    if(d.novoCod){ if(!podeCadastros()) return;
      const chave=d.novoCod, nome=rotuloDaChave(chave);
      if(!confirm("Gerar novo código para "+nome+"? O código atual ("+codigoDe(chave)+") deixa de valer nos aparelhos na próxima sincronização.")) return;
      const novo=gerarNovoCodigo(chave);
      alert("Novo código de "+nome+": "+novo+"\nAnote e repasse — o antigo não abre mais.");
      ir("cadastros",null,true); return; }
    /* novo código combinado (só ADMIN): escolhe atividades e/ou unidades */
    if(t.id==="bt-novo-combo"){ if(!podeCadastros()) return; novoCombo={ativs:[],unis:[]}; ir("cadastros",null,true); return; }
    if(t.id==="bt-combo-cancelar"){ novoCombo=null; ir("cadastros",null,true); return; }
    if(d.comboAtv && novoCombo){ const i=novoCombo.ativs.indexOf(d.comboAtv);
      if(i>=0) novoCombo.ativs.splice(i,1); else novoCombo.ativs.push(d.comboAtv);
      ir("cadastros",null,true); return; }
    if(d.comboUni && novoCombo){ const i=novoCombo.unis.indexOf(d.comboUni);
      if(i>=0) novoCombo.unis.splice(i,1); else novoCombo.unis.push(d.comboUni);
      ir("cadastros",null,true); return; }
    if(t.id==="bt-combo-gerar"){ if(!podeCadastros()||!novoCombo) return;
      if(!novoCombo.ativs.length && !novoCombo.unis.length){ alert("Marque pelo menos uma atividade ou unidade."); return; }
      const ordem=["CAFE","GRAOS","PECUARIA"];
      const chave="MIX:"+ordem.filter(a=>novoCombo.ativs.includes(a)).join("+")+":"+novoCombo.unis.slice().sort().join("+");
      const jaTinha=!!((D.codigosAcesso||{})[chave]);
      const novo=gerarNovoCodigo(chave);
      alert("Código combinado ("+rotuloDaChave(chave)+"): "+novo+(jaTinha?"\nJá existia um código com este mesmo escopo — o antigo não abre mais.":"")+"\nAnote e repasse.");
      novoCombo=null; ir("cadastros",null,true); return; }
    /* Escritório: Unidades e Plano de safra (v52) — só ADMIN */
    if(t.id==="bt-unidplano"){ if(!podeCadastros()) return; upEstado.dados=null; upEstado.erro=""; ir("unidplano"); upRecarregar(); return; }
    if(d.up!==undefined){ if(!podeCadastros()) return; upClique(d,t); return; }
    /* entrada e fazenda */
    if(d.atividade){ const u=D.usuarios.find(x=>x.papel==="gerente"); if(!u) return;

    if(d.perfil){ const u=D.usuarios.find(x=>x.papel===d.perfil); if(!u) return;

      if((d.perfil==="pos"||d.perfil==="gerente") && soLeitura()) return; /* diretoria só lê */

      else { sessao={userId:u.id,papel:u.papel,nome:u.nome}; Persist.set("bdf:sessao",JSON.stringify(sessao)); rascunho=null; ir("painel"); } return; }
    if(d.fazenda){ if(!podeVer(d.fazenda)) return;

    if(t.id==="bt-sync"){ syncTudo(); return; }
    if(t.id==="bt-sync-salvar"){
      const u=(app.querySelector("#sync-url")||{}).value||"", k=(app.querySelector("#sync-key")||{}).value||"";

    if(d.atvFiltro!==undefined && sessao && (sessao.papel==="proprietario"||sessao.papel==="admin")){
      filtroPainel.atv=d.atvFiltro; filtroPainel.fazenda=""; ir("painel",null,true); return; }
    if(d.impfonte){
      impEstado = (impEstado&&impEstado.cab)
        ? {...impEstado, fonte:d.impfonte, mapa:{}, resultado:"", semMaq:[], semTal:[]}

              const wb=XLSX.read(new Uint8Array(fr.result),{type:"array"});

              seguir(XLSX.utils.sheet_to_csv(ws,{FS:";"}));
            }catch(e){ alert("Não consegui ler este Excel. Abra a planilha, copie as células e cole na caixa de texto."); ir("importar"); } };
          fr.readAsArrayBuffer(arq);
        }).catch(()=>{ alert("Para ler Excel preciso de internet nesta primeira vez. Conecte e tente de novo — ou copie as células e cole na caixa."); ir("importar"); });
        return; }
      if(arq){ const fr=new FileReader(); fr.onload=()=>seguir(fr.result); fr.readAsText(arq,"utf-8"); }
      else if(cola){ seguir(cola); }

    if(t.id==="imp-rodar"){ impRodar(); return; }

    if(t.id==="bt-preencher-pos"){

    if(t.id==="bt-sair"||t.id==="bt-topo-sair"){ sessao=null; Persist.del("bdf:sessao"); ir("entrada"); return; }
    if(d.voltar){ ir(!sessao?"entrada":(sessao.papel==="gerente"?(sessao.fazendaId?"casa":"entrada"):"painel")); return; }

    o.fito+=(b.fito||[]).filter(f=>f.nivel==="Alto").length;
    if(b.irr&&(b.irr.status==="Rodou com problema"||b.irr.status==="Não rodou"||["Baixo","Crítica"].includes(b.irr.agua))) o.irrProb=(o.irrProb||0)+1;
    o.ocorr+=(b.ocorrencias||[]).filter(x=>x.grav==="Alta").length;
    if(b.pendencias) o.pend.push(fmtData(b.data)+": "+b.pendencias);
  });
  const tot=Object.values(porFaz).reduce((s,o)=>({sacas:s.sacas+o.sacas,latas:s.latas+o.latas,hm:s.hm+o.hm,comb:s.comb+o.comb,chuva:s.chuva+o.chuva}),{sacas:0,latas:0,hm:0,comb:0,chuva:0});
  const talhaoSacas={};
  bs.forEach(b=>(b.colheita||[]).forEach(c=>{ const k=fazenda(b.fazendaId).nome+" · "+talhao(c.talhaoId).nome;
    talhaoSacas[k]=(talhaoSacas[k]||0)+n0(c.sacas); }));
  const rankTal=Object.entries(talhaoSacas).sort((a,b)=>b[1]-a[1]).slice(0,10);
  return topo("Relatório do período","De "+fmtData(de)+" a "+fmtData(ate),true)+`
    <div class="filtros no-print">
      <select id="rel-faz"><option value="">Todas as fazendas</option>
        ${D.fazendas.map(f=>`<option value="${f.id}" ${filtroRel.fazenda===f.id?"selected":""}>${esc(f.nome)}</option>`).join("")}</select>
      <span></span>
      <input id="rel-de" type="date" value="${de}"><input id="rel-ate" type="date" value="${ate}">
    </div>
    <div class="kpis">
      <div class="kpi"><div class="valor num">${tot.sacas}</div><div class="rot">Sacas colhidas</div></div>
      <div class="kpi"><div class="valor num">${tot.hm}</div><div class="rot">Horas-máquina</div></div>
      <div class="kpi"><div class="valor num">${tot.comb}</div><div class="rot">Combustível (L)</div></div>
      <div class="kpi"><div class="valor num">${bs.length}</div><div class="rot">Boletins no período</div></div>
    </div>
    <div class="cartao"><h3>Resumo por fazenda</h3>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
        <tr style="text-align:left;border-bottom:2px solid var(--linha)">
          <th style="padding:6px 4px">Fazenda</th><th>Boletins</th><th>Sacas</th><th>Latas</th><th>Carretas</th><th>Horas-máq.</th><th>Comb. (L)</th><th>Chuva (mm)</th><th>Pessoas·dia</th><th>Irrig. c/ problema</th><th>Alertas</th></tr>
        ${Object.entries(porFaz).map(([k,o])=>`<tr style="border-bottom:1px solid var(--linha)">
          <td style="padding:6px 4px"><b>${esc(fazenda(k).nome)}</b></td><td class="num">${o.dias}</td><td class="num">${o.sacas}</td>
          <td class="num">${o.latas}</td><td class="num">${o.carretas||0}</td><td class="num">${o.hm}</td><td class="num">${o.comb}</td><td class="num">${o.chuva}</td>
          <td class="num">${o.mo}</td><td class="num">${o.irrProb||""}</td><td class="num">${o.fito+o.ocorr||""}</td></tr>`).join("")||"<tr><td colspan=11 class='mut'>Sem boletins no período.</td></tr>"}
      </table></div></div>
    ${rankTal.length?`<div class="cartao"><h3>Talhões que mais colheram</h3>
      <ul class="lista-limpa">${rankTal.map(([k,v])=>`<li class="linha-flex"><span class="cresce">${esc(k)}</span><b class="num">${v} sc</b></li>`).join("")}</ul></div>`:""}
    ${Object.entries(porFaz).some(([k,o])=>o.pend.length)?`<div class="cartao"><h3>Pendências registradas</h3>
      ${Object.entries(porFaz).filter(([k,o])=>o.pend.length).map(([k,o])=>`<p class="mt"><b>${esc(fazenda(k).nome)}</b><br><span class="mut" style="white-space:pre-wrap">${esc(o.pend.join("\n"))}</span></p>`).join("")}</div>`:""}
    <div class="linha-flex mt no-print" style="gap:8px">
      <button class="btn sec mini" id="bt-rel-csv">⬇ Exportar CSV deste relatório</button>
      <button class="btn sec mini" id="bt-pdf">🖨 Imprimir / PDF</button>
    </div>`;
}
function csvRelatorio(){
  const de=filtroRel.de||"", ate=filtroRel.ate||hojeISO();
  const sep=";", lin=[["Fazenda","Boletins","Sacas","Latas (manual)","Carretas","Horas-máquina","Combustível (L)","Chuva (mm)","Pessoas·dia","Alertas graves"].join(sep)];
  const bs=D.boletins.filter(b=>(!de||b.data>=de)&&b.data<=ate&&(!filtroRel.fazenda||b.fazendaId===filtroRel.fazenda));
  const porFaz={};
  bs.forEach(b=>{ const o=porFaz[b.fazendaId]=porFaz[b.fazendaId]||{d:0,s:0,l:0,h:0,c:0,ch:0,mo:0,al:0};
    o.d++; (b.colheita||[]).forEach(c=>{o.s+=n0(c.sacas);o.l+=n0(c.latas);o.cr=(o.cr||0)+n0(c.carretas);});
    (b.atividades||[]).forEach(a=>(a.maquinas||[]).forEach(m=>{o.h+=n0(m.horas);o.c+=n0(m.comb);}));
    o.ch+=n0(b.clima.chuvaMm); o.mo+=n0(b.mo.proprios)+n0(b.mo.diaristas);
    o.al+=(b.fito||[]).filter(f=>f.nivel==="Alto").length+(b.ocorrencias||[]).filter(x=>x.grav==="Alta").length; });
  Object.entries(porFaz).forEach(([k,o])=>lin.push([fazenda(k).nome,o.d,o.s,o.l,o.cr||0,o.h,o.c,o.ch,o.mo,o.al].join(sep)));
  const blob=new Blob(["\ufeff"+lin.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="relatorio-fazendas.csv"; a.click(); URL.revokeObjectURL(a.href);
}
function atualizarMatura(card, c){
  const s=n0(c.cereja)+n0(c.verde)+n0(c.seco), m=card.querySelector(".matura");
  if(!m) return;
  const [a,b,d]=m.children;
  a.style.width=(s?100*n0(c.cereja)/s:33)+"%"; a.textContent=n0(c.cereja)||"";
  b.style.width=(s?100*n0(c.verde)/s:34)+"%"; b.textContent=n0(c.verde)||"";
  d.style.width=(s?100*n0(c.seco)/s:33)+"%"; d.textContent=n0(c.seco)||"";
}
function cadastroClique(d,t){
  if(d.addCad){
    const tipo=d.addCad;
    if(tipo==="talhao"){ const nome=prompt("Nome do talhão:"); if(!nome) return;
      const area=n0(prompt("Área (ha):")||0);
      const nf=prompt("Fazenda (digite parte do nome):")||"";
      const fz=D.fazendas.find(f=>f.nome.toLowerCase().includes(nf.toLowerCase()));
      D.talhoes.push({id:uid(),nome,area,fazendaId:fz?fz.id:null,tipo:tipoPeloPerfil(nome, fz?perfilDe(fz.id):["CAFE"])}); }
    if(tipo==="maquina"){ const nome=prompt("Nome da máquina (com COD, se tiver):"); if(!nome) return;
      const cat=prompt("Categoria (ex.: Tratores café):","Outros")||"Outros";
      const nf=prompt("Fazendas que ela atende, separadas por vírgula (vazio = grupo todo):")||"";
      const fzs=nf.split(",").map(x=>x.trim()).filter(Boolean)
        .map(x=>D.fazendas.find(f=>f.nome.toLowerCase().includes(x.toLowerCase()))).filter(Boolean).map(f=>f.id);
      D.maquinas.push({id:uid(),nome,cat,fazendas:[...new Set(fzs)]}); }
    if(tipo==="insumo"){ const nome=prompt("Nome do insumo:"); if(!nome) return;
      const un=prompt("Unidade (L, kg, t…):")||""; D.insumos.push({id:uid(),nome,un}); }
    if(tipo==="usuario"){ const nome=prompt("Nome:"); if(!nome) return;
      const papel=prompt("Papel (gerente / proprietario / admin):")||"gerente"; D.usuarios.push({id:uid(),nome,papel}); }
    salvarDados(); ir("cadastros"); return;
  }
  if(d.rmCad){
    const [tipo,id]=d.rmCad.split(":");
    if(!confirm("Remover este cadastro?")) return;
    const mapa={talhao:"talhoes",maquina:"maquinas",insumo:"insumos",usuario:"usuarios"};
    D[mapa[tipo]]=D[mapa[tipo]].filter(x=>x.id!==id);
    salvarDados(); ir("cadastros");
  }
}
