<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F5233">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boletim LGS">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5233">
<title>Boletim Diário da Fazenda</title>
<style>
:root{
  --papel:#FBF9F4; --cartao:#FFFFFF; --tinta:#23201A; --tinta-2:#5C554A;
  --verde:#2F5233; --verde-esc:#243F28; --verde-claro:#E9F0E5;
  --terra:#7A5C43; --terra-claro:#F0E9E1;
  --cereja:#B5432E; --cereja-claro:#F7E5E1;
  --amarelo:#C98A1B; --amarelo-claro:#F8EFDC;
  --linha:#E3DDD2; --raio:12px;
  --sombra:0 1px 3px rgba(35,32,26,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--papel);color:var(--tinta);font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:12px;border:1.5px solid var(--linha);border-radius:10px;background:var(--cartao);min-height:48px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(47,82,51,.35);outline-offset:1px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:.82rem;font-weight:600;color:var(--tinta-2);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:.95rem;font-weight:700}
.mut{color:var(--tinta-2);font-size:.88rem}
.origem-dado{font-size:.75rem;margin-top:6px}       /* v63: de quando é o dado de integração (rodapé do bloco) */
.origem-dado.velho{color:var(--amarelo)}            /* sem sucesso do robô há mais de 26 h: cor de atenção, só isso */
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;padding:0 14px 90px}
#app.largo{max-width:860px}
/* Barra superior */
.topo{position:sticky;top:0;z-index:20;background:var(--verde);color:#fff;margin:0 -14px 14px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.topo h1{color:#fff;font-size:1.05rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .sub{font-size:.72rem;opacity:.85;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.btn-topo{background:rgba(255,255,255,.14);border-radius:9px;padding:8px 12px;font-size:.85rem;font-weight:600;color:#fff;min-height:40px}
/* Cabeçalho contextual (v66): linha 1 (Fazenda › Unidade (área)) mora na barra sticky de sempre;
   a linha 2 é uma faixa estática logo abaixo, que rola por baixo da barra — colapsa e expande com a
   própria rolagem, sem JS e sem mudar altura de nada (nenhum salto de layout) */
.topo.ctx{margin-bottom:0}
.topo.ctx h1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.18}
.topo.ctx .ctx-area{font-size:.8rem;font-weight:500;opacity:.85;white-space:nowrap}
.ctx-l2{background:var(--verde);color:#fff;margin:0 -14px 14px;padding:0 16px 5px;font-size:.72rem;line-height:1.25;opacity:.98;font-weight:500;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* v73: régua de 7 dias — componente ÚNICO reguaDias() das telas de leitura por data. Sete células fixas
   (sem rolagem de lado), do mais recente (esquerda) ao mais antigo; duas linhas por célula (dia da semana
   em pt-BR e número); sem raio, sem sombra; toque ≥ 44 px. Selecionado = fundo verde + número em negrito +
   aria-pressed (não depende só da cor); hoje = barra de 3 px embaixo, sempre visível (branca quando
   selecionado). Estática (rola com a tela): não empilha barra fixa em cima do cabeçalho contextual. */
.regua{display:flex;gap:4px;margin:0 0 12px}
.regua-dia{flex:1;min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0 3px;border:1.5px solid var(--linha);border-bottom-width:3px;background:var(--cartao);color:var(--tinta)}
.regua-dia .ds{font-size:.68rem;font-weight:600;color:var(--tinta-2);line-height:1.1}
.regua-dia .dn{font-size:1.02rem;font-weight:600;line-height:1.15;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.regua-dia.hoje{border-bottom-color:var(--verde)}
.regua-dia.on{background:var(--verde);border-color:var(--verde);color:#fff}
.regua-dia.on .ds{color:#fff}
.regua-dia.on .dn{font-weight:800}
.regua-dia.on.hoje{border-bottom-color:#fff}
/* Botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:var(--raio);font-weight:700;font-size:1.02rem;background:var(--verde);color:#fff;box-shadow:var(--sombra)}
.btn:active{background:var(--verde-esc)}
.btn.sec{background:var(--cartao);color:var(--verde);border:1.5px solid var(--verde)}
.btn.suave{background:var(--verde-claro);color:var(--verde-esc);border:none;box-shadow:none}
.btn.perigo{background:var(--cereja)}
.btn.mini{min-height:40px;width:auto;padding:0 14px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:default}
/* v71: ação sujeita a perfil que este código não executa — mesma forma e posição da ação habilitada, esmaecida em
   cinza neutro (nunca vermelho: cor é do farol), borda tracejada para não depender só do esmaecimento, sem cadeado
   nem ícone; aria-disabled para leitor de tela. Toque mostra quem executa (data-papel) por 2,5 s, sem modal. */
.acao-off,.btn.acao-off{background:var(--papel);color:var(--tinta-2);border:1.5px dashed var(--tinta-2);box-shadow:none;cursor:default;position:relative;font-weight:600}
.acao-off:active,.btn.acao-off:active{background:var(--papel)}
.acao-off.mostra::after{content:attr(data-papel);position:absolute;left:0;bottom:calc(100% + 4px);background:var(--tinta);color:var(--papel);font:600 .78rem/1.2 system-ui,-apple-system,sans-serif;padding:5px 8px;white-space:nowrap;z-index:8;letter-spacing:0;text-transform:none}
.acao-off.mostra.dir::after{left:auto;right:0}
/* v72: botão de avanço com pré-condição em falta — MESMO visual do .acao-off (um só estilo de "inativo" no app);
   data-falta diz a próxima ação ("Registre o clima ou uma observação do dia"), nunca acusa; o toque mostra por 2,5 s.
   Diferente do botão de perfil, este guarda o id: a pré-condição muda sem redesenhar a tela (atualizarAvanco). */
.acao-off[data-falta].mostra::after{content:attr(data-falta);white-space:normal;left:0;right:0;text-align:left}
/* v72: diálogo binário — componente ÚNICO (perguntar): pergunta curta, dois botões, nenhum campo. Afirmativa à direita;
   destaque (verde) só em ação reversível e frequente; ação destrutiva ou irreversível fica com os dois botões neutros. */
.dialogo{position:fixed;inset:0;z-index:70;background:rgba(35,32,26,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dialogo .cartao{max-width:440px;width:100%;margin:0;max-height:85vh;overflow:auto}
.dialogo .pergunta{font-weight:700;font-size:1.02rem;line-height:1.35}
.dialogo .acoes{display:flex;gap:10px;margin-top:14px}
.dialogo .acoes .btn{flex:1;min-width:0;font-size:.95rem;padding:0 8px;text-align:center}
/* Cartões */
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);padding:14px;margin-bottom:12px;box-shadow:var(--sombra)}
.cartao.toque{cursor:pointer}
.linha-flex{display:flex;align-items:center;gap:10px}
.linha-flex .cresce{flex:1;min-width:0}
/* Semáforo de status */
.farol{width:14px;height:14px;border-radius:50%;flex:none}
.farol.ok{background:var(--verde)}
.farol.espera{background:var(--amarelo)}
.farol.critico{background:var(--cereja)}
.farol.vazio{background:var(--linha)}
.farol.reto{border-radius:0}
/* Etiquetas */
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.75rem;font-weight:700}
.tag.verde{background:var(--verde-claro);color:var(--verde-esc)}
.tag.terra{background:var(--terra-claro);color:var(--terra)}
.tag.cereja{background:var(--cereja-claro);color:var(--cereja)}
.tag.amarelo{background:var(--amarelo-claro);color:#8a5f10}
/* Chips de seleção */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 14px;border-radius:24px;border:1.5px solid var(--linha);background:var(--cartao);font-weight:600;font-size:.92rem;min-height:46px}
.chip.on{background:var(--verde);border-color:var(--verde);color:#fff}
/* Stepper numérico */
.step{display:flex;align-items:center;gap:0;border:1.5px solid var(--linha);border-radius:10px;overflow:hidden;background:var(--cartao)}
.step button{width:52px;min-height:52px;font-size:1.5rem;font-weight:700;color:var(--verde);background:var(--verde-claro);flex:none}
.step input{border:none;border-radius:0;text-align:center;font-weight:800;font-size:1.15rem;min-height:52px}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* Assinatura: barra de maturação */
.matura{display:flex;height:26px;border-radius:8px;overflow:hidden;border:1px solid var(--linha);margin-top:8px}
.matura>div{display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;min-width:0;transition:width .2s}
.mat-cereja{background:var(--cereja)}
.mat-verde{background:var(--verde)}
.mat-seco{background:var(--terra)}
/* Acordeão do formulário */
.secao{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);margin-bottom:10px;overflow:hidden}
.secao>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;font-weight:700;cursor:pointer;min-height:56px}
.secao>summary::-webkit-details-marker{display:none}
.secao>summary .ico{width:34px;height:34px;border-radius:9px;background:var(--verde-claro);display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex:none}
.secao>summary .seta{margin-left:auto;color:var(--tinta-2);transition:transform .15s;flex:none}
.secao[open]>summary .seta{transform:rotate(90deg)}
.secao .corpo{padding:0 14px 16px;border-top:1px solid var(--linha)}
/* sub-acordeões da pecuária (dentro da seção 🐂): mesmo desenho, um degrau menor */
.subsec{border:1px solid var(--linha);border-radius:10px;margin-top:10px;background:var(--papel)}
.subsec>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px;font-weight:700;font-size:.95rem;cursor:pointer;min-height:48px}
.subsec>summary::-webkit-details-marker{display:none}
.subsec>summary .resumo{margin-left:auto;margin-right:6px;font-size:.76rem;color:var(--verde);font-weight:700;white-space:nowrap}
.subsec>summary .seta{color:var(--tinta-2);transition:transform .15s;flex:none}
.subsec[open]>summary .seta{transform:rotate(90deg)}
.subsec .corpo{padding:0 12px 14px;border-top:1px solid var(--linha)}
.secao>summary .resumo{margin-left:auto;margin-right:8px;font-size:.78rem;color:var(--verde);font-weight:700;white-space:nowrap}
/* v69: estado da seção eventual no cabeçalho — "sem resposta" (não respondido, texto desde a v70) e "sem ocorrência" são neutros, sem cor de alerta; só o contador fica verde */
.secao>summary .resumo.neutro,.subsec>summary .resumo.neutro{color:var(--tinta-2);font-weight:600}
.resp-secao{margin:6px 0 10px}.resp-secao:empty{display:none}
/* Seletor de operação por fase (grãos): fases recolhidas, toque para expandir */
.fase-op{border:1px solid var(--linha);border-radius:10px;margin-top:8px;background:var(--cartao)}
.fase-op>summary{list-style:none;padding:12px 14px;font-weight:700;cursor:pointer;display:flex;align-items:center}
.fase-op>summary::-webkit-details-marker{display:none}
.fase-op>summary::after{content:"›";margin-left:auto;color:var(--tinta-2);transition:transform .15s}
.fase-op[open]>summary::after{transform:rotate(90deg)}
.fase-op .chips{padding:0 12px 4px}
.subcartao{background:var(--papel);border:1px dashed var(--linha);border-radius:10px;padding:12px;margin-top:10px;position:relative}
.fechar-sub{position:absolute;top:8px;right:8px;color:var(--cereja);font-weight:800;font-size:.8rem;padding:4px 8px;min-height:32px}
/* Rodapé fixo */
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--cartao);border-top:1px solid var(--linha);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:30}
.rodape .interno{max-width:520px;margin:0 auto;display:flex;gap:10px}
/* Painel */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);padding:12px}
.kpi .valor{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.kpi .rot{font-size:.72rem;font-weight:700;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.05em}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros input,.filtros select{width:auto;flex:1;min-width:130px;min-height:44px;padding:9px 12px}
/* Aviso de rascunho / offline */
.aviso{background:var(--amarelo-claro);border:1px solid #ecd9ad;border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:12px}
.aviso.verde{background:var(--verde-claro);border-color:#cfe0c8}
/* Relatórios automáticos (v55): tabelas compactas, números tabulares, âmbar = para conferir */
.rel-tab{overflow-x:auto;margin:6px 0}
.rel-tab table{width:100%;border-collapse:collapse;font-size:.8rem}
.rel-tab th,.rel-tab td{text-align:left;padding:4px 5px;border-bottom:1px solid var(--linha);vertical-align:top;white-space:nowrap}
.rel-tab th{font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;color:var(--tinta-2);border-bottom:2px solid var(--linha)}
.rel-tab td.num,.rel-tab th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.rel-tab tr.conferir td{background:var(--amarelo-claro)}
.rel-tab tr.critico td{background:var(--cereja-claro)}
.rel-conf{color:#8a5f10;font-weight:600}
/* Texto longo em lista (v68): o cartão nasce COLAPSADO — prévia de 3 linhas cortada por linha inteira (max-height
   em múltiplo do line-height: nunca no meio da palavra) com reticências reais no canto reservado pelo padding
   (fade seria gradiente, proibido); ações lado a lado, copiar sem expandir; leitura completa na folha .folha
   (tela cheia, própria rolagem, corpo da página travado por body.folha-aberta para devolver a posição ao fechar). */
.txt-cartao{border-color:var(--amarelo)}   /* mesma borda âmbar "para revisar" do cartão antigo */
.txt-cartao .tag,.folha .tag{display:inline-block;margin-bottom:6px;border-radius:0;font-size:.68rem;padding:3px 5px}
.txt-previa{position:relative;white-space:pre-wrap;font-size:.95rem;line-height:1.45;max-height:calc(3 * 1.45em);overflow:hidden;padding-right:1.1em;margin-top:4px}
.txt-previa.cortado::after{content:"…";position:absolute;right:0;bottom:0;line-height:inherit;background:var(--cartao);padding-left:2px}
.txt-origem{font-size:.72rem;margin-top:6px}
.txt-acoes{display:flex;gap:8px;margin-top:10px}
.txt-acoes .btn{flex:1 1 auto;min-width:0;min-height:44px;padding:4px 4px;border-radius:0;box-shadow:none;font-size:.8rem;line-height:1.2;text-align:center}
.txt-acoes .txt-ler.oculto{display:none}
.folha{position:fixed;inset:0;z-index:60;background:var(--papel);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
.folha .miolo{max-width:640px;margin:0 auto}
.folha .btn-topo{min-height:44px;border-radius:0}
.folha .txt-completo{white-space:pre-wrap;font-size:.98rem;line-height:1.5;margin-top:10px}
.folha .rodape .btn{border-radius:0;box-shadow:none;font-size:.95rem}
.folha .rodape .btn.sec{flex:0 0 auto;width:auto;padding:0 22px}
body.folha-aberta{position:fixed;left:0;right:0;overflow:hidden}
.foto-mini{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--linha)}
.foto-grande{width:100%;border-radius:10px;border:1px solid var(--linha);margin-top:8px}
.lista-limpa{list-style:none}
.lista-limpa li{padding:9px 0;border-bottom:1px solid var(--linha)}
.lista-limpa li:last-child{border:none}
/* Cadastros (v56): menu → lista → detalhe; sem sombra, sem canto arredondado */
.cad-busca{margin:0 0 10px;min-height:46px;border-radius:0}
.cad-menu{display:flex;align-items:center;gap:12px;width:100%;background:var(--cartao);border:1px solid var(--linha);padding:14px;margin-bottom:8px;text-align:left;min-height:64px}
.cad-menu .ico{font-size:1.3rem;width:34px;text-align:center;flex:none}
.cad-menu .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.cad-menu .txt .mut{font-size:.78rem}
.cad-menu .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;color:var(--verde);flex:none}
.cad-item{display:flex;align-items:center;gap:10px;width:100%;background:var(--cartao);border:1px solid var(--linha);margin-top:-1px;padding:7px 12px;text-align:left;min-height:46px;line-height:1.3}
/* v79: quebra em linhas, NUNCA rola de lado — rolagem lateral esconde item, que é o
   mesmo motivo pelo qual ela já era proibida nos chips removíveis da v74 (regra c12). */
.cad-saltos{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px;margin:0 0 2px}
.cad-saltos .chip{flex:none;min-height:40px;padding:8px 12px;font-size:.84rem;border-radius:0}
.cad-saltos .chip.sal-mais{color:var(--tinta-2);font-variant-numeric:tabular-nums}
.cad-filtro-rot{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--tinta-2);margin:2px 0 4px;width:100%}
.plan-filtros{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 8px}
.plan-filtros .chip{min-height:40px;padding:8px 12px;font-size:.84rem;border-radius:0}
.plan-filtros-at{font-size:.78rem;flex:1 1 100%;margin:-2px 0 0}
.cad-item .cresce{display:flex;flex-direction:column;min-width:0}
.cad-item .cresce .mut{font-size:.78rem;white-space:normal}
.cad-item .seta{color:var(--tinta-2);flex:none}
.cad-item .cad-extra{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;flex:none}
/* Badge de categoria da operação (v67): UMA letra, fundo neutro único para todas as categorias (cor é canal do
   farol), sem raio e sem sombra, à esquerda do nome e centrado na primeira linha. Toque mostra o nome da
   categoria (legenda sob demanda, .mostra); a área de toque cresce por ::before sem crescer o quadrado. */
.op-cat{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-right:6px;vertical-align:-4px;background:var(--linha);color:var(--tinta);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;font-weight:700;line-height:1;flex:none;position:relative;cursor:pointer;-webkit-user-select:none;user-select:none}
.op-cat::before{content:"";position:absolute;inset:-12px}
.op-cat.mostra::after{content:attr(data-nome);position:absolute;left:0;bottom:calc(100% + 4px);background:var(--tinta);color:var(--papel);font:600 .78rem/1.2 system-ui,-apple-system,sans-serif;padding:5px 8px;white-space:nowrap;z-index:8;letter-spacing:0;text-transform:none}
/* v74: chips removíveis da multi-seleção — componente ÚNICO chipsSelecao()/pintarSelecoes(). Mesma família dos chips
   de opção (.chip), rótulo + × à direita. O × é o único alvo: 44 × 44 px por si (margens negativas — não cresce o
   chip); o corpo não faz nada. Vazio = contêiner sem conteúdo, nada desenhado. Quebra em linhas (flex-wrap do .chips),
   nunca rola de lado. Sem cor nova: a seleção já é o verde do chip de opção; aqui só o neutro do chip. */
/* v75: faixa do plano no topo do boletim, linha do plano na casa e cartão da Diretoria.
   Sem cor nova: o status é ícone + palavra (a cor é canal do farol). Cada item do plano ocupa
   UMA linha visual a 360 px (nowrap + reticências); no máximo PLANO_MAX_ITENS itens. */

.plan-tres>span{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;gap:3px;min-height:44px}

.plan-um .plan-exec{display:flex;align-items:center;min-height:44px}

<script>
"use strict";
/* ============================================================
   Boletim Diário da Fazenda — app leve, offline-first, sem frameworks
   Persistência: window.storage (Claude) com reserva em memória
   ============================================================ */

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hojeISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtData = iso => { if(!iso) return "—"; const [a,m,d]=iso.split("-"); return d+"/"+m+"/"+a; };
const fmtDataCurta = iso => { const [a,m,d]=iso.split("-"); return d+"/"+m; };
const agoraHM = () => { const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const n0 = v => { const x=parseFloat(String(v).replace(",",".")); return isNaN(x)?0:x; };
const emSafra = () => { const m=new Date().getMonth()+1; return m>=5 && m<=9; };

/* ---------- Estados de lista (v61): carregando · erro · vazio ----------
   REGRA DA CASA (docs/definicao-de-pronto.md): toda lista de leitura passa por aqui —
   nenhuma tela escreve o próprio texto de vazio. O vazio NOMEIA O RECORTE que o produziu
   (unidade, atividade, operação, talhão, busca, período) e relata ausência de REGISTRO,
   nunca de trabalho: proibidos "não fez", "não realizou", "pendente", "atrasado", "faltou",
   "esqueceu"; sem exclamação, sem emoji, sem culpar quem usa; uma frase, no máximo duas
   linhas no iPhone. Nomes vêm do cadastro pelo id (fazenda(id).nome, talhao(id).nome),
   nunca de pedaço de nome. Vale para as três atividades pela mesma função (café desde a
   v65 — CLAUDE.md, c4: isolamento é de comportamento, não de arquivo); nenhuma tela decide
   texto de vazio por atividadeDe(fz). Vazio de UM dia (régua de 7 dias, v73): passe
   periodo:periodoVazio(dia,dia) → "em 05/09/2026"; não existe parâmetro "dia" separado.
   Uso:
     fraseVazio({que:"boletim", atividade:"GRAOS", operacao:"Capina manual", unidade:"f33",
       talhao:"t125", filtro:"texto digitado", periodo:periodoVazio(de,ate), ultimo:"2026-08-31",
       dica:"Os boletins aparecem aqui depois do primeiro envio."})
       → 'Sem boletim de grãos de capina manual em Floramill em Pivô 01 com "texto digitado"
          de 01/09 a 07/09/2026. Último registro há 7 dias (31/08). Os boletins aparecem…'
     htmlEstado("vazio"|"carregando"|"erro", o, {tag:"p"|"li"|"td"|"div", classe, colspan, acao})
       → o elemento pronto; "erro" ganha o botão "Tentar de novo" (data-sync) quando w.acao=true. */
function periodoVazio(de,ate){
  if(de&&ate) return de===ate?"em "+fmtData(de):"de "+fmtDataCurta(de)+" a "+fmtData(ate);
  if(de) return "a partir de "+fmtData(de);
  if(ate) return "até "+fmtData(ate);
  return "";
}
/* "hoje" / "ontem" / "há N dias (dd/mm)" — a data vem do registro, nunca é estimada */
function haDias(iso){
  if(!iso) return "";
  const n=Math.round((new Date(hojeISO()+"T12:00:00")-new Date(String(iso).slice(0,10)+"T12:00:00"))/864e5);
  if(n<=0) return "hoje";
  if(n===1) return "ontem ("+fmtDataCurta(iso)+")";
  return "há "+n+" dias ("+fmtDataCurta(iso)+")";
}
function fraseVazio(o){
  o=o||{};
  const p=["Sem "+(o.que||"registro")];
  if(o.atividade) p.push("de "+rotuloAtividade(o.atividade).toLowerCase());
  if(o.operacao) p.push("de "+String(o.operacao).toLowerCase());
  if(o.unidade) p.push((o.prep||"em")+" "+fazenda(o.unidade).nome);
  else if(o.onde) p.push(o.onde);                 /* recorte sem id de unidade: "nas unidades do grupo" */
  if(o.talhao) p.push("em "+talhao(o.talhao).nome);
  if(o.filtro) p.push('com "'+o.filtro+'"');
  if(o.periodo) p.push(o.periodo);
  let s=p.join(" ")+".";
  if(o.ultimo) s+=" Último registro "+haDias(o.ultimo)+".";
  if(o.dica) s+=" "+o.dica;
  return s;
}
function htmlEstado(estado,o,w){
  o=o||{}; w=w||{};
  const tag=w.tag||"p", classe=w.classe||"mut";
  let txt;
  if(estado==="carregando") txt=esc("Carregando "+(o.que||"registros")+"…");
  else if(estado==="erro") txt=esc("Não foi possível carregar "+(o.que||"os registros")+".")
    +(w.acao?` <button class="btn suave mini" data-sync="1" style="display:inline-flex;padding:2px 8px">Tentar de novo</button>`:"");
  else txt=esc(fraseVazio(o))+(o.dicaHtml?" "+o.dicaHtml:"");
  if(tag==="td") return `<tr><td colspan="${w.colspan||1}" class="${classe}">${txt}</td></tr>`;
  return `<${tag} class="${classe}"${w.estilo?` style="${w.estilo}"`:""}>${txt}</${tag}>`;
}

/* ---------- Camada de persistência (window.storage com reserva em memória) ---------- */
const Persist = {
  mem:{}, modo:"mem",
  async get(chave){
    if(this.modo==="claude"){ try{ const r=await window.storage.get(chave); return r?r.value:null; }catch(e){ return this.mem[chave]||null; } }
    if(this.modo==="local"){ try{ return localStorage.getItem(chave); }catch(e){ return this.mem[chave]||null; } }
    return this.mem[chave]||null;
  },
  async set(chave,valor){
    this.mem[chave]=valor;
    if(this.modo==="claude"){ try{ await window.storage.set(chave,valor); }catch(e){} return; }
    if(this.modo==="local"){ try{ localStorage.setItem(chave,valor); }catch(e){} }
  },
  async del(chave){
    delete this.mem[chave];
    if(this.modo==="claude"){ try{ await window.storage.delete(chave); }catch(e){} return; }
    if(this.modo==="local"){ try{ localStorage.removeItem(chave); }catch(e){} }
  },
  get usaMem(){ return this.modo==="mem"; },
  async iniciar(){
    if(window.storage && window.storage.get){ this.modo="claude"; return; }
    try{ localStorage.setItem("bdf:teste","1"); localStorage.removeItem("bdf:teste"); this.modo="local"; }
    catch(e){ this.modo="mem"; }
  }
};

/* ---------- Estado ---------- */

let acesso=null;         // {codigo, chave} — código gravado no aparelho; a chave define o escopo (ver escopoDaChave)

async function carregarTudo(){
  await Persist.iniciar();
  const bruto = await Persist.get("bdf:dados");
  D = bruto ? JSON.parse(bruto) : dadosSemente();
  const semente = dadosSemente();
  if(bruto && (D.versao||0) < semente.versao){
    /* migração v6: unidades operacionais por atividade. Fazendas mistas desmembradas
       (f03 -> f03c/f03g, f22 -> f22c/f22g, f13 -> f13c/f13p, f14 -> f14c/f14p); histórico
       (boletins, remessas, pós-colheitas) vai para a unidade Café; talhões extras seguem o
       próprio tipo; ids antigos e unificações anteriores continuam valendo via FZ_LEGADO.
       Nenhum registro se perde (os ids dos talhões não mudam). */
    const rf = fzAtual;
    const UNIDADES_DESM={ f03:{CAFE:"f03c",GRAOS:"f03g"}, f22:{CAFE:"f22c",GRAOS:"f22g"},
      f13:{CAFE:"f13c",PECUARIA:"f13p"}, f14:{CAFE:"f14c",PECUARIA:"f14p"} };
    const rfTal = t => {
      const base={f19:"f03",f18:"f03",f05:"f14",f15:"f14",f16:"f14"}[t.fazendaId]||t.fazendaId;
      const u=UNIDADES_DESM[base];
      if(!u) return base;
      if(t.tipo==="GRAO_ANUAL"||t.tipo==="MILHO_SEMENTE"||t.tipo==="ARRENDADO") return u.GRAOS||u.CAFE;
      if(t.tipo==="PASTO_PECUARIA") return u.PECUARIA||u.CAFE;
      return u.CAFE; /* café, estrutura e indefinido ficam na unidade Café */
    };
    const PREFIXO_UNIF = {f05:"Caxico — ", f15:"José Eustáquio — ", f16:"Ernane — ", f18:"Área do Lico — "};
    const antigos = (D.boletins||[]).map(b=>({...b, fazendaId:rf(b.fazendaId)}));
    const posAntigos = (D.posColheitas||[]).map(p=>({...p, fazendaId:rf(p.fazendaId)}));
    const remAntigas = (D.remessas||[]).map(r=>({...r, origem:rf(r.origem), destino:rf(r.destino)}));
    const teleAntiga = (D.telemetria||[]).map(t=>({...t, fazendaId:rf(t.fazendaId)}));
    const estrAntigas = {}; Object.keys(D.estruturas||{}).forEach(k=>{ const nk=rf(k);
      estrAntigas[nk]=Object.assign({}, estrAntigas[nk]||{}, D.estruturas[k]); });
    const insumosExtras = (D.insumos||[]).filter(i=>!semente.insumos.some(s=>s.nome===i.nome));
    const maqExtras = (D.maquinas||[]).filter(m=>!semente.maquinas.some(s=>s.id===m.id))
      .map(m=>({...m, fazendas:(m.fazendas||[]).map(rf)}));
    const talExtras = (D.talhoes||[]).filter(t=>!semente.talhoes.some(s=>s.id===t.id))
      .map(t=>{ const p=PREFIXO_UNIF[t.fazendaId];
        const nome=(p && !String(t.nome||"").startsWith(p.replace(" — ",""))) ? p+t.nome : t.nome;
        return {...t, fazendaId:rfTal(t), nome}; });
    const ciclosAntigos = (D.ciclos||[]);
    const dMaq=D.deparaMaq||{}, dTal=D.deparaTal||{}, mImp=D.mapaImport||{};
    const uDoses=D.ultimasDoses||{}, uRec=D.ultimasReceitas||{}, uFert=D.ultimasFert||{}, insApr=D.insumosAprendidos||[];
    const pivLoc=D.pivosLocais||{}, uOpsTal=D.ultimasOpsTal||{}, uRecTal=D.ultimasReceitasTal||{}, uEvPec=D.ultimoEvPec||{};
    const catEx=D.catalogoExtra||{}, invPec=D.inventarioPec||{};   /* Cadastros v56 */
    const fzExtras=(D.fazendas||[]).filter(f=>!semente.fazendas.some(x=>x.id===f.id));
    const fzCampos={}; (D.fazendas||[]).forEach(f=>{ fzCampos[f.id]={entidade:f.entidade||"", inativa:!!f.inativa}; });
    D = semente;
    D.fazendas=[...semente.fazendas, ...fzExtras];
    D.fazendas.forEach(f=>{ const c=fzCampos[f.id]; if(c){ if(c.entidade) f.entidade=c.entidade; if(c.inativa) f.inativa=true; } });
    D.catalogoExtra=catEx; D.inventarioPec=invPec;
    D.talhoes = [...semente.talhoes, ...talExtras.filter(t=>D.fazendas.some(f=>f.id===t.fazendaId))];
    D.boletins = antigos.length ? antigos.filter(b=>D.fazendas.some(f=>f.id===b.fazendaId)) : semente.boletins;
    D.posColheitas = posAntigos.filter(p=>D.fazendas.some(f=>f.id===p.fazendaId));
    D.remessas = remAntigas; D.telemetria = teleAntiga; D.estruturas = estrAntigas;
    D.ciclos = ciclosAntigos.filter(c=>D.talhoes.some(t=>t.id===c.talhaoId));
    D.deparaMaq = dMaq; D.deparaTal = dTal; D.mapaImport = mImp;
    D.ultimasDoses = uDoses; D.ultimasReceitas = uRec; D.ultimasFert = uFert; D.insumosAprendidos = insApr;
    D.pivosLocais = pivLoc; D.ultimasOpsTal = uOpsTal; D.ultimasReceitasTal = uRecTal; D.ultimoEvPec = uEvPec;
    D.insumos = [...semente.insumos, ...insumosExtras];
    D.maquinas = [...semente.maquinas, ...maqExtras];
    await salvarDados();
  }
  if(!bruto) await salvarDados();
  /* normaliza máquinas: aceita vínculo com várias fazendas */
  (D.maquinas||[]).forEach(m=>{
    if(!Array.isArray(m.fazendas)) m.fazendas = m.fazendaId ? [m.fazendaId] : [];
    delete m.fazendaId;
    m.fazendas = m.fazendas.filter(fz=>D.fazendas.some(f=>f.id===fz));
  });
  /* multicultura: garante o perfil de cada fazenda (já vem gravado no cadastro) e
     deriva o tipo dos talhões que ainda não têm, sempre a partir do perfil */
  (D.fazendas||[]).forEach(f=>{
    if(f.entidade===undefined) f.entidade="";
    if(!Array.isArray(f.perfil)||!f.perfil.length) f.perfil = PERFIS_PADRAO[f.id]||["CAFE"];
  });
  /* v77: áreas do de-para da ata (Igrejinha e Lazaro) chegam nos aparelhos que já tinham dados,
     uma vez só, sem migração geral. Removidas em Cadastros, não voltam (D.talhoesRemovidos). */
  ["t057","t058"].forEach(id=>{ const semente=dadosSemente().talhoes.find(t=>t.id===id);
    if(semente && !(D.talhoes||[]).some(t=>t.id===id) && !((D.talhoesRemovidos||[]).includes(id))) D.talhoes.push({...semente}); });
  /* v86: os 7 talhões de GRÃOS da Lagamar do grupo (f03g), conforme o relatório do ERP AgroGestão
     de 11/09/2026 (propriedade "FAZENDA RIO PRETO - LAGAMAR", safra 2026/2027, atividade SOJA),
     chegam nos aparelhos que já tinham dados. Passo de UMA vez só (marca em D.migracoes): nada é
     apagado, nenhum id é reaproveitado, nenhum talhão é renomeado e boletins, apontamentos e
     ciclos ficam intactos. Os 5 que já existiam só recebem a área do ERP e o nomeErp; os 2 novos
     (t140, t141) entram como talhão novo. Removidos em Cadastros, não voltam (D.talhoesRemovidos);
     depois desta passagem a área volta a ser do Nilo, em Cadastros — a migração não roda de novo. */
  D.migracoes = D.migracoes||{};
  if(!D.migracoes.v86lagamar){
    dadosSemente().talhoes.filter(t=>t.fazendaId==="f03g").forEach(sem=>{
      const meu=(D.talhoes||[]).find(t=>t.id===sem.id);
      if(meu){ meu.area=sem.area; if(sem.nomeErp) meu.nomeErp=sem.nomeErp; }   /* reconciliação: só a área e a chave do ERP */
      else if(!((D.talhoesRemovidos||[]).includes(sem.id)) && D.fazendas.some(f=>f.id==="f03g")) D.talhoes.push({...sem});
    });
    D.migracoes.v86lagamar=true;
    await salvarDados();
  }
  (D.talhoes||[]).forEach(t=>{ if(!t.tipo) t.tipo=tipoPeloPerfil(t.nome, perfilDe(t.fazendaId)); });
  D.ciclos = D.ciclos||[];
  /* milho semente = área arrendada a sementeira: o talhão vira ARRENDADO e o ciclo não se aplica */
  (D.ciclos||[]).forEach(c=>{ if(c.cultura==="MILHO_SEMENTE"){
    const t=D.talhoes.find(x=>x.id===c.talhaoId); if(t&&t.tipo!=="ARRENDADO") t.tipo="ARRENDADO"; } });
  (D.talhoes||[]).forEach(t=>{ if(t.tipo==="MILHO_SEMENTE") t.tipo="ARRENDADO"; });
  D.ciclos = D.ciclos.filter(c=>{ const t=D.talhoes.find(x=>x.id===c.talhaoId); return !(t&&t.tipo==="ARRENDADO"); });
  await syncCarregarCfg();
  window.addEventListener && window.addEventListener("online", ()=>syncTudo());
  setTimeout(()=>syncTudo(), 800);
  nomeRespLembrado = await Persist.get("bdf:nomeResp") || "";
  try{ const rp=await Persist.get("bdf:rascpos"); if(rp){ rascunhoPos=JSON.parse(rp);
    if(rascunhoPos && !rascunhoPos.secadores){ rascunhoPos.secadores=rascunhoPos.secador?[rascunhoPos.secador]:[{lote:"",temp:"",horas:"",fim:"",umidade:"",obs:""}];
      rascunhoPos.beneficios=rascunhoPos.beneficio?[rascunhoPos.beneficio]:[{lote:"",sacas:"",obs:""}];
      delete rascunhoPos.secador; delete rascunhoPos.beneficio; }
    if(rascunhoPos && !rascunhoPos.tulhas) rascunhoPos.tulhas=[{lote:'',mov:'',obs:''}]; } }catch(e){}
  D.posColheitas = D.posColheitas||[];
  /* plano de safra vigente guardado no aparelho (v52) — sem cache o app é igual à v51 */
  try{ const pc=await Persist.get("bdf:plano"); planoCache=pc?(JSON.parse(pc)||{}):{}; }catch(e){ planoCache={}; }
  /* relatórios automáticos já baixados (v55) — sem rede vale o último; sem cache, nada aparece */
  try{ const rc=await Persist.get("bdf:relatorios"); relCache=rc?(JSON.parse(rc)||[]):[]; }catch(e){ relCache=[]; }
  /* faróis de registro (v60) — só aparelhos com painel baixam; sem cache a tela diz que não há dados */
  try{ const fc=await Persist.get("bdf:farolRegistro"); const o=fc?JSON.parse(fc):null; farolCache=(o&&Array.isArray(o.linhas))?o.linhas:[]; farolBaixadoEm=(o&&o.em)||""; }catch(e){ farolCache=[]; farolBaixadoEm=""; }
  try{ const rc=await Persist.get("bdf:ritmoOperacoes"); const o=rc?JSON.parse(rc):null; ritmoCache=Array.isArray(o)?o:[]; }catch(e){ ritmoCache=[]; }
  /* estado das integrações (v63) — de quando é o dado do iCrop/Solinftec; sem cache nenhuma linha de origem aparece */
  try{ const si=await Persist.get("bdf:statusIntegracoes"); const o=si?JSON.parse(si):null; statusIntegracoes=Array.isArray(o)?o:[]; }catch(e){ statusIntegracoes=[]; }
  D.remessas = D.remessas||[];
  D.estruturas = D.estruturas||{};
  D.telemetria = D.telemetria||[];
  const s = await Persist.get("bdf:sessao");
  sessao = s ? JSON.parse(s) : null;
  const r = await Persist.get("bdf:rascunho");
  rascunho = r ? JSON.parse(r) : null;
  try{ const ac = await Persist.get("bdf:acesso"); acesso = ac ? JSON.parse(ac) : null; }catch(e){ acesso=null; }
  /* aparelhos da versão anterior guardavam {tipo, fazendaId}: vira chave de escopo */
  if(acesso && !acesso.chave && acesso.tipo){
    acesso={codigo:acesso.codigo, chave:acesso.tipo==="admin"?"ADMIN":acesso.tipo==="diretoria"?"DIRETORIA":acesso.fazendaId};
    Persist.set("bdf:acesso",JSON.stringify(acesso));
  }
  if(acesso && (!escopoDaChave(acesso.chave) || codigoDe(acesso.chave)!==acesso.codigo)){ acesso=null; Persist.del("bdf:acesso"); }
  /* sessão gravada tem que caber no escopo do código deste aparelho */
  if(!acesso) sessao=null;
  else if(sessao){
    if(sessao.papel==="admin" && !podeCadastros()) sessao=null;
    else if(sessao.papel==="proprietario" && !podePainel()) sessao=null;
    else if((sessao.papel==="gerente"||sessao.papel==="pos") && sessao.fazendaId && !podeVer(sessao.fazendaId)) sessao=null;
    else if(sessao.papel==="gerente" && sessao.atividade && !unidadesPermitidas().some(f=>atividadeDe(f.id)===sessao.atividade)) sessao=null;
  }
}

/* ---------- Controle de acesso por código (escopos por unidade, atividade e combinados) ----------
   Cada código (prefixo-NNNN) aponta para uma CHAVE, e a chave define o escopo:
   lista de atividades e/ou lista de unidades + permissões (painel, cadastros).
   Chaves aceitas:
   - id de unidade (f01, f22g, …)          → só aquela unidade
   - ATV:CAFE / ATV:GRAOS / ATV:PECUARIA   → todas as unidades da atividade
   - ATV:CAFE+GRAOS (e demais combinações) → todas as unidades das atividades
   - MIX:<atividades>:<unidades>           → combinado criado pelo admin em Cadastros
   - DIRETORIA                             → painel + leitura de tudo, sem Cadastros
   - ADMIN                                 → tudo, inclusive Cadastros e códigos
   Unidade criada no futuro entra sozinha nos escopos por atividade (o escopo é
   calculado na hora pelo perfil da fazenda). O admin pode gerar um código novo em
   Cadastros: o novo vale na hora, o antigo cai nos outros aparelhos na próxima
   sincronização (tabela codigos_acesso no Supabase; sem internet vale a tabela
   abaixo). É fechadura de porta, não cofre — ver ESTADO.md. */
const CODIGOS_PADRAO={
  f01:"AL-4172", f03c:"RC-8305", f03g:"RG-2657", f13c:"MC-7914", f13p:"MP-3548",
  f14c:"CC-6081", f14p:"CP-1739", f20:"LR-8447", f21:"SF-9426", f22c:"VC-5883",
  f22g:"VG-2496", f23:"VR-7061", f24:"VQ-3215", f25:"NC-1690",
  f26:"AS-6754", f27:"CG-5372", f28:"CH-2381", f29:"CD-8196", f30:"CF-3907",
  f31:"CR-5240", f32:"FE-7623", f33:"FM-9028", f34:"GA-1058", f35:"PB-4519",
  "ATV:CAFE":"CAFE-2740", "ATV:GRAOS":"GRAOS-3815", "ATV:PECUARIA":"PECU-5926",
  "ATV:CAFE+GRAOS":"CAFEGRAOS-4157", "ATV:CAFE+PECUARIA":"CAFEPECU-6283",
  "ATV:GRAOS+PECUARIA":"GRAOSPECU-7492",
  DIRETORIA:"DIRETORIA-8034", ADMIN:"ADMIN-9561"
};
const CHAVES_ATV=["ATV:CAFE","ATV:GRAOS","ATV:PECUARIA","ATV:CAFE+GRAOS","ATV:CAFE+PECUARIA","ATV:GRAOS+PECUARIA"];
const ABREV_ATV={CAFE:"CAFE", GRAOS:"GRAOS", PECUARIA:"PECU"};
const codigoDe = chave => (((D&&D.codigosAcesso)||{})[chave] || CODIGOS_PADRAO[chave] || "");
/* chave → escopo {ativs, unidades, tudo?, painel?, cadastros?, soLe?} (null = chave inválida) */
function escopoDaChave(chave){
  if(!chave) return null;
  if(chave==="ADMIN") return {chave, tudo:true, painel:true, cadastros:true, ativs:[], unidades:[]};
  if(chave==="DIRETORIA") return {chave, tudo:true, painel:true, soLe:true, ativs:[], unidades:[]};
  if(/^(ATV|MIX):/.test(chave)){
    const p=chave.split(":");
    const ativs=(p[1]||"").split("+").filter(a=>ROTULO_CULT[a]);
    const unidades=(p[2]||"").split("+").filter(fz=>(D.fazendas||[]).some(f=>f.id===fz));
    return (ativs.length||unidades.length) ? {chave, ativs, unidades} : null;
  }
  return (D.fazendas||[]).some(f=>f.id===chave) ? {chave, ativs:[], unidades:[chave]} : null;
}
const chavesConhecidas = () => [...new Set(["ADMIN","DIRETORIA"].concat(CHAVES_ATV, (D.fazendas||[]).map(f=>f.id), Object.keys(D.codigosAcesso||{})))];
function escopoDoCodigo(cod){
  let c=String(cod||"").toUpperCase().replace(/\s+/g,"");
  const m=c.match(/^([A-Z]+)-?(\d{4})$/); if(m) c=m[1]+"-"+m[2]; /* aceita sem o traço */
  if(!c) return null;
  const chave=chavesConhecidas().find(k=>codigoDe(k)===c && escopoDaChave(k));
  return chave ? {codigo:c, chave} : null;
}
const escopoAtual = () => acesso ? escopoDaChave(acesso.chave) : null;
const unidadesPermitidas = () => { const e=escopoAtual(); if(!e) return [];
  if(e.tudo) return D.fazendas;
  return D.fazendas.filter(f=>e.unidades.includes(f.id) || perfilDe(f.id).some(a=>e.ativs.includes(a)));
};
const podeVer = fz => { const e=escopoAtual(); return !!e && (e.tudo || unidadesPermitidas().some(f=>f.id===fz)); };
const podePainel = () => { const e=escopoAtual(); return !!(e && e.painel); };
const podeCadastros = () => { const e=escopoAtual(); return !!(e && e.cadastros); };
const soLeitura = () => { const e=escopoAtual(); return !!(e && e.soLe); };
const chaveDoAcesso = () => acesso ? acesso.chave : null;
/* ---------- Ações sujeitas a perfil (v71) — três estados, componente ÚNICO ----------
   estadoAcao(id, ctx) → "permitido" | "bloqueado_visivel" | "oculto". A decisão de VISIBILIDADE é de negócio e
   privacidade (docs/acoes-por-perfil.md, tabela aprovada pelo Nilo em 08/09/2026): só aparece desabilitada a ação
   que (1) ajuda quem usa a saber a quem pedir, (2) tem rótulo sem produto, dose, custo ou outra fazenda e (3) é do
   domínio que a pessoa já enxerga. Ação de outra atividade e ação administrativa para gerente são sempre "oculto".
   É interface, não segurança: a autorização real é do Supabase (RLS). `papel` é o texto do toque — nomeia quem faz,
   nunca julga ("Ação da diretoria"; proibido "sem permissão", "acesso negado", "bloqueado"). Ação nova sujeita a
   perfil entra AQUI (e na tabela do docs), declarando `visivel` — nunca condicional solta na tela. */
const ACOES_PERFIL={
  boletim_atividade:    {pode:c=>!soLeitura() && unidadesPermitidas().some(f=>atividadeDe(f.id)===c.atv), visivel:()=>false},
  pos_colheita:         {pode:()=>!soLeitura() && unidadesPermitidas().some(f=>perfilDe(f.id).includes("CAFE")), visivel:()=>false},
  painel_diretoria:     {pode:()=>podePainel(), visivel:()=>false},
  relatorios_diretoria: {pode:()=>podePainel(), visivel:()=>false},
  planejamento:         {pode:()=>podePainel(), visivel:()=>false},
  escritorio:           {pode:()=>podeCadastros(), visivel:()=>false},
  cadastros_painel:     {pode:()=>!!sessao && sessao.papel==="admin", visivel:()=>!!sessao && sessao.papel==="proprietario", papel:"Ação do escritório (administrador)"},
  corrigir_boletim:     {pode:c=>!!sessao && sessao.papel==="gerente" && !!c.prazo, visivel:()=>!!sessao && sessao.papel!=="gerente", papel:"Ação do gerente (até 48 h após o envio)"},
  marcar_visto:         {pode:()=>!!sessao && sessao.papel!=="gerente", visivel:()=>!!sessao && sessao.papel==="gerente", papel:"Ação da diretoria"}
};
function estadoAcao(id, ctx){
  const a=ACOES_PERFIL[id]; if(!a) return "oculto";
  const c=ctx||{};
  if(a.pode(c)) return "permitido";
  return (a.papel && a.visivel(c)) ? "bloqueado_visivel" : "oculto";
}
const acaoOk = (id, ctx) => estadoAcao(id, ctx)==="permitido";
/* botão nos três estados: permitido → o botão de sempre (o.attrs leva id/data-* da ação); bloqueado_visivel → mesma
   forma e posição, classe acao-off, aria-disabled, SEM id nem data-* (nada executa ao tocar); oculto → "".
   o = {rotulo, aria (rótulo sem emoji, para o leitor de tela), classe, attrs} */
function botaoAcao(id, ctx, o){
  const st=estadoAcao(id, ctx); if(st==="oculto") return "";
  if(st==="permitido") return `<button class="${o.classe||"btn"}"${o.attrs?" "+o.attrs:""}>${o.rotulo}</button>`;
  const p=ACOES_PERFIL[id].papel;
  return `<button type="button" class="${o.classe||"btn"} acao-off" aria-disabled="true" aria-label="${esc(o.aria||o.rotulo)} — ${esc(p)}" title="${esc(p)}" data-papel="${esc(p)}">${o.rotulo}</button>`;
}
/* rótulo e descrição do escopo de uma chave (usados só nas telas de ADMIN) */
function rotuloDaChave(chave){
  if(chave==="ADMIN") return "Administrador";
  if(chave==="DIRETORIA") return "Diretoria";
  if(/^(ATV|MIX):/.test(chave)){
    const e=escopoDaChave(chave)||{ativs:[],unidades:[]};
    return e.ativs.map(a=>ROTULO_CULT[a]||a).concat(e.unidades.map(fz=>fazenda(fz).nome)).join(" + ")||chave;
  }
  return fazenda(chave).nome;
}
function escopoRotulo(chave){
  if(chave==="ADMIN") return "abre tudo, inclusive Cadastros e códigos";
  if(chave==="DIRETORIA") return "painel e leitura de todas as unidades, sem Cadastros";
  if(/^(ATV|MIX):/.test(chave)){
    const e=escopoDaChave(chave)||{ativs:[],unidades:[]};
    return e.ativs.map(a=>"todas as unidades de "+(ROTULO_CULT[a]||a).toLowerCase())
      .concat(e.unidades.map(fz=>fazenda(fz).nome)).join(" + ");
  }
  return "só esta unidade";
}
/* código do aparelho foi trocado pelo admin? cai fora na próxima sincronização */
function conferirAcesso(){
  if(acesso && (codigoDe(acesso.chave)!==acesso.codigo || !escopoDaChave(acesso.chave))) sairDoAparelho();
}
function sairDoAparelho(){
  acesso=null; sessao=null; rascunho=null;
  Persist.del("bdf:acesso"); Persist.del("bdf:sessao"); Persist.del("bdf:rascunho");
  ir("codigo");
}
/* depois de validar o código, cada escopo abre na sua tela: admin escolhe tudo;
   diretoria cai no painel; escopo com uma atividade só pula para a lista de
   unidades; com uma unidade só abre direto o boletim dela */
function entrarPeloAcesso(){
  if(!acesso){ ir("codigo"); return; }
  const e=escopoDaChave(acesso.chave);
  if(!e){ sairDoAparelho(); return; }
  if(e.cadastros){ ir("entrada"); return; }
  if(e.soLe){ const u=D.usuarios.find(x=>x.papel==="proprietario");
    sessao={userId:u?u.id:"u2", papel:"proprietario", nome:u?u.nome:"Diretoria"};
    Persist.set("bdf:sessao",JSON.stringify(sessao)); rascunho=null; ir("painel"); return; }
  const uni=unidadesPermitidas(), u=D.usuarios.find(x=>x.papel==="gerente");
  if(uni.length===1){ const fz=uni[0].id;
    sessao={userId:u?u.id:"u1", papel:"gerente", nome:"Gerente — "+fazenda(fz).nome, atividade:atividadeDe(fz), fazendaId:fz};
    Persist.set("bdf:sessao",JSON.stringify(sessao)); rascunho=null; ir("casa"); return; }
  const ativs=[...new Set(uni.map(f=>atividadeDe(f.id)))];
  if(ativs.length===1){
    sessao={userId:u?u.id:"u1", papel:"gerente", nome:u?u.nome:"Gerente", atividade:ativs[0], fazendaId:null};
    Persist.set("bdf:sessao",JSON.stringify(sessao)); rascunho=null; ir("fazendas"); return; }
  ir("entrada");
}
function gerarNovoCodigo(chave){
  const atual=codigoDe(chave), e=escopoDaChave(chave)||{ativs:[],unidades:[]};
  const pref = atual ? atual.split("-")[0]
    : (chave==="ADMIN"||chave==="DIRETORIA") ? chave
    : /^(ATV|MIX):/.test(chave) ? (e.unidades.length ? "MIX" : e.ativs.map(a=>ABREV_ATV[a]||a).join("")||"MIX")
    : String((fazenda(chave).nome||"XX")).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z ]/g," ").trim().split(/\s+/).map(p=>p[0]).join("").slice(0,2).toUpperCase().padEnd(2,"X");
  const emUso=chavesConhecidas().map(k=>codigoDe(k));
  let novo; do{ novo=pref+"-"+String(Math.floor(1000+Math.random()*9000)); }while(emUso.includes(novo));
  D.codigosAcesso=D.codigosAcesso||{}; D.codigosAcesso[chave]=novo; salvarDados();
  /* trocou o próprio código? o aparelho do admin continua dentro */
  if(acesso && acesso.chave===chave){ acesso={...acesso, codigo:novo}; Persist.set("bdf:acesso",JSON.stringify(acesso)); }
  syncEnfileirar("c",chave);
  return novo;
}
/* Tipo do talhão derivado do perfil da fazenda (o nome só desempata nas mistas) */
function tipoPeloPerfil(nome, perfil){
  const n=String(nome||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const so = (perfil&&perfil.length===1) ? perfil[0] : null;
  if(so==="PECUARIA") return /sede|represa|area geral|armazem/.test(n)?"ESTRUTURA":"PASTO_PECUARIA";
  if(so==="CAFE") return "CAFE_PERENE";
  if(so==="GRAOS") return "GRAO_ANUAL";
  if(/setor|cafe/.test(n)) return "CAFE_PERENE";
  if(/pivo|gleba|sequeiro/.test(n)) return "GRAO_ANUAL";
  if(/pasto|retiro|curral/.test(n)) return "PASTO_PECUARIA";
  if(/sede|represa|area geral|armazem/.test(n)) return "ESTRUTURA";
  const prim=(perfil&&perfil[0])||"CAFE";
  return prim==="GRAOS"?"GRAO_ANUAL":prim==="PECUARIA"?"PASTO_PECUARIA":"CAFE_PERENE";
}

/* Categoria da operação decide os campos do cartão — cada operação tem SÓ os seus campos */
function opCatDe(nome){
  const n=normTxt(nome);

  if(/palhada/.test(n)) return "PALHADA";
  if(/amostragem de solo/.test(n)) return "AMOSTRA_SOLO";
  if(/tratamento de sementes/.test(n)) return "TRAT_SEMENTES";
  if(/inoculacao/.test(n)) return "INOCULACAO";
  if(/adubacao de plantio/.test(n)) return "ADUBO_PLANTIO";
  if(/adubacao de cobertura/.test(n)) return "ADUBO_COBERTURA";
  if(/replantio/.test(n)) return "REPLANTIO";
  if(/estande/.test(n)) return "ESTANDE";
  if(/monitoramento/.test(n)) return "MONITORAMENTO";
  if(/daninhas manual/.test(n)) return "DANINHA_MANUAL";
  if(/colheita mecanizada/.test(n)) return "COLHEITA";
  if(/transporte/.test(n)) return "TRANSPORTE";
  if(/pesagem/.test(n)) return "PESAGEM";
  if(/amostragem de umidade/.test(n)) return "AMOSTRA_GRAO";
  if(/secagem/.test(n)) return "SECAGEM";

}

const CHAVE_CULT={SOJA:"soja",FEIJAO:"feijao",MILHO_COMERCIAL:"milho"};
function valeParaCultura(nome,cultura){
  if(!cultura) return true;
  const n=normTxt(nome);
  const cita=["soja","feijao","milho"].filter(c=>n.includes(c));
  return !cita.length || cita.includes(CHAVE_CULT[cultura]||"");

/* Ciclo vigente na data (para boletins antigos) e situação do talhão: cultura, dias após plantio e fase */
function cicloEm(talhaoId,data){
  return (D.ciclos||[]).find(c=>c.talhaoId===talhaoId && (!c.plantio||c.plantio<=data) && (!c.encerradoEm||c.encerradoEm>=data));
}
const DUR_CICLO={FEIJAO:75,SOJA:100,MILHO_COMERCIAL:115};
function infoCiclo(talhaoId,data){
  const c=cicloEm(talhaoId,data||hojeISO())||cicloAtivo(talhaoId);
  if(!c) return null;
  const dap=c.plantio?Math.round((new Date((data||hojeISO())+"T12:00:00")-new Date(c.plantio+"T12:00:00"))/864e5):null;
  let fase="Condução";
  if(dap!==null){
    if(dap<0) fase="Pré-plantio";
    else if(dap<=12) fase="Plantio";
    else if(dap>=(DUR_CICLO[c.cultura]||100)) fase="Colheita";
  }
  return {ciclo:c, cultura:c.cultura, dap, fase};
}

  else if(/fungicida/.test(n)) tipos=["Doença"];
  else if(/inseticida/.test(n)) tipos=["Praga"];
  else tipos=["Praga","Doença","Planta daninha"];

}

function opCategoriaIndice(){
  if(opCatIndice) return opCatIndice;

    const [pref,fases]=OP_CATALOGO_FONTE[atv](), porId={}, porNome={};
    fases.forEach(([fase,ops])=>ops.forEach(nome=>{ const id=codigoOperacao(pref,nome);
      const cat=OP_CATEGORIAS[atv].find(c=>(c.fase!=null && c.fase===fase) || (c.operacoes||[]).includes(id));
      if(cat){ porId[id]=cat; porNome[nome]=cat; } }));

    opCatIndice[atv]={porId,porNome};

function separarCSV(txt){
  const linha1=(txt.split(/\r?\n/).find(l=>l.trim())||"");
  const sep=[["\t",linha1.split("\t").length],[";",linha1.split(";").length],[",",linha1.split(",").length]].sort((a,b)=>b[1]-a[1])[0][0];
  const linhas=txt.split(/\r?\n/).filter(l=>l.trim());
  const partir=l=>{ const out=[]; let cur="",asp=false;
    for(const ch of l){ if(ch==='"'){asp=!asp;continue;} if(ch===sep&&!asp){out.push(cur);cur="";} else cur+=ch; }
    out.push(cur); return out.map(s=>s.trim()); };
  return linhas.map(partir);
}
function dataNorm(v){
  v=String(v||"").trim().split(" ")[0];
  let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(v);
  if(m){ let a=m[3].length===2?"20"+m[3]:m[3]; return a+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0"); }
  return "";
}
function acharMaquina(nomePlat){
  if(!nomePlat) return null;
  const dp=(D.deparaMaq||{})[nomePlat]; if(dp) return dp;
  const c=/(\d{1,4})/.exec(nomePlat);
  if(c){ const alvo=D.maquinas.find(m=>codDe(m.nome)===c[1]); if(alvo) return alvo.id; }
  const nl=nomePlat.toLowerCase();
  const alvo=D.maquinas.find(m=>m.nome.toLowerCase().includes(nl)||nl.includes(m.nome.toLowerCase().replace(/\s*\(cod[^)]*\)/i,"").trim()));
  return alvo?alvo.id:null;

function acharTalhao(nomePlat){
  if(!nomePlat) return null;
  const dp=(D.deparaTal||{})[nomePlat]; if(dp) return dp;
  const semAcento=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const bruto=String(nomePlat).trim();
  /* padrão do Alice/Solinftec: "VE-SETOR 1", "CX-SETOR 1" — a sigla antes do hífen restringe a busca */
  const m=/^([A-Za-z]{2,4})\s*[-–]\s*(.+)$/.exec(bruto);
  let candidatos=D.talhoes, resto=bruto;
  if(m){
    const sig=semAcento(m[1]); resto=m[2];
    const casaSig=w=>{ /* prefixo ("ve"→vereda) ou letras em sequência a partir do início ("cx"→caxico) */
      if(w.startsWith(sig)) return true;
      if(w[0]!==sig[0]) return false;
      let i=0; for(const ch of w){ if(ch===sig[i]) i++; if(i===sig.length) return true; }
      return false; };
    const fzs=D.fazendas.filter(f=>{
      const pal=semAcento(f.nome).split(/[\s\/–—-]+/).filter(Boolean);
      return pal.some(casaSig) || pal.map(w=>w[0]).join("").startsWith(sig);
    }).map(f=>f.id);
    if(fzs.length===1) candidatos=D.talhoes.filter(t=>fzs.includes(t.fazendaId));
  }
  const nl=semAcento(resto);
  /* v86: nomeErp é o nome EXATO do talhão no ERP AgroGestão — vale como igualdade,
     do lado da leitura, sem renomear nada e sem afrouxar a regra do "não chuta" */
  const iguais=candidatos.filter(t=>semAcento(t.nome)===nl||(t.nomeErp&&semAcento(t.nomeErp)===nl));
  if(iguais.length===1) return iguais[0].id;
  if(iguais.length>1) return null; /* ambíguo: não chuta — vai para o vínculo manual */
  const parecidos=candidatos.filter(t=>semAcento(t.nome).includes(nl)||nl.includes(semAcento(t.nome)));
  return parecidos.length===1?parecidos[0].id:null;
}

function icropDo(data,fz){
  /* a estação iCrop é da fazenda física; cada linha vai para a unidade certa:
     equipamento/parcela com "café" no nome -> unidade Café; demais -> Grãos;
     fazenda com uma unidade só recebe tudo */
  const maeId=maeIdDe(fz);
  const varias=unidadesDaMae(maeId).length>1;
  const minha=perfilDe(fz);
  const semAc=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const linhas=(D.icropDados||[]).filter(l=>{
    if(l.data!==data || icropFazendaId(l.fazenda)!==maeId) return false;
    if(!varias) return true;
    const ehCafe=semAc((l.equipamento||"")+" "+(l.parcela||"")).includes("cafe");
    return ehCafe ? minha.includes("CAFE") : minha.includes("GRAOS");
  });
  if(!linhas.length) return null;
  /* o bruto vem como texto (->>); campo ausente/nulo fica fora da conta */
  const vals=(ls,k)=>ls.map(l=>l[k]).filter(v=>v!=null&&v!=="").map(n0);
  const maxDe=(ls,k)=>{const v=vals(ls,k);return v.length?Math.max(...v):0;};
  const minDe=(ls,k)=>{const v=vals(ls,k);return v.length?Math.min(...v):0;};
  const somaDe=(ls,k)=>vals(ls,k).reduce((s,x)=>s+x,0);
  const mediaDe=(ls,k)=>{const v=vals(ls,k);return v.length?v.reduce((s,x)=>s+x,0)/v.length:0;};
  const probsDe=ls=>{const out=[];ls.forEach(l=>{const p=l.probs;
    if(!p||p==="null"||p==="[]") return;
    let itens=[p]; try{const j=JSON.parse(p); itens=Array.isArray(j)?j:[j];}catch(e){}
    itens.forEach(x=>{const s=String((x&&(x.descricao||x.nome))||x||"").trim();
      if(s&&s!=="[object Object]"&&!out.includes(s)) out.push(s);});});return out;};
  const chuva=Math.max(...linhas.map(l=>n0(l.precipitacao_mm)));
  const porEq={};
  linhas.forEach(l=>{
    const eq=l.equipamento||"Equipamento";
    (porEq[eq]=porEq[eq]||[]).push(l);
  });
  let custoDia=0;
  const eqs=Object.keys(porEq).sort().map(eq=>{
    const ls=porEq[eq], regadas=ls.filter(l=>n0(l.irrigacao_mm)>0);
    const custo=regadas.reduce((s,l)=>s+n0(l.irrigacao_mm)*n0(l.area)*n0(l.custo_mm),0);
    custoDia+=custo;
    return { nome:eq,
      regadas:regadas.map(l=>({parcela:l.parcela||"", mm:n0(l.irrigacao_mm)})),
      total:ls.length, custo,
      etc:Math.max(...ls.map(l=>n0(l.etc))),
      deficit:Math.max(...ls.map(l=>n0(l.deficit))),
      atraso:Math.max(...ls.map(l=>n0(l.atraso))),
      percent:maxDe(ls,"percentimetro"), tempo:maxDe(ls,"tempo_irr"),
      deficitPrev:maxDe(ls,"deficit_prev"), laminaMin:maxDe(ls,"lamina_min"),
      umid:minDe(ls,"umidade"), umidSeg:maxDe(ls,"umid_seg"), capCampo:maxDe(ls,"cap_campo"),
      umidBaixa:ls.some(l=>l.umidade!=null&&l.umidade!==""&&l.umid_seg!=null&&l.umid_seg!==""
        &&n0(l.umidade)<n0(l.umid_seg)),
      fase:String(ls.map(l=>l.fase).find(v=>v!=null&&v!==""&&v!=="null")||""),
      gd:maxDe(ls,"gd"), probs:probsDe(ls) };
  });
  /* clima da estação (é da fazenda física; qualquer linha do dia serve) */
  const temClima=linhas.some(l=>["t_min","t_max","ur","vento"].some(k=>l[k]!=null&&l[k]!==""));
  const clima=temClima?{ tmin:minDe(linhas,"t_min"), tmax:maxDe(linhas,"t_max"),
    ur:maxDe(linhas,"ur"), vento:maxDe(linhas,"vento") }:null;
  return { chuva, eqs, qtd:linhas.length, custoDia, clima,
    chuvaPluv:maxDe(linhas,"chuva_pluv"), eficiencia:mediaDe(linhas,"eficiencia"),
    acumIrr:mediaDe(linhas,"acum_irr"), acumChuva:mediaDe(linhas,"acum_chuva"),
    reaisNec:somaDe(linhas,"reais_nec"), reaisReal:somaDe(linhas,"reais_real") };
}

function icropVencimentos(){
  const fzs=D.icropFaz||[], pcs=D.icropParcelas||[];
  if(!fzs.length) return null;
  const hoje=hojeISO(), out={vencendo:[], zeradas:[]};
  const nomeDe=id=>{const f=fzs.find(x=>String(x.id_da_fazenda)===String(id));return f?f.nome:("fazenda "+id);};
  const comParcela=new Set();
  pcs.forEach(p=>{
    const ativas=(p.parcela&&p.parcela.parcelas_ativas)||[];
    if(ativas.length) comParcela.add(String(p.id_fazenda));
    ativas.forEach(a=>{
      if(!a.fim) return;
      const dias=Math.round((new Date(a.fim+"T12:00:00")-new Date(hoje+"T12:00:00"))/864e5);

    });
  });
  fzs.forEach(f=>{ if(!comParcela.has(String(f.id_da_fazenda))) out.zeradas.push(f.nome); });
  out.vencendo.sort((a,b)=>a.dias-b.dias);
  return (out.vencendo.length||out.zeradas.length)?out:null;
}

/* ---- Estado das integrações (v63): leitura da visão vw_status_integracoes (sql/045) ----
   Uma linha por fonte externa (icrop, solinftec) com três horários que NÃO se misturam:
   ultima_execucao_em (última TENTATIVA do robô), ultima_execucao_ok_em (último SUCESSO: a API de
   origem respondeu OK) e ultimo_dado_em (última GRAVAÇÃO de dado no Supabase), mais
   ultimo_dado_origem (dia a que o dado se refere). Tudo chega em UTC; a conversão para Brasília
   é feita aqui, com America/Sao_Paulo explícito (o gerente está em Monte Carmelo). Só leitura, na
   sincronização; sem a visão (404) ou sem rede fica o último baixado; sem cache nenhuma linha de
   origem aparece e as telas ficam exatamente como antes. Desde a v64 vale para café também (decisão do
   Nilo, 08/09/2026: dado de irrigação iCrop e de máquinas é gestão do cafeicultor) e para o painel. Regra: "Dados do iCrop de hoje, 04:05" no rodapé de cada bloco de dado externo; com
   mais de ORIGEM_LIMIAR_H horas sem sucesso do robô a linha vira "Última atualização do iCrop há N
   dias" em cor de atenção — sem ícone, sem exclamação, sem bloquear. Nunca "agora" nem "tempo real". */
let statusIntegracoes=[];   /* linhas de vw_status_integracoes (bdf:statusIntegracoes) */
const ORIGEM_LIMIAR_H=26;   /* uma janela diária inteira + folga */
const ORIGEM_FONTES={ icrop:{nome:"iCrop", de:"do"}, solinftec:{nome:"Solinftec", de:"da"} };
const FUSO_BRT="America/Sao_Paulo";
async function baixarStatusIntegracoes(){
  if(!syncAtivo()) return [];
  try{
    const cab={ headers:{ "apikey":syncCfg.chave, "Authorization":"Bearer "+syncCfg.chave } };
    const r=await fetch(syncCfg.url+"/rest/v1/vw_status_integracoes?select=fonte,ultima_execucao_em,ultima_execucao_ok_em,ultimo_dado_em,ultimo_dado_origem,horas_desde_ultimo_sucesso&order=fonte", cab);
    if(!r.ok) return [];
    const linhas=await r.json(); if(!Array.isArray(linhas)) return [];
    statusIntegracoes=linhas.filter(l=>l && ORIGEM_FONTES[l.fonte]);
    await Persist.set("bdf:statusIntegracoes", JSON.stringify(statusIntegracoes));
    return statusIntegracoes;
  }catch(e){ return []; }
}
const statusFonte=fonte=>statusIntegracoes.find(l=>l && l.fonte===fonte)||null;
/* horas desde o último sucesso, contadas no aparelho (o número da visão envelhece no cache) */
function horasSemSucesso(l){
  if(!l) return null;
  const ok=l.ultima_execucao_ok_em?new Date(l.ultima_execucao_ok_em):null;
  if(ok && !isNaN(ok)) return (Date.now()-ok.getTime())/36e5;
  return (l.horas_desde_ultimo_sucesso==null)?null:Number(l.horas_desde_ultimo_sucesso);
}
/* data (AAAA-MM-DD) e hora em Brasília, explícitas — o banco manda UTC */
const diaBRT=d=>new Date(d).toLocaleDateString("sv-SE",{timeZone:FUSO_BRT});
const fmtDHBRT=s=>{ if(!s) return "—"; const d=new Date(s); return isNaN(d)?"—":d.toLocaleString("pt-BR",{timeZone:FUSO_BRT,day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); };
/* texto da linha de origem: {texto, velho} ou null quando não há o que dizer */
function textoOrigemDado(fonte){
  const l=statusFonte(fonte), f=ORIGEM_FONTES[fonte];
  if(!l || !f || !l.ultimo_dado_em) return null;
  const horas=horasSemSucesso(l);
  if(horas!=null && horas>ORIGEM_LIMIAR_H){
    const dias=Math.max(1,Math.floor(horas/24));
    return { texto:"Última atualização "+f.de+" "+f.nome+" há "+dias+(dias===1?" dia":" dias"), velho:true };
  }
  const d=new Date(l.ultimo_dado_em); if(isNaN(d)) return null;
  const dia=diaBRT(d), hoje=diaBRT(new Date()), ontem=diaBRT(new Date(Date.now()-864e5));
  const quando=dia===hoje?"hoje":dia===ontem?"ontem":d.toLocaleDateString("pt-BR",{timeZone:FUSO_BRT,day:"2-digit",month:"2-digit"});
  const hora=d.toLocaleTimeString("pt-BR",{timeZone:FUSO_BRT,hour:"2-digit",minute:"2-digit"});
  return { texto:"Dados "+f.de+" "+f.nome+" de "+quando+", "+hora, velho:false };
}
/* uma linha por bloco de dado externo, no rodapé, tipografia secundária; vazio quando não há status */
function linhaOrigemDado(fonte){
  const o=textoOrigemDado(fonte);
  return o?`<p class="mut origem-dado${o.velho?" velho":""}">${esc(o.texto)}</p>`:"";
}

   "N de M operações com registro" — assim os dias sem registro dela ficam alcançáveis na tela da unidade.
   Unidade com pelo menos uma janela é mostrada exatamente como antes. */
function farolPorUnidade(){
  const uns={};
  farolLinhas().forEach(l=>{
    const u=uns[l.unidade_id]=uns[l.unidade_id]||{id:l.unidade_id,atividade:l.atividade,n:{vermelho:0,amarelo:0,cinza:0,verde:0},semJanela:0,comRegistro:0};
    if(l.farol) u.n[l.farol]=(u.n[l.farol]||0)+1; else u.semJanela++;
    if(!l.nunca_registrado) u.comRegistro++;
  });
  const ordem=u=>u.pior?FAROL_ORDEM[u.pior]:4;
  return Object.values(uns).map(u=>{ u.pior=["vermelho","amarelo","cinza","verde"].find(k=>u.n[k])||""; u.nome=fazenda(u.id).nome; return u; })
    .sort((a,b)=>ordem(a)-ordem(b) || a.nome.localeCompare(b.nome,"pt-BR"));
}

function relRotuloPer(rel,ini,fim){
  const per=(REL_CATALOGO[rel]||{}).per;
  if(ini===fim) return fmtData(ini);
  if(per==="mes"){ const [a,m]=ini.split("-"); const rot=MESES_REL[parseInt(m,10)-1]+"/"+a;
    const ultimo=new Date(parseInt(a,10),parseInt(m,10),0).getDate();
    return fim.slice(8)==String(ultimo).padStart(2,"0")?rot:rot+" (até "+fmtDataCurta(fim)+")"; }
  return fmtDataCurta(ini)+" a "+fmtData(fim);
}

function relAlerta(l){

/* ---------- Texto longo em lista (v68) — componente ÚNICO ----------

   de tela cheia, abrirFolhaTexto) e a ação principal (copiar), que funciona SEM expandir e sempre sobre o
   texto integral. Texto que cabe nas 3 linhas não mostra "ler texto completo" nem reticências

   lista por baixo. Nenhum campo de digitação; nunca uma variante por atividade ou por perfil.

/* depois de desenhar: prévia que não transborda perde as reticências e o "ler texto completo" */
function ajustarTextosLongos(){

}
/* trava e destrava o fundo enquanto uma folha de tela cheia está aberta — mesmo mecanismo para a
   folha de leitura (v68) e para a folha "Amanhã" (v75); só uma folha fica aberta por vez */
function travarFolha(){
  folhaScrollY=window.scrollY||window.pageYOffset||0;
  document.body.style.top=(-folhaScrollY)+"px"; document.body.classList.add("folha-aberta");
}
function destravarFolha(){
  document.body.classList.remove("folha-aberta"); document.body.style.top=""; window.scrollTo(0,folhaScrollY);
}
function abrirFolhaTexto(o){
  fecharFolhaTexto();
  const f=document.createElement("div"); f.className="folha"; f.id="folha-texto";
  f.setAttribute("role","dialog"); f.setAttribute("aria-modal","true"); f.setAttribute("aria-label",o.titulo);
  f.innerHTML=`<div class="miolo">
    <div class="topo"><button class="btn-topo" id="bt-folha-voltar">‹ Fechar</button><h1>${esc(o.titulo)}</h1></div>
    ${o.tag?`<span class="tag amarelo">${esc(o.tag)}</span>`:""}
    <p class="txt-completo">${esc(o.texto)}</p>
    ${o.origemLonga?`<p class="mut txt-origem">${esc(o.origemLonga)}</p>`:""}
  </div>
  <div class="rodape no-print"><div class="linha-flex" style="gap:8px;max-width:640px;margin:0 auto">
    <button class="btn sec" id="bt-folha-fechar">Fechar</button>
    <button class="btn" id="bt-folha-copiar">${esc(o.copiar||"copiar")}</button></div></div>`;
  document.body.appendChild(f);
  travarFolha();
  f.onclick=ev=>{ const t=ev.target.closest("button"); if(!t) return;
    if(t.id==="bt-folha-copiar"){ if(o.aoCopiar) o.aoCopiar(t); return; }
    if(t.id==="bt-folha-fechar"||t.id==="bt-folha-voltar") fecharFolhaTexto(); };
}
function fecharFolhaTexto(){
  const f=document.getElementById("folha-texto"); if(!f) return;
  f.remove(); destravarFolha();
}
/* Escape: fecha a folha de leitura, cancela o diálogo binário e vale como "Pular" na folha
   "Amanhã" (v75) — pular é o caminho neutro dela, o envio segue de todo modo */
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"){ fecharFolhaTexto(); fecharDialogo(false);
  if(document.getElementById("folha-plano")) fecharFolhaPlano(false); } });

/* ---------- Diálogo binário (v72) — componente ÚNICO ----------
   perguntar(o) → Promise<boolean>. Substitui todo confirm() nativo (proibido desde a v72). Uma pergunta curta em
   linguagem natural, terminada em "?", que DIZ o que vai acontecer (nunca "tem certeza?"; sem emoji, sem exclamação,
   sem culpar; nunca produto, dose ou custo). Exatamente dois botões e nenhum campo de digitação: à esquerda a
   alternativa neutra ("Cancelar" / "Voltar" / "Revisar"), à direita a afirmativa com VERBO no infinitivo + objeto
   (até três palavras: "Descartar rascunho", "Enviar boletim", "Abrir ciclos").
   o = { pergunta, sim, nao (padrão "Cancelar"), destaque, detalhes (lista de linhas, opcional) }.
   destaque:true pinta a afirmativa de verde — SÓ quando a ação é reversível e o caminho provável é claramente o
   mais frequente ("o sistema propõe, a pessoa aceita"). Ação destrutiva ou irreversível (descartar rascunho,
   remover, encerrar, publicar, gerar novo código, envio do boletim) NUNCA leva destaque: os dois botões ficam neutros
   para a pessoa parar e escolher — destaque em tudo treina o toque automático e esvazia as outras perguntas.
   Toque fora não decide nada; Escape = alternativa. Nunca uma variante por atividade ou por perfil. */
let dialogoResolve=null;
function perguntar(o){
  fecharDialogo(false);
  return new Promise(res=>{
    dialogoResolve=res;
    const f=document.createElement("div"); f.className="dialogo"; f.id="dialogo";
    f.setAttribute("role","alertdialog"); f.setAttribute("aria-modal","true"); f.setAttribute("aria-labelledby","dialogo-pergunta");
    f.innerHTML=`<div class="cartao">
      <p class="pergunta" id="dialogo-pergunta">${esc(o.pergunta)}</p>
      ${(o.detalhes||[]).length?`<div class="aviso mt" style="margin-bottom:0">${o.detalhes.map(a=>`<p style="margin:6px 0">${esc(a)}</p>`).join("")}</div>`:""}
      <div class="acoes">
        <button type="button" class="btn sec" id="bt-dialogo-nao">${esc(o.nao||"Cancelar")}</button>
        <button type="button" class="btn${o.destaque?"":" sec"}" id="bt-dialogo-sim">${esc(o.sim)}</button>
      </div></div>`;
    document.body.appendChild(f);
    f.onclick=ev=>{ const t=ev.target.closest("button"); if(!t) return;
      if(t.id==="bt-dialogo-sim") fecharDialogo(true); else if(t.id==="bt-dialogo-nao") fecharDialogo(false); };
    const foco=f.querySelector(o.destaque?"#bt-dialogo-sim":"#bt-dialogo-nao"); if(foco) foco.focus();
  });
}
function fecharDialogo(resposta){
  const f=document.getElementById("dialogo"); if(!f) return;
  f.remove(); const r=dialogoResolve; dialogoResolve=null; if(r) r(!!resposta);
}
/* ---------- Aviso inline (v72) — substitui todo alert() nativo ----------
   avisoInline(ancora, texto): UMA linha discreta (classe .aviso) logo acima do botão que foi tocado (ou no topo da
   tela, se não houver âncora), rolada para a vista; some no próximo redesenho ou na próxima chamada. Serve para o
   que a pessoa NÃO consegue enxergar antes do toque (boletim já existente naquela data, erro do servidor, arquivo
   sem linhas): nesses casos o toque é permitido e explicado. O que ela consegue enxergar (formulário vazio, chip não
   escolhido) vira botão inativo por botaoAvanco, não aviso. Texto diz a próxima ação; nunca "campo obrigatório",
   "erro de validação", "você esqueceu". */
function avisoInline(ancora, texto){
  document.querySelectorAll("[data-aviso-inline]").forEach(x=>x.remove());
  const el=(typeof ancora==="string")?document.querySelector(ancora):ancora;
  const av=document.createElement("div"); av.className="aviso"; av.setAttribute("data-aviso-inline","1"); av.setAttribute("role","status");
  av.textContent=texto;
  if(el && el.parentNode) el.parentNode.insertBefore(av, el);
  else { const app=$("#app"), topo=app.querySelector(".topo,.ctx-l2"); if(topo&&topo.nextSibling) app.insertBefore(av, topo.nextSibling); else app.prepend(av); }
  av.scrollIntoView({behavior:"smooth",block:"center"});
}
/* ---------- Botão de avanço com validação silenciosa (v72) — componente ÚNICO ----------
   botaoAvanco(id, {rotulo, falta, classe, attrs}): enquanto `falta` (o que ainda não foi feito, em forma de próxima
   ação: "Registre o clima ou uma observação do dia") não for vazio, o botão nasce INATIVO com o MESMO visual do
   botão de perfil da v71 (classe acao-off: cinza neutro, borda tracejada, sem vermelho, sem cadeado) e não executa —
   o tratador de clique intercepta .acao-off antes de qualquer ação; o toque mostra `falta` por 2,5 s. Diferença
   única em relação ao botão de perfil: este guarda o id e leva data-falta, porque a pré-condição muda com a
   digitação e atualizarAvanco(id, falta) troca o estado no lugar, sem redesenhar a tela. Só se aplica a
   pré-condição que a pessoa enxerga na tela; condição invisível continua permitindo o toque (avisoInline).
   Nunca por seção eventual sem resposta (v70 decide isso com o aviso âmbar, não com bloqueio). */
function botaoAvanco(id, o){
  const falta=o.falta||"", cls=o.classe||"btn";
  if(!falta) return `<button class="${cls}" id="${id}"${o.attrs?" "+o.attrs:""}>${o.rotulo}</button>`;
  return `<button class="${cls} acao-off" id="${id}" aria-disabled="true" aria-label="${esc(o.aria||o.rotulo)} — ${esc(falta)}" title="${esc(falta)}" data-falta="${esc(falta)}"${o.attrs?" "+o.attrs:""}>${o.rotulo}</button>`;
}
function atualizarAvanco(id, falta){
  const b=document.getElementById(id); if(!b) return;
  const rot=b.getAttribute("data-rotulo")||b.textContent.trim();
  if(falta){ b.classList.add("acao-off"); b.setAttribute("aria-disabled","true"); b.setAttribute("data-falta",falta); b.setAttribute("title",falta); b.setAttribute("aria-label",rot+" — "+falta); }
  else { b.classList.remove("acao-off","mostra","dir"); b.removeAttribute("aria-disabled"); b.removeAttribute("data-falta"); b.removeAttribute("title"); b.removeAttribute("aria-label"); }
}

/* ---------- Chips removíveis da multi-seleção (v74) — componente ÚNICO ----------
   chipsSelecao(attr, {um, varios}) devolve o contêiner (vazio) que pintarSelecoes() preenche a partir do estado `.on`
   dos chips de opção com data-<attr> do MESMO bloco (o pai do contêiner): contador ("3 setores selecionados" — o
   substantivo vem de quem chama, por tela, nunca por atividade) e, abaixo, um chip por item escolhido, rótulo + ×
   à direita. O × dispara o toque do chip de opção correspondente — a remoção reaproveita o tratador que já existe
   (nenhum mecanismo novo de escolha), é imediata e sem confirmação (reversível num toque: basta tocar a opção de
   novo). O corpo do chip não faz nada: a lista de opções está logo abaixo, no mesmo bloco, então "abrir a lista" não
   teria o que abrir, e um alvo só evita remover o item errado com o polegar. Mais de SEL_MAX itens: os SEL_MAX
   primeiros + um chip "+K" que expande (a expansão vive só na memória e some quando a seleção cai). Seleção vazia:
   nada desenhado (nem contador zerado, nem área reservada). Ordem: a do catálogo/cadastro (a mesma da lista de
   opções). Rótulos: os do chip de opção, que quem chama já desenha pelo cadastro por id. Mesmo componente em toda
   multi-seleção; nunca uma variante; seleção única não recebe chip. NUNCA entra na tela de apontamento em 3 passos
   (regra 7) — por isso o cartão do pivô dos grãos, cuja única multi-seleção mora ali, ficou de fora. */
const SEL_MAX=6;
const selExpandido=new Set();
function chipsSelecao(attr,o){
  return `<div class="sel-box" data-sel-de="${esc(attr)}" data-sel-um="${esc(o.um)}" data-sel-varios="${esc(o.varios)}" aria-live="polite"></div>`;
}
function pintarSelecoes(raiz){
  (raiz||document).querySelectorAll(".sel-box[data-sel-de]").forEach(box=>{
    const attr=box.dataset.selDe, pai=box.parentElement; if(!pai) return;
    const ons=[...pai.querySelectorAll(".chip.on[data-"+attr+"]")];
    if(!ons.length){ if(box.innerHTML) box.innerHTML=""; selExpandido.delete(attr); return; }
    const n=ons.length, vis=selExpandido.has(attr)?ons:ons.slice(0,SEL_MAX), resto=n-vis.length;
    const chip=b=>{ const rot=b.textContent.trim().replace(/\s+/g," ");
      return `<span class="chip sel"><span class="sel-rot">${esc(rot)}</span><button type="button" class="sel-x" data-sel-rm="${esc(attr)}|${esc(b.getAttribute("data-"+attr))}" aria-label="Remover ${esc(rot)}" title="Remover ${esc(rot)}">×</button></span>`; };
    box.innerHTML=`<p class="sel-cont">${n} ${esc(n===1?box.dataset.selUm:box.dataset.selVarios)}</p>
      <div class="chips sel-chips">${vis.map(chip).join("")}${resto>0?`<button type="button" class="chip sel-mais" data-sel-mais="${esc(attr)}" aria-label="Mostrar mais ${resto}" title="Mostrar mais ${resto}">+${resto}</button>`:""}</div>`;
  });
}

/* texto redigido pelo robô-redator (fase 2): sempre com o marcador de revisão. v68: cartão colapsado pelo

const fmtDataHora=iso=>new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

/* copia o texto INTEGRAL (nunca a prévia), marca "✔ copiado" e abre o compartilhar */
function relCopiar(l,bt){

/* renderização por relatório: tabelas compactas, âmbar onde há divergência/atraso */
function relRender(rel,ls){

        +(eq.length?`<p class="mut" style="font-size:.78rem;margin-top:8px"><b>Por equipamento</b></p>`+relTabela(["Equipamento","#h","#Ocioso %","#ha","#L","#L/h","#h boletim","Talhões"],eq.map(e=>[esc(e.equipamento),relNum(e.horas),relNum(e.ocioso_pct,0),relNum(e.area_ha),relNum(e.litros,0),relNum(e.l_h),relNum(e.h_boletim),esc(e.talhoes||"")])):"")
        +((d.talhoes||[]).length?`<p class="mut" style="font-size:.78rem;margin-top:8px"><b>Por talhão (Solinftec)</b></p>`+relTabela(["Talhão","Operação","#h","#ha","#L"],(d.talhoes||[]).map(t=>[esc(t.talhao),esc(t.operacao),relNum(t.horas),relNum(t.area_ha),relNum(t.litros,0)])):""),

  }
  if(rel==="irrigacao_rec_exec_semana"){
    return ls.map(l=>{ const d=l.dados||{}, r=d.resumo||{};
